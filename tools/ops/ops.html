<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the look's scripts and the site's own from this site, the page's own
       script and style inline, its connections to this site only: its
       numbers and its controls, and the tab's icon a png the page draws
       (js/favicon.js), a data url -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>ops</title>
  <!-- the tab's icon: none until js/favicon.js draws it, so the browser
       asks for no /favicon.ico -->
  <link rel="icon" href="data:,">
  <style>
    /* the paper colour, as in js/raster.js: any sliver past the canvas matches */
    html, body { margin: 0; background: #fbf6f0; }
    /* no system cursor: the pointer is drawn into the frame as a hand */
    html, body { cursor: none; }
    /* the document never scrolls: the page scrolls itself, in the frame */
    html, body { overflow: hidden; overscroll-behavior: none; }
    /* a press on the canvas is the page's own. no selecting */
    canvas { position: fixed; top: 0; left: 0; display: block; image-rendering: pixelated; cursor: none;
             touch-action: none; user-select: none; -webkit-user-select: none; }
    /* the one field: never seen, a pixel across, under where the page
       draws the field that has the keys, its font big enough that a phone
       does not zoom in to it. a pointer passes through it to the canvas */
    input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0;
            opacity: 0; font-size: 16px; pointer-events: none; }
  </style>
  <script>
    // the paper's colour as the visitor last chose the site, light or
    // dark, or as the system is where they have not chosen, before any
    // other script has loaded
    try {
      let kept = null;
      try { kept = localStorage.getItem('dark'); } catch (e) {}
      const dark = kept !== null ? kept === '1' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.background = dark ? '#000000' : '#fbf6f0';
    } catch (e) {}
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <input id="key" type="text" maxlength="1024" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="a new password">
  <script src="/js/raster.js"></script>
  <script src="/js/view.js"></script>
  <script src="/js/letter.js"></script>
  <script src="/js/hover.js"></script>
  <script src="/js/icon.js"></script>
  <script src="/js/switch.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/skin.js"></script>
  <script src="/js/type.js"></script>
  <script src="/js/favicon.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/hand-art.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/metrics.js"></script>
  <script>
    // --- ops ---------------------------------------------------------------------
    // the sites' numbers and their locks, for their owner, drawn as the
    // site is. across the top, the page's name at the left (the name,
    // below) and the light and dark switch at the right (the switch,
    // below). under the name two menus, made as the site's menus are (the
    // menus, below): metrics, a site's numbers and graphs as /stats answers
    // them (tools/ops/stats.js) and as the site's metrics show them
    // (js/metrics.js), and under it controls, each site's lock and
    // password as /controls answers and takes them (tools/ops/controls.js).
    // each site is called by its host (js/site.js). the page is as tall as
    // what is open, and scrolls itself (the scroll, below); the document
    // never does. the sections, top to bottom: the viewport, the letters,
    // the page's numbers, the hover colours, the menus, the boxes, the
    // switch, the name, the words, the answers, the graphs, metrics, the
    // controls, the field, the keys, the scroll, the layout, what a press
    // presses, the click, the cursor and the frame.

    // --- the viewport ------------------------------------------------------------
    // the window is a viewport onto a grid of world pixels, each View.SCALE
    // css pixels square (js/view.js): a css pixel, but in a window fewer
    // than View.across css pixels wide each as much smaller as shows
    // View.across of them across, and no smaller than one of the screen's
    // own pixels. every pixel is drawn into one framebuffer (js/raster.js)
    // the size of the visible world, and once a frame it is copied whole
    // into the canvas bitmap, which is that size exactly. nothing draws to
    // the canvas itself
    const canvas = document.getElementById('view');
    View.load(window, canvas); // the viewport onto the window, through the canvas
    const ctx = canvas.getContext('2d'); // only the framebuffer's present uses it
    let W = 0, H = 0; // the viewport, in world pixels
    let fb = null;    // the world bitmap, remade at the viewport's size
    let qfb = null;   // a menu's insides, drawn apart and copied through its skin (Menu.draw)
    let pfb = null;   // a submenu's insides, or a field's, drawn apart and copied through its skin into qfb (Menu.draw, drawField)

    function resize() {
      ({ W, H } = View.resize());
      fb = new Framebuffer(W, H);
      Letter.fb = fb; // the letters draw into it unless given another (js/letter.js)
      qfb = new Framebuffer(W, H);
      pfb = new Framebuffer(W, H);
      layout();
    }

    // --- letters -----------------------------------------------------------------
    // a letter (js/letter.js) is one object: a bitmap of ink (a glyph of
    // js/type.js's, cut to its ink, an icon, or a box's art), a home
    // position in continuous world space, a scale and a tilt, and slow
    // sines of its own on each, at rates and phases seeded from its place
    // in the text, drawn as a sprite (js/raster.js), so a sub-pixel move or
    // a touch of scale shows as edge pixels popping, never as the block
    // stepping

    // the page's words are js/type.js's lines in UI.FACE (js/ui.js),
    // helvetica neue's medium. a menu's caret is a > in it (Menu.caret)
    Menu.load(() => document.createElement('canvas'));

    // --- the numbers -------------------------------------------------------------
    // the page's sizes, springs and rates are UI's (js/ui.js), as the site's
    // menus' are

    // the page's own: its name, the menus' column, the sites and the windows
    const OPS = {
      TEXT: 'ops',  // the page's name,
      SIZE: 32,     // its world px to the em,
      SEED: 98000,  // and its letters' seeds, from here
      COLUMN: 600,  // world px, the most the menus' column is across
      APART: 2,     // rows of ROW between the two menus, and between the controls' sites
      METRICS: 'metrics', CONTROLS: 'controls', // what the two menus' headers say
      SITES: SITE.HOSTS, // each site, as /stats and /controls name it, and as the page calls it, its host (js/site.js)
      DAYS: ['7', '30', '90'], WINDOW: ' days', // the windows /stats takes, days long, and what follows one's length
      LOADING: 'loading', // what waits on an answer
      CUT: '...',         // what ends a line cut short
    };
    const SITE_KEYS = Object.keys(OPS.SITES);
    const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

    // --- hover -------------------------------------------------------------------
    // a mouse's pointer over anything a press would press, or over a day of
    // a graph, turns it one of three colours while it is there, by how deep
    // it is (level): each menu's header, its outline, caret and words, in
    // HOVER; what a menu holds (a submenu, a button that picks and the one
    // picked, a field, a button) in HOVER_ITEM; what that holds (another of
    // those a button that picks picks from, a graph's day) in HOVER_LINK.
    // the switch is in HOVER. a finger has no hover. the three are the
    // look's teal, tan and mauve, and where a mouse's pointer is, in world
    // px on the screen, or null, is Hover.at (js/hover.js); what it is over
    // is worked out afresh each frame, so it follows the menus as they move
    // under a still pointer
    const [HOVER, HOVER_ITEM, HOVER_LINK] = Hover.colours();
    // the hover colour of what is n levels into a menu, 0 the menu itself
    const level = Hover.level;
    Hover.listen(canvas, View);

    // --- the menus ---------------------------------------------------------------
    // the page's menus are the site's (js/menu.js): a menu, shut, is a
    // button, and a press on it opens it round what it holds, on its
    // spring, its skin after it and its insides drawn apart (qfb) and
    // copied through the skin. a submenu is a menu inside a menu, its
    // insides drawn apart again (pfb) and copied through its own skin, and
    // a button that picks is a menu too. whatever opens pushes everything
    // under it down as far as it has opened

    // how far down button that picks pm, laid out as pick, has opened past
    // its bottom shut, world px
    function grownOf(pm, pick) {
      return Math.max(0, Menu.at(pm, pick, pm.p).y1 - pick.shut.y1);
    }

    // --- the boxes ---------------------------------------------------------------
    // a bar's art: a box's inside (Menu.inkBox), w x h art px, r round its
    // corners; or, given from or to, only the part of it from row from
    // down and left of column to, the rest left out, so drawn where the
    // whole is drawn it lands on the whole's pixels exactly. each is made
    // the first time it is asked for and kept, so a bar rising asks for
    // each height once
    const arts = new Map();
    const ARTS_KEPT = 8000; // the most kept, past which they are made again as asked for
    function barArt(w, h, r, from = 0, to = w) {
      const key = w + ' ' + h + ' ' + r + ' ' + from + ' ' + to;
      let g = arts.get(key);
      if (g) return g;
      if (arts.size > ARTS_KEPT) arts.clear();
      if (!from && to === w) g = Menu.inkBox(w, h, r).fill;
      else {
        const whole = barArt(w, h, r), ink = new Uint8Array(w * h);
        for (let y = from; y < h; y++) for (let x = 0; x < to; x++) ink[y * w + x] = whole.ink[y * w + x];
        g = { ink, w, h };
      }
      arts.set(key, g);
      return g;
    }

    // --- the switch --------------------------------------------------------------
    // light or dark, as the site's (js/switch.js): a switch EDGE world px in
    // from the window's right edge, its middle level with the middle of the
    // page's name's ink above its baseline: ICONS.switch (js/icons.js) with
    // ICONS.ball over it, the ball a press takes hold of, in HOVER while a
    // mouse is over it or the ball is held. it scrolls with the page, and a
    // press is asked about it where the page has scrolled it to. a click on
    // it, or a little round it, sends the page to its other end (the click,
    // below). the page starts as the visitor last sent the switch, here or
    // on the sites, or as the system is, light or dark; the document behind
    // the canvas is the paper's colour of the end the page is nearer, and
    // the tab's icon is that end's: a teal, a tan and a mauve dot down its
    // diagonal
    Switch.load(window, [HOVER, HOVER_ITEM, HOVER_LINK]);

    // the switch at the window's top right, its middle cy down the page,
    // and its ball
    function placeSwitch(cy) {
      Switch.place(ICONS.switch, ICONS.ball, W - UI.EDGE, cy, true);
    }

    // whether world (x, y) on the screen presses the switch, where the page
    // has scrolled it to
    function switchAt(x, y) {
      return Switch.at(x, y + scrolled());
    }

    // a primary press on the switch is watched, and the click a press that
    // took its ball ends in presses nothing (grabbed, the cursor below)
    Switch.listen(canvas, View, switchAt, () => { grabbed = true; });

    // --- the name ----------------------------------------------------------------
    // the page's name, OPS.TEXT in the page's face, each glyph a letter in
    // ink, its ink EDGE world px clear of the page's top and left edges,
    // SIZE world px to the em. it scrolls with the page
    let nameAt = { letters: [], bottom: UI.EDGE, middle: UI.EDGE }; // its letters, where its ink ends down the page, and the middle of its ink above its baseline
    function placeName() {
      const t = typeOf(OPS.TEXT), k = OPS.SIZE / TYPE.EM, ox = UI.EDGE + k * t.left, base = UI.EDGE + k * t.ascent;
      nameAt = {
        letters: t.glyphs.map((gl) => Letter.make(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, OPS.SEED + gl.at, k)),
        bottom: base + k * t.descent, middle: UI.EDGE + k * t.ascent / 2,
      };
    }

    // --- the words ---------------------------------------------------------------
    // every line of text the page says is a Type (js/type.js) in UI.FACE, made
    // once for each text and kept, and its letters made once for each place
    // they are said at and kept until the next layout (said)
    const types = new Map();
    function typeOf(text) {
      let t = types.get(text);
      if (!t) {
        if (types.size > 4000) types.clear();
        types.set(text, t = new Type(text, () => document.createElement('canvas'), UI.FACE));
      }
      return t;
    }

    // how wide the ink of text is at the text's size size, world px
    function wideOf(text, size) {
      const t = typeOf(text);
      return size / TYPE.EM * (t.left + t.right);
    }

    // text's letters at the text's size size, its ink's left at x0, on the
    // baseline of a row whose top is y0, their seeds from sd, as a menu's
    // are (Menu.kit); or, given w, the text no wider than that (fit)
    const kept = new Map();
    function said(text, x0, y0, size, sd, w = 0) {
      const key = text + '|' + x0 + '|' + y0 + '|' + size + '|' + sd + '|' + w;
      let got = kept.get(key);
      if (!got) {
        if (kept.size > 8000) kept.clear();
        const t = typeOf(w ? fit(text, w, size) : text), k = size / TYPE.EM;
        got = t.glyphs.map((gl) => Letter.make(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (UI.PAD_Y + UI.CAP) + k * gl.dy, sd + gl.at, k));
        kept.set(key, got);
      }
      return got;
    }

    // letters into into, dy world px down, in v
    function drawSaid(ls, t, dy, into, v = 1) {
      for (let i = 0; i < ls.length; i++) ls[i].draw(t, dy, into, 0, v);
    }

    // text no wider than w at the text's size size: as it is, or the most
    // of it that fits with CUT after it
    function fit(text, w, size) {
      if (wideOf(text, size) <= w) return text;
      let lo = 0, hi = text.length;
      while (lo < hi) {
        const n = (lo + hi + 1) >> 1;
        if (wideOf(text.slice(0, n).trimEnd() + OPS.CUT, size) <= w) lo = n;
        else hi = n - 1;
      }
      return text.slice(0, lo).trimEnd() + OPS.CUT;
    }

    // text as lines no wider than w at the text's size size, broken where
    // sep stands in it, most of them at the most, what is past the last
    // cut short (fit)
    function wrap(text, sep, w, size, most = 3) {
      const bits = text.split(sep), lines = [];
      let line = '';
      for (let i = 0; i < bits.length; i++) {
        const next = line ? line + sep + bits[i] : bits[i];
        if (!line || wideOf(next, size) <= w) line = next;
        else {
          lines.push(line);
          line = bits[i];
        }
      }
      if (line) lines.push(line);
      if (lines.length > most) lines.splice(most - 1, lines.length, lines.slice(most - 1).join(sep));
      return lines.map((l) => fit(l, w, size));
    }

    // a count as it is said, its thousands apart: 1,204
    const num = (n) => Math.round(n).toLocaleString('en-US');
    // n of of as a whole percent
    const pct = (n, of) => (of > 0 ? Math.round(100 * n / of) : 0) + '%';
    // n over of to a tenth, 0 for none of
    const per = (n, of) => (of > 0 ? n / of : 0).toFixed(1);
    // a day, yyyy-mm-dd, as its month and day, 'nov 16', read from the
    // text so no zone moves it
    function dayName(day) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
      return m && MONTHS[Number(m[2]) - 1] ? MONTHS[Number(m[2]) - 1] + ' ' + Number(m[3]) : String(day);
    }
    // ms as the day it is here, 'nov 16'
    function atName(ms) {
      const d = new Date(ms);
      return MONTHS[d.getMonth()] + ' ' + d.getDate();
    }

    // --- the answers -------------------------------------------------------------
    // the page asks its own worker (tools/ops/worker.js), one fetch for
    // each thing it needs: a site's numbers over a window from /stats, and
    // both sites' locks from /controls, which a POST there changes. each
    // answer is json; a good one says no error, and anything else is what
    // went wrong, in words: the worker's own, or the status, or no answer.
    // the answers of /stats are kept for the page's life, by site and
    // window, and asked for again only after one failed
    const stats = new Map(); // by 'site|days': { state: 'loading' | 'ok' | 'failed', data, error }
    let controls = { state: 'loading', data: null, error: '' }; // both sites' locks, as /controls last answered

    // a response read: { data }, its json, when it is good and says no
    // error, else { error }
    async function answered(res) {
      let body = null;
      try { body = await res.json(); } catch (e) {}
      if (res.ok && body && typeof body === 'object' && !body.error) return { data: body };
      if (body && typeof body.error === 'string') return { error: body.error };
      return { error: res.status === 401 ? 'locked out · load the page again' : 'answered ' + res.status };
    }

    // url fetched, init as fetch takes it, and its answer read (answered),
    // or { error } with none
    async function ask(url, init) {
      try {
        return await answered(await fetch(url, init));
      } catch (e) {
        return { error: 'no answer' };
      }
    }

    // a site's numbers over days, asked for unless they are kept or being asked for
    async function fetchStats(site, days) {
      const key = site + '|' + days, had = stats.get(key);
      if (had && had.state !== 'failed') return;
      stats.set(key, { state: 'loading' });
      const got = await ask('/stats?site=' + site + '&days=' + days), d = got.data;
      const ok = d && Array.isArray(d.days) && d.days.length > 0 && d.actives && Metrics.shaped(d);
      stats.set(key, ok ? { state: 'ok', data: d } : { state: 'failed', error: got.error || 'an answer not understood' });
    }

    // whether d is both sites' locks as /controls answers them
    function lockShaped(d) {
      return !!d && SITE_KEYS.every((k) => d[k] && typeof d[k].locked === 'boolean' && (d[k].password === 'secret' || d[k].password === 'ops'));
    }

    // both sites' locks asked for
    async function fetchControls() {
      const got = await ask('/controls');
      controls = lockShaped(got.data) ? { state: 'ok', data: got.data, error: '' } : { state: 'failed', data: null, error: got.error || 'an answer not understood' };
    }

    // --- the graphs --------------------------------------------------------------
    // what metrics' submenus hold, each laid out for the numbers of the
    // site and window picked (contentOf). until those come, a submenu says
    // LOADING, and if they could not be had, what went wrong. with them,
    // each holds a daily graph or rows (specOf): visitors, visits and where
    // as the page has them, of what every site counts, and the others as
    // the site's metrics have them (js/metrics.js). a daily graph
    // (placeDaily): over it two lines of numbers, then the tallest day's
    // value in small type over its left end; then a bar a day, oldest at
    // the left, each a rounded box (Menu.inkBox), its art drawn GROW times its
    // size as a letter, so its edges shimmer and it wobbles, a px or two
    // apart, 1 where two would leave a bar under two px; no gridlines and
    // no axes; under the bars the first and last days in small type, and
    // where a bar is split into parts, a legend in words, each part's word
    // in its colour. a pointer over a day lights its bar in level(2), and
    // the two lines say that day's date and its numbers in their place; a
    // finger's press on a day does the same until the next press. rows
    // (placeRows): a row for each thing counted, its word, a bar across and
    // its count, under a bar split in two where there is one, as where's
    // is between phones and desktops; a pointer over a row lights it and
    // the two lines say its word and its numbers. as a submenu opens, and
    // again whenever what it shows changes while it is open, its bars rise
    // from nothing on the menus' spring, each kicked as a menu is as it
    // opens, one after another from the left, or from the top, over RISE s
    // (stepRise)
    const METRICS = {
      GRAPH: 7,   // of the text's size, how tall a graph is
      SMALL: 0.8, // of the text's size, the small type's, no less than CAP_LEAST
      BAR: 0.6,   // of the text's size, how thick a bar across is (a row's),
      MID: 0.27,  // and how far over its row's baseline its middle is: the face's small letters' middle
      TOP: 8,     // the most countries where lists
      RISE: 0.3,  // s from the first bar's kick to the last's
      SEED: 20000, // their letters' seeds run from here
      UNKNOWN: 'unknown', // where's word for a country not known,
      NOTHING: 'nothing counted', // and what it says with no visitors in the window
    };
    // a bar lying across wobbles only along x and y: turned or breathing,
    // one as long as a row's would move its ends a px or more
    const LYING = Object.assign({}, LETTER.WOBBLE, { BREATHE: 0, TILT_RAD: 0 });
    const BLANK = { ink: new Uint8Array(1), w: 1, h: 1 }; // a bar's art before it is first drawn
    const rises = {}; // each submenu's bars as they rise, by its key: { key, t0, p, v, on }

    // count name of a day's counts, 0 for none
    const count = (c, name) => c[name] || 0;

    // the site's metrics (js/metrics.js) handed what they use of the page:
    // how a count and a share are said, a day's count of a name, what
    // follows a window's length, and the hover colours
    Metrics.load({ num, pct, count, WINDOW: OPS.WINDOW, HOVER, HOVER_ITEM, HOVER_LINK });

    // what submenu key shows of the numbers d: visitors' and visits' daily
    // graphs (dailyOf) and where's rows (whereOf) the page's own, any
    // other the site's (Metrics.of). a daily graph's: parts(c), each day's
    // bar's parts from the bottom up, its counts c, in colours, named in
    // the legend (legend, none for a bar of one part); says, the two lines
    // over it; day(c), what the second says of a day pointed at, its date
    // the first; under, the lines under it; and num, how the tallest day's
    // value is written, as a count unless given. rows', summed over the
    // window: rows, each { name, n, tells }, its word, its count and what
    // the second line says of it pointed at, its word the first; whole,
    // the count a bar right across stands for; says, the two lines over
    // them; split, the bar split in two over them, { words, n, tells },
    // its two parts' words, their counts and what the two lines say of
    // each pointed at, else null; and nothing, whether there is nothing to
    // show. what has rows is laid out as rows, else as a daily graph
    function specOf(key, d) {
      if (key === 'visitors' || key === 'visits') return dailyOf(key, d);
      if (key === 'where') return whereOf(d);
      return Metrics.of(key, d);
    }

    // the daily graph of visitors, new and returning, or of visits, of the
    // numbers d, as specOf has a daily graph's
    function dailyOf(key, d) {
      const days = d.days, today = days[days.length - 1].counts, span = days.length + OPS.WINDOW;
      const sum = (f) => days.reduce((s, x) => s + f(x.counts), 0);
      if (key === 'visitors') return {
        parts: (c) => [count(c, 'new'), Math.max(0, count(c, 'visitors') - count(c, 'new'))], colours: [HOVER_ITEM, 1], legend: ['new', 'returning'],
        says: ['today ' + num(count(today, 'visitors')) + ' · 7 days ' + num(d.actives.week) + ' · 30 days ' + num(d.actives.month), num(count(today, 'new')) + ' new today'],
        day: (c) => num(count(c, 'visitors')) + ' visitors · ' + num(count(c, 'new')) + ' new',
        under: [],
      };
      const visits = sum((c) => count(c, 'visits')), visitors = sum((c) => count(c, 'visitors'));
      return {
        parts: (c) => [count(c, 'visits')], colours: [1], legend: null,
        says: ['today ' + num(count(today, 'visits')) + ' · ' + span + ' ' + num(visits), per(visits, visitors) + ' visits a visitor a day'],
        day: (c) => num(count(c, 'visits')) + ' visits · ' + per(count(c, 'visits'), count(c, 'visitors')) + ' a visitor',
        under: [],
      };
    }

    // where's rows of the numbers d, as specOf has rows': the phones and
    // the desktops among the visitors, split, and the TOP countries most of
    // them came from, a bar as long as its share of all of them; its
    // counts are daily visitors, so a visitor seen on two days is two
    function whereOf(d) {
      const days = d.days, sumOf = {};
      for (let i = 0; i < days.length; i++) {
        const c = days[i].counts;
        for (const k in c) sumOf[k] = (sumOf[k] || 0) + c[k];
      }
      const of = (k) => sumOf[k] || 0;
      const phone = of('device:phone'), desktop = of('device:desktop'), both = phone + desktop;
      const countries = Object.keys(sumOf).filter((k) => k.startsWith('country:')).map((k) => ({ cc: k.slice(8), n: sumOf[k] })).sort((a, b) => b.n - a.n || (a.cc < b.cc ? -1 : 1));
      const all = countries.reduce((s, c) => s + c.n, 0), nameOf = (cc) => cc === '-' ? METRICS.UNKNOWN : cc.toLowerCase();
      return {
        nothing: !all && !both, whole: all,
        says: [num(all) + ' daily visitors · ' + countries.length + (countries.length === 1 ? ' country' : ' countries'), 'phone ' + pct(phone, both) + ' · desktop ' + pct(desktop, both)],
        split: { words: ['phone', 'desktop'], n: [phone, desktop], tells: [num(phone) + ' · ' + pct(phone, both), num(desktop) + ' · ' + pct(desktop, both)] },
        rows: countries.slice(0, METRICS.TOP).map((c) => ({ name: nameOf(c.cc), n: c.n, tells: num(c.n) + ' · ' + pct(c.n, all) })),
      };
    }

    // the room inside submenu S, and the measures every graph's layout
    // shares: { x0, x1, w, y0, size, small, srow, sd, M }: its ink's left
    // and right, a pad in from S's inside, and how far apart; the top of
    // its first row, under its header; the text's size and the small
    // type's; a row of small type; its seeds; and the menu kit
    function roomOf(S) {
      const M = at.kit, size = at.size, small = at.small, x0 = Math.round(S.x0 + M.pad), x1 = Math.round(S.x1 - M.pad);
      return { x0, x1, w: x1 - x0, y0: S.shut.y1, size, small, srow: Math.round(small * (UI.PAD_Y + UI.CAP + UI.DESC)), sd: S.seed, M };
    }

    // submenu S saying text, in its words, as lines no wider than its
    // room: { kind, lines, bottom }
    function placeSaid(S, text) {
      const R = roomOf(S), lines = wrap(text, ' ', R.w, R.size);
      return { kind: 'said', lines: lines.map((l, j) => said(l, R.x0, R.y0 + j * R.M.lead, R.size, R.sd + 100 * j)), bottom: R.y0 + (lines.length - 1) * R.M.lead + R.M.th + R.M.margin, count: 0 };
    }

    // submenu S's daily graph of the numbers d, shown as spec has it
    // (specOf): { kind, R, says, day, tallest, first, last, legend, under,
    // graph, count, bottom }. says the two lines over it, day(i) them
    // pointing at day i; tallest the tallest day's value, first and last
    // the first and last days, as letters; legend, each part's word and its
    // colour, { letters, v }; under, the lines under it; graph, { x0, top,
    // floor, n, bw, gap, pitch, aw, r, totals, parts, colours, max,
    // letters, right }: the left of the first bar, where the tallest is as
    // tall as it goes and where they stand, the days, a bar's width, the
    // gap between two and the two together, a bar's art's width and its
    // corners' radius, each day's total and its parts, their colours, the
    // most of any day, a letter for each bar and where the last ends
    function placeDaily(S, d, spec) {
      const R = roomOf(S), M = R.M, n = d.days.length;
      const gap = (R.w + 2) / n - 2 < 2 ? 1 : 2, bw = Math.max(1, Math.floor((R.w + gap) / n) - gap), aw = Math.max(1, Math.round(bw / UI.GROW));
      const parts = d.days.map((x) => spec.parts(x.counts)), totals = parts.map((p) => p.reduce((s, v) => s + v, 0));
      const max = totals.reduce((m, v) => Math.max(m, v), 0), right = R.x0 + n * (bw + gap) - gap;
      const ys = R.y0 + M.lead + M.th, top = ys + R.srow, floor = top + Math.round(METRICS.GRAPH * R.size), yd = floor + 2;
      const graph = {
        x0: R.x0, top, floor, n, bw, gap, pitch: bw + gap, aw, r: Math.min(UI.RADIUS * R.size / UI.GROW, aw / 2), totals, parts, colours: spec.colours, max, right,
        letters: d.days.map((x, i) => Letter.make(BLANK, 0, 0, R.sd + 3000 + i, UI.GROW)),
      };
      const last = dayName(d.days[n - 1].day);
      let y = yd + R.srow;
      const legend = [];
      if (spec.legend) {
        let x = R.x0;
        for (let k = 0; k < spec.legend.length; k++) {
          const word = spec.legend[k], w = wideOf(word, R.small);
          if (x > R.x0 && x + w > R.x1) {
            x = R.x0;
            y += R.srow;
          }
          legend.push({ letters: said(word, x, y, R.small, R.sd + 600 + 50 * k), v: spec.colours[k] });
          x += w + M.apart * 2;
        }
        y += R.srow;
      }
      const under = [];
      for (let k = 0; k < spec.under.length; k++) {
        const lines = wrap(spec.under[k], ' · ', R.w, R.size);
        for (let j = 0; j < lines.length; j++) {
          under.push(said(lines[j], R.x0, y, R.size, R.sd + 800 + 100 * under.length));
          y += M.lead;
        }
      }
      if (under.length) y += M.th - M.lead;
      return {
        kind: 'daily', R, graph, count: n, bottom: y + M.margin,
        says: spec.says, day: (i) => [dayName(d.days[i].day), spec.day(d.days[i].counts)],
        tallest: said((spec.num || num)(max), R.x0, ys, R.small, R.sd + 200),
        first: said(dayName(d.days[0].day), R.x0, yd, R.small, R.sd + 300),
        last: said(last, Math.round(right - wideOf(last, R.small)), yd, R.small, R.sd + 400),
        legend, under,
      };
    }

    // submenu S's rows, shown as spec has them (specOf), or NOTHING said
    // with nothing to show: { kind, R, says, day, split, ends, rows, hits,
    // lead, count, bottom }. says the two lines over them, day(i) them
    // pointing at part i; split, the bar split in two, if spec has one ({
    // x0, cy, w, h, share, first, letter }: its left, its middle down, its
    // length and thickness, its share of that, whole, its first part's
    // share of it, in HOVER_ITEM at its left, the other in ink, and its
    // letter), and ends, the two parts' words under its ends; rows, each
    // row's ({ n, name, number, x0, cy, w, h, share, letter, top }): its
    // word at the left, a bar as long as its count's share of spec's
    // whole, and its count at the right; hits, where a pointer is over
    // each part, { i, rect }, the split's two first; lead, how many parts
    // come before the rows
    function placeRows(S, spec) {
      if (spec.nothing) return placeSaid(S, METRICS.NOTHING);
      const R = roomOf(S), M = R.M, sp = spec.split, list = spec.rows, hits = [];
      const bh = Math.max(4, Math.round(METRICS.BAR * R.size));
      let y = R.y0 + M.lead + M.th + M.row, split = null, ends = null;
      if (sp) {
        const both = sp.n[0] + sp.n[1], y1 = y, yl = y1 + bh + 2;
        split = { x0: R.x0, cy: y1 + bh / 2, w: R.w, h: bh, share: both ? 1 : 0, first: both ? sp.n[0] / both : 0, letter: Letter.make(BLANK, 0, 0, R.sd + 3000, UI.GROW, LYING) };
        ends = [said(sp.words[0], R.x0, yl, R.small, R.sd + 500), said(sp.words[1], Math.round(R.x1 - wideOf(sp.words[1], R.small)), yl, R.small, R.sd + 520)];
        const mid = Math.round(R.x0 + split.first * R.w);
        hits.push({ i: 0, rect: { x0: R.x0, y0: y1 - 2, x1: mid, y1: yl + R.srow } }, { i: 1, rect: { x0: mid, y0: y1 - 2, x1: R.x1, y1: yl + R.srow } });
        y = yl + R.srow + M.row;
      }
      const lead = hits.length;
      const nw = Math.max(0, ...list.map((r) => wideOf(r.name, R.size))), cw = Math.max(0, ...list.map((r) => wideOf(num(r.n), R.size)));
      const bx = Math.round(R.x0 + nw + 2 * M.pad), bw = Math.max(1, Math.round(R.x1 - cw - 2 * M.pad - bx)), rows = [];
      for (let k = 0; k < list.length; k++) {
        const r = list[k], text = num(r.n);
        rows.push({
          n: r.n, name: said(r.name, R.x0, y, R.size, R.sd + 1000 + 50 * k), number: said(text, Math.round(R.x1 - wideOf(text, R.size)), y, R.size, R.sd + 1020 + 50 * k),
          x0: bx, cy: y + R.size * (UI.PAD_Y + UI.CAP - METRICS.MID), w: bw, h: bh, share: spec.whole ? r.n / spec.whole : 0, letter: Letter.make(BLANK, 0, 0, R.sd + 3100 + k, UI.GROW, LYING), top: y,
        });
        hits.push({ i: lead + k, rect: { x0: R.x0, y0: y, x1: R.x1, y1: y + M.lead } });
        y += M.lead;
      }
      if (rows.length) y += M.th - M.lead;
      return {
        kind: 'rows', R, says: spec.says, split, ends, rows, hits, lead, count: (split ? 1 : 0) + rows.length, bottom: y + M.margin,
        day: (i) => i < lead ? [sp.words[i], sp.tells[i]] : [list[i - lead].name, list[i - lead].tells],
      };
    }

    // the numbers of the site and window picked, as kept: { state, data, error }, or none yet
    function statsNow() {
      return stats.get(pickedSite() + '|' + pickedDays()) || null;
    }

    // what submenu S holds for the numbers picked, laid out again only
    // when those, or how far they have come, change: key, what it shows
    function contentOf(S) {
      const e = statsNow(), state = e ? e.state : 'loading', key = S.key + '|' + pickedSite() + '|' + pickedDays() + '|' + state;
      if (S.laid && S.laid.key === key) return S.laid;
      if (state === 'ok') {
        const spec = specOf(S.key, e.data);
        S.laid = spec.rows ? placeRows(S, spec) : placeDaily(S, e.data, spec);
      } else S.laid = placeSaid(S, state === 'failed' ? e.error : OPS.LOADING);
      S.laid.key = key;
      return S.laid;
    }

    // submenu S's bars, laid out as L, dt on: from nothing once it is open
    // with them in it and they are new to it, each kicked RISE s * i / n
    // after the first, then on the spring toward their height; forgotten
    // once it is shut, so they rise again when it next opens
    function stepRise(S, sm, L, dt, t) {
      const R = rises[S.key] || (rises[S.key] = { key: null, t0: 0, p: null, v: null, on: null });
      if (!sm.open) {
        R.key = null;
        return;
      }
      if (!L.count) return;
      const n = L.count;
      if (R.key !== L.key) Object.assign(R, { key: L.key, t0: t, p: new Float64Array(n), v: new Float64Array(n), on: new Uint8Array(n) });
      const w = 2 * Math.PI / UI.RESPONSE, z = 1 - UI.BOUNCE, sg = z * w, wd = w * Math.sqrt(1 - z * z);
      const e = Math.exp(-sg * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt);
      for (let i = 0; i < n; i++) {
        if (!R.on[i]) {
          if (t - R.t0 < METRICS.RISE * i / Math.max(1, n - 1)) continue;
          R.on[i] = 1;
          R.v[i] += UI.KICK;
        }
        const x0 = R.p[i] - 1, v0 = R.v[i];
        R.p[i] = 1 + e * (x0 * c + (v0 + sg * x0) / wd * sn);
        R.v[i] = e * (v0 * c - (w * w * x0 + sg * v0) / wd * sn);
        if (R.p[i] < 0) { R.p[i] = 0; R.v[i] = Math.max(0, R.v[i]); }
      }
    }

    // how far bar i of submenu S's has risen, laid out as L: 1 with none rising
    function risen(S, L, i) {
      const R = rises[S.key];
      return R && R.p && R.p.length === L.count ? R.p[i] : 1;
    }

    // bar i of graph G, risen p of the way, dy world px down, into pfb: in
    // lit if given, else each part in its colour, the top part's over the
    // whole bar and each under it over the bar from its own top down, all
    // drawn where the whole is (barArt), so the bar is one rounded box in
    // bands. its art is aw across and as tall as its share of the tallest
    // day's, GROW times smaller than drawn, two art px at the least,
    // standing on the graph's floor
    function drawDayBar(G, i, p, dy, t, lit) {
      const total = G.totals[i], hpx = G.max > 0 ? (G.floor - G.top) * total / G.max * p : 0;
      if (!total || hpx < 0.5) return;
      const aw = G.aw, ah = Math.max(2, Math.round(hpx / UI.GROW)), r = Math.min(G.r, ah / 2), L = G.letters[i];
      L.cx = G.x0 + i * G.pitch + G.bw / 2;
      L.cy = G.floor - ah * UI.GROW / 2;
      if (lit) {
        L.g = barArt(aw, ah, r);
        L.draw(t, dy, pfb, 0, lit);
        return;
      }
      const parts = G.parts[i];
      let above = 0; // the parts over this one, summed
      for (let k = parts.length - 1; k >= 0; k--) {
        if (!parts[k]) continue;
        const from = Math.round(ah * above / total);
        above += parts[k];
        if (from >= ah) continue;
        L.g = barArt(aw, ah, r, from);
        L.draw(t, dy, pfb, 0, G.colours[k]);
      }
    }

    // bar B lying across, risen p of the way, dy world px down, into pfb,
    // as long as its share of its whole length, in v; given split, its
    // first share of that in split's colour, { share, v }
    function drawRowBar(B, p, dy, t, v, split) {
      const len = B.w * B.share * p;
      if (len < 0.5) return;
      const ah = Math.max(1, Math.round(B.h / UI.GROW)), aw = Math.max(2, Math.round(len / UI.GROW)), r = Math.min(UI.RADIUS * at.size / UI.GROW, ah / 2), L = B.letter;
      L.g = barArt(aw, ah, r);
      L.cx = B.x0 + aw * UI.GROW / 2;
      L.cy = B.cy;
      L.draw(t, dy, pfb, 0, v);
      if (!split) return;
      const to = Math.round(aw * split.share);
      if (to <= 0) return;
      L.g = barArt(aw, ah, r, 0, to);
      L.draw(t, dy, pfb, 0, split.v);
    }

    // what submenu S holds, dy world px down, into pfb, on what the pointer
    // is on (on): its words, and its graph's bars as far as they have
    // risen, the day pointed at, by the pointer or a finger's press
    // (pinned), lit in level(2) and its date and numbers in the two lines
    function drawContent(S, dy, t, on) {
      const L = contentOf(S), lit = on && on.graph === S.key ? on : pinned && pinned.graph === S.key ? pinned : null;
      if (L.kind === 'said') {
        for (let j = 0; j < L.lines.length; j++) drawSaid(L.lines[j], t, dy, pfb);
        return;
      }
      const R = L.R, i = lit ? lit.i : -1, lines = i >= 0 ? L.day(i) : L.says, lv = level(2);
      for (let j = 0; j < 2; j++) drawSaid(said(lines[j], R.x0, R.y0 + j * R.M.lead, R.size, R.sd + 100 * j, R.w), t, dy, pfb);
      if (L.kind === 'rows') {
        if (L.split) {
          drawRowBar(L.split, risen(S, L, 0), dy, t, i === 1 ? lv : 1, { share: L.split.first, v: i === 0 ? lv : HOVER_ITEM });
          drawSaid(L.ends[0], t, dy, pfb, HOVER_ITEM);
          drawSaid(L.ends[1], t, dy, pfb);
        }
        const bars = L.split ? 1 : 0;
        for (let k = 0; k < L.rows.length; k++) {
          const r = L.rows[k], v = i === L.lead + k ? lv : 1;
          drawSaid(r.name, t, dy, pfb, v);
          drawSaid(r.number, t, dy, pfb, v);
          drawRowBar(r, risen(S, L, bars + k), dy, t, v, null);
        }
        return;
      }
      drawSaid(L.tallest, t, dy, pfb);
      drawSaid(L.first, t, dy, pfb);
      drawSaid(L.last, t, dy, pfb);
      for (let k = 0; k < L.legend.length; k++) drawSaid(L.legend[k].letters, t, dy, pfb, L.legend[k].v);
      for (let k = 0; k < L.under.length; k++) drawSaid(L.under[k], t, dy, pfb);
      const G = L.graph;
      for (let k = 0; k < G.n; k++) drawDayBar(G, k, risen(S, L, k), dy, t, k === i ? lv : 0);
    }

    // which day of what submenu S holds world (x, y) on the page is over,
    // y less how far S has been pushed down: anywhere in a daily graph's
    // column for it, from the tallest's top to the floor, or a part of
    // rows, { graph, i }, graph S's key and i the day or the part; or null
    function hitContent(S, x, y) {
      const L = contentOf(S);
      if (L.kind === 'daily') {
        const G = L.graph;
        if (y < G.top - 2 || y > G.floor + 2 || x < G.x0 - G.gap / 2 || x >= G.right + G.gap / 2) return null;
        return { graph: S.key, i: Math.max(0, Math.min(G.n - 1, Math.floor((x - G.x0 + G.gap / 2) / G.pitch))) };
      }
      if (L.kind === 'rows') {
        for (let k = 0; k < L.hits.length; k++) {
          const r = L.hits[k].rect;
          if (x >= r.x0 && x < r.x1 && y >= r.y0 && y < r.y1) return { graph: S.key, i: L.hits[k].i };
        }
      }
      return null;
    }

    // --- metrics -----------------------------------------------------------------
    // the first menu, under the page's name, EDGE in from the window's
    // left: shut, a button with a caret and METRICS at its left; open, down
    // and to the right round one column, MARGIN round it, as wide as
    // COLUMN or as the window leaves, EDGE in from its right. the column
    // holds, side by side across its top, two buttons that pick: the site,
    // of SITES, the live site first, and the window, of DAYS, 30 first; and
    // under them, ROW apart, its submenus (Metrics.SUBS), each as wide as
    // the column, holding what the graphs lay out (the graphs, above). a
    // button that picks opened shuts the other, and either pushes the
    // submenus down as far as it has opened; a submenu, those under it and
    // the menu's bottom. a pick of another site or window asks /stats for
    // it, unless it is kept, and what the submenus hold shows it. under the
    // pointer the header is in level(0), a submenu's header and a button
    // that picks in level(1), and another of those it picks from in
    // level(2)
    const metricsMenu = Menu.shut();
    const metricsPicks = { site: Menu.shut(), days: Menu.shut() }; // its buttons that pick, menus too
    const metricsOrders = { site: [0, 1], days: [1, 0, 2] };    // what those pick from, as they list them, each its place in SITE_KEYS or DAYS: the first is the one picked
    const metricsSubs = Object.fromEntries(Metrics.SUBS.map(([key]) => [key, Menu.shut()])); // its submenus, by key
    const metricsPush = Object.fromEntries(Metrics.SUBS.map(([key]) => [key, 0]));          // world px each is pushed down by what opens over it
    let controlsPush = 0; // world px metrics has opened past its button, which the controls are pushed down by

    const pickedSite = () => SITE_KEYS[metricsOrders.site[0]];
    const pickedDays = () => OPS.DAYS[metricsOrders.days[0]];

    // metrics laid out with its button's top left at (left, top) and its
    // column col across, its parts as M (Menu.kit) makes them: { room,
    // size, shut, full, bottom, header, picks, subs }. picks, its two
    // buttons that pick, site and days, each as wide as the widest it
    // picks from with two pads; subs, each submenu, a menu of its own ({
    // key, room, size, seed, shut, full, header, x0, x1, laid }): shut, a
    // button as wide as the column, its caret and words from its left;
    // open, down round what it holds (contentOf), x0 and x1 its inside,
    // MARGIN in from its sides
    function placeMetrics(M, left, top, col) {
      const { room, size, th, ph, pad, margin, row, wide, headed, head } = M, sd = METRICS.SEED, sx0 = left + margin, sx1 = sx0 + col;
      const tt = typeOf(OPS.METRICS), shut = { x0: left, y0: top, x1: left + headed(tt), y1: top + th };
      const sites = SITE_KEYS.map((k) => typeOf(OPS.SITES[k])), windows = OPS.DAYS.map((n) => typeOf(n + OPS.WINDOW));
      const sw = Math.round(Math.max(...sites.map(wide)) + 2 * pad), ww = Math.round(Math.max(...windows.map(wide)) + 2 * pad);
      const picks = { site: M.pick(sites, sx0, sx0 + sw, shut.y1, sd + 100), days: M.pick(windows, sx0 + sw + row, sx0 + sw + row + ww, shut.y1, sd + 400) };
      let y = shut.y1 + ph + row;
      const subs = Metrics.SUBS.map(([key, title], c) => {
        const seed = sd + 10000 * (c + 1);
        const S = { key, room, size, seed, shut: { x0: sx0, y0: y, x1: sx1, y1: y + th }, header: head(typeOf(title), sx0, y, seed), x0: sx0 + margin, x1: sx1 - margin, laid: null };
        S.full = { x0: sx0, y0: y, x1: sx1, y1: y + th };
        y = S.shut.y1 + row;
        return S;
      });
      const full = { x0: left, y0: top, x1: sx1 + margin, y1: y - row + margin };
      return { room, size, shut, full, bottom: full.y1, header: head(tt, left, top, sd), picks, subs };
    }

    // metrics dt on: its buttons that pick toward open or shut, shut once
    // the menu is; each submenu, shut once the menu is, pushed down as far
    // as the buttons that pick and the submenus over it have opened, as
    // tall open as what it holds (contentOf), and its bars rising
    // (stepRise); the menu as much taller as they have opened; and how far
    // it has opened past its button, which pushes the controls down
    function stepMetrics(dt, t) {
      const ui = at.metrics, m = metricsMenu;
      let push = 0;
      for (const key in metricsPicks) {
        const pm = metricsPicks[key], P = ui.picks[key];
        if (!m.open) pm.open = false;
        Menu.step(pm, P, dt, t);
        push = Math.max(push, grownOf(pm, P));
      }
      for (let c = 0; c < ui.subs.length; c++) {
        const S = ui.subs[c], sm = metricsSubs[S.key], L = contentOf(S);
        metricsPush[S.key] = push;
        if (!m.open) sm.open = false;
        S.full.y1 = L.bottom;
        Menu.step(sm, S, dt, t);
        stepRise(S, sm, L, dt, t);
        push += Math.max(0, Menu.at(sm, S, sm.p).y1 - S.shut.y1);
      }
      ui.full.y1 = ui.bottom + push;
      Menu.step(m, ui, dt, t);
      controlsPush = Math.max(0, Menu.at(m, ui, m.p).y1 - ui.shut.y1);
    }

    // metrics' insides, laid out as ui, dy world px down, into qfb, on what
    // the pointer is on (on): its two buttons that pick (Menu.drawPick), and
    // each submenu as far down as what opens over it has pushed it, drawn
    // as a submenu is (Menu.draw), what it holds by drawContent
    function drawMetricsInside(ui, dy, t, on) {
      for (const key in metricsPicks) Menu.drawPick(ui.picks[key], metricsPicks[key], metricsOrders[key], dy, grownOf(metricsPicks[key], ui.picks[key]), t, on, qfb, level(1), level(2));
      for (let c = 0; c < ui.subs.length; c++) {
        const S = ui.subs[c];
        Menu.draw(S, metricsSubs[S.key], dy + metricsPush[S.key], t, on, drawContent, qfb, pfb, level(1));
      }
    }

    // what a press at world (x, y) on the page would press in metrics: its
    // header, a little round it, or once the menu is over half open
    // anywhere across its top row, { menu }; once it is over half open, a
    // button that picks, a little round it, or, once that is over half
    // open, one of the rows under it, { option, pick }, pick which; a
    // submenu's header, a little round it, where it has been pushed down
    // to, { menu }, and once that is over half open a day of what it holds
    // (hitContent), { graph, i }; or anywhere else in the open menu, {
    // inside }. or null
    function hitMetrics(x, y) {
      const ui = at.metrics, m = metricsMenu, inside = (r, g, dy = 0) => x >= r.x0 - g && x <= r.x1 + g && y - dy >= r.y0 - g && y - dy <= r.y1 + g;
      if (inside(ui.shut, 2)) return { menu: m };
      if (!m.open || m.p <= 0.5) return null;
      if (x >= ui.full.x0 && x <= ui.full.x1 && y >= ui.full.y0 - 2 && y < ui.shut.y1 - 2) return { menu: m };
      for (const key in metricsPicks) {
        const rows = ui.picks[key].rows, pm = metricsPicks[key];
        if (inside(rows[0].rect, 2)) return { option: rows[0], pick: key };
        if (pm.open && pm.p > 0.5) for (let j = 1; j < rows.length; j++) if (inside(rows[j].rect, 0)) return { option: rows[j], pick: key };
      }
      for (let c = 0; c < ui.subs.length; c++) {
        const S = ui.subs[c], sm = metricsSubs[S.key], dy = metricsPush[S.key];
        if (inside(S.shut, 2, dy)) return { menu: sm };
        if (!sm.open || sm.p <= 0.5) continue;
        const h = hitContent(S, x, y - dy);
        if (h) return h;
      }
      if (inside(Menu.at(m, ui, m.p), 0)) return { inside: m };
      return null;
    }

    // a press on one of metrics' buttons that pick: on the one picked, it
    // opened, kicked, shutting the other, or shut; on another, that one put
    // where the one picked was, that one where it was, the button shut,
    // and the numbers for what is now picked asked for
    function pressPick(h) {
      const order = metricsOrders[h.pick], pm = metricsPicks[h.pick];
      if (h.option.j) {
        const j = h.option.j, was = order[0];
        order[0] = order[j];
        order[j] = was;
        pm.open = false;
        pinned = null;
        fetchStats(pickedSite(), pickedDays());
        return;
      }
      pm.open = !pm.open;
      if (!pm.open) return;
      pm.v += UI.KICK;
      for (const key in metricsPicks) if (key !== h.pick) metricsPicks[key].open = false;
    }

    // --- the controls ------------------------------------------------------------
    // the second menu, OPS.APART rows under metrics' button and pushed down
    // as far as metrics has opened past it, built as metrics is: open, it
    // holds a part for each site, OPS.APART rows apart, until /controls has
    // answered only LOADING, or what went wrong. a site's part, top to
    // bottom:
    //   its name, and beside it a button that picks whether it is LOCKED or
    //   open: the pick that takes the live site (main) from how it starts
    //   (SITE.OPEN, js/site.js), locking it where it starts open and
    //   opening it where it starts locked, takes a second press, the first
    //   turning it to SURE for SURE_S s; the other pick, and dev's, take
    //   one;
    //   its password: SECRET while it is still the worker's own, or SET_AT
    //   and the day its gate row last changed once one was set from here;
    //   a field to type a new one into (the field, below), and SET at its
    //   right, which, as enter in the field does, sends what is typed;
    //   and, once something was sent, SAVING until it is answered, DONE once
    //   it is, or what went wrong.
    // a change is sent as /controls takes it, { site, locked } or { site,
    // password }, and its answer, both sites' locks, shown for both. while
    // one is out for a site, its button that picks shows what was sent, and
    // nothing more is sent for it. a button that picks opened shuts the
    // other, and pushes everything under it down as far as it has opened.
    // under the pointer the header is in level(0), and a button that picks
    // and the one it shows, the field and SET in level(1), and the other in
    // level(2)
    const CONTROLS = {
      LOCK: ['locked', 'open'], SURE: 'sure?', SURE_S: 3, // what the button that picks says, and what the pick that asks twice says for s after a press
      PASSWORD: 'password · ', SECRET: 'cloudflare secret', SET_AT: 'set from ops ', // what the password's line says
      SET: 'set',                          // what the button beside the field says
      SAVING: 'saving',                    // what a part says while a change is out,
      DONE: 'done · its gate takes it within 30 s', // and once it is answered
      SEED: 80000,                         // its letters' seeds run from here
    };
    const controlsMenu = Menu.shut();
    const lockPicks = { main: Menu.shut(), dev: Menu.shut() }; // each site's button that picks
    // each site's sending: whether a change is out, the lock sent while it
    // is (null for none), the s its pick that asks twice still says SURE,
    // and what it says of the last change
    const sends = { main: { out: false, want: null, sure: 0, says: '' }, dev: { out: false, want: null, sure: 0, says: '' } };
    const controlsPushes = [0, 0, 0]; // world px a row of the controls is pushed down by the buttons that pick over it, by how many there are

    // whether site is shown locked: as sent while a change is out, else as last answered
    function shownLocked(site) {
      const s = sends[site];
      return s.want !== null ? s.want : controls.data[site].locked;
    }

    // whether picking locked (true) or open (false) for site asks twice:
    // only the pick that takes the live site from how it starts (SITE.OPEN)
    const asksTwice = (site, locked) => site === 'main' && locked === SITE.OPEN;

    // what site's button that picks lists, each its place in LOCK, or 2 for
    // SURE: the lock shown first, then the other, SURE in its place while
    // it says it, if it is the pick that asks twice
    function lockOrder(site) {
      const shown = shownLocked(site);
      return [shown ? 0 : 1, sends[site].sure > 0 && asksTwice(site, !shown) ? 2 : shown ? 1 : 0];
    }

    // what site's password line says
    function passwordSays(site) {
      const c = controls.data[site];
      return CONTROLS.PASSWORD + (c.password === 'ops' ? CONTROLS.SET_AT + (c.at ? atName(c.at) : '') : CONTROLS.SECRET);
    }

    // what the controls show, as one line of text: they are laid out again
    // whenever it changes
    function controlsShows() {
      let s = controls.state + '|' + controls.error;
      if (controls.state === 'ok') for (const site of SITE_KEYS) s += '|' + passwordSays(site) + '|' + sends[site].says;
      return s;
    }

    // the controls laid out with their button's top left at (left, top)
    // and their column col across, as they show now (controlsShows): {
    // key, room, size, shut, full, bottom, header, said, parts }: said, the
    // lines saying LOADING or what went wrong while there are no locks;
    // parts, with them, each site's ({ site, name, pick, password, field,
    // set, says }): its name's letters; its button that picks, a menu of
    // its own as metrics' are, beside the name; the password line's
    // letters; field, { x0, y0, y1, most }, where the field stands and the
    // most it may be across; set, SET's { rect, letters }, at the column's
    // right; and says, the lines of what it says of the last change. the
    // name and the button that picks are pushed down by the buttons that
    // pick over them (controlsPushes) and the rest by those and its own
    function placeControls(M, left, top, col) {
      const { room, size, th, pad, margin, row, lead, wide, headed, head } = M, C = CONTROLS, sx0 = left + margin, sx1 = sx0 + col;
      const tt = typeOf(OPS.CONTROLS), shut = { x0: left, y0: top, x1: left + headed(tt), y1: top + th }, key = controlsShows();
      const ui = { key, room, size, shut, header: head(tt, left, top, C.SEED), said: null, parts: null };
      let y = shut.y1;
      if (controls.state !== 'ok') {
        const lines = wrap(controls.state === 'failed' ? controls.error : OPS.LOADING, ' ', col - 2 * pad, size);
        ui.said = lines.map((l, j) => said(l, sx0 + pad, y + j * lead, size, C.SEED + 100 + 100 * j));
        y += (lines.length - 1) * lead + th;
      } else {
        const nameW = Math.round(Math.max(...SITE_KEYS.map((k) => wide(typeOf(OPS.SITES[k])))) + 2 * pad);
        const lw = Math.round(Math.max(...C.LOCK.concat(C.SURE).map((s) => wide(typeOf(s)))) + 2 * pad), setW = Math.round(wide(typeOf(C.SET)) + 2 * pad);
        ui.parts = SITE_KEYS.map((site, n) => {
          const sd = C.SEED + 1000 * (n + 1), part = { site, n };
          if (n) y += OPS.APART * row;
          part.name = said(OPS.SITES[site], sx0 + pad, y, size, sd);
          part.pick = M.pick(C.LOCK.concat(C.SURE).map(typeOf), sx0 + nameW, sx0 + nameW + lw, y, sd + 100);
          y += th + row;
          part.password = said(passwordSays(site), sx0 + pad, y, size, sd + 400);
          y += th + row;
          part.field = { x0: sx0, y0: y, y1: y + th, most: sx1 - setW - row - sx0 };
          part.set = { rect: { x0: sx1 - setW, y0: y, x1: sx1, y1: y + th }, letters: said(C.SET, sx1 - setW + pad, y, size, sd + 500) };
          y += th;
          const lines = sends[site].says ? wrap(sends[site].says, ' ', col - 2 * pad, size) : [];
          part.says = lines.map((l, j) => said(l, sx0 + pad, y + row + j * lead, size, sd + 600 + 100 * j));
          if (lines.length) y += row + (lines.length - 1) * lead + th;
          return part;
        });
      }
      ui.full = { x0: left, y0: top, x1: sx1 + margin, y1: y + margin };
      ui.bottom = ui.full.y1;
      return ui;
    }

    // the controls dt on, laid out again first if what they show has
    // changed; each site's SURE counted down, and forgotten once its button
    // that picks is shut; its button that picks toward open or shut, shut
    // once the menu is, pushing the rows under it down as far as it has
    // opened (controlsPushes), and its field (stepField); the menu as much
    // taller as they have opened; and the field let go once the menu is
    // shut or there is no field
    function stepControls(dt, t) {
      if (controlsShows() !== at.controls.key) {
        at.controls = placeControls(at.kit, at.controls.shut.x0, at.controls.shut.y0, at.col);
        for (const site of SITE_KEYS) fitField(site);
      }
      const ui = at.controls, m = controlsMenu;
      let push = 0;
      for (let n = 0; n < SITE_KEYS.length; n++) {
        const site = SITE_KEYS[n], pm = lockPicks[site], s = sends[site], P = ui.parts && ui.parts[n];
        controlsPushes[n] = push;
        if (!m.open) pm.open = false;
        s.sure = pm.open ? Math.max(0, s.sure - dt) : 0;
        if (!P) {
          if (pm.skin) Object.assign(pm, Menu.shut());
          fields[site].skin = null;
          continue;
        }
        P.pick.full.y1 = P.pick.rows[1].rect.y1;
        Menu.step(pm, P.pick, dt, t);
        push += grownOf(pm, P.pick);
        stepField(site, P, dt, t);
      }
      controlsPushes[SITE_KEYS.length] = push;
      ui.full.y1 = ui.bottom + push;
      Menu.step(m, ui, dt, t);
      if (fieldHeld && (!m.open || !ui.parts)) input.blur();
    }

    // the controls' insides, laid out as ui, dy world px down, into qfb, on
    // what the pointer is on (on): LOADING or what went wrong; or each
    // site's part, each row as far down again as the buttons that pick over
    // it have pushed it: its name, its button that picks (Menu.drawPick), its
    // password line, its field (drawField), SET outlined round its word,
    // in level(1) under the pointer, and what it says of the last change
    function drawControlsInside(ui, dy, t, on) {
      if (!ui.parts) {
        for (let j = 0; j < ui.said.length; j++) drawSaid(ui.said[j], t, dy, qfb);
        return;
      }
      for (let n = 0; n < ui.parts.length; n++) {
        const P = ui.parts[n], site = P.site, pm = lockPicks[site], d0 = dy + controlsPushes[n], d1 = dy + controlsPushes[n + 1];
        drawSaid(P.name, t, d0, qfb);
        Menu.drawPick(P.pick, pm, lockOrder(site), d0, grownOf(pm, P.pick), t, on, qfb, level(1), level(2));
        drawSaid(P.password, t, d1, qfb);
        drawField(site, P, d1, t, on);
        const r = P.set.rect, v = on && on.set === site ? level(1) : 1;
        qfb.roundRect(r.x0, r.y0 + d1, r.x1, r.y1 + d1, UI.RADIUS * ui.size, null, v, UI.LINE);
        drawSaid(P.set.letters, t, d1, qfb, v);
        for (let j = 0; j < P.says.length; j++) drawSaid(P.says[j], t, d1, qfb);
      }
    }

    // what a press at world (x, y) on the page would press in the
    // controls, where they have been pushed down to: their header, a little
    // round it, or once the menu is over half open anywhere across its top
    // row, { menu }; once it is over half open, a site's button that
    // picks, a little round it, or, once that is over half open, the row
    // under it, { option, lock }, lock the site; its field, from its left
    // to the most it may be across, a little round it, { field }; SET, a
    // little round it, { set }; or anywhere else in the open menu, {
    // inside }. or null
    function hitControls(x, y) {
      const ui = at.controls, m = controlsMenu, inside = (r, g, dy) => x >= r.x0 - g && x <= r.x1 + g && y - dy >= r.y0 - g && y - dy <= r.y1 + g;
      const dy = controlsPush;
      if (inside(ui.shut, 2, dy)) return { menu: m };
      if (!m.open || m.p <= 0.5) return null;
      if (x >= ui.full.x0 && x <= ui.full.x1 && y - dy >= ui.full.y0 - 2 && y - dy < ui.shut.y1 - 2) return { menu: m };
      for (let n = 0; ui.parts && n < ui.parts.length; n++) {
        const P = ui.parts[n], rows = P.pick.rows, pm = lockPicks[P.site], d0 = dy + controlsPushes[n], d1 = dy + controlsPushes[n + 1], f = P.field;
        if (inside(rows[0].rect, 2, d0)) return { option: rows[0], lock: P.site };
        if (pm.open && pm.p > 0.5 && inside(rows[1].rect, 0, d0)) return { option: rows[1], lock: P.site };
        if (inside({ x0: f.x0, y0: f.y0, x1: f.x0 + f.most, y1: f.y1 }, 2, d1)) return { field: P.site };
        if (inside(P.set.rect, 2, d1)) return { set: P.site };
      }
      if (inside(Menu.at(m, ui, m.p), 0, dy)) return { inside: m };
      return null;
    }

    // a press on a site's button that picks: on the lock shown, it opened,
    // kicked, shutting the other, or shut; on the other, unless a change is
    // out for the site: the pick that asks twice (asksTwice) made to say
    // SURE for SURE_S s unless it says it, else the button shut and the
    // lock sent
    function pressLock(h) {
      const site = h.lock, pm = lockPicks[site], s = sends[site];
      if (!h.option.j) {
        pm.open = !pm.open;
        if (!pm.open) return;
        pm.v += UI.KICK;
        for (const k in lockPicks) if (k !== site) lockPicks[k].open = false;
        return;
      }
      if (s.out) return;
      const locked = !shownLocked(site);
      if (asksTwice(site, locked) && s.sure <= 0) {
        s.sure = CONTROLS.SURE_S;
        return;
      }
      s.sure = 0;
      pm.open = false;
      send(site, { locked });
    }

    // a change sent for site, body { locked } or { password }: SAVING until
    // it is answered, the lock sent shown meanwhile; then both sites' locks
    // as answered and DONE, a password sent cleared from its field, or
    // what went wrong
    async function send(site, body) {
      const s = sends[site];
      s.out = true;
      s.says = CONTROLS.SAVING;
      if (body.locked !== undefined) s.want = body.locked;
      const got = await ask('/controls', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ site }, body)) });
      s.out = false;
      s.want = null;
      if (!lockShaped(got.data)) {
        s.says = got.error || 'an answer not understood';
        return;
      }
      controls = { state: 'ok', data: got.data, error: '' };
      s.says = CONTROLS.DONE;
      if (body.password !== undefined && fields[site].typed === body.password) {
        fields[site].typed = '';
        if (fieldHeld === site) input.value = '';
        fitField(site);
      }
    }

    // --- the field ---------------------------------------------------------------
    // a site's new password is typed into a field made as the gate's is
    // (tools/server/gate.html): a rounded rect, RADIUS of its text's size
    // round its corners, PAD_Y over and under its line and PAD_X either
    // side of it, and a skin that chases it, outlined LINE px, its insides
    // drawn apart (pfb) and copied through the skin. it stands at the left
    // of its row and is as wide as what it holds and its bar, its width on
    // the menus' spring toward that and the skin after it, each edge
    // warbling WARBLE px either way: empty, HINT, the bar before it; typed
    // in, what is typed as it is, in plain letters, since its owner needs
    // to see what they set, the bar after it. it is never wider than its
    // row leaves beside SET: past that it shows the end of what is typed,
    // CUT before it. under the pointer or with the keys, its outline and
    // HINT are in level(1); what is typed is always ink. while it has the
    // keys the bar is on and off each BLINK s
    const FIELD = {
      HINT: 'new password', // what it says empty
      BLINK: 0.5,           // s the bar is on, and then off
      GAP: 3,               // world px between the bar and what the field holds
      TAIL: 120,            // the most of what is typed it shows, its end
    };
    // each site's field: what is typed, its width on its spring, the width
    // it goes to, what it shows, its skin and the room it was made in, and
    // each edge's warble
    const newField = () => ({
      typed: '', wide: { p: 0, v: 0 }, to: 0, shown: '', skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    });
    const fields = { main: newField(), dev: newField() };

    // the part of the controls laid out for site, or null
    function partOf(site) {
      const ps = at.controls.parts;
      return ps ? ps[SITE_KEYS.indexOf(site)] : null;
    }

    // what site's field shows of what is typed, and how wide it goes: what
    // it holds (HINT empty), the bar and its gap and PAD_X either side, no
    // wider than its row leaves. what is typed past TAIL is never shown
    // whole, so only its last TAIL are measured
    function fitField(site) {
      const f = fields[site], P = partOf(site);
      if (!P) return;
      const size = at.size, room = 2 * UI.PAD_X * size + FIELD.GAP + 1, most = P.field.most - room;
      let shown = f.typed;
      if (shown.length > FIELD.TAIL || (shown && wideOf(shown, size) > most)) {
        const tail = shown.slice(-FIELD.TAIL);
        let lo = 0, hi = tail.length;
        while (lo < hi) {
          const n = (lo + hi + 1) >> 1;
          if (wideOf(OPS.CUT + tail.slice(-n), size) <= most) lo = n;
          else hi = n - 1;
        }
        shown = OPS.CUT + tail.slice(tail.length - lo);
      }
      f.shown = shown;
      f.to = Math.min(P.field.most, wideOf(shown || FIELD.HINT, size) + room);
    }

    // site's field's rect as it has got to, laid out in part P, { x0, y0,
    // x1, y1, r }: as wide as its spring has it, and, given a time t, each
    // edge warbled WARBLE px either way on its own sine
    function fieldAt(site, P, t) {
      const f = fields[site], a = P.field, c = { x0: a.x0, y0: a.y0, x1: a.x0 + Math.max(0, f.wide.p), y1: a.y1, r: UI.RADIUS * at.size };
      if (t !== undefined) {
        const w = (e) => UI.WARBLE * Math.sin(2 * Math.PI * t * f.warble[e].hz + f.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // site's field dt on, laid out in part P: its width toward what it
    // holds on the spring, and its skin after it; in a new room, settled at
    // that width where it now stands
    function stepField(site, P, dt, t) {
      const f = fields[site];
      if (!f.skin || f.room !== at.room) {
        fitField(site);
        f.wide.p = f.to;
        f.wide.v = 0;
        f.skin = new Skin(fieldAt(site, P), UI.SPREAD);
        f.room = at.room;
        return;
      }
      Menu.spring(f.wide, f.to, dt);
      f.skin.step(dt, fieldAt(site, P, t));
    }

    // site's field, laid out in part P, dy world px down, into qfb, on what
    // the pointer is on (on): what it holds, HINT or what is typed, and the
    // bar while it has the keys, into pfb over its skin's box; then pfb
    // copied into qfb through the skin and the skin outlined over it
    function drawField(site, P, dy, t, on) {
      const f = fields[site];
      if (!f.skin) return;
      const held = fieldHeld === site, v = held || (on && on.field === site) ? level(1) : 1, box = f.skin.bounds(), size = at.size;
      const x = P.field.x0 + UI.PAD_X * size, sd = CONTROLS.SEED + 1000 * (P.n + 1) + 700;
      pfb.clearRows(Math.floor(box.y0 + dy) - UI.LINE, Math.ceil(box.y1 + dy) + UI.LINE + 1);
      if (f.typed) drawSaid(said(f.shown, x, P.field.y0, size, sd), t, dy, pfb);
      else drawSaid(said(FIELD.HINT, held ? x + FIELD.GAP + 1 : x, P.field.y0, size, sd + 100), t, dy, pfb, v);
      if (held && (t - blink) % (2 * FIELD.BLINK) < FIELD.BLINK) {
        const bx = Math.round(f.typed ? x + wideOf(f.shown, size) + FIELD.GAP : x), y0 = P.field.y0 + dy + UI.PAD_Y * size;
        pfb.line(bx, y0, bx, y0 + (UI.CAP + UI.DESC) * size, 1, 1);
      }
      const pts = f.skin.screen(dy), n = pts.length;
      qfb.fillPolygon(pts, pfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        qfb.line(p.x, p.y, q.x, q.y, v, UI.LINE);
      }
    }

    // what is typed in site's field sent as its new password, unless
    // nothing is or a change is out for it
    function sendPassword(site) {
      const f = fields[site];
      if (!f.typed || sends[site].out) return;
      send(site, { password: f.typed });
    }

    // --- the keys ----------------------------------------------------------------
    // the fields take the keys through the one element in the document
    // besides the canvas, an input never seen, put under the field that
    // has them: a press on a field gives it the keys, inside the press, so
    // a phone brings up its keyboard there. it has them while the input
    // has the focus, its bar on from then and from each key. enter sends
    // what is typed, and escape, a press anywhere but the field, or the
    // controls shutting lets go
    const input = document.getElementById('key');
    let fieldHeld = null; // the site whose field has the keys, or null
    let blink = 0;        // s, when the bar last came on

    // the input put under site's field, where the page has it on the screen
    function underField(site) {
      const P = partOf(site);
      if (!P) return;
      input.style.left = Math.round(P.field.x0) * View.SCALE + 'px';
      input.style.top = Math.round(P.field.y0 + controlsPush + controlsPushes[P.n + 1] - scrolled()) * View.SCALE + 'px';
    }

    // site's field given the keys: the input holding what it has typed,
    // put under it, and focused
    function holdField(site) {
      fieldHeld = site;
      input.value = fields[site].typed;
      blink = performance.now() / 1000;
      underField(site);
      input.focus();
    }

    input.addEventListener('focus', () => { blink = performance.now() / 1000; });
    input.addEventListener('blur', () => { fieldHeld = null; });
    input.addEventListener('input', () => {
      if (!fieldHeld) return;
      fields[fieldHeld].typed = input.value;
      blink = performance.now() / 1000;
      fitField(fieldHeld);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') input.blur();
      if (e.key !== 'Enter' || !fieldHeld) return;
      e.preventDefault();
      sendPassword(fieldHeld);
    });
    canvas.addEventListener('pointerdown', (e) => {
      if (!fieldHeld) return;
      const p = View.pointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || h.field !== fieldHeld) input.blur();
    });
    // a mouse's press on a field keeps the keys there: its own default
    // would take the focus from the input before the click gives it back
    canvas.addEventListener('mousedown', (e) => {
      const p = View.pointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.field) e.preventDefault();
    });

    // --- the scroll --------------------------------------------------------------
    // the page is as tall as what is open, from its top to the controls'
    // bottom and EDGE under it, and the window shows it scrolled down
    // scroll world px, from none to as far as leaves its bottom at the
    // window's: the wheel moves it as far as it turns, and a finger drawn
    // SLOP px down or up from where it went down on bare paper (anywhere a
    // press presses nothing, in a menu or out, or on a graph) carries it
    // with it, its click pressing nothing. a page that shrinks under where
    // it is scrolled to eases back up to its bottom by the house approach,
    // dt-correct. the wheel's listener is passive, the only one: webkit
    // stops scrolling with a listener that is not, over a document kept
    // from overscrolling
    const SCROLL = {
      LINE: 16, // css px a line, for a wheel that counts in lines
      SLOP: 5,  // world px a finger goes before it carries the page
      RATE: 0.3, // of the way left to its bottom, each 60 hz frame, a page scrolled past it eases back
    };
    let scroll = 0;     // world px the page is scrolled down
    let carry = null;   // the finger carrying the page, { id, y, from, on }: where it went down, the scroll then, and whether it has gone SLOP; or null

    // world px the page is scrolled down, whole
    function scrolled() {
      return Math.round(scroll);
    }

    // the furthest the page scrolls: its bottom, the controls' as they have
    // got to and EDGE under them, at the window's
    function furthest() {
      const ui = at.controls;
      return Math.max(0, Math.ceil(Menu.at(controlsMenu, ui, controlsMenu.p).y1 + controlsPush + UI.EDGE - H));
    }

    // the page scrolled to y, no further than it goes either way
    function scrollTo(y) {
      scroll = Math.max(0, Math.min(furthest(), y));
    }

    // a page scrolled past its bottom eased back to it
    function stepScroll(dt) {
      const most = furthest();
      if (scroll <= most) return;
      scroll += (most - scroll) * (1 - Math.pow(1 - SCROLL.RATE, 60 * dt));
      if (scroll - most < 0.5) scroll = most;
    }

    canvas.addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      const px = e.deltaMode === 1 ? SCROLL.LINE : e.deltaMode === 2 ? window.innerHeight : 1;
      scrollTo(scroll + e.deltaY * px / View.SCALE);
    }, { passive: true });
    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' || !e.isPrimary || carry) return;
      const p = View.pointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!switchAt(p.x, p.y) && (!h || h.inside || h.graph)) carry = { id: e.pointerId, y: p.y, from: scroll, on: false };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!carry || e.pointerId !== carry.id) return;
      const by = View.pointer(e).y - carry.y;
      if (!carry.on && Math.abs(by) < SCROLL.SLOP) return;
      carry.on = true;
      scrollTo(carry.from - by);
    });
    // the finger lifted: if it carried the page, the click it ends in
    // presses nothing
    const carryGo = (e) => {
      if (!carry || e.pointerId !== carry.id) return;
      if (carry.on && e.type === 'pointerup') grabbed = true;
      carry = null;
    };
    canvas.addEventListener('pointerup', carryGo);
    canvas.addEventListener('pointercancel', carryGo);

    // --- layout ------------------------------------------------------------------
    // the page laid out for the window: its text MOST world px to the em,
    // or PHONE where the window is narrower than STACK_BELOW, the menus'
    // words CAPTION of that and no less than CAP_LEAST; the name and the
    // switch; metrics EDGE under the name's ink, and the controls under
    // it; the menus' column COLUMN across, or as the window leaves; and
    // the scroll kept in the page. laid out again at each resize, in a new
    // room, so the skins settle where things then are
    let at = null; // the page as laid out: { room, size, small, kit, col, metrics, controls }
    function layout() {
      const bs = W < UI.STACK_BELOW ? UI.PHONE : UI.MOST, size = Math.max(UI.CAP_LEAST, UI.CAPTION * bs), room = {};
      const M = Menu.kit(room, size);
      kept.clear();
      placeName();
      placeSwitch(nameAt.middle);
      const left = UI.EDGE, top = Math.round(nameAt.bottom + UI.EDGE), col = Math.floor(Math.min(OPS.COLUMN, W - 2 * UI.EDGE - 2 * M.margin));
      at = { room, size, small: Math.max(UI.CAP_LEAST, METRICS.SMALL * size), kit: M, col };
      at.metrics = placeMetrics(M, left, top, col);
      at.controls = placeControls(M, left, at.metrics.shut.y1 + OPS.APART * M.row, col);
      for (const site of SITE_KEYS) fitField(site);
      scrollTo(scroll);
    }

    // --- what a press presses ----------------------------------------------------
    // what a press at world (x, y) on the screen would press, where the
    // page is scrolled to: metrics' (hitMetrics) or the controls'
    // (hitControls), or null. the switch is apart from these (switchAt),
    // and asked first
    function hitAt(x, y) {
      const py = y + scrolled();
      return hitMetrics(x, py) || hitControls(x, py);
    }

    // whether hits a and b are one control: each key of one the same in the
    // other, a menu, a row or a button the same object, as laid out
    function same(a, b) {
      if (!a || !b) return false;
      const ka = Object.keys(a);
      return ka.length === Object.keys(b).length && ka.every((k) => a[k] === b[k]);
    }

    // --- the click ---------------------------------------------------------------
    // a click: the switch sends the page to its other end, dark or light;
    // a menu's header opens it, kicked toward open, or shuts it; a button
    // that picks is metrics' (pressPick) or a site's lock (pressLock); a
    // field takes the keys (holdField) and SET sends its password
    // (sendPassword); a finger's press on a day of a graph pins it, its
    // date and numbers said until the next press, and a press anywhere else
    // lets it go. a click presses only the control its press went down on
    // (pressed, same), and the click a press ends in that took hold of
    // something (grabbed) presses nothing
    let pressed = null; // what the last press went down on (hitAt), the switch none
    let touched = false; // whether the last press was a finger's
    let pinned = null;  // the day of a graph a finger's press pinned, { graph, i }, or null
    canvas.addEventListener('pointerdown', (e) => {
      const p = View.pointer(e);
      if (!e.isPrimary) return;
      pressed = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      touched = e.pointerType !== 'mouse';
    });
    canvas.addEventListener('click', (e) => {
      if (grabbed) { grabbed = false; return; }
      const p = View.pointer(e);
      if (switchAt(p.x, p.y)) { Switch.send(Switch.to < 0.5 ? 1 : 0); return; }
      const h = hitAt(p.x, p.y), was = pinned;
      pinned = null;
      if (!same(h, pressed)) return;
      if (h.menu) {
        h.menu.open = !h.menu.open;
        if (h.menu.open) h.menu.v += UI.KICK;
      }
      else if (h.pick) pressPick(h);
      else if (h.lock) pressLock(h);
      else if (h.field) { if (fieldHeld !== h.field) holdField(h.field); }
      else if (h.set) sendPassword(h.set);
      else if (h.graph && touched) pinned = same(h, was) ? null : h;
    });

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm on the
    // pointer. while the button is held it closes through the frames to a
    // fist, and it opens again when the button lifts. a touch gets no hand.
    // it goes down last, over everything. a press is captured, so a drag
    // carries on outside the window, and a pointer that leaves is forgotten
    const cursor = new Cursor();

    let grabbed = false; // whether the last press took hold of something, so the click it ends in presses nothing
    // the hand follows the pointer, closes on a press and opens on a lift,
    // and goes when there is nothing left to hover (js/cursor.js); and each
    // press starts having taken hold of nothing
    cursor.listen(canvas, View);
    canvas.addEventListener('pointerdown', () => { grabbed = false; });

    // --- the frame ---------------------------------------------------------------
    // the page is drawn fresh every browser frame, all of it into the
    // framebuffer. first the hand, metrics and the controls, each on its
    // spring with its skin, the scroll and the switch catch up with the
    // clock; then the bits are cleared and drawn, each layer simply writing
    // over the bits of the last, as far up as the page is scrolled: the
    // name, metrics, the controls, the switch, and last the hand. then the
    // whole of it goes to the canvas in one copy
    let lastNow = null; // the last frame's time, for dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      cursor.update(dt);
      stepMetrics(dt, t);
      stepControls(dt, t);
      stepScroll(dt);
      Switch.step(dt);
      fb.clear();
      const up = -scrolled(), overSwitch = !!Hover.at && switchAt(Hover.at.x, Hover.at.y);
      const hit = Hover.at && !overSwitch && hitAt(Hover.at.x, Hover.at.y);
      drawSaid(nameAt.letters, t, up, fb);
      Menu.draw(at.metrics, metricsMenu, up, t, hit, drawMetricsInside, fb, qfb, level(0));
      Menu.draw(at.controls, controlsMenu, controlsPush + up, t, hit, drawControlsInside, fb, qfb, level(0));
      Switch.draw(fb, t, overSwitch, up);
      cursor.draw(fb);
      fb.present(ctx, Switch.dark);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    fetchStats(pickedSite(), pickedDays());
    fetchControls();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
