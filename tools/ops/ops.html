    // that picks is shut; its button that picks toward open or shut, shut
    // once the menu is, pushing the rows under it down as far as it has
    // opened (controlsPushes), and its field (stepField); the menu as much
    // taller as they have opened; and the field let go once the menu is
    // shut or there is no field
    function stepControls(dt, t) {
      if (controlsShows() !== at.controls.key) {
        at.controls = placeControls(at.kit, at.controls.shut.x0, at.controls.shut.y0, at.col);
        for (const site of SITE_KEYS) fitField(site);
      }
      const ui = at.controls, m = controlsMenu;
      let push = 0;
      for (let n = 0; n < SITE_KEYS.length; n++) {
        const site = SITE_KEYS[n], pm = lockPicks[site], s = sends[site], P = ui.parts && ui.parts[n];
        controlsPushes[n] = push;
        if (!m.open) pm.open = false;
        s.sure = pm.open ? Math.max(0, s.sure - dt) : 0;
        if (!P) {
          if (pm.skin) Object.assign(pm, shutMenu());
          fields[site].skin = null;
          continue;
        }
        P.pick.full.y1 = P.pick.rows[1].rect.y1;
        stepMenu(pm, P.pick, dt, t);
        push += grownOf(pm, P.pick);
        stepField(site, P, dt, t);
      }
      controlsPushes[SITE_KEYS.length] = push;
      ui.full.y1 = ui.bottom + push;
      stepMenu(m, ui, dt, t);
      if (fieldHeld && (!m.open || !ui.parts)) input.blur();
    }

    // the controls' insides, laid out as ui, dy world px down, into qfb, on
    // what the pointer is on (on): LOADING or what went wrong; or each
    // site's part, each row as far down again as the buttons that pick over
    // it have pushed it: its name, its button that picks (drawPick), its
    // password line, its field (drawField), SET outlined round its word,
    // in level(1) under the pointer, and what it says of the last change
    function drawControlsInside(ui, dy, t, on) {
      if (!ui.parts) {
        for (let j = 0; j < ui.said.length; j++) drawSaid(ui.said[j], t, dy, qfb);
        return;
      }
      for (let n = 0; n < ui.parts.length; n++) {
        const P = ui.parts[n], site = P.site, pm = lockPicks[site], d0 = dy + controlsPushes[n], d1 = dy + controlsPushes[n + 1];
        drawSaid(P.name, t, d0, qfb);
        drawPick(P.pick, pm, lockOrder(site), d0, grownOf(pm, P.pick), t, on, qfb, 1);
        drawSaid(P.password, t, d1, qfb);
        drawField(site, P, d1, t, on);
        const r = P.set.rect, v = on && on.set === site ? level(1) : 1;
        qfb.roundRect(r.x0, r.y0 + d1, r.x1, r.y1 + d1, UI.RADIUS * ui.size, null, v, UI.LINE);
        drawSaid(P.set.letters, t, d1, qfb, v);
        for (let j = 0; j < P.says.length; j++) drawSaid(P.says[j], t, d1, qfb);
      }
    }

    // what a press at world (x, y) on the page would press in the
    // controls, where they have been pushed down to: their header, a little
    // round it, or once the menu is over half open anywhere across its top
    // row, { menu }; once it is over half open, a site's button that
    // picks, a little round it, or, once that is over half open, the row
    // under it, { option, lock }, lock the site; its field, from its left
    // to the most it may be across, a little round it, { field }; SET, a
    // little round it, { set }; or anywhere else in the open menu, {
    // inside }. or null
    function hitControls(x, y) {
      const ui = at.controls, m = controlsMenu, inside = (r, g, dy) => x >= r.x0 - g && x <= r.x1 + g && y - dy >= r.y0 - g && y - dy <= r.y1 + g;
      const dy = controlsPush;
      if (inside(ui.shut, 2, dy)) return { menu: m };
      if (!m.open || m.p <= 0.5) return null;
      if (x >= ui.full.x0 && x <= ui.full.x1 && y - dy >= ui.full.y0 - 2 && y - dy < ui.shut.y1 - 2) return { menu: m };
      for (let n = 0; ui.parts && n < ui.parts.length; n++) {
        const P = ui.parts[n], rows = P.pick.rows, pm = lockPicks[P.site], d0 = dy + controlsPushes[n], d1 = dy + controlsPushes[n + 1], f = P.field;
        if (inside(rows[0].rect, 2, d0)) return { option: rows[0], lock: P.site };
        if (pm.open && pm.p > 0.5 && inside(rows[1].rect, 0, d0)) return { option: rows[1], lock: P.site };
        if (inside({ x0: f.x0, y0: f.y0, x1: f.x0 + f.most, y1: f.y1 }, 2, d1)) return { field: P.site };
        if (inside(P.set.rect, 2, d1)) return { set: P.site };
      }
      if (inside(menuAt(m, ui, m.p), 0, dy)) return { inside: m };
      return null;
    }

    // a press on a site's button that picks: on the lock shown, it opened,
    // kicked, shutting the other, or shut; on the other, unless a change is
    // out for the site: locked for dangelo.engineering made to say SURE for
    // SURE_S s unless it says it, else the button shut and the lock sent
    function pressLock(h) {
      const site = h.lock, pm = lockPicks[site], s = sends[site];
      if (!h.option.j) {
        pm.open = !pm.open;
        if (!pm.open) return;
        pm.v += UI.KICK;
        for (const k in lockPicks) if (k !== site) lockPicks[k].open = false;
        return;
      }
      if (s.out) return;
      const locked = !shownLocked(site);
      if (locked && site === 'main' && s.sure <= 0) {
        s.sure = CONTROLS.SURE_S;
        return;
      }
      s.sure = 0;
      pm.open = false;
      send(site, { locked });
    }

    // a change sent for site, body { locked } or { password }: SAVING until
    // it is answered, the lock sent shown meanwhile; then both sites' locks
    // as answered and DONE, a password sent cleared from its field, or
    // what went wrong
    async function send(site, body) {
      const s = sends[site];
      s.out = true;
      s.says = CONTROLS.SAVING;
      if (body.locked !== undefined) s.want = body.locked;
      const got = await ask('/controls', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ site }, body)) });
      s.out = false;
      s.want = null;
      if (!lockShaped(got.data)) {
        s.says = got.error || 'an answer not understood';
        return;
      }
      controls = { state: 'ok', data: got.data, error: '' };
      s.says = CONTROLS.DONE;
      if (body.password !== undefined && fields[site].typed === body.password) {
        fields[site].typed = '';
        if (fieldHeld === site) input.value = '';
        fitField(site);
      }
    }

    // --- the field ---------------------------------------------------------------
    // a site's new password is typed into a field made as the gate's is
    // (tools/server/gate.html): a rounded rect, RADIUS of its text's size
    // round its corners, PAD_Y over and under its line and PAD_X either
    // side of it, and a skin that chases it, outlined LINE px, its insides
    // drawn apart (pfb) and copied through the skin. it stands at the left
    // of its row and is as wide as what it holds and its bar, its width on
    // the menus' spring toward that and the skin after it, each edge
    // warbling WARBLE px either way: empty, HINT, the bar before it; typed
    // in, what is typed as it is, in plain letters, since its owner needs
    // to see what they set, the bar after it. it is never wider than its
    // row leaves beside SET: past that it shows the end of what is typed,
    // CUT before it. under the pointer or with the keys, its outline and
    // HINT are in level(1); what is typed is always ink. while it has the
    // keys the bar is on and off each BLINK s
    const FIELD = {
      HINT: 'new password', // what it says empty
      BLINK: 0.5,           // s the bar is on, and then off
      GAP: 3,               // world px between the bar and what the field holds
      TAIL: 120,            // the most of what is typed it shows, its end
    };
    // each site's field: what is typed, its width on its spring, the width
    // it goes to, what it shows, its skin and the room it was made in, and
    // each edge's warble
    const newField = () => ({
      typed: '', wide: { p: 0, v: 0 }, to: 0, shown: '', skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    });
    const fields = { main: newField(), dev: newField() };

    // the part of the controls laid out for site, or null
    function partOf(site) {
      const ps = at.controls.parts;
      return ps ? ps[SITE_KEYS.indexOf(site)] : null;
    }

    // what site's field shows of what is typed, and how wide it goes: what
    // it holds (HINT empty), the bar and its gap and PAD_X either side, no
    // wider than its row leaves. what is typed past TAIL is never shown
    // whole, so only its last TAIL are measured
    function fitField(site) {
      const f = fields[site], P = partOf(site);
      if (!P) return;
      const size = at.size, room = 2 * UI.PAD_X * size + FIELD.GAP + 1, most = P.field.most - room;
      let shown = f.typed;
      if (shown.length > FIELD.TAIL || (shown && wideOf(shown, size) > most)) {
        const tail = shown.slice(-FIELD.TAIL);
        let lo = 0, hi = tail.length;
        while (lo < hi) {
          const n = (lo + hi + 1) >> 1;
          if (wideOf(OPS.CUT + tail.slice(-n), size) <= most) lo = n;
          else hi = n - 1;
        }
        shown = OPS.CUT + tail.slice(tail.length - lo);
      }
      f.shown = shown;
      f.to = Math.min(P.field.most, wideOf(shown || FIELD.HINT, size) + room);
    }

    // site's field's rect as it has got to, laid out in part P, { x0, y0,
    // x1, y1, r }: as wide as its spring has it, and, given a time t, each
    // edge warbled WARBLE px either way on its own sine
    function fieldAt(site, P, t) {
      const f = fields[site], a = P.field, c = { x0: a.x0, y0: a.y0, x1: a.x0 + Math.max(0, f.wide.p), y1: a.y1, r: UI.RADIUS * at.size };
      if (t !== undefined) {
        const w = (e) => UI.WARBLE * Math.sin(2 * Math.PI * t * f.warble[e].hz + f.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // site's field dt on, laid out in part P: its width toward what it
    // holds on the spring, and its skin after it; in a new room, settled at
    // that width where it now stands
    function stepField(site, P, dt, t) {
      const f = fields[site];
      if (!f.skin || f.room !== at.room) {
        fitField(site);
        f.wide.p = f.to;
        f.wide.v = 0;
        f.skin = new Skin(fieldAt(site, P), UI.SPREAD);
        f.room = at.room;
        return;
      }
      spring(f.wide, f.to, dt);
      f.skin.step(dt, fieldAt(site, P, t));
    }

    // site's field, laid out in part P, dy world px down, into qfb, on what
    // the pointer is on (on): what it holds, HINT or what is typed, and the
    // bar while it has the keys, into pfb over its skin's box; then pfb
    // copied into qfb through the skin and the skin outlined over it
    function drawField(site, P, dy, t, on) {
      const f = fields[site];
      if (!f.skin) return;
      const held = fieldHeld === site, v = held || (on && on.field === site) ? level(1) : 1, box = f.skin.bounds(), size = at.size;
      const x = P.field.x0 + UI.PAD_X * size, sd = CONTROLS.SEED + 1000 * (P.n + 1) + 700;
      pfb.clearRows(Math.floor(box.y0 + dy) - UI.LINE, Math.ceil(box.y1 + dy) + UI.LINE + 1);
      if (f.typed) drawSaid(said(f.shown, x, P.field.y0, size, sd), t, dy, pfb);
      else drawSaid(said(FIELD.HINT, held ? x + FIELD.GAP + 1 : x, P.field.y0, size, sd + 100), t, dy, pfb, v);
      if (held && (t - blink) % (2 * FIELD.BLINK) < FIELD.BLINK) {
        const bx = Math.round(f.typed ? x + wideOf(f.shown, size) + FIELD.GAP : x), y0 = P.field.y0 + dy + UI.PAD_Y * size;
        pfb.line(bx, y0, bx, y0 + (UI.CAP + UI.DESC) * size, 1, 1);
      }
      const pts = f.skin.screen(dy), n = pts.length;
      qfb.fillPolygon(pts, pfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        qfb.line(p.x, p.y, q.x, q.y, v, UI.LINE);
      }
    }

    // what is typed in site's field sent as its new password, unless
    // nothing is or a change is out for it
    function sendPassword(site) {
      const f = fields[site];
      if (!f.typed || sends[site].out) return;
      send(site, { password: f.typed });
    }

    // --- the keys ----------------------------------------------------------------
    // the fields take the keys through the one element in the document
    // besides the canvas, an input never seen, put under the field that
    // has them: a press on a field gives it the keys, inside the press, so
    // a phone brings up its keyboard there. it has them while the input
    // has the focus, its bar on from then and from each key. enter sends
    // what is typed, and escape, a press anywhere but the field, or the
    // controls shutting lets go
    const input = document.getElementById('key');
    let fieldHeld = null; // the site whose field has the keys, or null
    let blink = 0;        // s, when the bar last came on

    // the input put under site's field, where the page has it on the screen
    function underField(site) {
      const P = partOf(site);
      if (!P) return;
      input.style.left = Math.round(P.field.x0) * SCALE + 'px';
      input.style.top = Math.round(P.field.y0 + controlsPush + controlsPushes[P.n + 1] - scrolled()) * SCALE + 'px';
    }

    // site's field given the keys: the input holding what it has typed,
    // put under it, and focused
    function holdField(site) {
      fieldHeld = site;
      input.value = fields[site].typed;
      blink = performance.now() / 1000;
      underField(site);
      input.focus();
    }

    input.addEventListener('focus', () => { blink = performance.now() / 1000; });
    input.addEventListener('blur', () => { fieldHeld = null; });
    input.addEventListener('input', () => {
      if (!fieldHeld) return;
      fields[fieldHeld].typed = input.value;
      blink = performance.now() / 1000;
      fitField(fieldHeld);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') input.blur();
      if (e.key !== 'Enter' || !fieldHeld) return;
      e.preventDefault();
      sendPassword(fieldHeld);
    });
    canvas.addEventListener('pointerdown', (e) => {
      if (!fieldHeld) return;
      const p = worldPointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || h.field !== fieldHeld) input.blur();
    });
    // a mouse's press on a field keeps the keys there: its own default
    // would take the focus from the input before the click gives it back
    canvas.addEventListener('mousedown', (e) => {
      const p = worldPointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.field) e.preventDefault();
    });

    // --- the scroll --------------------------------------------------------------
    // the page is as tall as what is open, from its top to the controls'
    // bottom and EDGE under it, and the window shows it scrolled down
    // scroll world px, from none to as far as leaves its bottom at the
    // window's: the wheel moves it as far as it turns, and a finger drawn
    // SLOP px down or up from where it went down on bare paper (anywhere a
    // press presses nothing, in a menu or out, or on a graph) carries it
    // with it, its click pressing nothing. a page that shrinks under where
    // it is scrolled to eases back up to its bottom by the house approach,
    // dt-correct. the wheel's listener is passive, the only one: webkit
    // stops scrolling with a listener that is not, over a document kept
    // from overscrolling
    const SCROLL = {
      LINE: 16, // css px a line, for a wheel that counts in lines
      SLOP: 5,  // world px a finger goes before it carries the page
      RATE: 0.3, // of the way left to its bottom, each 60 hz frame, a page scrolled past it eases back
    };
    let scroll = 0;     // world px the page is scrolled down
    let carry = null;   // the finger carrying the page, { id, y, from, on }: where it went down, the scroll then, and whether it has gone SLOP; or null

    // world px the page is scrolled down, whole
    function scrolled() {
      return Math.round(scroll);
    }

    // the furthest the page scrolls: its bottom, the controls' as they have
    // got to and EDGE under them, at the window's
    function furthest() {
      const ui = at.controls;
      return Math.max(0, Math.ceil(menuAt(controlsMenu, ui, controlsMenu.p).y1 + controlsPush + UI.EDGE - H));
    }

    // the page scrolled to y, no further than it goes either way
    function scrollTo(y) {
      scroll = Math.max(0, Math.min(furthest(), y));
    }

    // a page scrolled past its bottom eased back to it
    function stepScroll(dt) {
      const most = furthest();
      if (scroll <= most) return;
      scroll += (most - scroll) * (1 - Math.pow(1 - SCROLL.RATE, 60 * dt));
      if (scroll - most < 0.5) scroll = most;
    }

    canvas.addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      const px = e.deltaMode === 1 ? SCROLL.LINE : e.deltaMode === 2 ? window.innerHeight : 1;
      scrollTo(scroll + e.deltaY * px / SCALE);
    }, { passive: true });
    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' || !e.isPrimary || carry) return;
      const p = worldPointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!switchAt(p.x, p.y) && (!h || h.inside || h.graph)) carry = { id: e.pointerId, y: p.y, from: scroll, on: false };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!carry || e.pointerId !== carry.id) return;
      const by = worldPointer(e).y - carry.y;
      if (!carry.on && Math.abs(by) < SCROLL.SLOP) return;
      carry.on = true;
      scrollTo(carry.from - by);
    });
    // the finger lifted: if it carried the page, the click it ends in
    // presses nothing
    const carryGo = (e) => {
      if (!carry || e.pointerId !== carry.id) return;
      if (carry.on && e.type === 'pointerup') grabbed = true;
      carry = null;
    };
    canvas.addEventListener('pointerup', carryGo);
    canvas.addEventListener('pointercancel', carryGo);

    // --- layout ------------------------------------------------------------------
    // the page laid out for the window: its text MOST world px to the em,
    // or PHONE where the window is narrower than STACK_BELOW, the menus'
    // words CAPTION of that and no less than CAP_LEAST; the name and the
    // switch; metrics EDGE under the name's ink, and the controls under
    // it; the menus' column COLUMN across, or as the window leaves; and
    // the scroll kept in the page. laid out again at each resize, in a new
    // room, so the skins settle where things then are
    let at = null; // the page as laid out: { room, size, small, kit, col, metrics, controls }
    function layout() {
      const bs = W < UI.STACK_BELOW ? UI.PHONE : UI.MOST, size = Math.max(UI.CAP_LEAST, UI.CAPTION * bs), room = {};
      const M = menuKit(room, size);
      kept.clear();
      placeName();
      placeSwitch(nameAt.middle);
      const left = UI.EDGE, top = Math.round(nameAt.bottom + UI.EDGE), col = Math.floor(Math.min(OPS.COLUMN, W - 2 * UI.EDGE - 2 * M.margin));
      at = { room, size, small: Math.max(UI.CAP_LEAST, METRICS.SMALL * size), kit: M, col };
      at.metrics = placeMetrics(M, left, top, col);
      at.controls = placeControls(M, left, at.metrics.shut.y1 + OPS.APART * M.row, col);
      for (const site of SITE_KEYS) fitField(site);
      scrollTo(scroll);
    }

    // --- what a press presses ----------------------------------------------------
    // what a press at world (x, y) on the screen would press, where the
    // page is scrolled to: metrics' (hitMetrics) or the controls'
    // (hitControls), or null. the switch is apart from these (switchAt),
    // and asked first
    function hitAt(x, y) {
      const py = y + scrolled();
      return hitMetrics(x, py) || hitControls(x, py);
    }

    // whether hits a and b are one control: each key of one the same in the
    // other, a menu, a row or a button the same object, as laid out
    function same(a, b) {
      if (!a || !b) return false;
      const ka = Object.keys(a);
      return ka.length === Object.keys(b).length && ka.every((k) => a[k] === b[k]);
    }

    // --- the click ---------------------------------------------------------------
    // a click: the switch sends the page to its other end, dark or light;
    // a menu's header opens it, kicked toward open, or shuts it; a button
    // that picks is metrics' (pressPick) or a site's lock (pressLock); a
    // field takes the keys (holdField) and SET sends its password
    // (sendPassword); a finger's press on a day of a graph pins it, its
    // date and numbers said until the next press, and a press anywhere else
    // lets it go. a click presses only the control its press went down on
    // (pressed, same), and the click a press ends in that took hold of
    // something (grabbed) presses nothing
    let pressed = null; // what the last press went down on (hitAt), the switch none
    let touched = false; // whether the last press was a finger's
    let pinned = null;  // the day of a graph a finger's press pinned, { graph, i }, or null
    canvas.addEventListener('pointerdown', (e) => {
      const p = worldPointer(e);
      if (!e.isPrimary) return;
      pressed = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      touched = e.pointerType !== 'mouse';
    });
    canvas.addEventListener('click', (e) => {
      if (grabbed) { grabbed = false; return; }
      const p = worldPointer(e);
      if (switchAt(p.x, p.y)) { sendDark(darkTo < 0.5 ? 1 : 0); return; }
      const h = hitAt(p.x, p.y), was = pinned;
      pinned = null;
      if (!same(h, pressed)) return;
      if (h.menu) {
        h.menu.open = !h.menu.open;
        if (h.menu.open) h.menu.v += UI.KICK;
      }
      else if (h.pick) pressPick(h);
      else if (h.lock) pressLock(h);
      else if (h.field) { if (fieldHeld !== h.field) holdField(h.field); }
      else if (h.set) sendPassword(h.set);
      else if (h.graph && touched) pinned = same(h, was) ? null : h;
    });

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm on the
    // pointer. while the button is held it closes through the frames to a
    // fist, and it opens again when the button lifts. a touch gets no hand.
    // it goes down last, over everything. a press is captured, so a drag
    // carries on outside the window, and a pointer that leaves is forgotten
    const cursor = new Cursor();

    // where pointer event e is, world px on the screen
    function worldPointer(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / SCALE, y: (e.clientY - rect.top) / SCALE };
    }
    let grabbed = false; // whether the last press took hold of something, so the click it ends in presses nothing
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      cursor.press();
      grabbed = false;
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
    });
    // a lifted press opens the hand again. it goes when there is nothing
    // left to hover: a finger lifted, or a captured drag let go outside the
    // viewport
    function liftCursor(e) {
      cursor.release();
      const p = worldPointer(e);
      if (e.pointerType === 'touch' || p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) cursor.hide();
    }
    canvas.addEventListener('pointerup', liftCursor);
    canvas.addEventListener('pointercancel', liftCursor);
    canvas.addEventListener('pointerleave', () => { cursor.hide(); });

    // --- the frame ---------------------------------------------------------------
    // the page is drawn fresh every browser frame, all of it into the
    // framebuffer. first the hand, metrics and the controls, each on its
    // spring with its skin, the scroll and the switch catch up with the
    // clock; then the bits are cleared and drawn, each layer simply writing
    // over the bits of the last, as far up as the page is scrolled: the
    // name, metrics, the controls, the switch, and last the hand. then the
    // whole of it goes to the canvas in one copy
    let lastNow = null; // the last frame's time, for dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      cursor.update(dt);
      stepMetrics(dt, t);
      stepControls(dt, t);
      stepScroll(dt);
      stepSwitch(dt);
      fb.clear();
      const up = -scrolled(), overSwitch = !!hoverAt && switchAt(hoverAt.x, hoverAt.y);
      const hit = hoverAt && !overSwitch && hitAt(hoverAt.x, hoverAt.y);
      drawSaid(nameAt.letters, t, up, fb);
      drawMenu(at.metrics, metricsMenu, up, t, hit, drawMetricsInside);
      drawMenu(at.controls, controlsMenu, controlsPush + up, t, hit, drawControlsInside);
      drawSwitch(t, overSwitch, up);
      cursor.draw(fb);
      fb.present(ctx, dark);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    fetchStats(pickedSite(), pickedDays());
    fetchControls();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
