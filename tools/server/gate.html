<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the look's scripts from this site, the page's own script and style
       inline, its one connection the try at the password, to this site,
       and the tab's icon a png the page draws (js/favicon.js), a data
       url -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title></title>
  <!-- the tab's icon: none until js/favicon.js draws it, so the browser
       asks for no /favicon.ico -->
  <link rel="icon" href="data:,">
  <style>
    /* the paper colour, as in js/raster.js: any sliver past the canvas matches */
    html, body { margin: 0; background: #fbf6f0; }
    /* no system cursor: the pointer is drawn into the frame as a hand */
    html, body { cursor: none; }
    /* the document never scrolls: the page is the window */
    html, body { overflow: hidden; overscroll-behavior: none; }
    /* a press on the canvas is the page's own. no selecting */
    canvas { position: fixed; top: 0; left: 0; display: block; image-rendering: pixelated; cursor: none;
             touch-action: none; user-select: none; -webkit-user-select: none; }
    /* the one field: never seen, a pixel across, under where the page
       draws the field, its font big enough that a phone does not zoom in
       to it. a pointer passes through it to the canvas */
    input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0;
            opacity: 0; font-size: 16px; pointer-events: none; }
  </style>
  <script>
    // the paper's colour as the visitor last chose the site, light or
    // dark, or as the system is where they have not chosen, before any
    // other script has loaded
    try {
      let kept = null;
      try { kept = localStorage.getItem('dark'); } catch (e) {}
      const dark = kept !== null ? kept === '1' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.background = dark ? '#000000' : '#fbf6f0';
    } catch (e) {}
  </script>
  <script src="/js/site.js"></script>
  <script>
    // the page's title: the site's name (js/site.js)
    document.title = SITE.NAME;
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <input id="key" type="password" autocomplete="current-password" aria-label="password">
  <script src="/js/raster.js"></script>
  <script src="/js/view.js"></script>
  <script src="/js/letter.js"></script>
  <script src="/js/hover.js"></script>
  <script src="/js/icon.js"></script>
  <script src="/js/switch.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/logo.js"></script>
  <script src="/js/softbody.js"></script>
  <script src="/js/skin.js"></script>
  <script src="/js/type.js"></script>
  <script src="/js/favicon.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/hand-art.js"></script>
  <script src="/js/cursor.js"></script>
  <script>
    // --- the gate ----------------------------------------------------------------
    // the door to the site while it is kept to a password: the page's name
    // across the top (the logo, below), the light and dark switch in the
    // bottom right corner (the switch, below), the hand, and in the
    // window's middle one field to type the password into (the field,
    // below). the sections, top to bottom: the viewport, the letters, the
    // page's numbers, the hover colours, the switch, the logo, the field,
    // a try, the keys, what a press presses, the click, the cursor and the
    // frame.

    // --- the viewport ------------------------------------------------------------
    // the window is a viewport onto a grid of world pixels, each View.SCALE
    // css pixels square (js/view.js): a css pixel, but in a window fewer
    // than View.across css pixels wide each as much smaller as shows
    // View.across of them across, and no smaller than one of the screen's
    // own pixels. every pixel is drawn into one framebuffer (js/raster.js)
    // the size of the visible world, and once a frame it is copied whole
    // into the canvas bitmap, which is that size exactly. nothing draws to
    // the canvas itself
    const canvas = document.getElementById('view');
    View.load(window, canvas); // the viewport onto the window, through the canvas
    const ctx = canvas.getContext('2d'); // only the framebuffer's present uses it
    let W = 0, H = 0; // the viewport, in world pixels
    let fb = null;    // the world bitmap, remade at the viewport's size
    let qfb = null;   // the field's insides, drawn apart and copied through its skin (drawField)

    function resize() {
      ({ W, H } = View.resize());
      fb = new Framebuffer(W, H);
      Letter.fb = fb; // the letters draw into it unless given another (js/letter.js)
      qfb = new Framebuffer(W, H);
      placeSwitch();
      Logo.place(W, H);
      placeField();
    }

    // --- letters -----------------------------------------------------------------
    // a letter (js/letter.js) is one object: a bitmap of ink (a glyph of
    // js/type.js's, cut to its ink, or an icon), a home position in
    // continuous world space, a scale and a tilt, and slow sines of its own
    // on each, at rates and phases seeded from its place in the text, drawn
    // as a sprite (js/raster.js), so a sub-pixel move or a touch of scale
    // shows as edge pixels popping, never as the block stepping

    // --- the numbers -------------------------------------------------------------
    // the page's sizes, springs and rates, and the face its words are set
    // in, js/type.js's lines in helvetica neue's medium, are UI's (js/ui.js)

    // --- hover -------------------------------------------------------------------
    // a mouse's pointer over the field turns it HOVER, its outline and its
    // hint with it, and over the switch the switch and its ball. a finger
    // has no hover. HOVER, HOVER_ITEM and HOVER_LINK are the look's teal,
    // tan and mauve, and where a mouse's pointer is, in world px on the
    // screen, or null, is Hover.at (js/hover.js)
    const [HOVER, HOVER_ITEM, HOVER_LINK] = Hover.colours();
    Hover.listen(canvas, View);

    // --- the switch --------------------------------------------------------------
    // light or dark (js/switch.js): a switch EDGE world px clear of the
    // window's bottom-right corner, ICONS.switch (js/icons.js) with
    // ICONS.ball over it, the ball a press takes hold of, in HOVER while a
    // mouse is over it or the ball is held. a click on it, or a little
    // round it, sends the page to its other end (the click, below), and a
    // press on it presses nothing under it. the page starts
    // as the visitor last sent the switch, here or on the site, or as the
    // system is, light or dark; the document behind the canvas is the
    // paper's colour of the end the page is nearer, and the tab's icon is
    // that end's: a teal, a tan and a mauve dot down its diagonal
    Switch.load(window, [HOVER, HOVER_ITEM, HOVER_LINK]);

    // the switch, EDGE clear of the window's bottom-right corner, and its
    // ball
    function placeSwitch() {
      Switch.place(ICONS.switch, ICONS.ball, W - UI.EDGE, H - UI.EDGE);
    }

    // whether world (x, y) on the screen presses the switch
    function switchAt(x, y) {
      return Switch.at(x, y);
    }

    // a primary press on the switch is watched, and the click a press that
    // took its ball ends in presses nothing (grabbed, the cursor below)
    Switch.listen(canvas, View, switchAt, () => { grabbed = true; });

    // --- the logo ----------------------------------------------------------------
    // the page's name across the top of the window (js/logo.js): the
    // site's name (js/site.js) in the page's face, each glyph a letter in
    // HOVER_ITEM, with a soft dot in HOVER left of it and one in
    // HOVER_LINK right of it, which a press takes hold of and pulls, but
    // not a press the switch takes or one on the field (what a press
    // presses, below); the click a press that held a dot ends in presses
    // nothing (grabbed, the cursor below)
    Logo.load(SITE.NAME, () => document.createElement('canvas'), UI.FACE, [HOVER, HOVER_ITEM, HOVER_LINK]);

    // a primary press on a dot takes hold of it, and each move of its
    // pointer takes the pull there; the press over, the dot is let go, and
    // the click it ends in presses nothing
    Logo.listen(canvas, View, (x, y) => {
      const h = !switchAt(x, y) && hitAt(x, y);
      return h && h.logo;
    }, () => { grabbed = true; });

    // --- the field ---------------------------------------------------------------
    // in the window's middle, the field the password is typed into, made
    // as the menus' buttons are: a rounded rect, RADIUS of its text's size
    // round its corners, PAD_Y over and under its line and PAD_X either
    // side of it, and a skin (js/skin.js) that chases it, its anchors'
    // pull reaching only SPREAD along it, outlined LINE px from point to
    // point, its insides drawn apart (qfb) and copied through the skin, so
    // it wipes them in as it grows. it is as wide as what it holds and its
    // bar: empty, HINT; typed in, a row of DOT in the page's face, one a
    // character, never the letters, so one or two make it far narrower
    // than HINT, and it widens a DOT at a time from there. its width and its place
    // across ride on the menus' spring (RESPONSE s a swing undamped,
    // damped 1 - BOUNCE) toward those, and the skin after them, each edge
    // warbling WARBLE px either way. it is never wider than the window
    // less EDGE either side: past that the row is drawn smaller to fit.
    // while a mouse is over it, its outline and HINT are HOVER, and
    // otherwise ink, as the row of DOT always is; while it has the keys a
    // bar stands after the row, or before HINT, on and off each BLINK s. a
    // wrong password sets it going left on its spring at SHAKE px a
    // second, which swings it out, back a little past its place and
    // still, its skin dragged after it. a try that could not be checked
    // says FAILED a row under it until the next try
    const GATE = {
      HINT: 'password',                      // what the field says empty
      FAILED: 'could not check · try again', // what it says under it when a try could not be checked
      DOT: '•',                              // what each character typed shows as
      BLINK: 0.5,                            // s the bar is on, and then off
      GAP: 3,                                // world px between the bar and what the field holds
      SHAKE: 360,                            // world px a second a wrong password sets the field going left at
      REACH: 6,                              // world px round the field a press still presses it, for a finger
      SEED: 70000,                           // its letters' seeds run from here
    };
    const input = document.getElementById('key'); // the field's input
    let field = null;   // the field as laid out (placeField): { size, th, pad, most, hint, said, dots, text, bar, to, wide, side, skin }
    let typed = '';     // what is typed, as the input holds it
    let held = false;   // the field has the keys
    let blink = 0;      // s, when the bar last came on
    let out = false;    // a try is out at /gate
    let failed = false; // the last try could not be checked
    const warble = [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })); // each edge's

    // text in UI.FACE as letters k of a glyph's px to the world px, seeded
    // from sd, its ink centred on (0, 0); and how wide its ink is
    function words(text, k, sd) {
      const t = new Type(text, () => document.createElement('canvas'), UI.FACE);
      const x0 = -k * (t.right - t.left) / 2, base = k * (t.ascent - t.descent) / 2;
      return { wide: k * (t.left + t.right), letters: t.glyphs.map((gl) => Letter.make(gl.g, x0 + k * (gl.x + gl.dx), base + k * gl.dy, sd + gl.at, k)) };
    }

    // the field laid out for the window: its text's size, its height, its
    // padding and the most it may be across, HINT and FAILED as letters,
    // then what is typed (fill); it and its skin settled at that size in
    // the window's middle, still, and its input put under it
    function placeField() {
      const size = W < UI.STACK_BELOW ? UI.PHONE : UI.MOST, k = size / TYPE.EM;
      field = {
        size, th: Math.round(size * (2 * UI.PAD_Y + UI.CAP + UI.DESC)), pad: UI.PAD_X * size, most: W - 2 * UI.EDGE,
        hint: words(GATE.HINT, k, GATE.SEED), said: words(GATE.FAILED, k, GATE.SEED + 1000), dots: null, text: 0, bar: 0, to: 0,
        wide: { p: 0, v: 0 }, side: { p: 0, v: 0 }, skin: null,
      };
      fill();
      field.wide.p = field.to;
      field.skin = new Skin(fieldAt(), UI.SPREAD);
      underField();
    }

    // what is typed as a row of DOT; how far across from the field's
    // middle what it holds (HINT or the row) and the bar stand, the bar
    // GAP px after the row or before HINT and the two centred together;
    // and how wide the field goes: the two and PAD_X either side, the row
    // drawn smaller where that would be more than the most
    function fill() {
      const f = field, k = f.size / TYPE.EM, n = [...typed].length, room = 2 * f.pad + GATE.GAP + 1;
      f.dots = words(GATE.DOT.repeat(n), k, GATE.SEED + 2000);
      if (f.dots.wide + room > f.most) f.dots = words(GATE.DOT.repeat(n), k * (f.most - room) / f.dots.wide, GATE.SEED + 2000);
      const wide = n ? f.dots.wide : f.hint.wide, side = n ? 1 : -1;
      f.text = -side * (GATE.GAP + 1) / 2;
      f.bar = f.text + side * (wide / 2 + GATE.GAP);
      f.to = wide + room;
    }

    // the field's rect as it has got to, { x0, y0, x1, y1, r }: its middle
    // as far across from the window's as its spring has it and as wide,
    // and, given a time t, each edge warbled WARBLE px either way on its
    // own sine
    function fieldAt(t) {
      const f = field, cx = W / 2 + f.side.p, hw = Math.max(0, f.wide.p) / 2;
      const c = { x0: cx - hw, y0: H / 2 - f.th / 2, x1: cx + hw, y1: H / 2 + f.th / 2, r: UI.RADIUS * f.size };
      if (t !== undefined) {
        const w = (e) => UI.WARBLE * Math.sin(2 * Math.PI * t * warble[e].hz + warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // the field dt on: its width toward what it holds and its place back
    // to the middle, each on the spring, and its skin after them
    function stepField(dt, t) {
      const f = field;
      Menu.spring(f.wide, f.to, dt);
      Menu.spring(f.side, 0, dt);
      f.skin.step(dt, fieldAt(t));
    }

    // the input put under the field, so a phone shows it there
    function underField() {
      const r = fieldAt();
      input.style.left = Math.round(r.x0) * View.SCALE + 'px';
      input.style.top = Math.round(r.y0) * View.SCALE + 'px';
    }

    // whether world (x, y) on the screen is on the field, REACH round it
    function onField(x, y) {
      const r = fieldAt(), m = GATE.REACH;
      return x >= r.x0 - m && x <= r.x1 + m && y >= r.y0 - m && y <= r.y1 + m;
    }

    // the field into fb, its outline and HINT in HOVER if over: HINT or
    // the row of DOT, and the bar while it has the keys, into qfb over its
    // skin's box, in the middle of its rect as it has got to; then qfb
    // copied into fb through the skin and the skin outlined over it; and
    // FAILED a row under it
    function drawField(t, over) {
      const f = field, r = fieldAt(), v = over ? HOVER : 1, box = f.skin.bounds();
      const cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2;
      qfb.clearRows(Math.floor(box.y0) - UI.LINE, Math.ceil(box.y1) + UI.LINE + 1);
      const says = typed ? f.dots.letters : f.hint.letters, sv = typed ? 1 : v;
      for (let i = 0; i < says.length; i++) says[i].draw(t, cy, qfb, 0, sv, cx + f.text);
      if (held && (t - blink) % (2 * GATE.BLINK) < GATE.BLINK) {
        const x = Math.round(cx + f.bar), tall = (UI.CAP + UI.DESC) * f.size / 2;
        qfb.line(x, cy - tall, x, cy + tall, 1, 1);
      }
      const pts = f.skin.screen(0), n = pts.length;
      fb.fillPolygon(pts, qfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        fb.line(p.x, p.y, q.x, q.y, v, UI.LINE);
      }
      if (failed) for (let i = 0; i < f.said.letters.length; i++) f.said.letters[i].draw(t, H / 2 + f.th + UI.ROW * f.size, fb, 0, 1, W / 2);
    }

    // --- a try -------------------------------------------------------------------
    // what is typed sent to /gate, unless a try is out or nothing is
    // typed: let in, the page loads again as the site; a wrong password,
    // cleared and the field shaken (wrong); anything else, or no answer,
    // FAILED said under the field
    async function send() {
      if (out || !typed) return;
      out = true;
      failed = false;
      let status = 0;
      try { status = (await fetch('/gate', { method: 'POST', body: typed })).status; } catch (e) {}
      if (status === 204) {
        location.reload();
        return;
      }
      out = false;
      if (status === 401) wrong();
      else failed = true;
    }

    // what is typed cleared, the bar on from now, and the field set going
    // left at SHAKE px a second, which its spring swings back
    function wrong() {
      input.value = typed = '';
      blink = performance.now() / 1000;
      fill();
      field.side.v -= GATE.SHAKE;
    }

    // --- the keys ----------------------------------------------------------------
    // the field has the keys while its input has the focus, its bar on from
    // then and from each key. enter sends what is typed, and escape or a
    // press anywhere but the field lets go
    input.addEventListener('focus', () => {
      held = true;
      blink = performance.now() / 1000;
    });
    input.addEventListener('blur', () => { held = false; });
    input.addEventListener('input', () => {
      typed = input.value;
      blink = performance.now() / 1000;
      fill();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') input.blur();
      if (e.key !== 'Enter') return;
      e.preventDefault();
      send();
    });
    canvas.addEventListener('pointerdown', (e) => {
      if (!held) return;
      const p = View.pointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || !h.field) input.blur();
    });
    // a mouse's press on the field keeps the keys there: its own default
    // would take the focus from the input before the click gives it back
    canvas.addEventListener('mousedown', (e) => {
      const p = View.pointer(e), h = !switchAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.field) e.preventDefault();
    });

    // --- what a press presses ----------------------------------------------------
    // what a press at world (x, y) on the screen would press: the field, a
    // little round it, { field }; one of the logo's dots, a little round
    // it, { logo }, logo the dot; or null. the switch is apart from these
    // (switchAt), and asked first
    function hitAt(x, y) {
      if (onField(x, y)) return { field: true };
      const dot = Logo.dotAt(x, y);
      return dot ? { logo: dot } : null;
    }

    // --- the click ---------------------------------------------------------------
    // a click: the switch sends the page to its other end, dark or light
    // (Switch.send, js/switch.js); the field takes the keys, its input put under it
    // first, inside the press, so a phone brings up its keyboard. the
    // click a press ends in that took hold of something (grabbed) presses
    // nothing
    canvas.addEventListener('click', (e) => {
      if (grabbed) { grabbed = false; return; }
      const p = View.pointer(e);
      if (switchAt(p.x, p.y)) { Switch.send(Switch.to < 0.5 ? 1 : 0); return; }
      const h = hitAt(p.x, p.y);
      if (!h || !h.field) return;
      underField();
      input.focus();
    });

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm on the
    // pointer. while the button is held it closes through the frames to a
    // fist, and it opens again when the button lifts. a touch gets no hand.
    // it goes down last, over everything. a press is captured, so a drag
    // carries on outside the window, and a pointer that leaves is forgotten
    const cursor = new Cursor();

    let grabbed = false; // whether the last press took hold of something, so the click it ends in presses nothing
    // the hand follows the pointer, closes on a press and opens on a lift,
    // and goes when there is nothing left to hover (js/cursor.js); and each
    // press starts having taken hold of nothing
    cursor.listen(canvas, View);
    canvas.addEventListener('pointerdown', () => { grabbed = false; });

    // --- the frame ---------------------------------------------------------------
    // the page is drawn fresh every browser frame, all of it into the
    // framebuffer. first the logo's dots, the hand, the field on its
    // spring with its skin, and the switch catch up with the clock; then
    // the bits are cleared and drawn, each layer simply writing over the
    // bits of the last: the logo, the field, the hold on one of the logo's
    // dots, the switch, and last the hand. then the whole of it goes to
    // the canvas in one copy
    let lastNow = null; // the last frame's time, for dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      Logo.step(now);
      cursor.update(dt);
      stepField(dt, t);
      Switch.step(dt);
      fb.clear();
      const overSwitch = !!Hover.at && switchAt(Hover.at.x, Hover.at.y);
      const hit = Hover.at && !overSwitch && hitAt(Hover.at.x, Hover.at.y);
      Logo.draw(fb, t);
      drawField(t, !!(hit && hit.field));
      Logo.drawHold(fb);
      Switch.draw(fb, t, overSwitch);
      cursor.draw(fb);
      fb.present(ctx, Switch.dark);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    input.focus();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
