<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>text editor</title>
  <style>
    :root { --bg: #111; --fg: #eee; --muted: #777; --line: #333; --accent: #e33; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
                 font: 14px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; gap: 14px; align-items: center; padding: 8px 12px;
             border-bottom: 1px solid var(--line); }
    header span { color: var(--muted); }
    button { background: #222; color: var(--fg); border: 1px solid #444; padding: 3px 9px; cursor: pointer; }
    button:hover { background: #333; }
    #status { margin-left: auto; }
    #status.dirty { color: var(--accent); }
    main { flex: 1; display: flex; min-height: 0; }
    #fields { flex: none; width: 440px; box-sizing: border-box; overflow-y: auto; padding: 0 12px 40px;
              border-right: 1px solid var(--line); }
    #fields h2 { font-size: 15px; margin: 20px 0 8px; }
    #fields label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 3px; }
    textarea { display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden;
               background: #222; color: var(--fg); border: 1px solid #444; padding: 6px 8px;
               font: inherit; line-height: 1.45; }
    textarea:focus { outline: none; border-color: #888; }
    #page { flex: 1; min-width: 0; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <strong>text</strong>
    <span>a line is a paragraph &nbsp; ⌘S saves</span>
    <button id="savebtn">save</button>
    <span id="status"></span>
  </header>
  <main>
    <div id="fields"></div>
    <iframe id="page" src="../../index.html"></iframe>
  </main>

  <script src="../../js/text.js"></script>
  <script>
    // the page's words (js/text.js): a section's text under its title, a
    // paragraph each, or its items' texts under theirs. the editor shows a
    // field for every text, a paragraph a line, with the page beside them;
    // ⌘S writes js/text.js back through serve.py and the page beside takes
    // the words as they now are.
    const HEAD = `// the page's words, written by tools/text/editor.html (python3
// tools/text/serve.py): edit there, not here. a section's text is under
// its title, a paragraph each; a section of items has each item's under
// the item's title, and an item with none shows lorem ipsum (index.html).
`;

    const $ = (id) => document.getElementById(id);
    const fields = $('fields'), status = $('status'), page = $('page');

    // --- model ------------------------------------------------------------------
    const text = JSON.parse(JSON.stringify(TEXT));

    function serialize(t) {
      return HEAD + 'const TEXT = ' + JSON.stringify(t, null, 2) + ';\n';
    }

    let savedText = serialize(text);
    let dirty = false;

    function setStatus(words, isDirty) {
      status.textContent = words;
      status.className = isDirty ? 'dirty' : '';
    }

    function changed() {
      dirty = serialize(text) !== savedText;
      setStatus(dirty ? 'unsaved' : 'saved', dirty);
    }

    // --- fields -----------------------------------------------------------------
    // a text's field: its paragraphs a blank line apart, as tall as they
    // stand. every line with something on it is a paragraph, written back
    // into the model (into[key]) as it is typed
    function field(into, key, hint) {
      const ta = document.createElement('textarea');
      ta.rows = 1;
      ta.value = into[key].join('\n\n');
      if (hint) ta.placeholder = hint;
      const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
      ta.addEventListener('input', () => {
        into[key] = ta.value.split('\n').map((line) => line.trim()).filter(Boolean);
        fit();
        changed();
      });
      fields.appendChild(ta);
      fit();
    }

    for (const title in text) {
      const h = document.createElement('h2');
      h.textContent = title;
      fields.appendChild(h);
      if (Array.isArray(text[title])) { field(text, title); continue; }
      for (const item in text[title]) {
        const l = document.createElement('label');
        l.textContent = item;
        fields.appendChild(l);
        field(text[title], item, 'no text yet: the page shows lorem ipsum');
      }
    }

    // --- save -------------------------------------------------------------------
    // the page beside the fields takes the words where it stands, its open
    // boxes left open; one that cannot is loaded again
    function show() {
      const w = page.contentWindow;
      try { w.readText(text); w.layout(); }
      catch (e) { w.location.reload(); }
    }

    async function save() {
      const out = serialize(text);
      try {
        const r = await fetch('/save', { method: 'POST', body: out, headers: { 'Content-Type': 'text/plain' } });
        if (!r.ok) throw new Error('http ' + r.status);
      } catch (e) {
        setStatus('not saved: run python3 tools/text/serve.py', true);
        return;
      }
      savedText = out;
      changed();
      if (!dirty) setStatus('saved ' + new Date().toLocaleTimeString(), false);
      show();
    }

    // ⌘S saves from the fields and from the page beside them
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    }
    window.addEventListener('keydown', onKey);
    page.addEventListener('load', () => page.contentWindow.addEventListener('keydown', onKey));
    $('savebtn').addEventListener('click', save);
    window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

    changed();
  </script>
</body>
</html>
