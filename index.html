        }
      }, pfb, qfb, tint(it.home, 2));
    }

    // how far down the page as laid out the opening is on the screen now, world px
    function chessDown() {
      return Math.round(chessItem.shift + chessHome.off - scrolled());
    }

    // whether any of the opening is on the screen
    function chessSeen() {
      const b = chessItem.chessAt && chessItem.chessAt.box;
      return !!b && b.y1 + chessDown() > 0 && b.y0 + chessDown() < H;
    }

    // p, world px on the screen, as a px of the canvas, GROW world px
    // each, from the picture's top left where it is on the screen now
    function inChess(p) {
      const r = chessRect(chessItem.chessAt), g = WALL_UI.GROW;
      return { x: (p.x - r.x) / g, y: (p.y - (r.y + chessDown())) / g };
    }

    // whether p, world px on the screen, is in the opening where it is now
    function inOpening(p) {
      const b = chessItem.chessAt.box, y = p.y - chessDown();
      return p.x >= b.x0 && p.x < b.x1 && y >= b.y0 && y < b.y1;
    }

    // whether a press is on the board's opening, or on the scrubber
    function onChess(e) {
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      return !!(h && (h.board || h.scrub));
    }

    // the scrubber held at world x: the set shown after as many of the
    // famous game's moves as that is of the way along its bar, between
    // its ends' middles
    function scrubTo(x) {
      const b = chessItem.chessAt.panel.replay.bar, r = (b.y1 - b.y0) / 2;
      Replay.seek(Math.max(0, Math.min(1, (x - b.x0 - r) / (b.x1 - b.x0 - 2 * r))) * Replay.line.length);
    }

    // the synthesis menu's knob held at world x: turned to as far as x is
    // across its bar, -1 KNOB in from its left end to 1 as far in from its
    // right (Clack.turn), as upright's are (knobSlider)
    function knobTo(x) {
      const b = chessItem.chessAt.synth.knobs[synthHold.k].bar, e = DEMO.KNOB, u = Math.min(1, Math.max(0, (x - b.x0) / (b.x1 - b.x0)));
      Clack.turn(synthHold.k, 2 * (u - e) / (1 - 2 * e) - 1);
    }

    // the set on, and the famous game played back on it (Replay.step),
    // its canvas the opening's size, while chebble is at least partly open
    // in a box out of its o and its opening is on the screen, the piece
    // under a mouse's pointer on the opening lit first, none anywhere
    // else; then what that step found touched said to the set's sound
    // (js/clack.js), there and nowhere else, so a step's words are said
    // once; and the hold on a piece let go, the fingers on the board
    // forgotten and the scrubber let go, once chebble or its box is shut
    function stepChess(dt) {
      if (!chessItem) return;
      if (!(openBox(chessHome) && chessItem.open)) {
        if (chessHold && chessHold.held === 1) {
          Chess.drop();
          chessHold.held = -1;
        }
        chessFingers.clear();
        chessScrub = null;
      }
      if (!Chess.ready || !shownBox(chessHome) || chessItem.p <= 0 || !chessSeen()) return;
      Chess.size(chessItem.chessAt.w, chessItem.chessAt.h);
      const h = Hover.at && !cornerAt(Hover.at.x, Hover.at.y) && hitAt(Hover.at.x, Hover.at.y), q = h && h.board && inChess(Hover.at);
      Chess.hover(q ? Chess.at(q.x, q.y) : -1);
      Chess.step(dt);
      Replay.step(dt);
      Clack.say(Chess.words());
    }

    // a primary press on the board takes the piece under it, or the view.
    // a second finger down on it with the first lets go of what the first
    // held, and from there the two zoom the camera as they move. one on
    // the scrubber takes hold of it, there, and one on a knob's row of the
    // synthesis menu takes hold of the knob and turns it there (knobTo),
    // the set in or not
    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.knob && e.isPrimary) {
        synthHold = { id: e.pointerId, k: h.knob.k };
        knobTo(p.x);
      }
      if (!Chess.ready) return;
      if (h && h.scrub && e.isPrimary) {
        chessScrub = e.pointerId;
        scrubTo(p.x);
      }
      if (!h || !h.board) return;
      if (e.pointerType === 'touch') {
        chessFingers.set(e.pointerId, p);
        if (chessFingers.size > 1) {
          if (chessHold && chessHold.held === 1) Chess.drop();
          if (chessHold) chessHold.held = -1;
          return;
        }
      }
      if (!e.isPrimary) return;
      const q = inChess(p);
      chessHold = { id: e.pointerId, x: p.x, y: p.y, held: Chess.take(q.x, q.y) ? 1 : 0 };
    });
    // two fingers on the board zoom the camera in by as much as they have
    // come apart since either last moved, and out as they come together. a
    // piece held is carried to the pointer, and let go as the pointer
    // leaves the opening; the view held is turned by the way the pointer
    // went; and the scrubber held, or a knob, goes where the pointer is
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId === chessScrub) scrubTo(View.pointer(e).x);
      if (synthHold && e.pointerId === synthHold.id) knobTo(View.pointer(e).x);
      const f = chessFingers.get(e.pointerId);
      if (f) {
        const at = View.pointer(e);
        if (chessFingers.size === 2) {
          let o = null;
          for (const [id, q] of chessFingers) if (id !== e.pointerId) o = q;
          const was = Math.hypot(f.x - o.x, f.y - o.y), now = Math.hypot(at.x - o.x, at.y - o.y);
          if (was > 0 && now > 0) Chess.zoom(now / was);
        }
        chessFingers.set(e.pointerId, at);
      }
      if (!chessHold || e.pointerId !== chessHold.id) return;
      const p = View.pointer(e);
      if (chessHold.held === 1 && !inOpening(p)) {
        Chess.drop();
        chessHold.held = -1;
      } else if (chessHold.held === 1) {
        const q = inChess(p);
        Chess.carry(q.x, q.y);
      } else if (chessHold.held === 0) Chess.turn((p.x - chessHold.x) * CHESS.DRAG, (p.y - chessHold.y) * CHESS.DRAG);
      chessHold.x = p.x;
      chessHold.y = p.y;
    });
    // a press on the opening lifted or called off lets go of the piece it
    // held; the click it ends in presses nothing, wherever the pointer has
    // got to, as the bottle's does. the scrubber and a knob are let go,
    // their click pressing nothing either
    const chessGo = (e) => {
      chessFingers.delete(e.pointerId);
      if (e.pointerId === chessScrub) {
        chessScrub = null;
        if (e.type === 'pointerup') grabbed = true;
      }
      if (synthHold && e.pointerId === synthHold.id) {
        synthHold = null;
        if (e.type === 'pointerup') grabbed = true;
      }
      if (!chessHold || e.pointerId !== chessHold.id) return;
      if (chessHold.held === 1) Chess.drop();
      chessHold = null;
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', chessGo);
    canvas.addEventListener('pointercancel', chessGo);

    // the arrow keys, while chebble is open in its box, its opening is on
    // the screen and a famous game is played back: left and right show it
    // a move back and on, up before its first move and down after its
    // last (js/replay.js), each kept from the browser. a key held with a
    // modifier is the browser's
    window.addEventListener('keydown', (e) => {
      if (!chessItem || !Replay.on || !(openBox(chessHome) && chessItem.open) || !chessSeen() || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (e.key === 'ArrowLeft') Replay.back();
      else if (e.key === 'ArrowRight') Replay.next();
      else if (e.key === 'ArrowUp') Replay.seek(0);
      else if (e.key === 'ArrowDown') Replay.seek(Replay.line.length);
      else return;
      e.preventDefault();
    });

    // --- the film ----------------------------------------------------------------
    // cicada's item, in personal work, holds its film (js/film.js,
    // js/films.js): its picture over its text (layoutItems), as far
    // across as the text's measure and no more than FILM.ACROSS, as tall
    // as the film's shape has that, a pixel a world px, in the film's own
    // few colours, the same on the dark page. it is seen through a
    // porthole, a skin (js/skin.js) as a menu's is but always open: a
    // rounded rect, its corners an item's bubble's, each edge warbling on
    // its own sine as a box's do, outlined as they are, and FILM.IN px
    // in from the picture's edges all round, so the picture fills it
    // however it warbles. until
    // the film is first played or sought the picture is its poster. a
    // menu's ROW under the picture is a row: at its left a button, built
    // as a famous game's controls' are (chess, above), that says PLAY,
    // PAUSE while the film plays, and WAIT while it plays with its sound
    // or its video not in yet; and from there to the picture's right its
    // bar, a slider's, with a dot as far along it, between its ends'
    // middles, as the film is wanted through. the film's sound is played
    // as a record under a hand is (js/scrub.js) and its picture keeps time
    // with what is heard: a press on the button or on the picture plays
    // the film, the sound spinning up to speed, or stops it while it
    // plays, the sound spinning down, and once it has run out plays it
    // from its start; a primary press on the bar's row, held and moved,
    // wants the film where the pointer is along the bar and holds it
    // there, and the sound and the picture go after it, back or on, as
    // fast as they are far and slowing as they arrive; let go, the film
    // plays on from there if it was playing. the click a press on the bar
    // ends in presses nothing. a press
    // there is never a swipe (the swipe, below). under the pointer the
    // button, and with it the porthole's outline, the picture under it
    // too, and the bar, held too, are in the
    // words' hover colour. the film's sound is eased to silence while the
    // page is muted (the mute button, above). it is stopped once cicada
    // or its box is shut, and its picture is brought up to it each frame
    // while cicada is at least partly open in a box out of its o and the
    // picture is on the screen (the frame, below); off the screen it
    // plays on, heard
    const FILM = {
      ACROSS: 640, // world px, the most its picture is across: the film's own width
      IN: 1,       // world px, its porthole in from the picture's edges at rest
      PLAY: 'play', PAUSE: 'pause', WAIT: 'loading', // what its button says: stopped, playing, and playing with nothing in to play on with
    };
    const filmHome = sections.find((s) => s.items.some((it) => it.film)) || null; // the section whose box holds the film
    const filmItem = filmHome ? filmHome.items.find((it) => it.film) : null;       // cicada, the item it is in
    const filmSays = [FILM.PLAY, FILM.PAUSE, FILM.WAIT].map((text) => new Type(text, () => document.createElement('canvas'), TAG.FACE)); // what its button says, each as type
    let filmHold = null; // the pointer holding the film's bar, or null
    let filmDot = null;  // how far along its bar its dot has got to, 0 .. 1, or null before its first step
    // its porthole: its skin, the picture's box that was made round
    // (room), and each edge's warble, as a menu's
    const filmPort = {
      skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };
    Film.load(FILMS.cicada, window);

    // how tall the film's part of its item stands, its picture across
    // world px across, at the text's size bs: the picture, as the film's
    // shape has it, a menu's ROW, and its row, a button's height
    function filmH(across, bs) {
      const S = SHOP_UI, F = FILMS.cicada, size = Math.max(BOX.CAP_LEAST, BOX.CAP * bs);
      return Math.round(across * F.h / F.w) + Math.round(S.ROW * size) + Math.round(size * (2 * S.PAD_Y + S.CAP + S.DESC));
    }

    // the film's part of its item with its top left at (x, y), its
    // picture w across, world px on the page as laid out, at the text's
    // size bs: the picture's box (box) and its size (w, h), its porthole
    // at rest (port), IN in from the box all round, its corners an
    // item's bubble's, the buttons'
    // text's size (size), its button, { rect, says }, as wide as the
    // widest thing it says and the letters of each of those in its
    // middle, its bar (bar), as tall as a slider's and in the middle of
    // the row down, and where a press takes hold of it (hit), the row
    // from the bar's left to its right
    function placeFilm(x, y, w, bs, seed) {
      const S = SHOP_UI, F = FILMS.cicada, size = Math.max(BOX.CAP_LEAST, BOX.CAP * bs), k = size / TYPE.EM;
      const h = Math.round(w * F.h / F.w), th = Math.round(size * (2 * S.PAD_Y + S.CAP + S.DESC)), row = Math.round(S.ROW * size), top = y + h + row;
      const wide = (t) => k * (t.left + t.right), bw = Math.round(Math.max(...filmSays.map(wide)) + 2 * S.PAD_X * size), sh = DEMO.SLIDER.H;
      const says = filmSays.map((t, j) => t.glyphs.map((gl) => Letter.make(gl.g, x + (bw - wide(t)) / 2 + k * (gl.x + gl.dx + t.left), top + size * (S.PAD_Y + S.CAP) + k * gl.dy, seed + 100 * j + gl.at, k, LETTER.WOBBLE)));
      const by = top + Math.round((th - sh) / 2), bar = { x0: x + bw + row, y0: by, x1: x + w, y1: by + sh };
      return {
        box: { x0: x, y0: y, x1: x + w, y1: y + h }, w, h, size,
        port: { x0: x + FILM.IN, y0: y + FILM.IN, x1: x + w - FILM.IN, y1: y + h - FILM.IN, r: BOX.ITEM_RADIUS * BOX.ITEM * bs },
        button: { rect: { x0: x, y0: top, x1: x + bw, y1: top + th }, says },
        bar, hit: { x0: bar.x0, y0: top, x1: bar.x1, y1: top + th },
      };
    }

    // item it's film, d world px down from where it was laid out, into
    // pfb, hover what the pointer is on: its picture, once it is the size
    // it is laid out at, a pixel a world px, drawn into qfb over its
    // porthole's skin's box, then qfb copied into pfb through the skin
    // and the skin outlined over it, as a menu is; its button, outlined
    // round what it says now; and its bar with its dot where it has got
    // to, between the bar's ends' middles. the porthole's outline and the
    // button, under the pointer or the picture under it, and the bar
    // under it or held, are in the words' hover colour
    function drawFilm(it, t, d, hover) {
      const a = it.filmAt, dy = Math.round(d), on = hover && hover.it === it && hover.film ? hover : null, g = Film.picture;
      const r = a.button.rect, v = on && on.play ? tint(it.home, 0) : 1, says = a.button.says[Film.waiting() ? 2 : Film.playing() ? 1 : 0];
      if (filmPort.skin && filmPort.room === a.box) {
        const box = filmPort.skin.bounds();
        qfb.clearRows(Math.floor(box.y0 + dy) - BOX.LINE, Math.ceil(box.y1 + dy) + BOX.LINE + 1);
        if (g && g.w === a.w && g.h === a.h) qfb.blitPixels(g, a.box.x0, a.box.y0 + dy);
        const pts = filmPort.skin.screen(dy), n = pts.length;
        pfb.fillPolygon(pts, qfb);
        for (let i = 0; i < n; i++) {
          const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
          pfb.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
        }
      }
      pfb.roundRect(r.x0, r.y0 + dy, r.x1, r.y1 + dy, SHOP_UI.RADIUS * a.size, null, v, BOX.LINE);
      for (let i = 0; i < says.length; i++) says[i].draw(t, dy, pfb, 0, v);
      const bar = a.bar, end = (bar.y1 - bar.y0) / 2 / (bar.x1 - bar.x0);
      Bar.draw(pfb, bar, dy, 0, filmDot === null ? null : end + filmDot * (1 - 2 * end), filmHold !== null || (on && on.reel) ? tint(it.home, 0) : 1, DEMO.SLIDER);
    }

    // whether any of the film's picture is on the screen
    function filmSeen() {
      const b = filmItem.filmAt && filmItem.filmAt.box;
      if (!b) return false;
      const y = filmItem.shift + filmHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    // whether a press is on the film's bar's row
    function onFilm(e) {
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      return !!(h && h.reel);
    }

    // the bar held at world x: the film wanted as far through as that is
    // of the way along the bar, between its ends' middles
    function reelTo(x) {
      const b = filmItem.filmAt.bar, r = (b.y1 - b.y0) / 2;
      Film.seek((x - b.x0 - r) / (b.x1 - b.x0 - 2 * r));
    }

    // the film stopped and its bar let go once cicada or its box is shut;
    // its dot on toward as far along its bar as the film is wanted
    // through (Bar.dotTo); and, while cicada is at least partly open in a box out of
    // its o, its porthole's skin on after its shape at rest, each edge
    // warbled WARBLE px either way on its own sine at time t, as Menu.at
    // has a menu's, a new skin settled there when it has been laid out
    // again; and, while the picture is on the screen too, the picture,
    // the size it is laid out at, brought up to the film (Film.step)
    function stepFilm(dt, t) {
      if (!filmItem) return;
      if (!(openBox(filmHome) && filmItem.open)) {
        filmHold = null;
        Film.hold(false);
        Film.pause();
      }
      filmDot = Bar.dotTo(filmDot, Film.at(), dt);
      const a = filmItem.filmAt;
      if (!a || !shownBox(filmHome) || filmItem.p <= 0) return;
      const shape = { ...a.port }, w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * filmPort.warble[e].hz + filmPort.warble[e].ph);
      shape.x0 += w(0);
      shape.y0 += w(1);
      shape.x1 += w(2);
      shape.y1 += w(3);
      if (!filmPort.skin || filmPort.room !== a.box) {
        filmPort.skin = new Skin(shape, SKIN.SPREAD);
        filmPort.room = a.box;
      } else filmPort.skin.step(dt, shape);
      if (!filmSeen()) return;
      Film.size(filmItem.filmAt.w, filmItem.filmAt.h);
      Film.step();
    }

    // a primary press on the bar's row takes hold of the bar, the film
    // wanted where it is along it and held there, and each move while it
    // is held wants it on
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0 || !filmItem) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || !h.reel) return;
      filmHold = e.pointerId;
      reelTo(p.x);
      Film.hold(true);
    });
    canvas.addEventListener('pointermove', (e) => { if (e.pointerId === filmHold) reelTo(View.pointer(e).x); });
    // the bar let go, the film is held no longer; the click a lifted press
    // on it ends in presses nothing, wherever the pointer has got to, as
    // the ribbon's does
    const filmGo = (e) => {
      if (e.pointerId !== filmHold) return;
      filmHold = null;
      Film.hold(false);
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', filmGo);
    canvas.addEventListener('pointercancel', filmGo);

    // --- the swipe ---------------------------------------------------------------
    // the browser scrolls on its own and tells the page where it got to late
    // and unevenly, so a finger scrolls the page itself. a press (not a
    // mouse) that goes SWIPE.SLOP css px, more up or down than across, is a
    // swipe: everything else the press was doing is called off as the
    // browser's own scroll calls it off (a pointercancel and a
    // pointerleave), and from there the page moves 1:1 with the finger, no
    // further than either end. let go moving, it glides on the way it was
    // going, toward where the finger's speed as it left would carry it, by
    // the house approach, GLIDE of the way left each 60 hz frame (a
    // flick slowing as ios's scroll does, 0.998 of its speed a ms). that
    // may be past the page's end: the glide leaves at the finger's speed
    // however little page is left, and stops at the end when it gets
    // there. a press that goes across first is the page's to the end. a
    // press while it glides stops it and is the swipe's alone, its events
    // and its click going no further: up or down, it swipes on from where
    // it stopped it. a press on the wall, or on its menu's cells, slider
    // or tray, that stops no glide is the wall's to the end (the wall,
    // above), and never a swipe, and so is one on the chess set's board
    // or its scrubber (chess, above), or on the film's bar (the film,
    // above)
    const SWIPE = {
      SLOP: 10,                              // css px a press goes before it is a swipe or not
      FLICK: 100,                            // ms of the finger's last moves its speed is read from
      WEIGH: [0.6, 0.35, 0.05],              // what the speeds between the finger's last four moves count for, oldest first, as ios's scroll view weighs them
      STILL: 60,                             // ms a finger held still before lifting that leaves no glide
      GLIDE: 1 - Math.pow(0.998, 1000 / 60), // of the way left to glide, each 60 hz frame
    };
    let swipeY = 0, swipeTo = 0; // css px the page is scrolled, and where it glides to, which may be past either end
    let swipe = null;            // the press being watched, { id, x, y, on, done, stop, y0, from, samples }, or null
    let eatClick = false;        // the click the press ends in presses nothing
    let calling = false;         // the swipe is calling a press off, so its own listeners let that through

    // how far the page is scrolled, in whole world px
    function scrolled() {
      return Math.round(swipeY / View.SCALE);
    }

    // y css px of the page's scroll, no further than either end
    function clampSwipe(y) {
      return Math.min(Math.max(y, 0), scrollEnd);
    }

    // the finger's scroll kept in the page, and gliding on toward where it
    // was flicked while no finger holds it. the page itself goes no
    // further than either end, and a glide that comes to one is over
    function stepSwipe(dt) {
      swipeY = clampSwipe(swipeY);
      if ((swipe && swipe.on) || swipeTo === swipeY) return;
      let y = swipeY + (swipeTo - swipeY) * (1 - Math.pow(1 - SWIPE.GLIDE, 60 * dt));
      if (Math.abs(swipeTo - y) < 0.5) y = swipeTo;
      swipeY = clampSwipe(y);
      if (swipeY !== y) swipeTo = swipeY;
    }

    // on the window, capturing, so a press is heard before the canvas's
    // own listeners and can be kept from them
    window.addEventListener('pointerdown', (e) => {
      if (calling) return;
      eatClick = false;
      if (e.pointerType === 'mouse' || !e.isPrimary) return;
      const stop = Math.abs(swipeTo - swipeY) > SWIPE.SLOP;
      if (!stop && (onWall(e) || onChess(e) || onFilm(e))) return;
      swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false, done: false, stop, y0: 0, from: 0, samples: [] };
      swipeTo = swipeY;
      // a press while it glides stops it, and nothing else hears it
      if (stop) {
        e.stopPropagation();
        eatClick = true;
      }
    }, true);
    window.addEventListener('pointermove', (e) => {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.on) {
        e.stopPropagation();
        swipeY = swipeTo = clampSwipe(swipe.from - (e.clientY - swipe.y0));
        swipe.samples.push({ t: e.timeStamp, y: swipeY });
        while (swipe.samples.length > 2 && e.timeStamp - swipe.samples[0].t > SWIPE.FLICK) swipe.samples.shift();
        return;
      }
      if (swipe.stop) e.stopPropagation();
      if (swipe.done) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      if (Math.hypot(dx, dy) <= SWIPE.SLOP) return;
      swipe.done = true;
      // across first: the press is the page's to the end
      if (Math.abs(dy) <= Math.abs(dx)) return;
      // up or down: the press called off as the browser's scroll calls it
      // off, unless it stopped a glide and the canvas never heard it
      if (!swipe.stop) {
        const like = { pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary, clientX: e.clientX, clientY: e.clientY };
        calling = true;
        canvas.dispatchEvent(new PointerEvent('pointercancel', like));
        canvas.dispatchEvent(new PointerEvent('pointerleave', like));
        calling = false;
      }
      // anchored where it takes over, so the page does not jump by the slop
      swipe.on = true;
      swipe.y0 = e.clientY;
      swipe.from = swipeY;
      swipe.samples = [{ t: e.timeStamp, y: swipeY }];
      eatClick = true;
      e.stopPropagation();
    }, true);
    // the finger's speed as it left, css px a second, from the last of its
    // moves s, each { t, y }: the speeds between its last four, weighed
    // SWIPE.WEIGH, the last move counting for least, so a finger still
    // speeding up is not taken at its average, nor one that slows as it
    // lifts at its last move. fewer than four moves are taken straight
    // from the first to the last
    function flickSpeed(s) {
      const speed = (a, b) => b.t > a.t ? (b.y - a.y) / (b.t - a.t) * 1000 : 0;
      const n = s.length - 1;
      if (n < 3) return speed(s[0], s[n]);
      let v = 0;
      for (let i = 0; i < 3; i++) v += SWIPE.WEIGH[i] * speed(s[n - 3 + i], s[n - 2 + i]);
      return v;
    }

    // a swipe let go: the finger's speed v as it left (flickSpeed), from
    // its last FLICK ms of moves, none if it was held still STILL ms first,
    // and the glide's end v / k on, past the page's end or not, k the
    // house approach's rate a second, so the glide starts at the finger's
    // speed
    function swipeLift(e) {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.stop || swipe.on) e.stopPropagation();
      if (swipe.on && e.type === 'pointerup') {
        const s = swipe.samples.filter((p) => e.timeStamp - p.t <= SWIPE.FLICK);
        const v = s.length < 2 || e.timeStamp - s[s.length - 1].t > SWIPE.STILL ? 0 : flickSpeed(s);
        const k = -60 * Math.log(1 - SWIPE.GLIDE);
        swipeTo = swipeY + v / k;
      }
      swipe = null;
    }
    window.addEventListener('pointerup', swipeLift, true);
    window.addEventListener('pointercancel', swipeLift, true);
    window.addEventListener('click', (e) => {
      if (!eatClick) return;
      eatClick = false;
      e.stopPropagation();
    }, true);

    // --- the wheel ---------------------------------------------------------------
    // the wheel scrolls the page itself as a finger does, and the document
    // stays where it is: safari puts the system's pointer back over the
    // hand whenever its document comes to its top or leaves it. the page's
    // one wheel listener, which stops nothing, moves the page 1:1 by each
    // event's way down, no further than either end, stopping a glide. its
    // events under RUN ms apart are one run, and a run that starts over the
    // bottle turns the bottle instead (the ship, above), to its last event,
    // one that starts over the wall moves its opening over
    // it (the wall, above), the page scrolling by what that leaves
    // of its way down, and one that starts over the chess set's board
    // with its first event zooming the camera, in for a wheel going up and
    // out for one going down, e to CHESS.WHEEL a px, zooms it to its last
    // event and scrolls nothing, however long it goes on after the camera
    // is as far in or out as it goes; one whose first event finds the
    // camera already that far scrolls the page. a wheel held
    // with ctrl is the browser's zoom and
    // moves nothing, but over the wall, where one held with ctrl or cmd
    // grows or shrinks the wall, and over the board, where it zooms the
    // camera (below)
    const WHEEL = {
      LINE: 16, // css px a line, for a wheel that counts in lines
      RUN: 200, // ms: the wheel's events under this apart are one run
    };
    let wheelAt = -Infinity; // when the wheel was last heard, ms on the page's clock
    let wheelShip = false;   // the run it is in is the bottle's
    let wheelWall = false;   // the run it is in is the wall's
    let wheelChess = false;  // the run it is in is the chess set's: it began by zooming its camera
    // held with ctrl or cmd over the wall, as most browsers send a
    // trackpad's pinch, it grows or shrinks the wall about the pointer and
    // is kept from the browser, and the page's listener leaves it be; over
    // the chess set's board it zooms the camera as much, the same way
    canvas.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y), v = wallView(), U = WALL_UI;
      if (!h || !(h.board || (h.canvas && v))) return;
      e.preventDefault();
      const px = e.deltaMode === 1 ? WHEEL.LINE : e.deltaMode === 2 ? window.innerHeight : 1;
      const by = Math.exp(-Math.max(-U.NOTCH, Math.min(U.NOTCH, e.deltaY * px)) * U.PINCH);
      if (h.board) { Chess.zoom(by); return; }
      zoomTo(wallScale * by, p.x - v.x, p.y - v.y);
      wallScaleTo = wallScale;
    }, { passive: false });
    // safari's own word for a trackpad's pinch: one that starts over the
    // wall grows or shrinks it about the pointer by as much as the pinch
    // has since it was last heard, and is kept from safari's zoom of the
    // page; one that starts over the chess set's board zooms its camera by
    // as much. fingers on a screen are the pointers' (the wall and chess,
    // above)
    canvas.addEventListener('gesturestart', (e) => {
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || !(h.canvas || h.board)) return;
      e.preventDefault();
      if (h.board) chessPinch = 1;
      else wallPinch = 1;
    });
    canvas.addEventListener('gesturechange', (e) => {
      if (chessPinch !== null) {
        e.preventDefault();
        if (!chessFingers.size && e.scale > 0) Chess.zoom(e.scale / chessPinch);
        chessPinch = e.scale > 0 ? e.scale : chessPinch;
        return;
      }
      if (wallPinch === null) return;
      e.preventDefault();
      const p = View.pointer(e), v = wallView();
      if (v && !wallFingers.size && e.scale > 0) {
        zoomTo(wallScale * e.scale / wallPinch, p.x - v.x, p.y - v.y);
        wallScaleTo = wallScale;
      }
      wallPinch = e.scale > 0 ? e.scale : wallPinch;
    });
    canvas.addEventListener('gestureend', () => { wallPinch = chessPinch = null; });
    canvas.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.defaultPrevented) return;
      const now = performance.now();
      const px = e.deltaMode === 1 ? WHEEL.LINE : e.deltaMode === 2 ? window.innerHeight : 1;
      let zoomed = false;
      if (now - wheelAt >= WHEEL.RUN) {
        const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
        wheelShip = !!(h && h.ship);
        wheelWall = !!(h && h.canvas);
        wheelChess = zoomed = !!(h && h.board) && Chess.zoom(Math.exp(-e.deltaY * px * CHESS.WHEEL));
      }
      wheelAt = now;
      if (wheelShip) Ship.turn((Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * px * SHIP.WHEEL);
      else if (wheelWall) swipeY = swipeTo = clampSwipe(swipeY + panWall(e.deltaX * px / View.SCALE, e.deltaY * px / View.SCALE) * View.SCALE);
      else if (!wheelChess) swipeY = swipeTo = clampSwipe(swipeY + e.deltaY * px);
      else if (!zoomed) Chess.zoom(Math.exp(-e.deltaY * px * CHESS.WHEEL));
    }, { passive: true });

    // cicada's drag line: dashed, from the grabbed point to the pointer,
    // its dashes shrinking and gaps opening over the last 30 % of the reach
    // before the skin lets go, in world w through view as its bubble is
    // drawn. cicada also put a plus on every held point; those are left
    // off, the skin is not to be marked
    function drawDrag(view, d) {
      if (!d) return;
      const c = d.points[0].point;
      const dx = c.x - d.x, dy = c.y - d.y;
      const reach = Math.min(Math.sqrt(dx * dx + dy * dy) / SOFT.DRAG.BREAKAWAY, 1);
      const dashing = Math.pow(Math.max(0, (reach - 0.7) / 0.3), 2);
      const dashLength = Math.max(2, 12 * (1 - dashing)), gapLength = 1 + 25 * dashing;
      // walked from the rounded ends, as cicada did
      const x0 = Math.round(c.x), y0 = Math.round(c.y), x1 = Math.round(d.x), y1 = Math.round(d.y);
      const len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (len === 0) return;
      const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      for (let at = 0, drawing = true; at < len; drawing = !drawing) {
        const end = Math.min(at + (drawing ? dashLength : gapLength), len);
        if (drawing) view.line(x0 + ux * at, y0 + uy * at, x0 + ux * end, y0 + uy * end);
        at = end;
      }
    }

    // --- the tally ---------------------------------------------------------------
    // the tally (js/tally.js) is told each frame's ms and the things open
    // in it, by their words: every item open in a box that is open, as the
    // box that one is in is, so it knows how long each was open for
    const openThings = [];
    function tellFrame(now) {
      openThings.length = 0;
      for (let n = 0; n < sections.length; n++) {
        const s = sections[n];
        if (!s.box.open || (s.up && !s.up.box.open)) continue;
        for (let j = 0; j < s.items.length; j++) if (s.items[j].open) openThings.push(s.items[j].title);
      }
      Tally.frame(now, openThings);
    }

    // --- the frame ---------------------------------------------------------------
    // the world is drawn fresh every browser frame, all of it into the
    // framebuffer. first the bubble's world, its face, the demo's voice,
    // its face, its dots and its menu, the piano's menu and its keys, the ship, daedalus, the wall, the tag's bubbles and the
    // cursor's hand and the boxes catch up with the clock, the words
    // under them are pushed down, the page's end is worked out, and each box's skin is stepped after
    // where its box has got to, warbled, the upgrades' menu and the wall's
    // with their skins, and the paint in the wall's tray; then the bits are cleared, the words and
    // their boxes drawn scrolled, a shut box in its word's o's place with
    // its insides showing through it, the bubble in its box, every other
    // letter over them on its own
    // clock, the tag's bubbles, the
    // drag's marks, the scroll hand and the mute button, and last the hand on its backing, over
    // the end of the drag's line, each layer simply writing over the bits of the last. then
    // the whole of it goes to the canvas in one copy, and the system cursor
    // is hidden (drawn, on the root) once there is a hand drawn in its
    // place. the next frame is asked for first, so one that throws does
    // not stop the ones after it.
    let lastNow = null; // the last frame's time, for the face's dt
    let drawn = false;  // a frame has been presented
    function frame(now) {
      requestAnimationFrame(frame);
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      tellFrame(now);
      if (pointerAt) { const q = toRoom(pointerAt); world.pointer(q.x, q.y); }
      if (bubble) world.spawning = playing();
      // each bubble's worth at its size before it can eat anything
      for (const b of world.blobs) if (!worth.has(b)) worth.set(b, Shop.reward(b.radius));
      world.step(now);
      // a bubble that ate another takes on its worth, before the bubble
      // eats either; the bubble, having eaten, earns each one's worth,
      // strikes one of the piano's keys at random at once (js/piano.js) and
      // a moment later thanks whoever fed him (js/voice.js)
      for (const m of world.merges) if (m.blob !== bubble) worth.set(m.blob, worthOf(m.blob) + worthOf(m.eaten));
      const fed = bubble ? world.merges.filter((m) => m.blob === bubble) : [];
      if (fed.length) {
        for (const m of fed) shop.earn(worthOf(m.eaten) * shop.value(), now);
        Piano.strike(Math.floor(Math.random() * Piano.DEGREES));
        Voice.thank();
      }
      for (let i = 0; i < world.snaps.length; i++) if (world.snaps[i] < SNAP.QUICK) snapped.push(now);
      while (snapped.length && now - snapped[0] > SNAP.WITHIN) snapped.shift();
      if (snapped.length >= SNAP.TIMES) { snapped = []; Voice.slower(); }
      bps = shop.rate(now);
      for (const h of helpers) {
        if (h.hand.drag) h.cursor.press(); else h.cursor.release();
        h.cursor.update(dt);
      }
      Voice.update();
      Monk.update(now);
      stepDots(dt);
      Menu.step(demoMenu, demoItem && demoItem.demoAt && demoItem.demoAt.menu, dt, t);
      // the piano's menu and its dots, and what is under the menu pushed
      // down as far as it has opened
      stepSliders(pianoMenu, dt);
      Menu.step(pianoMenu, pianoItem && pianoItem.pianoAt && pianoItem.pianoAt.menu, dt, t);
      if (pianoItem && pianoItem.pianoAt) pushItem(pianoItem, pianoPush(pianoItem));
      // the demo's face to the voice as heard, while monk mouth is at least
      // partly open in a box out of its o
      if (Moon.ready && demoItem && shownBox(demoHome) && demoItem.p > 0) Moon.step(Monk.state, dt);
      // the ship on, while third dimension is at least partly open in a
      // box out of its o and its box is on the screen
      if (Ship.ready && shipItem && shownBox(shipHome) && shipItem.p > 0 && shipSeen()) Ship.step(dt);
      // the chess set on, the famous game played back on it, and what it
      // found touched said to its sound, its canvas the opening's size,
      // while chebble is at least partly open in a box out of its o and
      // its opening is on the screen, and the hold on a piece let go once
      // chebble is shut (chess, above)
      stepChess(dt);
      // the film stopped once cicada is shut, its dot on, and its
      // porthole's skin and its picture brought up to it while cicada is
      // at least partly open in a box out of its o, the picture while it
      // is on the screen (the film, above)
      stepFilm(dt, t);
      // daedalus on, after the pointer, and his strikes rung, while second
      // dimension is at least partly open in a box out of its o and his
      // box is on the screen
      if (Daedalus.ready && daedalusItem && shownBox(daedalusHome) && daedalusItem.p > 0 && daedalusSeen()) {
        pointDaedalus();
        Daedalus.step(dt);
        ringDaedalus();
      }
      // the piano's keys let go once it is not there to play, and on,
      // after the pointer, while upright is at least partly open in a box
      // out of its o and they are on the screen
      if (!pianoOn() && (pianoHolds.size || pianoPedal)) liftKeys();
      if (Keys.ready && pianoItem && shownBox(pianoHome) && pianoItem.p > 0 && pianoSeen()) {
        pointKeys();
        Keys.step(dt);
      }
      stepWall();
      stepSubtitle();
      stepMonkSubtitle();
      if (bubble) face.update(bubble, world, dt, Voice.mouth);
      for (const b of tagBubbles) {
        if (pointerAt) b.world.pointer(pointerAt.x, pointerAt.y);
        b.world.step(now);
      }
      cursor.update(dt);
      for (const s of sections) {
        stepBox(s, dt);
        stepItems(s, dt);
        grow(s);
      }
      // a box that holds sections grown by their boxes, once those have grown
      for (const s of sections) growSubs(s);
      settle();
      setScroll();
      for (const s of sections) if (s.skin) s.skin.step(dt, boxAt(s, s.box.p, t));
      // each item's skin after its bubble while its box is out of the o,
      // and the box that one is in
      for (const s of sections) if (shownBox(s)) for (const it of s.items) if (it.skin) it.skin.step(dt, itemAt(it, t));
      Menu.step(menu, shopNow(), dt, t);
      Menu.step(wallMenu, wallItem && wallItem.wallAt && wallItem.wallAt.menu, dt, t);
      stepChessMenu(dt, t);
      wallMix.step(dt);
      takeMixed();
      stepEraser(dt);
      stepZoom(dt);
      wallDot = Bar.dotTo(wallDot, (WALL.SIZES.indexOf(wallBrush) + 0.5) / WALL.SIZES.length, dt);
      stepSwipe(dt);
      stepHand(dt);
      Switch.step(dt);
      fb.clear();
      // the words and their boxes first, scrolled and pushed down by the
      // boxes above them, each box over its word, so the header's letters
      // cover them all
      const sy = scrolled();
      const overMute = !!Hover.at && muteAt(Hover.at.x, Hover.at.y), overSwitch = !!Hover.at && !overMute && switchAt(Hover.at.x, Hover.at.y);
      const hit = Hover.at && !overMute && !overSwitch && hitAt(Hover.at.x, Hover.at.y);
      for (const s of tops) {
        const v = onWord(hit, s) ? tint(s, 0) : undefined;
        for (const L of s.letters) L.draw(t, s.off - sy, fb, 0, v);
      }
      for (const s of tops) drawBox(s, t, sy - s.off, hit, fb);
      // the header's letters, the name's under the pointer in its colour
      const lit = nameRow && nameRow.keys[nameOn];
      for (const L of letters) L.draw(t, 0, fb, 0, lit && L === lit.L ? lit.v : undefined);
      for (const b of tagBubbles) drawTagBubble(b);
      // the pointer's hold's line, from the skin where it is drawn: the
      // bubble's as bubbleAt has it, a small bubble's in the room
      if (bubble && bubbleHome.room && world.drag) drawDrag(roomView(fb, t, sy - bubbleHome.off, world.drag.blob === bubble ? bubbleAt() : inRoom()), world.drag);
      for (const b of tagBubbles) drawDrag({ line: (x0, y0, x1, y1) => fb.line(x0, y0, x1, y1, b.v) }, b.world.drag);
      drawHand(t);
      Switch.draw(fb, t, overSwitch);
      Mute.draw(fb, t, overMute ? HOVER : 1);
      cursor.draw(fb);
      fb.present(ctx, Switch.dark);
      if (!drawn) {
        drawn = true;
        document.documentElement.classList.add('drawn');
      }
    }

    // the tally (js/tally.js) told that the page has opened and, whenever
    // it is hidden or left, how long was spent on it
    Tally.load(window);
    Tally.open();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Tally.away(); });
    window.addEventListener('pagehide', () => Tally.away());

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
