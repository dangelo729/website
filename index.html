      const rt = type(rate), ct = type(count), bt = type(U.BAR), tt = type(U.TITLE), cg = caretType.glyphs[0], cw = cg ? k * cg.g.w : 0, apart = U.APART * size;
      const right = room.x + room.w - inset, top = room.y + inset;
      const hw = Math.round(cw + wide(rt) + wide(ct) + 2 * wide(bt) + wide(tt) + 5 * apart + 2 * U.PAD_X * size);
      const shut = { x0: right - hw, y0: top, x1: right, y1: top + h };
      const x = shut.x0 + U.PAD_X * size, xr = x + cw + apart, xa = xr + wide(rt) + apart;
      const xc = xa + wide(bt) + apart, xb = xc + wide(ct) + apart, xt = xb + wide(bt) + apart;
      const header = {
        caret: cg ? makeLetter(cg.g, x + cw / 2, top + size * (U.PAD_Y + U.CAP) + k * cg.dy, 78999, k, WOBBLE) : null,
        rate: letters(rt, xr, top, 76000),
        rateBar: letters(bt, xa, top, 76500),
        count: letters(ct, xc, top, 79000),
        bar: letters(bt, xb, top, 77000),
        title: letters(tt, xt, top, 78000),
      };
      // the list under it, every button as wide as the widest, or as the
      // header less the margins if that is wider, and the open menu round it
      const margin = Math.round(U.MARGIN * size), row = Math.round(U.ROW * size), types = labels.map(type);
      const bw = Math.max(Math.round(Math.max(...types.map(wide)) + 2 * U.PAD_X * size), hw - 2 * margin);
      const buttons = [];
      let y = shut.y1;
      U.KEYS.forEach((key, i) => {
        const rect = { x0: right - margin - bw, y0: y, x1: right - margin, y1: y + h };
        buttons.push({ key, rect, ring: ringRound(rect, U.RADIUS * size, U.STEP), letters: letters(types[i], rect.x0 + U.PAD_X * size, y, 70000 + 1000 * i) });
        y += h + row;
      });
      const full = { x0: right - Math.max(hw, bw + 2 * margin), y0: top, x1: right, y1: y - row + margin };
      shopUI = { room, key, size, shut, full, header, buttons };
      return shopUI;
    }

    // menu m's shape at p, from shut (0) to open (1), as laid out in ui
    // (bubble bob's, or the demo's), and, given a time t, each edge
    // warbled WARBLE px either way on its own sine, as boxAt has the boxes
    function menuAt(m, ui, p, t) {
      const a = ui.shut, b = ui.full, c = { r: SHOP_UI.RADIUS * ui.size };
      for (const k of ['x0', 'y0', 'x1', 'y1']) c[k] = a[k] + (b[k] - a[k]) * p;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * m.warble[e].hz + m.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // menu m, laid out as ui (bubble bob's, or the demo's), dt on toward
    // open or back to its button on the boxes' spring made bouncier
    // (stepBox's closed form, stopping dead at shut, at rest open within a
    // px on the edge that moves furthest), its caret turning as an item's
    // does, and its skin after it; laid out again in a new room, a new skin
    // is settled where the menu now is. with no ui, nothing moves
    function stepMenu(m, ui, dt, t) {
      if (!ui) return;
      const a = ui.shut, b = ui.full;
      const px = 1 / Math.max(1, Math.abs(b.x0 - a.x0), Math.abs(b.y0 - a.y0), Math.abs(b.x1 - a.x1), Math.abs(b.y1 - a.y1));
      const target = m.open ? 1 : 0, w = 2 * Math.PI / BOX.RESPONSE, z = 1 - SHOP_UI.BOUNCE;
      const sg = z * w, wd = w * Math.sqrt(1 - z * z), x0 = m.p - target, v0 = m.v;
      const e = Math.exp(-sg * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt);
      m.p = target + e * (x0 * c + (v0 + sg * x0) / wd * sn);
      m.v = e * (v0 * c - (w * w * x0 + sg * v0) / wd * sn);
      if (m.p <= 0) { m.p = 0; m.v = Math.max(0, m.v); }
      if (m.open && Math.abs(m.p - 1) < px && Math.abs(m.v) / 60 < px) { m.p = 1; m.v = 0; }
      m.turn = ease(m.turn, m.open, dt, 4 * ui.size, BOX.FLIP);
      const shape = menuAt(m, ui, m.p, t);
      if (!m.skin || m.room !== ui.room) {
        m.skin = new Skin(shape, SHOP_UI.SPREAD);
        m.room = ui.room;
      } else m.skin.step(dt, shape);
    }

    // a rounded rect's outline as a ring of points about step px apart,
    // clockwise from the top right corner, its corners quarter circles of
    // radius round
    function ringRound(r, round, step) {
      const pts = [];
      const corner = (cx, cy, from) => {
        const n = Math.max(2, Math.ceil(round * Math.PI / 2 / step));
        for (let i = 0; i <= n; i++) {
          const a = from + i / n * Math.PI / 2;
          pts.push({ x: cx + round * Math.cos(a), y: cy + round * Math.sin(a) });
        }
      };
      const edge = (ax, ay, bx, by) => {
        const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
        for (let i = 1; i < n; i++) pts.push({ x: ax + (bx - ax) * i / n, y: ay + (by - ay) * i / n });
      };
      corner(r.x1 - round, r.y0 + round, -Math.PI / 2);
      edge(r.x1, r.y0 + round, r.x1, r.y1 - round);
      corner(r.x1 - round, r.y1 - round, 0);
      edge(r.x1 - round, r.y1, r.x0 + round, r.y1);
      corner(r.x0 + round, r.y1 - round, Math.PI / 2);
      edge(r.x0, r.y1 - round, r.x0, r.y0 + round);
      corner(r.x0 + round, r.y0 + round, Math.PI);
      edge(r.x0 + round, r.y0, r.x1 - round, r.y0);
      return pts;
    }

    // the menu sy up into into, hover what the pointer is on: its header and,
    // while it is open at all, its buttons, each ring outlined LINE px from
    // point to point, drawn into qfb over the skin's box; then qfb copied
    // into into through the skin and the skin outlined over it, as drawBox
    // does a box
    function drawShop(t, sy, hover, into) {
      const ui = shopNow();
      if (!ui || !menu.skin) return;
      const v = hover && hover.menu ? HOVER_LINK : 1, box = menu.skin.bounds();
      qfb.clearRows(Math.floor(box.y0 - sy) - BOX.LINE, Math.ceil(box.y1 - sy) + BOX.LINE + 1);
      for (const L of ui.header.rate) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.rateBar) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.count) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.bar) L.draw(t, -sy, qfb, 0, v);
      if (ui.header.caret) ui.header.caret.draw(t, -sy, qfb, menu.turn * Math.PI / 2, v);
      for (const L of ui.header.title) L.draw(t, -sy, qfb, 0, v);
      if (menu.p > 0) for (const b of ui.buttons) {
        const bv = hover && hover.buy === b.key ? HOVER : 1, n = b.ring.length;
        for (let i = 0; i < n; i++) {
          const p = b.ring[i], q = b.ring[i + 1 < n ? i + 1 : 0];
          qfb.line(p.x, p.y - sy, q.x, q.y - sy, bv, BOX.LINE);
        }
        for (const L of b.letters) L.draw(t, -sy, qfb, 0, bv);
      }
      const pts = menu.skin.screen(-sy), n = pts.length;
      into.fillPolygon(pts, qfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        into.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // a level of key bought, if there are bubbles enough, and what it buys
    function buy(key) {
      if (!world || !shop.buy(key)) return;
      if (key === 'drag') world.dragForce = SOFT.DRAG.FORCE * shop.drag();
      if (key === 'spawn') world.spawnMs = SOFT.SPAWN.EVERY_MS / shop.spawn();
      if (key === 'max') world.maxBlobs = SOFT.SPAWN.MAX_BLOBS + shop.more();
      if (key === 'voice') Voice.randomize();
      if (key !== 'hands') return;
      const room = bubbleHome.room, r = shopNow().buttons.find((b) => b.key === 'hands').rect;
      const hand = new Hand((r.x0 + r.x1) / 2 - room.x, (r.y0 + r.y1) / 2 - room.y, world.hands.length);
      world.hands.push(hand);
      helpers.push({ hand, cursor: new Cursor() });
    }

    // the hands sy up into into, each where its world has it in the room,
    // as the small bubbles are drawn (inRoom)
    function drawHands(sy, into) {
      if (!helpers.length) return;
      const room = bubbleHome.room;
      for (const { hand, cursor } of helpers) {
        cursor.moveTo(room.x + hand.x, room.y + hand.y - sy);
        cursor.draw(into);
      }
    }

    // a point in world px on the screen as its world's px, wherever the page
    // has scrolled to, the boxes have pushed the bubble's and its box has it
    // drawn (bubbleAt), so a press lands on the bubble where it is drawn,
    // or, while a small bubble is held, where the room is (inRoom), so it
    // follows the pointer where it is drawn; as it is with no room
    function toRoom(p) {
      const r = bubbleHome && bubbleHome.room;
      if (!r) return p;
      const b = world.drag && world.drag.blob !== bubble ? inRoom() : bubbleAt(), y = p.y + scrolled() - bubbleHome.off;
      return { x: bubble.lockX + (p.x - b.x) / b.k, y: bubble.lockY + (y - b.y) / b.k };
    }

    // --- the tag's bubbles -------------------------------------------------------
    // a small bubble in each of the tag's lines, in the line's colour: a
    // ring of verlet points (js/softbody.js) as Doodles' bubble is,
    // with no face, locked where the tag puts it and holding still there,
    // with no wobble. each is in a world of its own the size of the
    // viewport, so its px are the page's: the tag does not scroll. it is
    // made at each layout and settled in place at once, at a radius that
    // puffs out to the one the tag gives it (PUFFED, the ring's radius at
    // rest over the radius it is made with). it is filled with its colour
    // right out to the skin; a press within
    // REACH of it takes hold of it as of the other, and it wobbles home
    // when let go.
    const SETTLE = 60; // steps that leave a ring still where it is made
    const PUFFED = (() => {
      const w = new World(100, 100), b = new SoftBlob(50, 50, BUBBLE_POINTS, 10, BUBBLE_PUFF, true);
      w.blobs.push(b);
      for (let i = 0; i < SETTLE; i++) w.tick();
      const c = b.getCenter();
      return b.points.reduce((r, p) => r + Math.hypot(p.x - c.x, p.y - c.y), 0) / b.points.length / 10;
    })();
    let tagBubbles = []; // each { world, blob, x, y, r, v }, made by layoutTag

    // a bubble r px round at (x, y) on the page in colour v, settled there
    function makeTagBubble(x, y, r, v) {
      const world = new World(W, H), blob = new SoftBlob(x, y, BUBBLE_POINTS, r / PUFFED, BUBBLE_PUFF, true);
      world.blobs.push(blob);
      for (let i = 0; i < SETTLE; i++) world.tick();
      return { world, blob, x, y, r, v };
    }

    // a tag bubble: filled with its colour out to its skin's outer edge,
    // the ring's points pushed out along its normal by half BUBBLE_LINE,
    // so it is as big as an outline BUBBLE_LINE px thick round the ring
    // would be and as round as the ring is
    function drawTagBubble(b) {
      const pts = b.blob.points, n = pts.length;
      const edge = (d) => pts.map((q, i) => {
        // the secant across it turned a quarter: outward, on a ring that
        // runs clockwise on screen
        const a = pts[(i + n - 1) % n], c = pts[(i + 1) % n];
        const nx = c.y - a.y, ny = a.x - c.x, m = Math.hypot(nx, ny) || 1;
        return { x: q.x + d * nx / m, y: q.y + d * ny / m };
      });
      fb.fillPolygon(edge(BUBBLE_LINE / 2), b.v);
    }

    // the tag bubble a press at world (x, y) on the screen takes hold of:
    // the nearest, if the press is within REACH of its skin, or null
    function tagBubbleAt(x, y) {
      let best = null, most = Infinity;
      for (const b of tagBubbles) {
        const d = Math.hypot(x - b.x, y - b.y) - b.r;
        if (d <= TAG.REACH && d < most) { best = b; most = d; }
      }
      return best;
    }

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm
    // on the pointer. while the button is held it closes through the frames
    // to a fist, and it opens again when the button lifts. a touch gets no
    // hand: there is nothing to see under a finger. it goes down last, over
    // everything, on a dark backing, so it reads over the letters and the
    // bubble.
    const cursor = new Cursor();

    // --- the drag ----------------------------------------------------------------
    // a press near the skin, while bubble bob's box is open and the press presses
    // nothing else, takes hold of its nearest point and two either
    // side and pulls them toward the pointer, and so does a press near one
    // of the tag's bubbles that presses nothing else, until the press lifts or the
    // pull goes too far and the skin lets go; the click it ends in presses
    // nothing. the pointer is captured, so a
    // drag carries on outside the window; only a pointer that leaves with
    // nothing held is forgotten, and the eyes stop following it. where it
    // is goes to each world each frame, so a scroll or a box pushing the
    // bubble's moves it in the world as a move would
    function worldPointer(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / SCALE, y: (e.clientY - rect.top) / SCALE };
    }
    let pointerAt = null, grabbed = false; // the pointer, world px on the screen, or null; whether the last press took hold
    // the pointer's string in the bubble's world snapping TIMES times
    // inside WITHIN ms, each before it had held QUICK ms, is a drag too
    // fast: the bubble says to drag slower (js/voice.js) and the count
    // starts again. a string that held QUICK ms or more first is let go
    // of by a slip, not by someone yet to find how it pulls, and does not count
    const SNAP = { TIMES: 3, WITHIN: 10000, QUICK: 1000 };
    let snapped = []; // when each snap still inside WITHIN came, the frame's ms, oldest first
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      cursor.press();
      pointerAt = p;
      const q = toRoom(p);
      const free = !hitAt(p.x, p.y) && !muteAt(p.x, p.y); // the press presses nothing else
      grabbed = !!(playing() && free) && world.grab(q.x, q.y);
      if (grabbed && world.drag.blob === bubble) Voice.complain(); // the bubble, taken hold of, complains out loud (js/voice.js)
      const b = !grabbed && free && tagBubbleAt(p.x, p.y);
      if (b) grabbed = b.world.grab(p.x, p.y);
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      pointerAt = p;
    });
    // a lifted press opens the hand again. it goes when there is nothing
    // left to hover: a finger lifted, or a captured drag let go outside the
    // viewport
    function liftCursor(e) {
      cursor.release();
      const p = worldPointer(e);
      if (e.pointerType === 'touch' || p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) cursor.hide();
    }
    // every world a press can take hold in
    function worlds() {
      return [world, ...tagBubbles.map((b) => b.world)];
    }
    canvas.addEventListener('pointerup', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    canvas.addEventListener('pointercancel', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    // a captured drag carried outside the window keeps its hand: moves still come
    canvas.addEventListener('pointerleave', () => {
      if (worlds().some((w) => w.drag)) return;
      pointerAt = null;
      for (const w of worlds()) w.pointerOff();
      cursor.hide();
    });

    // --- the swipe ---------------------------------------------------------------
    // the browser scrolls on its own and tells the page where it got to late
    // and unevenly, so a finger scrolls the page itself. a press (not a
    // mouse) that goes SWIPE.SLOP css px, more up or down than across, is a
    // swipe: everything else the press was doing is called off as the
    // browser's own scroll calls it off (a pointercancel and a
    // pointerleave), and from there the page moves 1:1 with the finger, no
    // further than either end. let go moving, it glides on the way it was
    // going, as far as the finger's speed over its last FLICK ms carries
    // it, by the house approach, GLIDE of the way left each 60 hz frame (a
    // flick slowing as ios's scroll does, 0.998 of its speed a ms). a press
    // that goes across first is the page's to the end. a press while it
    // glides stops it and is the swipe's alone, its events and its click
    // going no further: up or down, it swipes on from where it stopped it
    const SWIPE = {
      SLOP: 10,                              // css px a press goes before it is a swipe or not
      FLICK: 100,                            // ms of the finger's last moves its speed is taken over
      STILL: 60,                             // ms a finger held still before lifting that leaves no glide
      GLIDE: 1 - Math.pow(0.998, 1000 / 60), // of the way left to glide, each 60 hz frame
    };
    let swipeY = 0, swipeTo = 0; // css px the page is scrolled, and where it glides to
    let swipe = null;            // the press being watched, { id, x, y, on, done, stop, y0, from, samples }, or null
    let eatClick = false;        // the click the press ends in presses nothing
    let calling = false;         // the swipe is calling a press off, so its own listeners let that through

    // how far the page is scrolled, in whole world px
    function scrolled() {
      return Math.round(swipeY / SCALE);
    }

    // y css px of the page's scroll, no further than either end
    function clampSwipe(y) {
      return Math.min(Math.max(y, 0), scrollEnd);
    }

    // the finger's scroll kept in the page, and gliding on toward where it
    // was flicked while no finger holds it
    function stepSwipe(dt) {
      swipeY = clampSwipe(swipeY);
      swipeTo = clampSwipe(swipeTo);
      if ((swipe && swipe.on) || swipeTo === swipeY) return;
      swipeY += (swipeTo - swipeY) * (1 - Math.pow(1 - SWIPE.GLIDE, 60 * dt));
      if (Math.abs(swipeTo - swipeY) < 0.5) swipeY = swipeTo;
    }

    // on the window, capturing, so a press is heard before the canvas's
    // own listeners and can be kept from them
    window.addEventListener('pointerdown', (e) => {
      if (calling) return;
      eatClick = false;
      if (e.pointerType === 'mouse' || !e.isPrimary) return;
      const stop = Math.abs(swipeTo - swipeY) > SWIPE.SLOP;
      swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false, done: false, stop, y0: 0, from: 0, samples: [] };
      swipeTo = swipeY;
      // a press while it glides stops it, and nothing else hears it
      if (stop) {
        e.stopPropagation();
        eatClick = true;
      }
    }, true);
    window.addEventListener('pointermove', (e) => {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.on) {
        e.stopPropagation();
        swipeY = swipeTo = clampSwipe(swipe.from - (e.clientY - swipe.y0));
        swipe.samples.push({ t: e.timeStamp, y: swipeY });
        while (swipe.samples.length > 2 && e.timeStamp - swipe.samples[0].t > SWIPE.FLICK) swipe.samples.shift();
        return;
      }
      if (swipe.stop) e.stopPropagation();
      if (swipe.done) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      if (Math.hypot(dx, dy) <= SWIPE.SLOP) return;
      swipe.done = true;
      // across first: the press is the page's to the end
      if (Math.abs(dy) <= Math.abs(dx)) return;
      // up or down: the press called off as the browser's scroll calls it
      // off, unless it stopped a glide and the canvas never heard it
      if (!swipe.stop) {
        const like = { pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary, clientX: e.clientX, clientY: e.clientY };
        calling = true;
        canvas.dispatchEvent(new PointerEvent('pointercancel', like));
        canvas.dispatchEvent(new PointerEvent('pointerleave', like));
        calling = false;
      }
      // anchored where it takes over, so the page does not jump by the slop
      swipe.on = true;
      swipe.y0 = e.clientY;
      swipe.from = swipeY;
      swipe.samples = [{ t: e.timeStamp, y: swipeY }];
      eatClick = true;
      e.stopPropagation();
    }, true);
    // a swipe let go: the finger's speed v, css px a second, over its last
    // FLICK ms, none if it was held still STILL ms first, and the glide's
    // end v / k on, k the house approach's rate a second, so the glide
    // starts at the finger's speed
    function swipeLift(e) {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.stop || swipe.on) e.stopPropagation();
      if (swipe.on && e.type === 'pointerup') {
        const s = swipe.samples.filter((p) => e.timeStamp - p.t <= SWIPE.FLICK);
        const a = s[0], b = s[s.length - 1];
        const v = s.length < 2 || e.timeStamp - b.t > SWIPE.STILL || b.t === a.t ? 0 : (b.y - a.y) / (b.t - a.t) * 1000;
        const k = -60 * Math.log(1 - SWIPE.GLIDE);
        swipeTo = clampSwipe(swipeY + v / k);
      }
      swipe = null;
    }
    window.addEventListener('pointerup', swipeLift, true);
    window.addEventListener('pointercancel', swipeLift, true);
    window.addEventListener('click', (e) => {
      if (!eatClick) return;
      eatClick = false;
      e.stopPropagation();
    }, true);

    // --- the wheel ---------------------------------------------------------------
    // the wheel scrolls the page itself as a finger does, and the document
    // stays where it is: safari puts the system's pointer back over the
    // hand whenever its document comes to its top or leaves it. the page's
    // one wheel listener, which stops nothing, moves the page 1:1 by each
    // event's way down, no further than either end, stopping a glide. its
    // events under RUN ms apart are one run, and a run that starts over the
    // bottle turns the bottle instead (the ship, above), to its last event.
    // a wheel held with ctrl is the browser's zoom and moves nothing
    const WHEEL = {
      LINE: 16, // css px a line, for a wheel that counts in lines
      RUN: 200, // ms: the wheel's events under this apart are one run
    };
    let wheelAt = -Infinity; // when the wheel was last heard, ms on the page's clock
    let wheelShip = false;   // the run it is in is the bottle's
    canvas.addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      const now = performance.now();
      if (now - wheelAt >= WHEEL.RUN) {
        const p = worldPointer(e), h = !muteAt(p.x, p.y) && hitAt(p.x, p.y);
        wheelShip = !!(h && h.ship);
      }
      wheelAt = now;
      const px = e.deltaMode === 1 ? WHEEL.LINE : e.deltaMode === 2 ? window.innerHeight : 1;
      if (wheelShip) Ship.turn((Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * px * SHIP.WHEEL);
      else swipeY = swipeTo = clampSwipe(swipeY + e.deltaY * px);
    }, { passive: true });

    // cicada's drag line: dashed, from the grabbed point to the pointer,
    // its dashes shrinking and gaps opening over the last 30 % of the reach
    // before the skin lets go, in world w through view as its bubble is
    // drawn. cicada also put a plus on every held point; those are left
    // off, the skin is not to be marked
    function drawDrag(view, d) {
      if (!d) return;
      const c = d.points[0].point;
      const dx = c.x - d.x, dy = c.y - d.y;
      const reach = Math.min(Math.sqrt(dx * dx + dy * dy) / SOFT.DRAG.BREAKAWAY, 1);
      const dashing = Math.pow(Math.max(0, (reach - 0.7) / 0.3), 2);
      const dashLength = Math.max(2, 12 * (1 - dashing)), gapLength = 1 + 25 * dashing;
      // walked from the rounded ends, as cicada did
      const x0 = Math.round(c.x), y0 = Math.round(c.y), x1 = Math.round(d.x), y1 = Math.round(d.y);
      const len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (len === 0) return;
      const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      for (let at = 0, drawing = true; at < len; drawing = !drawing) {
        const end = Math.min(at + (drawing ? dashLength : gapLength), len);
        if (drawing) view.line(x0 + ux * at, y0 + uy * at, x0 + ux * end, y0 + uy * end);
        at = end;
      }
    }

    // --- daedalus ----------------------------------------------------------------
    // the program's 128x64 panel, one world pixel per panel pixel, in the
    // middle of the viewport, copied bit for bit into the framebuffer, dark
    // bits too, so it reads as a screen over whatever is under it. it runs
    // 80 frames a second on its own clock; each browser frame runs as many
    // as wall time has moved on.
    // the bubble has taken its place in the middle; SHOW_DAEDALUS brings it back.
    const SHOW_DAEDALUS = false; // false: no module, no panel, no keyboard
    const FRAME_MS = 12.5;
    let panel = null; // set once the module is up

    if (SHOW_DAEDALUS) createDaedalus().then((m) => {
      m._daed_init(0x64616564);
      const PW = m._daed_width(), PH = m._daed_height();
      const stride = (PW + 7) >> 3;
      let acc = 0, last = performance.now();

      panel = {
        step(now) {
          acc += now - last;
          last = now;
          if (acc > 100) acc = 100; // after a stall, catch up a little, not forever
          while (acc >= FRAME_MS) { m._daed_frame(); acc -= FRAME_MS; }
        },
        draw() {
          // HEAPU8 re-read each frame: the heap view changes if memory grows
          fb.blitPacked(m.HEAPU8, m._daed_buffer(), PW, PH, stride, panelX, panelY);
        },
      };

      // the computer keyboard as a midi keyboard, the sim window's layout:
      // A W S E D F T G Y H U J K O L P ; are C4..E5, Z/X the octave, C/V the
      // velocity by 20, space the sustain pedal (a hand on every bell).
      const KEYS = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
                     KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14,
                     KeyP: 15, Semicolon: 16 };
      let base = 60, vel = 100, pedal = false;
      const held = {};
      const send = (s, a, b) => m._daed_midi(s, a, b);
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code in KEYS) {
          if (held[e.code] !== undefined) return;
          held[e.code] = base + KEYS[e.code];
          send(0x90, held[e.code], vel);
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (!pedal) { pedal = true; send(0xB0, 64, 127); }
        } else if (e.code === 'KeyZ') { if (base - 12 >= 0) base -= 12; }
        else if (e.code === 'KeyX') { if (base + 12 <= 108) base += 12; }
        else if (e.code === 'KeyC') { vel = Math.max(1, vel - 20); }
        else if (e.code === 'KeyV') { vel = Math.min(127, vel + 20); }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code in KEYS) {
          if (held[e.code] === undefined) return;
          send(0x80, held[e.code], 0);
          delete held[e.code];
        } else if (e.code === 'Space') {
          if (pedal) { pedal = false; send(0xB0, 64, 0); }
        }
      });
      window.addEventListener('blur', () => {
        for (const k in held) { send(0x80, held[k], 0); delete held[k]; }
        if (pedal) { pedal = false; send(0xB0, 64, 0); }
      });
    });

    // --- the frame ---------------------------------------------------------------
    // the world is drawn fresh every browser frame, all of it into the
    // framebuffer. first the bubble's world, its face, the demo's voice,
    // its face, its dots and its menu, the ship, daedalus, the tag's bubbles and the
    // cursor's hand and the boxes catch up with the clock, the words
    // under them are pushed down, the page's end is worked out, and each box's skin is stepped after
    // where its box has got to, warbled, and the upgrades' menu with its
    // skin; then the bits are cleared, the words and
    // their boxes drawn scrolled, a shut box in its word's o's place with
    // its insides showing through it, the bubble in its box, every other
    // letter over them on its own
    // clock, the tag's bubbles, daedalus's panel if it is shown, the
    // drag's marks, the scroll hand and the mute button, and last the hand on its backing, over
    // the end of the drag's line, each layer simply writing over the bits of the last. then
    // the whole of it goes to the canvas in one copy.
    let lastNow = null; // the last frame's time, for the face's dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      if (pointerAt) { const q = toRoom(pointerAt); world.pointer(q.x, q.y); }
      if (bubble) world.spawning = playing();
      // each bubble's worth at its size before it can eat anything
      for (const b of world.blobs) if (!worth.has(b)) worth.set(b, Shop.reward(b.radius));
      world.step(now);
      // a bubble that ate another takes on its worth, before the bubble
      // eats either; the bubble, having eaten, earns each one's worth,
      // strikes one of the piano's keys at random at once (js/piano.js) and
      // a moment later thanks whoever fed him (js/voice.js)
      for (const m of world.merges) if (m.blob !== bubble) worth.set(m.blob, worthOf(m.blob) + worthOf(m.eaten));
      const fed = bubble ? world.merges.filter((m) => m.blob === bubble) : [];
      if (fed.length) {
        for (const m of fed) shop.earn(worthOf(m.eaten) * shop.value(), now);
        Piano.strike(Math.floor(Math.random() * Piano.DEGREES));
        Voice.thank();
      }
      for (let i = 0; i < world.snaps.length; i++) if (world.snaps[i] < SNAP.QUICK) snapped.push(now);
      while (snapped.length && now - snapped[0] > SNAP.WITHIN) snapped.shift();
      if (snapped.length >= SNAP.TIMES) { snapped = []; Voice.slower(); }
      bps = shop.rate(now);
      for (const h of helpers) {
        if (h.hand.drag) h.cursor.press(); else h.cursor.release();
        h.cursor.update(dt);
      }
      Voice.update();
      Monk.update(now);
      stepDots(dt);
      stepMenu(demoMenu, demoItem && demoItem.demoAt && demoItem.demoAt.menu, dt, t);
      // the demo's face to the voice as heard, while monk mouth is at least
      // partly open in a box out of its o
      if (Moon.ready && demoItem && demoHome.box.shown && demoItem.p > 0) Moon.step(Monk.state, dt);
      // the ship on, while third dimension is at least partly open in a
      // box out of its o and its box is on the screen
      if (Ship.ready && shipItem && shipHome.box.shown && shipItem.p > 0 && shipSeen()) Ship.step(dt);
      // daedalus on, after the pointer, and his strikes rung, while second
      // dimension is at least partly open in a box out of its o and his
      // box is on the screen
      if (Daedalus.ready && daedalusItem && daedalusHome.box.shown && daedalusItem.p > 0 && daedalusSeen()) {
        pointDaedalus();
        Daedalus.step(dt);
        ringDaedalus();
      }
      stepSubtitle();
      if (bubble) face.update(bubble, world, dt, Voice.mouth);
      for (const b of tagBubbles) {
        if (pointerAt) b.world.pointer(pointerAt.x, pointerAt.y);
        b.world.step(now);
      }
      cursor.update(dt);
      for (const s of sections) {
        stepBox(s, dt);
        stepItems(s, dt);
        grow(s);
      }
      settle();
      setScroll();
      for (const s of sections) if (s.skin) s.skin.step(dt, boxAt(s, s.box.p, t));
      // each item's skin after its bubble while its box is out of the o
      for (const s of sections) if (s.box.shown) for (const it of s.items) if (it.skin) it.skin.step(dt, itemAt(it, t));
      stepMenu(menu, shopNow(), dt, t);
      // if (bubble) beard.step(dt, face.mouf, face.scale);
      if (panel) panel.step(now);
      stepSwipe(dt);
      stepHand(dt);
      fb.clear();
      // the words and their boxes first, scrolled and pushed down by the
      // boxes above them, each box over its word, so the header's letters
      // cover them all
      const sy = scrolled();
      const overMute = !!hoverAt && muteAt(hoverAt.x, hoverAt.y);
      const hit = hoverAt && !overMute && hitAt(hoverAt.x, hoverAt.y);
      for (const s of sections) {
        const v = hit && hit.s === s && !hit.it && !hit.close && !hit.shop && !hit.slide ? HOVER : undefined;
        for (const L of s.letters) L.draw(t, s.off - sy, fb, 0, v);
      }
      for (const s of sections) drawBox(s, t, sy - s.off, hit && hit.s === s ? hit : null);
      // the header's letters, the name's under the pointer in its colour
      const lit = nameRow && nameRow.keys[nameOn];
      for (const L of letters) L.draw(t, 0, fb, 0, lit && L === lit.L ? lit.v : undefined);
      for (const b of tagBubbles) drawTagBubble(b);
      if (SHOW_DAEDALUS && panel) panel.draw();
      // the pointer's hold's line, from the skin where it is drawn: the
      // bubble's as bubbleAt has it, a small bubble's in the room
      if (bubble && bubbleHome.room && world.drag) drawDrag(roomView(fb, t, sy - bubbleHome.off, world.drag.blob === bubble ? bubbleAt() : inRoom()), world.drag);
      for (const b of tagBubbles) drawDrag({ line: (x0, y0, x1, y1) => fb.line(x0, y0, x1, y1, b.v) }, b.world.drag);
      drawHand(t);
      drawMute(t, overMute);
      cursor.draw(fb);
      fb.present(ctx);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
