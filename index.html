    // and back to teal, in STEPS shades from each to the next, and from the
    // skin's ink up to the colour in LEVELS shades by how strongly the
    // pulse lights it, times INTENSITY: at 1.75 anything it lights at about
    // half or more is the colour itself, and the rest of its trail and its
    // last moments fade back into the ink. every shade is a colour of the
    // framebuffer's palette, made once here: up from the page's ink, black,
    // and on the dark page up from its ink there, the paper's colour
    const PULSE = { STEPS: 6, LEVELS: 5, INTENSITY: 1.75 };
    const pulseInks = (() => {
      const rgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
      const hex = (c) => '#' + c.map((x) => Math.round(x).toString(16).padStart(2, '0')).join('');
      const inks = [Framebuffer.INK, Framebuffer.PAPER].map((word) => [0, 8, 16].map((k) => word >> k & 0xFF)); // the palette's words run r, g, b up from the low byte
      const cols = TAG.LINES.map((l) => rgb(l.colour)), n = cols.length * PULSE.STEPS;
      return Array.from({ length: PULSE.LEVELS }, (_, l) => Array.from({ length: n }, (_, k) => {
        const a = cols[Math.floor(k / PULSE.STEPS)], b = cols[(Math.floor(k / PULSE.STEPS) + 1) % cols.length];
        const f = (k % PULSE.STEPS) / PULSE.STEPS, lit = (l + 1) / PULSE.LEVELS;
        const shade = (ink) => hex(ink.map((x, j) => x + (a[j] + (b[j] - a[j]) * f - x) * lit));
        return Framebuffer.colour(shade(inks[0]), shade(inks[1]));
      }));
    })();

    // the ink a stretch of skin is drawn in, from the pulses at its two
    // ends (SoftBlob.pulseAt), as cicada coloured its lines: the mean of the
    // two where both are lit, the short way round the cycle, the one where
    // one is, and the skin's own ink where neither is or the shade comes to
    // none
    function pulseInk(a, b) {
      if (!a && !b) return 1;
      let strength, along;
      if (a && b) {
        let d = b.along - a.along;
        if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
        strength = (a.strength + b.strength) / 2;
        along = (a.along + d / 2 + 1) % 1;
      } else ({ strength, along } = a || b);
      const level = Math.min(Math.round(strength * PULSE.INTENSITY * PULSE.LEVELS), PULSE.LEVELS);
      if (level <= 0) return 1;
      const row = pulseInks[level - 1];
      return row[Math.round(along * row.length) % row.length];
    }

    // a blob's skin through view: filled with paper and outlined
    // BUBBLE_LINE px thick, in ink, or where a pulse runs round it, in the
    // pulse's colours
    function drawSkin(view, blob) {
      const pts = blob.points, n = pts.length;
      view.fillPolygon(pts, 0);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        view.line(p.x, p.y, q.x, q.y, pulseInk(blob.pulseAt(i), blob.pulseAt((i + 1) % n)), BUBBLE_LINE);
      }
    }

    // --- the subtitles -----------------------------------------------------------
    // what the bubble says (js/voice.js), in the box text's face at its
    // size, as words beside him: one syllable more each time he begins one,
    // the whole line once he is done, and gone LINGER seconds after, or as
    // soon as he says another or his box shuts. a line goes somewhere round
    // him at random (js/subtitle.js), GAP of its size clear of his skin as
    // it is when he starts, inside his room EDGE of its size in from the
    // box and off bubble bob's caret and name, and stays there; with nowhere it fits, it
    // does not show. its letters warble more than the box text's, each its
    // own way: WOBBLE's sway, bob, breathe and tilt, depth and rate, each
    // times its own 1 ± SPREAD at random. what monk mouth's face sings
    // (js/monk.js) has subtitles of its own, the same way but a syllable at
    // a time: each syllable he begins, as it is heard, goes somewhere round
    // his face at random, MONK_GAP clear of its features as they are then,
    // inside his item's bubble EDGE in from its outline, over its text if
    // that is where it lands, and off its caret and name, the demo's
    // settings menu and its ribbon. it is gone as soon as he begins the
    // next, LINGER seconds after he is done, or as his item or its box shuts
    const SUBS = {
      GAP: 0.6,       // of its size, from his skin to the line's ink
      MONK_GAP: 0.15, // of its size, from monk mouth's face to a syllable's ink
      EDGE: 0.6,    // of its size, from the room's edge to the line's ink, and round bubble bob's caret and name
      LINGER: 0.75, // seconds it stays once he is done
      SPREAD: 0.5,
      WOBBLE: { SWAY_PX: 0.5, SWAY_HZ: 1.2, BOB_PX: 0.5, BOB_HZ: 0.7, BREATHE: 0.03, BREATHE_HZ: 0.9, TILT_RAD: 0.03, TILT_HZ: 0.5 },
    };
    const subTypes = new Map(); // a line's or a syllable's text as shown, to its Type, made the first time it is said
    let subSaid = 0; // the voice's lines said, as of the last frame
    let sub = null;  // the line shown, { room, ends, letters: [{ L, at }] }, or null
    let monkSaid = 0;   // monk mouth's syllables begun, as of the last frame
    let monkSub = null; // his syllable shown, { at, ends, letters: [{ L, at }] }, at the demo as laid out, or null

    // a line of type at size, its syllables ending at ends, placed round a
    // circle of radius r about (cx, cy), inside area and off every box of
    // keep (js/subtitle.js), each of its letters warbling its own way:
    // { ends, letters: [{ L, at }] }, or null with nowhere it fits
    function placeLine(type, ends, size, cx, cy, r, area, keep) {
      const k = size / TYPE.EM;
      const at = Subtitle.place(k * (type.left + type.right), k * (type.ascent + type.descent), cx, cy, r, area, keep);
      if (!at) return null;
      const ox = at.x + k * type.left, base = at.y + k * type.ascent; // the line's origin, on its baseline
      const vary = () => 1 + SUBS.SPREAD * (2 * Math.random() - 1);
      const letters = type.glyphs.map((gl) => {
        const wob = {};
        for (const key in SUBS.WOBBLE) wob[key] = SUBS.WOBBLE[key] * vary();
        return { at: gl.at, L: Letter.make(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, Math.floor(Math.random() * 1e6), k, wob) };
      });
      return { ends, letters };
    }

    // a line's subtitle, placed round him in his room as laid out, or null
    function makeSubtitle(line) {
      const { whole, ends } = Subtitle.split(line.text || '');
      if (!ends.length) return null;
      let type = subTypes.get(whole);
      if (!type) subTypes.set(whole, type = new Type(whole, () => document.createElement('canvas'), TAG.FACE));
      if (!type.glyphs.length) return null;
      const room = bubbleHome.room, size = room.size, edge = SUBS.EDGE * size;
      let reach = 0; // his skin's furthest from his lock
      for (const p of bubble.points) reach = Math.max(reach, Math.hypot(p.x - bubble.lockX, p.y - bubble.lockY));
      const h = bubbleItem.hit, keep = [{ x0: h.x0 - edge, y0: h.y0 - edge, x1: h.x1 + edge, y1: h.y1 + edge }];
      const ui = shopNow();
      if (ui) {
        const r = menu.p > 0 || menu.open ? ui.full : ui.shut;
        keep.push({ x0: r.x0 - edge, y0: r.y0 - edge, x1: r.x1 + edge, y1: r.y1 + edge });
      }
      const area = { x0: room.x + edge, y0: room.y + edge, x1: room.x + room.w - edge, y1: room.y + room.h - edge };
      const s = placeLine(type, ends, size, room.x + bubble.lockX, room.y + bubble.lockY, reach + BUBBLE_LINE + SUBS.GAP * size, area, keep);
      if (s) s.room = room;
      return s;
    }

    // each frame: a new line's subtitle made as he starts it, and the one
    // shown dropped once it has lingered, or the engine would not take it,
    // or his box shuts or is laid out again
    function stepSubtitle() {
      if (Voice.said !== subSaid) {
        subSaid = Voice.said;
        sub = bubble && bubbleHome.room && playing() && Voice.line ? makeSubtitle(Voice.line) : null;
      }
      if (sub && (!Voice.line || !playing() || bubbleHome.room !== sub.room ||
          (Voice.endedAt !== null && Date.now() - Voice.endedAt > SUBS.LINGER * 1000))) sub = null;
    }

    // the subtitle sy up into into: as many syllables as he has begun, every
    // one once he is done
    function drawSubtitle(t, sy, into) {
      drawLine(sub, Voice.endedAt !== null ? sub.ends.length : Math.min(Voice.heard, sub.ends.length), t, -sy, into);
    }

    // a placed line's first n syllables, dy world px down from where it was
    // placed, into into
    function drawLine(line, n, t, dy, into) {
      if (!n) return;
      const end = line.ends[n - 1];
      for (const s of line.letters) if (s.at < end) s.L.draw(t, dy, into);
    }

    // how far monk mouth's face reaches from the head's centre now, world
    // px, its wobble aside: the furthest any of its features' paper goes,
    // at its place and its size as drawDemo draws it
    function faceReach() {
      let reach = 0;
      for (const f of Moon.features) {
        const g = f.paper, s = DEMO.FACE * f.scale;
        let x0 = g.w, y0 = g.h, x1 = 0, y1 = 0; // its paper's ink box, bitmap px
        for (let y = 0; y < g.h; y++) {
          for (let x = 0; x < g.w; x++) {
            if (!g.ink[y * g.w + x]) continue;
            if (x < x0) x0 = x;
            if (x + 1 > x1) x1 = x + 1;
            if (y < y0) y0 = y;
            if (y + 1 > y1) y1 = y + 1;
          }
        }
        if (x1 <= x0) continue;
        const cx = DEMO.FACE * f.x, cy = DEMO.FACE * f.y;
        const ax = Math.max(Math.abs(cx + s * (x0 - g.w / 2)), Math.abs(cx + s * (x1 - g.w / 2)));
        const ay = Math.max(Math.abs(cy + s * (y0 - g.h / 2)), Math.abs(cy + s * (y1 - g.h / 2)));
        reach = Math.max(reach, Math.hypot(ax, ay));
      }
      return reach;
    }

    // a syllable's subtitle, its text as shown, placed round his face in his
    // item's bubble as laid out, or null
    function makeMonkSubtitle(text) {
      const { whole, ends } = Subtitle.split(text);
      if (!ends.length) return null;
      let type = subTypes.get(whole);
      if (!type) subTypes.set(whole, type = new Type(whole, () => document.createElement('canvas'), TAG.FACE));
      if (!type.glyphs.length) return null;
      const it = demoItem, a = it.demoAt, size = a.size, edge = SUBS.EDGE * size, m = BOX.LINE + edge;
      const grow = (r) => ({ x0: r.x0 - edge, y0: r.y0 - edge, x1: r.x1 + edge, y1: r.y1 + edge });
      const keep = [grow(it.hit), grow(demoMenu.p > 0 || demoMenu.open ? a.menu.full : a.menu.shut), grow(a.bar)];
      const area = { x0: it.full.x0 + m, y0: it.full.y0 + m, x1: it.full.x1 - m, y1: it.full.y1 - m };
      const s = placeLine(type, ends, size, a.face[0].cx, a.face[0].cy, faceReach() + SUBS.MONK_GAP * size, area, keep);
      if (s) s.at = a;
      return s;
    }

    // each frame: a syllable's subtitle made in place of the last as it is
    // heard, while his item is open in its box and his face is in, and the
    // one shown dropped once it has lingered, or his item or its box shuts
    // or is laid out again
    function stepMonkSubtitle() {
      if (Monk.said !== monkSaid) {
        monkSaid = Monk.said;
        monkSub = demoItem && demoItem.demoAt && demoItem.open && openBox(demoHome) && Moon.ready ? makeMonkSubtitle(Monk.text) : null;
      }
      if (monkSub && (demoItem.demoAt !== monkSub.at || !demoItem.open || !openBox(demoHome) ||
          (Monk.endedAt !== null && Date.now() - Monk.endedAt > SUBS.LINGER * 1000))) monkSub = null;
    }

    // --- the shop ------------------------------------------------------------------
    // bubble bob's box sells drag strength, hands, spawn rate, max bubbles,
    // bubble value and a random voice for the bubbles the bubble has eaten, each paying by its size (js/shop.js), every number
    // shown to two places, in a menu of its own in the room's top right, as
    // far in from its top and right as his caret's ink is from its left. shut, the
    // menu is a button: a rounded rect drawn as the box is, filled with
    // paper over whatever drifts under it and outlined LINE px from point to
    // point, RADIUS of its text's size round its corners, saying with a
    // caret on its left the bubbles earned a second (js/shop.js's rate), a
    // BAR, how many bubbles there are, a BAR and TITLE, APART from each
    // other, in the box text's face at the photo caption's size, PAD round
    // them. a press
    // on it opens the menu as a box opens: the button is its shut shape, and
    // its open one reaches down and left round a list of the upgrades under
    // the header, a button each, ROW apart, every one as wide as the
    // widest, MARGIN round them, each with its label and price. it swings
    // there and back on the boxes' spring, but bouncier (UI.BOUNCE) and set off
    // with a KICK when it opens, so it bursts open and swings further past
    // it before it settles, its edges warbling as the boxes' do, and a skin
    // (js/skin.js) chases it as a box's does, its anchors' pull reaching
    // only UI.SPREAD along it, so it bows between them as a big box's skin
    // does, with the menu's insides, drawn apart (pfb), copied through the
    // skin, so it wipes the list in as it grows. its caret turns from > to v as it opens, as an
    // item's does, and a press on the header shuts it. under the pointer
    // the menu's outline, its caret and its words are in the links' hover
    // colour (the musician's), and a button's outline and words in the
    // words' (the inventor's). a press on a button buys a level: drag strength pulls every
    // held skin in the bubble's world harder, spawn rate spawns small
    // bubbles there more often, max bubbles lets it hold more at once,
    // bubble value makes every one the bubble eats pay more,
    // randomize voice gives the bubble a new voice (js/voice.js), and
    // a hand comes out of its button and goes after the small bubbles
    // (js/hands.js), drawn as the pointer is (js/cursor.js), a fist while
    // it holds one, its hold's line dashed as the pointer's is, over the
    // small bubbles and under the bubble, as cicada layered them
    // (drawGame). HAND_REACH is how far its art reaches from its palm.
    // the demo's menu (the demo, above) is built on SHOP_UI too, and moves
    // as this one does (Menu.at, Menu.step)
    const SHOP_UI = {
      KEYS: ['drag', 'hands', 'spawn', 'max', 'value', 'voice'], TITLE: 'upgrades', BAR: '|',
      LABELS: { drag: 'drag strength', hands: 'hands', spawn: 'spawn rate', max: 'max bubbles', value: 'bubble value', voice: 'randomize voice' },
      PAD_X: 0.5, PAD_Y: 0.25, RADIUS: 0.4, // of the text's size: round a button's words, and its corners
      APART: 0.4,                           // of the text's size, between the header's caret, rate, bars, count and title
      ROW: 0.4, MARGIN: 0.4,                // of the text's size, between the list's buttons, and round them in the open menu
      KICK: 12,                             // a second, added to its speed toward open as it opens: with UI.BOUNCE, about 19 % past open
      CAP: 0.75, DESC: 0.2,                 // of the text's size, the face's caps over its baseline and descenders under
      STEP: 2,                              // px between a button's outline's points, as the box's skin stands
    };
    const shop = new Shop();
    // what each bubble in the world pays when the bubble eats it: its own
    // reward (Shop.reward) at the size it is first seen at, and a bubble
    // that eats another takes on what that one pays too, so a merged bubble
    // pays what its parts would have paid apart (the frame, below)
    const worth = new WeakMap();
    const worthOf = (b) => worth.has(b) ? worth.get(b) : Shop.reward(b.radius);
    let bps = 0;                 // the shop's rate, as of this frame
    const helpers = [];          // each hand bought, { hand, cursor }
    const HAND_REACH = 20;       // world px
    const shopTypes = new Map(); // a label's text, to its Type
    let shopUI = null;           // as laid out: { room, key, size, shut, full, header: { caret, rate, rateBar, count, bar, title }, buttons: [{ key, rect, ring, letters }] }
    // the menu: whether it is open, how far (p, 0 shut, 1 open and past as
    // it swings) and how fast, its caret's turn, its skin and the room it
    // was made in, and each edge's warble
    const menu = {
      open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };

    // dev mode: D, E and V held down together for DEV.MS make the shop free
    // until the page is reloaded; the count and the prices go on as ever
    const DEV = { KEYS: ['KeyD', 'KeyE', 'KeyV'], MS: 5000 };
    const devHeld = new Set();
    let devTimer = null;
    const devStop = () => { clearTimeout(devTimer); devTimer = null; };
    window.addEventListener('keydown', (e) => {
      if (!DEV.KEYS.includes(e.code)) return;
      devHeld.add(e.code);
      if (devHeld.size === DEV.KEYS.length && devTimer === null) devTimer = setTimeout(() => { shop.free = true; }, DEV.MS);
    });
    window.addEventListener('keyup', (e) => { if (devHeld.delete(e.code)) devStop(); });
    window.addEventListener('blur', () => { devHeld.clear(); devStop(); });

    // the menu laid out, again whenever the room or what it says changes;
    // null with no room
    function shopNow() {
      const room = bubbleHome && bubbleHome.room;
      if (!room) return null;
      const U = SHOP_UI, labels = U.KEYS.map((k) => U.LABELS[k] + ' · ' + Shop.figure(shop.price(k)));
      const rate = Shop.figure(bps) + ' bps', count = Shop.figure(shop.bubbles) + ' bubbles';
      const key = labels.join('|') + '|' + rate + '|' + count;
      if (shopUI && shopUI.room === room && shopUI.key === key) return shopUI;
      const size = Math.max(BOX.CAP_LEAST, BOX.CAP * room.size), k = size / TYPE.EM, inset = room.inset;
      const type = (text) => {
        let t = shopTypes.get(text);
        if (!t) shopTypes.set(text, t = new Type(text, () => document.createElement('canvas'), TAG.FACE));
        return t;
      };
      const wide = (t) => k * (t.left + t.right), h = Math.round(size * (2 * U.PAD_Y + U.CAP + U.DESC));
      // a line's letters, its ink's left at x0, on the baseline of a row whose top is y0
      const letters = (t, x0, y0, seed) => t.glyphs.map((gl) => Letter.make(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (U.PAD_Y + U.CAP) + k * gl.dy, seed + gl.at, k, LETTER.WOBBLE));
      // the header, the shut menu: the caret, the rate, a bar, the count, a bar and the title
      const rt = type(rate), ct = type(count), bt = type(U.BAR), tt = type(U.TITLE), cg = Menu.caret.glyphs[0], cw = cg ? k * cg.g.w : 0, apart = U.APART * size;
      const right = room.x + room.w - inset, top = room.y + inset;
      const hw = Math.round(cw + wide(rt) + wide(ct) + 2 * wide(bt) + wide(tt) + 5 * apart + 2 * U.PAD_X * size);
      const shut = { x0: right - hw, y0: top, x1: right, y1: top + h };
      const x = shut.x0 + U.PAD_X * size, xr = x + cw + apart, xa = xr + wide(rt) + apart;
      const xc = xa + wide(bt) + apart, xb = xc + wide(ct) + apart, xt = xb + wide(bt) + apart;
      const header = {
        caret: cg ? Letter.make(cg.g, x + cw / 2, top + size * (U.PAD_Y + U.CAP) + k * cg.dy, 78999, k, LETTER.WOBBLE) : null,
        rate: letters(rt, xr, top, 76000),
        rateBar: letters(bt, xa, top, 76500),
        count: letters(ct, xc, top, 79000),
        bar: letters(bt, xb, top, 77000),
        title: letters(tt, xt, top, 78000),
      };
      // the list under it, every button as wide as the widest, or as the
      // header less the margins if that is wider, and the open menu round it
      const margin = Math.round(U.MARGIN * size), row = Math.round(U.ROW * size), types = labels.map(type);
      const bw = Math.max(Math.round(Math.max(...types.map(wide)) + 2 * U.PAD_X * size), hw - 2 * margin);
      const buttons = [];
      let y = shut.y1;
      U.KEYS.forEach((key, i) => {
        const rect = { x0: right - margin - bw, y0: y, x1: right - margin, y1: y + h };
        buttons.push({ key, rect, ring: ringRound(rect, U.RADIUS * size, U.STEP), letters: letters(types[i], rect.x0 + U.PAD_X * size, y, 70000 + 1000 * i) });
        y += h + row;
      });
      const full = { x0: right - Math.max(hw, bw + 2 * margin), y0: top, x1: right, y1: y - row + margin };
      shopUI = { room, key, size, shut, full, header, buttons };
      return shopUI;
    }

    // a rounded rect's outline as a ring of points about step px apart,
    // clockwise from the top right corner, its corners quarter circles of
    // radius round
    function ringRound(r, round, step) {
      const pts = [];
      const corner = (cx, cy, from) => {
        const n = Math.max(2, Math.ceil(round * Math.PI / 2 / step));
        for (let i = 0; i <= n; i++) {
          const a = from + i / n * Math.PI / 2;
          pts.push({ x: cx + round * Math.cos(a), y: cy + round * Math.sin(a) });
        }
      };
      const edge = (ax, ay, bx, by) => {
        const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
        for (let i = 1; i < n; i++) pts.push({ x: ax + (bx - ax) * i / n, y: ay + (by - ay) * i / n });
      };
      corner(r.x1 - round, r.y0 + round, -Math.PI / 2);
      edge(r.x1, r.y0 + round, r.x1, r.y1 - round);
      corner(r.x1 - round, r.y1 - round, 0);
      edge(r.x1 - round, r.y1, r.x0 + round, r.y1);
      corner(r.x0 + round, r.y1 - round, Math.PI / 2);
      edge(r.x0, r.y1 - round, r.x0, r.y0 + round);
      corner(r.x0 + round, r.y0 + round, Math.PI);
      edge(r.x0 + round, r.y0, r.x1 - round, r.y0);
      return pts;
    }

    // the menu sy up into into, hover what the pointer is on: its header and,
    // while it is open at all, its buttons, each ring outlined LINE px from
    // point to point, drawn into qfb over the skin's box; then qfb copied
    // into into through the skin and the skin outlined over it, as drawBox
    // does a box
    function drawShop(t, sy, hover, into) {
      const ui = shopNow();
      if (!ui || !menu.skin) return;
      const v = hover && hover.menu ? HOVER_LINK : 1, box = menu.skin.bounds();
      qfb.clearRows(Math.floor(box.y0 - sy) - BOX.LINE, Math.ceil(box.y1 - sy) + BOX.LINE + 1);
      for (const L of ui.header.rate) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.rateBar) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.count) L.draw(t, -sy, qfb, 0, v);
      for (const L of ui.header.bar) L.draw(t, -sy, qfb, 0, v);
      if (ui.header.caret) ui.header.caret.draw(t, -sy, qfb, menu.turn * Math.PI / 2, v);
      for (const L of ui.header.title) L.draw(t, -sy, qfb, 0, v);
      if (menu.p > 0) for (const b of ui.buttons) {
        const bv = hover && hover.buy === b.key ? HOVER : 1, n = b.ring.length;
        for (let i = 0; i < n; i++) {
          const p = b.ring[i], q = b.ring[i + 1 < n ? i + 1 : 0];
          qfb.line(p.x, p.y - sy, q.x, q.y - sy, bv, BOX.LINE);
        }
        for (const L of b.letters) L.draw(t, -sy, qfb, 0, bv);
      }
      const pts = menu.skin.screen(-sy), n = pts.length;
      into.fillPolygon(pts, qfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        into.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // a level of key bought, if there are bubbles enough, and what it buys
    function buy(key) {
      if (!world || !shop.buy(key)) return;
      if (key === 'drag') world.dragForce = SOFT.DRAG.FORCE * shop.drag();
      if (key === 'spawn') world.spawnMs = SOFT.SPAWN.EVERY_MS / shop.spawn();
      if (key === 'max') world.maxBlobs = SOFT.SPAWN.MAX_BLOBS + shop.more();
      if (key === 'voice') Voice.randomize();
      if (key !== 'hands') return;
      const room = bubbleHome.room, r = shopNow().buttons.find((b) => b.key === 'hands').rect;
      const hand = new Hand((r.x0 + r.x1) / 2 - room.x, (r.y0 + r.y1) / 2 - room.y, world.hands.length);
      world.hands.push(hand);
      helpers.push({ hand, cursor: new Cursor() });
    }

    // the hands sy up into into, each where its world has it in the room,
    // as the small bubbles are drawn (inRoom)
    function drawHands(sy, into) {
      if (!helpers.length) return;
      const room = bubbleHome.room;
      for (const { hand, cursor } of helpers) {
        cursor.moveTo(room.x + hand.x, room.y + hand.y - sy);
        cursor.draw(into);
      }
    }

    // a point in world px on the screen as its world's px, wherever the page
    // has scrolled to, the boxes have pushed the bubble's and its box has it
    // drawn (bubbleAt), so a press lands on the bubble where it is drawn,
    // or, while a small bubble is held, where the room is (inRoom), so it
    // follows the pointer where it is drawn; as it is with no room
    function toRoom(p) {
      const r = bubbleHome && bubbleHome.room;
      if (!r) return p;
      const b = world.drag && world.drag.blob !== bubble ? inRoom() : bubbleAt(), y = p.y + scrolled() - bubbleHome.off;
      return { x: bubble.lockX + (p.x - b.x) / b.k, y: bubble.lockY + (y - b.y) / b.k };
    }

    // --- the tag's bubbles -------------------------------------------------------
    // a small bubble in each of the tag's lines, in the line's colour: a
    // ring of verlet points (js/softbody.js) as Doodles' bubble is,
    // with no face, locked where the tag puts it and holding still there,
    // with no wobble. each is in a world of its own the size of the
    // viewport, so its px are the page's: the tag does not scroll. it is
    // made at each layout and settled in place at once, at a radius that
    // puffs out to the one the tag gives it (PUFFED, the ring's radius at
    // rest over the radius it is made with). it is filled with its colour
    // right out to the skin; a press within
    // REACH of it takes hold of it as of the other, and it wobbles home
    // when let go.
    const SETTLE = 60; // steps that leave a ring still where it is made
    const PUFFED = (() => {
      const w = new World(100, 100), b = new SoftBlob(50, 50, BUBBLE_POINTS, 10, BUBBLE_PUFF, true);
      w.blobs.push(b);
      for (let i = 0; i < SETTLE; i++) w.tick();
      const c = b.getCenter();
      return b.points.reduce((r, p) => r + Math.hypot(p.x - c.x, p.y - c.y), 0) / b.points.length / 10;
    })();
    let tagBubbles = []; // each { world, blob, x, y, r, v }, made by layoutTag

    // a bubble r px round at (x, y) on the page in colour v, settled there
    function makeTagBubble(x, y, r, v) {
      const world = new World(W, H), blob = new SoftBlob(x, y, BUBBLE_POINTS, r / PUFFED, BUBBLE_PUFF, true);
      world.blobs.push(blob);
      for (let i = 0; i < SETTLE; i++) world.tick();
      return { world, blob, x, y, r, v };
    }

    // a tag bubble: filled with its colour out to its skin's outer edge,
    // the ring's points pushed out along its normal by half BUBBLE_LINE,
    // so it is as big as an outline BUBBLE_LINE px thick round the ring
    // would be and as round as the ring is
    function drawTagBubble(b) {
      const pts = b.blob.points, n = pts.length;
      const edge = (d) => pts.map((q, i) => {
        // the secant across it turned a quarter: outward, on a ring that
        // runs clockwise on screen
        const a = pts[(i + n - 1) % n], c = pts[(i + 1) % n];
        const nx = c.y - a.y, ny = a.x - c.x, m = Math.hypot(nx, ny) || 1;
        return { x: q.x + d * nx / m, y: q.y + d * ny / m };
      });
      fb.fillPolygon(edge(BUBBLE_LINE / 2), b.v);
    }

    // the tag bubble a press at world (x, y) on the screen takes hold of:
    // the nearest, if the press is within REACH of its skin, or null
    function tagBubbleAt(x, y) {
      let best = null, most = Infinity;
      for (const b of tagBubbles) {
        const d = Math.hypot(x - b.x, y - b.y) - b.r;
        if (d <= TAG.REACH && d < most) { best = b; most = d; }
      }
      return best;
    }

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm
    // on the pointer. while the button is held it closes through the frames
    // to a fist, and it opens again when the button lifts. a touch gets no
    // hand: there is nothing to see under a finger. it goes down last, over
    // everything, on a dark backing, so it reads over the letters and the
    // bubble.
    const cursor = new Cursor();

    // --- the drag ----------------------------------------------------------------
    // a press near the skin, while bubble bob's box is open and the press presses
    // nothing else, takes hold of its nearest point and two either
    // side and pulls them toward the pointer, and so does a press near one
    // of the tag's bubbles that presses nothing else, until the press lifts or the
    // pull goes too far and the skin lets go; the click it ends in presses
    // nothing. the pointer is captured, so a
    // drag carries on outside the window; only a pointer that leaves with
    // nothing held is forgotten, and the eyes stop following it. where it
    // is goes to each world each frame, so a scroll or a box pushing the
    // bubble's moves it in the world as a move would
    let pointerAt = null, grabbed = false; // the pointer, world px on the screen, or null; whether the last press took hold
    // the pointer's string in the bubble's world snapping TIMES times
    // inside WITHIN ms, each before it had held QUICK ms, is a drag too
    // fast: the bubble says to drag slower (js/voice.js) and the count
    // starts again. a string that held QUICK ms or more first is let go
    // of by a slip, not by someone yet to find how it pulls, and does not count
    const SNAP = { TIMES: 3, WITHIN: 10000, QUICK: 1000 };
    let snapped = []; // when each snap still inside WITHIN came, the frame's ms, oldest first
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = View.pointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      cursor.press();
      pointerAt = p;
      const q = toRoom(p);
      const free = !hitAt(p.x, p.y) && !cornerAt(p.x, p.y); // the press presses nothing else
      grabbed = !!(playing() && free) && world.grab(q.x, q.y);
      if (grabbed) Tally.play(bubbleItem.title); // a bubble of bubble bob's taken hold of: he is counted as played with (js/tally.js)
      if (grabbed && world.drag.blob === bubble) Voice.complain(); // the bubble, taken hold of, complains out loud (js/voice.js)
      const b = !grabbed && free && tagBubbleAt(p.x, p.y);
      if (b) grabbed = b.world.grab(p.x, p.y);
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = View.pointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      pointerAt = p;
    });
    // a lifted press opens the hand again. it goes when there is nothing
    // left to hover: a finger lifted, or a captured drag let go outside the
    // viewport
    function liftCursor(e) {
      cursor.release();
      const p = View.pointer(e);
      if (e.pointerType === 'touch' || p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) cursor.hide();
    }
    // every world a press can take hold in
    function worlds() {
      return [world, ...tagBubbles.map((b) => b.world)];
    }
    canvas.addEventListener('pointerup', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    canvas.addEventListener('pointercancel', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    // a captured drag carried outside the window keeps its hand: moves still come
    canvas.addEventListener('pointerleave', () => {
      if (worlds().some((w) => w.drag)) return;
      pointerAt = null;
      for (const w of worlds()) w.pointerOff();
      cursor.hide();
    });

    // --- the wall ----------------------------------------------------------------
    // graffiti wall, in Doodles, is the wall (js/wall.js): one bitmap,
    // WALL.W by WALL.H px in the wall's own colours, that every visitor
    // draws on, kept by its server (tools/wall-server) and sent to everyone
    // looking at it as it is drawn. its bubble shut goes round its caret
    // and name as the others' do; open, it is a box round the wall
    // (layoutItems): as much of the wall as fits across the box's insides
    // and, down, twice bubble bob's box, the whole inside of its outline
    // the wall, GROW times its size and still, each of its px off the
    // framebuffer's grid and wobbling a little where it is, so its ink
    // shimmers as the letters do (Shimmer.draw). its
    // caret and name stay in its top left corner as its label, over the
    // wall, and a press there is still the item's, not the wall's. in
    // its top right corner, as far in from the top and right as its
    // caret's ink is from its left, is its menu, built as bubble bob's is
    // (the shop, above) and moving as his does: shut, a button, a caret,
    // TITLE, his BAR and the pen, the brush in use as it stamps in the
    // colour picked (the paper's, which would not show, as a ring of ink),
    // in the middle of what the button has left right of the bar, the button tall enough to
    // hold it and as wide as the open menu, its words at its left; open,
    // the first PICKS of the wall's colours under it in rows of COLS cells,
    // CELL px square and GAP apart, each a little inside its place, the
    // one picked outlined PICK px thick in the words' hover colour (the
    // inventor's), the first the paper's, which rubs out,
    // along the bottom of them, its brush's slider, a
    // small ribbon as the demo's menu's are (Bar.draw): a bar with a tick
    // in the middle of each brush's zone and a dot on the line of the one
    // in use, going from line to line as theirs do, and PEN right of it,
    // the two as wide as the cells; a GAP under that, as
    // wide as the cells and TRAY px tall, the mixing tray (js/mix.js),
    // bare paper with its paint on it, the paint's px GROW world px each,
    // and until paint is first dragged into it HINT in its middle over a
    // hand pointing down into it;
    // and under the tray, at the cells' left, ERASER, a button drawn as
    // the shop's are, paper inside. the cells, the bar and ERASER's outline are ink
    // drawn as letters are, each with a letter's wobble, GROW times the
    // size its art is made (wallArt), and the pen in the header and the
    // tray's paint are drawn GROW times their size too, so all of them
    // shimmer as the letters do.
    // a primary press on a cell takes up a pen's worth of its paint, and
    // one on the tray the paint under the pen and all the paint touching
    // it, the pen for both the biggest there is, whatever brush is picked
    // (wallDab): while it is held the paint follows the pointer, out of the cell
    // through the air over the cells and the slider, and over the tray is
    // pushed and stirred there; lifted, it is put down, a tap on a cell
    // picks its colour, and a tap on paint in the tray, or paint that was
    // dragged, once it is put down (takeMixed), picks the tray's paint:
    // its blob (js/mix.js), the paint tapped or put down and all the paint
    // touching it, as one, ringed PICK px round on the tray in the words'
    // hover colour while it is picked. a press on the wall then draws each pixel one of
    // the colours the blob shows, by its share of the blob (wallInk), and
    // the pen in the header shows it so. the
    // click it ends in presses nothing. a cell held goes on giving
    // paint as long as it is held (js/mix.js). the wall left
    // or the menu shut while it is held lets it go, picking nothing. a
    // primary press on ERASER takes hold of it, and while it is held it
    // follows the pointer from where it was taken, over the rest of the
    // menu and kept inside it under the header, and the tray's paint it
    // goes over is gone, every px of the tray whose middle it covers, all
    // the way from where it was (eraserTo); the pen is back in the cell's
    // colour last picked once none of the blob picked is left. let go, or
    // the wall left or the menu shut while it is held, it goes back to
    // its place under the tray by the house approach, ERASER_RATE of the
    // way left each 60 hz frame (stepEraser), rubbing nothing out on the
    // way, and the click it ends in presses nothing. the tray's paint
    // otherwise stays for the
    // page's life, but that what is over the tray's fill dries away. a press on the header opens the
    // menu or shuts it; a primary press on the bar, or its row above and
    // below it, takes it, and while it is held the brush is the one whose
    // zone the pointer is in across the bar, and the click it ends in
    // presses nothing. under the pointer a cell's outline, PICK px thick,
    // the bar, and ERASER's outline and word, held too, are in the words' hover colour (the inventor's). where the opening is smaller than the wall it
    // starts over the wall's middle and is moved over it by two fingers on
    // it, or by the wheel over it (the wheel, below): across by the
    // wheel's way across, down by its way down as far as the wall goes,
    // and what is left of that scrolls the page. a primary press on the
    // wall draws in the colour and brush picked: a mouse's at once, a
    // finger's once it has moved SLOP px, stayed HOLD ms or lifted (a
    // dot), so a second finger coming down before that moves the wall and
    // leaves no mark. while it is held the pen follows the pointer, kept
    // inside the opening; a lift ends the stroke and the click it ends in
    // presses nothing. a press on the wall, or on the menu's cells, slider,
    // tray or eraser, is never a swipe (the swipe, below). the pen runs dry when it draws faster than its ink
    // comes back, and draws again as it does (js/wall.js). the page joins
    // the wall's server as it starts and stays with it, so the wall is
    // there behind its bubble before that is opened and is shown as the
    // bubble opens, as a box's words are; until the wall has come nothing
    // draws, and with no server to join, words in its middle say so.
    // two fingers on the wall coming together or apart, a wheel held with
    // ctrl or cmd over it, safari's pinch over it (the wheel, below) and
    // OUT and IN in the opening's bottom right corner draw it smaller or
    // bigger, from ZOOM_MOST world px a px down to the whole of it fitting
    // its opening, where it stands in the opening's middle with its edges
    // drawn (zoomTo, stepZoom, clampPan)
    const WALL_UI = {
      TITLE: 'settings', // what the menu's header says
      PICKS: 16, // the wall's colours the menu has a cell for, its first: the rest are mixed from them
      COLS: 4,  // cells in a row of the menu
      CELL: 28, // world px, a cell, square
      GAP: 6,   // world px between cells, across and down
      PICK: 1,  // the art's and the tray's px, how thick the outline of the colour picked (a cell's or the tray's blob's) and of a cell hovered is
      GROW: 1.1, // the wall, the tray's paint, the pen, and the cells', the slider's and ERASER's art are drawn this many times their size, off the pixels' grid, so their edges shimmer as a letter's do
      SLOP: 4,  // world px a finger moves before it draws
      HOLD: 80, // ms a finger stays before it draws
      TRAY: 132, // world px, the mixing tray's height: it is as wide as the row of cells
      ERASER: 'eraser', // what the button under the tray says: dragged, it rubs out the tray's paint it goes over
      ERASER_RATE: 0.2, // of the way left to its place under the tray it goes, let go, each 60 hz frame
      HINT: 'drag and mix paint here', // what the tray says in its middle until paint is first dragged into it
      HINT_GAP: 4, // world px between those words and the hand under them, pointing down into the tray
      PEN: 'pen size', // what the slider's words say
      OUT: '−', IN: '+', // what the two small buttons in the opening's bottom right corner say: the wall drawn smaller, and bigger
      ZOOM_MOST: 8,   // world px a px of the wall is drawn at most
      ZOOM_STEP: 1.5, // times bigger, or smaller, a press on IN or OUT draws it
      ZOOM_RATE: 0.2, // of the way left to there it goes each 60 hz frame
      PINCH: 0.01,    // a px of a wheel held with ctrl or cmd grows or shrinks it e to this
      NOTCH: 30,      // px, the most one such wheel event counts for
    };
    // the tray, as wide as the row of cells, and how far the cells' top is
    // above its top: their rows, the slider's row and a GAP. placeWall lays
    // the menu out by these, and the tray's paint (wallMix) is made to them
    // and, GROW times smaller, in its own px: its paint's are drawn GROW
    // times their size (mw, mh, mup)
    const wallTray = (() => {
      const U = WALL_UI, w = U.COLS * (U.CELL + U.GAP) - U.GAP, up = Math.ceil(U.PICKS / U.COLS) * (U.CELL + U.GAP) + U.CELL + U.GAP;
      return { w, up, mw: Math.round(w / U.GROW), mh: Math.round(U.TRAY / U.GROW), mup: Math.ceil(up / U.GROW) };
    })();
    // the menu's art, a GROW'th of the size it is drawn: a cell's, 2 px in
    // from its place all round (cell), and its outline PICK px thick for
    // the one picked or hovered (ring), and the slider's bar with its
    // ticks (Bar.draw), for one drawn w px wide (bar(w)), made the first
    // time and kept
    const wallArt = (() => {
      const U = WALL_UI, a = Math.round(U.CELL / U.GROW), h = DEMO.SLIDER.H, bars = new Map();
      const bar = (w) => {
        const aw = Math.round(w / U.GROW);
        if (!bars.has(aw)) {
          const f = new Framebuffer(aw, h);
          Bar.draw(f, { x0: 0, y0: 0, x1: aw, y1: h }, 0, WALL.SIZES.length, null, 1, DEMO.SLIDER);
          bars.set(aw, { ink: Uint8Array.from(f.bits), w: aw, h });
        }
        return bars.get(aw);
      };
      return { cell: Menu.inkBox(a - 4, a - 4, 3), ring: Menu.inkBox(a - 4, a - 4, 3, U.PICK).line, bar };
    })();
    // the wall's server: the site's own, the deployed worker, from the
    // site's hosts (none, and the site's wall is offline), or one run beside the page,
    // on the page's host's port 8787 (make dev in tools/wall-server, or
    // make lan for a phone), from anywhere else
    const WALL_LIVE = 'wss://wall.wall-server.workers.dev';
    const WALL_URL = /(^|\.)(github\.io|peter-dangelo\.com|dangelo\.engineering)$/.test(location.hostname) ? WALL_LIVE
      : location.hostname ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':8787' : '';
    const wallHome = sections.find((s) => s.items.some((it) => it.wall)) || null; // the section whose box holds the wall
    const wallItem = wallHome ? wallHome.items.find((it) => it.wall) : null;       // graffiti wall, the item it is
    const wallLut = Uint16Array.from(WALL.COLOURS, (c, i) => i < 2 ? i : Framebuffer.colour(c));  // each of the wall's colours as the framebuffer's v, its paper and its black the page's own
    const wall = new Wall(wallLut);
    const wallPicture = { px: wall.shown, w: WALL.W, h: WALL.H }; // the wall as a picture the framebuffer takes
    const wallWords = {
      offline: new Type('the wall is offline', () => document.createElement('canvas'), TAG.FACE),
      title: new Type(WALL_UI.TITLE, () => document.createElement('canvas'), TAG.FACE),
      bar: new Type(SHOP_UI.BAR, () => document.createElement('canvas'), TAG.FACE),
      eraser: new Type(WALL_UI.ERASER, () => document.createElement('canvas'), TAG.FACE),
      hint: new Type(WALL_UI.HINT, () => document.createElement('canvas'), TAG.FACE),
      pen: new Type(WALL_UI.PEN, () => document.createElement('canvas'), TAG.FACE),
      out: new Type(WALL_UI.OUT, () => document.createElement('canvas'), TAG.FACE),
      in: new Type(WALL_UI.IN, () => document.createElement('canvas'), TAG.FACE),
    };
    const wallMix = new Mix(WALL.COLOURS, wallTray.mw, wallTray.mh, wallTray.mup); // the paint in the tray, kept for the page's life
    const wallMixed = { px: new Uint16Array(wallTray.mw * (wallTray.mup + wallTray.mh)), w: wallTray.mw, h: wallTray.mup + wallTray.mh, lit: false }; // the paint in the air and, under it, the tray's, as a picture, painted again when either has changed, and whether it holds the blob's ring (trayNow)
    let wallMixer = null;          // the pointer holding the tray's paint, or null
    let wallTake = false;          // whether the paint last let go was lifted, not called off: its colour, once it is put down, is the one picked
    let wallEraser = null;         // the press holding the eraser, { id, x, y }: its pointer, and where on the page as laid out it took hold, from where the eraser is at its place; or null
    const wallOut = { x: 0, y: 0 }; // how far the eraser is from its place under the tray, world px
    let wallColour = 1, wallBrush = 2; // the colour and the brush picked: the colour one of the cells', or -1, the tray's paint, its blob (js/mix.js) as one
    const wallDab = WALL.SIZES[WALL.SIZES.length - 1]; // the pen the tray's paint is taken up and stirred with: the biggest, whatever brush is picked
    let wallCell = 1;              // the cell's colour last picked: the pen's again when the tray's paint is picked and the tray is emptied
    let wallSet = null;            // the tray's paint as the pen takes it, its blob's { colours, weights } (Mix.shares), or null with none: made again when the paint has changed (trayNow)
    let wallFromCell = false;      // whether the press holding the tray's paint came down on a cell
    let wallPainted = false;       // whether paint has been dragged into the tray: the words asking for it are gone for good
    const wallNib = { px: null, w: 0, h: 0, brush: 0, colour: -2, set: null }; // the pen as a picture, and the brush and colour it was made for
    let wallPan = null;            // the wall px at the opening's top left, { x, y }, once it is laid out
    let wallScale = WALL_UI.GROW, wallScaleTo = WALL_UI.GROW; // world px a px of the wall is drawn, and what OUT and IN have asked for
    const wallMips = [];           // the wall at half its size, a quarter and so on, as pictures, made as they are drawn from (wallMip)
    let wallPinch = null;          // safari's pinch over the wall: its scale as last heard, or null
    let wallPen = null;            // the press drawing, { id, x, y, at, on, ink }: its pointer, where and when it came down, world px on the screen and ms, whether it has drawn yet, and what it draws in (wallInk); or null
    const wallFingers = new Map(); // each finger down on the wall, by its pointer, where it was last, world px on the screen
    let wallJoined = false;        // whether the page has asked for the wall's server
    let wallSlide = null;          // the pointer holding the brush's slider, or null
    let wallDot = null;            // the slider's dot, 0 .. 1 across its bar, where it has got to; null until it is first put on its line
    // the menu, as bubble bob's is (menu, above)
    const wallMenu = {
      open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };

    // the wall's opening with its top left at (x, y), w x h, world px on
    // the page as laid out, at the text's size bs, inset how far its
    // caret's ink is in from its left: the opening (box); the words that
    // stand in its middle where there is no server, as letters seeded from
    // seed (offline); OUT and IN, two small square buttons in its bottom
    // right corner (zooms, each { rect, dir, fill, ring, letter }); and its menu, laid out as bubble bob's is
    // (shopNow), { room, size, shut, full, header: { caret, title, bar,
    // nib }, cells, slider, tray, eraser, hint }: its button in the opening's top right
    // corner, on whole px, as wide as the open menu, its words from its
    // left on the middle of its height and nib the top left of the pen's
    // place, in the middle of the room right of the bar; and, open, down from it
    // round the colours' cells under the header, each { x0, y0, x1, y1,
    // colour, fill, line, ring }, its place and its art's inside, outline

    // the wall as a picture 2 to the n times smaller, each of its pixels

    // scrubber's bar (replay.bar), as tall as a slider's, and where a

      const port = Math.round(C.PORT * th), hole = { x0: left, y0: bottom - port, x1: left + port, y1: bottom, r: port / 2 };

    // where the picture is drawn in an opening laid out as a, world px on
