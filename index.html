<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peter D'Angelo</title>
  <style>
    /* the paper colour, as in js/raster.js: any sliver past the canvas matches */
    html, body { margin: 0; background: #fbf6f0; }
    /* no system cursor over the document either, as over the canvas */
    html, body { cursor: none; }
    /* the document never scrolls: the page scrolls itself, in the script
       (the swipe and the wheel), drawn that far up the canvas, which stays
       fixed over the window. no bar, no bounce */
    html, body { overflow: hidden; overscroll-behavior: none; }
    /* a press on the canvas is the page's own, and so is a swipe: a finger
       scrolls the page itself (the swipe, in the script). no selecting. no
       cursor either: the pointer is drawn into the frame as a hand */
    canvas { position: fixed; top: 0; left: 0; display: block; image-rendering: pixelated; cursor: none;
             touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <script src="font.js"></script>
  <script src="daedalus/daedalus.js"></script>
  <script src="js/raster.js"></script>
  <script src="js/softbody.js"></script>
  <script src="js/hands.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/face-art.js"></script>
  <script src="js/mouth.js"></script>
  <script src="js/face.js"></script>
  <!-- <script src="js/beard.js"></script> -->
  <script src="js/hand-art.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/type.js"></script>
  <script src="js/about-photos.js"></script>
  <script src="js/logos.js"></script>
  <script src="js/text.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/scale.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/monk.js"></script>
  <script src="js/moon.js"></script>
  <script src="js/ship.js"></script>
  <script src="js/daedalus.js"></script>
  <script src="js/subtitle.js"></script>
  <script>
    // --- the viewport ------------------------------------------------------------
    // the window is a viewport onto a grid of world pixels, each SCALE css
    // pixels square. resizing shows more or fewer of them; nothing is ever
    // stretched. every pixel is drawn into one framebuffer (js/raster.js)
    // the size of the visible world, each pixel lit or dark; once a frame
    // it is copied whole into the canvas bitmap, which is that size exactly,
    // and the browser blows it up by SCALE. nothing draws to the canvas
    // itself.
    const SCALE = 1;

    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d'); // only the framebuffer's present uses it
    let W = 0, H = 0; // the viewport, in world pixels
    let fb = null;    // the world bitmap, remade at the viewport's size
    let cfb = null;   // the about box's insides, drawn apart and copied through the box (below)
    let pfb = null;   // each item's insides, drawn apart and copied through its skin (drawInsides)
    let qfb = null;   // a menu's insides, the upgrades' or the demo's, drawn apart and copied through its skin (drawShop, drawSettings)

    function resize() {
      W = Math.max(1, Math.floor(window.innerWidth / SCALE));
      H = Math.max(1, Math.floor(window.innerHeight / SCALE));
      canvas.width = W;
      canvas.height = H;
      fb = new Framebuffer(W, H);
      cfb = new Framebuffer(W, H);
      pfb = new Framebuffer(W, H);
      qfb = new Framebuffer(W, H);
      canvas.style.width = (W * SCALE) + 'px';
      canvas.style.height = (H * SCALE) + 'px';
      layout();
      placeMute();
      placeHand();
    }

    // --- letters -----------------------------------------------------------------
    // a letter is one object: its glyph from font.js cut to its ink, a home
    // position in continuous world space, a scale and a tilt, and slow sines
    // of its own on each, at rates and phases seeded from its place in the
    // text. it is drawn as a sprite (js/raster.js), as daedalus's head is:
    // every world pixel in its box is carried back through the transform
    // into the glyph and lit when enough of it lands on ink, so a sub-pixel
    // move or a touch of scale shows as edge pixels popping, never as the
    // block stepping, and a 1 px stroke at these scales always lights one
    // pixel and only doubles when it sits almost exactly between two. the
    // bubble's face goes through the same sampler.
    const LETTER_SCALE = 1.56;
    const SWAY_PX  = 0.1,   SWAY_HZ    = 0.4;  // along x
    const BOB_PX   = 0.1,   BOB_HZ     = 0.23; // along y
    const BREATHE  = 0.008, BREATHE_HZ = 0.31; // of the scale: 1.55 to 1.57
    const TILT_RAD = 0.006, TILT_HZ    = 0.17; // about the centre
    // the four together, as makeLetter takes them: the name's letters take
    // these too (NAME.WOBBLE), and could be given their own
    const WOBBLE = { SWAY_PX, SWAY_HZ, BOB_PX, BOB_HZ, BREATHE, BREATHE_HZ, TILT_RAD, TILT_HZ };
    // none of it: a letter, or a picture, that holds still
    const STILL = { SWAY_PX: 0, SWAY_HZ: 0, BOB_PX: 0, BOB_HZ: 0, BREATHE: 0, BREATHE_HZ: 0, TILT_RAD: 0, TILT_HZ: 0 };

    // the glyph cut to its ink columns as a sprite's bitmap, or null for a
    // blank
    function glyphInk(ch) {
      const rows = typeof FONT !== 'undefined' && FONT.glyphs[ch];
      if (!rows) return null;
      let lo = FONT.width, hi = -1;
      for (const r of rows) for (let i = 0; i < r.length; i++)
        if (r[i] === '#') { if (i < lo) lo = i; if (i > hi) hi = i; }
      if (hi < 0) return null;
      return Framebuffer.ink(rows.map((r) => r.slice(lo, hi + 1)));
    }

    // a stable number in [0, 1) from two integers
    function noise(i, k) {
      const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
      return s - Math.floor(s);
    }

    // the bitmap g centred on (cx, cy), drawn at scale and wobbled by wob,
    // its rates and phases seeded from i, in v: ink, or a colour of the
    // framebuffer's palette. g a picture ({ px, w, h }, the photo or a logo)
    // rather than ink, it goes through Framebuffer.spritePixels in its own
    // colours, wobbling as a letter does. g null, it is the wobble alone,
    // for something drawn its own way (the bubble)
    function makeLetter(g, cx, cy, i, scale = LETTER_SCALE, wob = WOBBLE, v = 1) {
      const rate = (base, k) => base * (0.8 + 0.4 * noise(i, k));
      const phase = (k) => 2 * Math.PI * noise(i, k);
      return {
        g, cx, cy, scale, wob, v,
        swayHz: rate(wob.SWAY_HZ, 1), bobHz: rate(wob.BOB_HZ, 2), breatheHz: rate(wob.BREATHE_HZ, 3), tiltHz: rate(wob.TILT_HZ, 4),
        swayPh: phase(5), bobPh: phase(6), breathePh: phase(7), tiltPh: phase(8),
        // where it is at time t: its centre, its scale and its tilt, { x, y, s, a }
        pose(t) {
          const w = 2 * Math.PI * t, m = this.wob;
          return {
            x: this.cx + m.SWAY_PX * Math.sin(w * this.swayHz + this.swayPh),
            y: this.cy + m.BOB_PX * Math.sin(w * this.bobHz + this.bobPh),
            s: this.scale * (1 + m.BREATHE * Math.sin(w * this.breatheHz + this.breathePh)),
            a: m.TILT_RAD * Math.sin(w * this.tiltHz + this.tiltPh),
          };
        },
        // at time t, dy world px down from home (up, for a scroll), into
        // the page's framebuffer or another, turned turn radians more
        // (clockwise) than its tilt, in v if given rather than its own. its
        // pose is pose(t)'s, worked out in place with no object made for
        // it. a picture unturned at its own size with its top left (x0, y0)
        // on a whole pixel is blitted, which lands it pixel for pixel as
        // the sprite would
        draw(t, dy = 0, into = fb, turn = 0, v = this.v) {
          const w = 2 * Math.PI * t, m = this.wob, g = this.g;
          const x = this.cx + m.SWAY_PX * Math.sin(w * this.swayHz + this.swayPh);
          const y = this.cy + m.BOB_PX * Math.sin(w * this.bobHz + this.bobPh) + dy;
          const s = this.scale * (1 + m.BREATHE * Math.sin(w * this.breatheHz + this.breathePh));
          const a = m.TILT_RAD * Math.sin(w * this.tiltHz + this.tiltPh) + turn;
          const x0 = x - g.w / 2, y0 = y - g.h / 2;
          if (!g.px) into.sprite(g, x, y, s, a, v);
          else if (s === 1 && a === 0 && Number.isInteger(x0) && Number.isInteger(y0)) into.blitPixels(g, x0, y0);
          else into.spritePixels(g, x, y, s, a);
        },
      };
    }

    // a line of text as letters, x and y the top-left of the first cell:
    // proportional, one column of air after each glyph, a space half a cell
    // wide, everything at LETTER_SCALE
    function layoutText(text, x, y, firstIndex) {
      const out = [];
      let i = firstIndex;
      for (const ch of text) {
        const g = glyphInk(ch);
        if (!g) { x += (FONT.width >> 1) * LETTER_SCALE; i++; continue; }
        out.push(makeLetter(g, x + g.w * LETTER_SCALE / 2, y + g.h * LETTER_SCALE / 2, i++));
        x += (g.w + 1) * LETTER_SCALE;
      }
      return out;
    }

    // the width of a line of text as layoutText lays it out
    function textWidth(text) {
      let w = 0, last = false;
      for (const ch of text) {
        const g = glyphInk(ch);
        w += (g ? g.w + 1 : (FONT.width >> 1)) * LETTER_SCALE;
        last = !!g;
      }
      return last ? w - LETTER_SCALE : w;
    }

    // --- the name ----------------------------------------------------------------
    // the name across the top left, in helvetica, as big as the page gives
    // it room for. it is not browser text: js/type.js fills each glyph once,
    // big, into an offscreen canvas and reads it back as a bitmap, and here
    // each one is a letter like the menu's, drawn through the same sampler
    // at the name's size with the same sway, bob, breathe and tilt, seeded
    // from its own place in the name. the bitmaps are made once, at the em;
    // a resize only places them and sets their scale, size over the em. at
    // these sizes the breathe and the tilt do most of the moving: the sway
    // and the bob are a tenth of a world pixel whatever its size. wide,
    // its ink's top left sits on the menu's margin, at SIZE or smaller when
    // the page is too narrow for that; narrow, it is centred across the top
    // and the bubble and the menu stack under it. the rest of the page keeps
    // GAP clear of its box. with no 2d canvas there is no name, as there
    // is no menu without font.js.
    //
    // its letters are a row of keys, each one struck on the piano as the
    // pointer comes onto it (the name's keys, below): a key is a column
    // from the name's ink top to its bottom, split from its neighbours
    // halfway between their inks, so the row has no gaps, the apostrophe is
    // as easy to hit as any letter and the space is shared by the r and the
    // d; the row ends at the first letter's ink and the last's. each
    // letter has a colour of the tag's three, in turn along the name,
    // drawn while the pointer is on it.
    const NAME = {
      TEXT: 'Peter D\'Angelo',
      SIZE: 114,       // world px to the em, the most it will be
      WIDTH: 0.68,     // of the viewport's width its ink may span, wide
      NARROW: 0.9,     // the same, stacked
      X: 21,           // its ink's left edge, wide: the menu's margin
      TOP: 21,         // world px from the top edge to its tallest ink
      GAP: 21,         // from its box's bottom to anything under it
      FIRST: 100,      // its letters' seeds run from here, clear of the menu's
      WOBBLE,          // the menu's sway, bob, breathe and tilt
    };
    const nameType = new Type(NAME.TEXT, () => document.createElement('canvas'));

    // the name's letters into letters, sized to fit and placed, and its
    // keys into nameRow; its ink's
    // box and size, { left, right, top, base, bottom, size } with base its
    // baseline and size world px to the em, or null
    // when there is no name. wide, it leaves room on its right for the tag
    // at its least
    function layoutName(stacked) {
      const t = nameType;
      nameRow = null;
      if (!t.glyphs.length) return null;
      const ems = (t.left + t.right) / TYPE.EM; // its ink's width, in ems
      const room = tagStair ? 2 * TAG.GAP + TAG.LEAST * tagStair.ems : 0;
      const size = Math.min(NAME.SIZE, (stacked ? NAME.NARROW * W : Math.min(NAME.WIDTH * W, W - NAME.X - room)) / ems);
      const k = size / TYPE.EM;
      // the line's origin on its baseline, from where its ink's top left goes
      const ox = (stacked ? (W - ems * size) / 2 : NAME.X) + k * t.left, base = NAME.TOP + k * t.ascent;
      const keys = t.glyphs.map((gl, i) => {
        const L = makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, NAME.FIRST + gl.at, k, NAME.WOBBLE);
        letters.push(L);
        return { L, lo: L.cx - k * gl.g.w / 2, hi: L.cx + k * gl.g.w / 2, v: tagLines[i % 3].v };
      });
      // each pair of keys meets halfway between their inks
      for (let i = 1; i < keys.length; i++) keys[i].lo = keys[i - 1].hi = (keys[i - 1].hi + keys[i].lo) / 2;
      const box = { left: ox - k * t.left, right: ox + k * t.right, top: NAME.TOP, base, bottom: base + k * t.descent, size };
      nameRow = { top: box.top, bottom: box.bottom, keys };
      return box;
    }

    // the name's keys, { top, bottom, keys }: the row's top and bottom, and
    // in glyph order each letter's key, { L, lo, hi, v }, the letter, the
    // key's left and right and the letter's colour, all world px on the
    // screen; or null when there is no name
    let nameRow = null;

    // the name's key at (x, y), world px on the screen, as its index, or -1
    function nameAt(x, y) {
      const r = nameRow;
      if (!r || y < r.top || y > r.bottom || x < r.keys[0].lo || x > r.keys[r.keys.length - 1].hi) return -1;
      let i = 0;
      while (x > r.keys[i].hi) i++;
      return i;
    }

    // --- the tag -----------------------------------------------------------------
    // what he does, three lines of helvetica beside the name, stepped down
    // to the right along their bubbles: each line's bubble stands a STEP
    // right of the one above's, so the bubbles go down a straight line
    // evenly apart and each line hangs off its own, each in its own
    // colour. they are the name's
    // kind of letter, through the same sampler with the same wobble, only
    // small. wide, they stand in the room right of the name: the stair's
    // ink starts GAP past the name's and keeps GAP from the right edge, the
    // first line's top is level with the name's top and the last line sits
    // on the name's baseline, at the most size that keeps LEAD between
    // baselines and the widest step inside the room. under LEAST it is too
    // small to read, so it stays at LEAST, the name narrowing to leave it
    // the room and the stair running on below the baseline. stacked, the
    // stair goes under the name at SIZE or less, centred across the page.
    //
    // each line holds a small bubble in its own colour (the tag's bubbles,
    // below), at the character its bubble names: after Inventor, between
    // Software and Engineer, before Musician. it is BUBBLE ems across with
    // its middle RISE ems over the baseline, about the middle of the caps,
    // and it stands SPACE ems clear of the ink either side of it, the
    // glyphs after it moved along to make the room.
    const TAG = {
      LINES: [
        { text: 'Inventor',          colour: '#49B6B0', bubble: 8 },
        { text: 'Software Engineer', colour: '#B8B693', bubble: 8 },
        { text: 'Musician',          colour: '#B5979A', bubble: 0 },
      ],
      // helvetica neue's medium: at this size regular's strokes fall
      // under a pixel and break up, and bold's fill the counters
      FACE: { weight: 500, family: '"Helvetica Neue", Helvetica, Arial, sans-serif' },
      STEP: 1.25, // ems each line's bubble stands right of the one above's
      LEAD: 1.1,  // the least baseline to baseline, in ems
      GAP: 21,    // world px clear of the name, and of the right edge
      LEAST: 15,  // world px to the em, wide, the least it will be
      SIZE: 17,   // world px to the em, stacked, the most it will be
      FIRST: 200, // its letters' seeds run from here, clear of the name's
      BUBBLE: 0.7, // ems across a line's bubble, about the caps' height
      RISE: 0.35,  // ems from the baseline up to the bubble's middle
      SPACE: 0.25, // ems clear of the ink either side of the bubble
      REACH: 6,    // world px past a bubble's skin a press still takes hold of it
    };
    const tagLines = TAG.LINES.map((l) => {
      const type = new Type(l.text, () => document.createElement('canvas'), TAG.FACE);
      return { type, v: Framebuffer.colour(l.colour), ...tagRoom(type, l.bubble) };
    });

    // where a line's bubble goes, in its type's px from its origin: the
    // glyphs before at stay, the bubble starts SPACE past their ink (at the
    // line's ink's left when there are none), and the glyphs from at on
    // move shift along to start SPACE past it. { at, shift, bx, right }:
    // bx the bubble's middle and right the line's ink's right with it in
    function tagRoom(t, at) {
      const em = TYPE.EM, edge = (gl, side) => gl.x + gl.dx + side * gl.g.w / 2;
      const before = t.glyphs.filter((gl) => gl.at < at), after = t.glyphs.filter((gl) => gl.at >= at);
      const x0 = before.length ? Math.max(...before.map((gl) => edge(gl, 1))) + TAG.SPACE * em : -t.left;
      const shift = after.length ? x0 + (TAG.BUBBLE + TAG.SPACE) * em - Math.min(...after.map((gl) => edge(gl, -1))) : 0;
      const right = Math.max(x0 + TAG.BUBBLE * em, ...after.map((gl) => edge(gl, 1) + shift), ...before.map((gl) => edge(gl, 1)));
      return { at, shift, bx: x0 + TAG.BUBBLE * em / 2, right };
    }

    // the stair: each line's ink's left in ems from the stair's, set so
    // its bubble's middle is a STEP right of the line above's, the stair's
    // width in ems, and the first line's ink above its baseline; null, and
    // no tag, when a line has no glyphs
    const tagStair = tagLines.every((l) => l.type.glyphs.length) ? (() => {
      const wide = tagLines.map((l) => (l.type.left + l.right) / TYPE.EM);
      const lefts = tagLines.map((l, i) => i * TAG.STEP - (l.type.left + l.bx) / TYPE.EM);
      const lo = Math.min(...lefts);
      return {
        lefts: lefts.map((x) => x - lo),
        ems: Math.max(...lefts.map((x, i) => x + wide[i])) - lo,
        asc: tagLines[0].type.ascent / TYPE.EM,
      };
    })() : null;

    // the tag's lines into letters beside the name's box, or under it
    // stacked, and each line's bubble made where it goes; the bottom of
    // its ink, or null when there is no tag
    function layoutTag(name, stacked) {
      tagBubbles = [];
      if (!name || !tagStair) return null;
      const n = tagLines.length, em = TYPE.EM, { ems, asc } = tagStair;
      let size, x, top, lead;
      if (stacked) {
        size = Math.min(TAG.SIZE, NAME.NARROW * W / ems);
        x = (W - ems * size) / 2;
        top = name.bottom + NAME.GAP / 2;
        lead = TAG.LEAD * size;
      } else {
        x = name.right + TAG.GAP;
        top = name.top;
        const across = (W - TAG.GAP - x) / ems, down = (name.base - top) / (asc + (n - 1) * TAG.LEAD);
        size = Math.min(across, Math.max(TAG.LEAST, down));
        lead = n > 1 ? Math.max(TAG.LEAD * size, (name.base - top - size * asc) / (n - 1)) : 0;
      }
      if (!(size > 0)) return null;
      const k = size / em;
      let base = top + size * asc;
      tagLines.forEach((l, i) => {
        const t = l.type, ox = x + tagStair.lefts[i] * size + k * t.left;
        base = top + size * asc + i * lead;
        for (const gl of t.glyphs)
          letters.push(makeLetter(gl.g, ox + k * (gl.x + gl.dx + (gl.at >= l.at ? l.shift : 0)), base + k * gl.dy, TAG.FIRST + 50 * i + gl.at, k, WOBBLE, l.v));
        tagBubbles.push(makeTagBubble(ox + k * l.bx, base - TAG.RISE * size, TAG.BUBBLE * size / 2, l.v));
      });
      return base + k * tagLines[n - 1].type.descent;
    }

    // --- the sections ------------------------------------------------------------
    // words down the page under the header (the name and its tag), each a
    // section that opens (SECTIONS, below): About, Professional work,
    // Personal work, Doodles and Contact.
    // they are in the name's helvetica at SIZE of the name's size, or less
    // when the widest would not fit across the screen, their ink's left
    // INDENT in from the name's (each centred, stacked), the first's top BELOW of the
    // name's ems under the header's ink and each next one's SPACE of their
    // size under the one before's. they are what scrolls: the document
    // itself never does, a finger or the wheel scrolls the page (the swipe
    // and the wheel, below), and each frame the words are
    // drawn that far up, in whole world px so they move
    // rigidly rather than shimmer through the sampler. they go down before
    // the header's letters, and a letter writes only its ink, so passing
    // under the header they are hidden by its letters and nothing else:
    // there is only paper behind the header. it scrolls until the last
    // word's ink, or its box's while there is one, stands END above the
    // window's bottom edge, and not at all while it already does.
    //
    // an open box pushes every word under it down, and their boxes, by as
    // far as its bottom has got past its own word's ink, in whole px, so
    // the next word keeps SPACE under the box as it kept under the word,
    // and rides down with the box as it opens and back up as it shuts.
    const ABOUT = {
      SIZE: 0.6,   // of the name's world px to the em, the most
      BELOW: 1,    // the name's ems from the header's ink to the first word's ink
      SPACE: 1.8,  // of the words' size: from a word's ink, or its box, to the next word's ink
      INDENT: 0.4, // of the words' size: their ink's left in from the name's, wide
      FIRST: 300,  // their letters' seeds run from here, a hundred a word, clear of the tag's
      END: 64,     // world px from the last word's ink, or its box, to the window's bottom edge at the page's end
    };
    let scrollEnd = 0; // css px the page scrolls at most

    // --- the boxes -----------------------------------------------------------------
    // a press on a word opens a box round it: a slightly rounded rect, a
    // LINE px outline through the framebuffer like everything, that grows
    // out of the word's o. shut, the box is the o: a ring LINE px thick in
    // the o's own ink box, its corners as round as they go, drawn in the
    // o's place all the time, where the o's glyph is not drawn, with the
    // insides showing through it; open, it stands PAD clear of the
    // words' ink at its top and left (every box the same width, edged by
    // the word furthest left), as far in from the window's right, and,
    // with the photo, down to as far up from the window's bottom, or past
    // it when its insides need more; without, as far down as its text
    // needs. every edge and the corners' radius go from one to the other
    // together, by how far open it is, and that moves on a spring,
    // RESPONSE s a swing, pulled toward open or back toward the o from
    // wherever it has got to and at whatever speed. opening, it swings
    // past open, further the more BOUNCE, the words under it pushed with
    // it, and settles back; shutting, it speeds into the o and stops
    // there, never smaller. each frame steps the spring exactly by the
    // frame's length, so it moves alike at any frame rate. where the
    // spring has it is where the box is headed; its shape is a skin
    // (js/skin.js), a ring of points chasing that outline, its corners'
    // and edges' middles pulled hardest so they lead and drag the rest
    // after them like jelly, gaining points as it grows and shedding them
    // as it shrinks. it is filled from the insides and outlined LINE px,
    // as the bubbles are, in the word's hover colour while the word is
    // hovered. it is
    // drawn over the word, so it covers the word as it grows and shows it
    // again as it shrinks. open, an x stands in its top left corner, inside
    // its padding where the word's ink starts: the pixel font's X (font.js,
    // the old menu's) at CLOSE of its own size, with the text's wobble, the
    // text and photo
    // starting under it where the word was. a press on the x sends the
    // box back into the o,
    // from wherever it has got to. while it is open the word, under it, is
    // not pressed; while it is shrinking a press on the word opens it again.
    //
    // Doodles' box holds items as the work boxes do, one of them so far:
    // bubble bob, whose o is the bubble's (below), a ring BOB of
    // Doodles' o across and up, sitting on the baseline and bigger than
    // the name round it. it is his item's bubble shut, so his item has no
    // bubble round its caret and name; open, it grows out of the o into a
    // box round them and the game under them, as wide as the box's
    // insides and BUBBLE of About's box's height. in the others, their text in the
    // tag's face, under the x at BODY size wide
    // (no wider than MEASURE) and at PHONE size stacked, and, in About's,
    // a slideshow: the photos (SLIDES, js/about-photos.js) one at a time
    // in a frame, the same for every one so nothing moves when it changes,
    // the one shown dithered at the frame's size in its own few colours,
    // each a place in the framebuffer's palette, cut to fill the frame
    // about its own focus, and captioned under it, a line each. on the
    // caption's first line, right of it, a <, which slide it is of how
    // many (2 / 4) and a >, SLIDE_GAP apart, the >'s ink ending at the
    // frame's right. a press on the < shows the slide before, on the > or
    // anywhere on the frame the slide after, round from the last to the
    // first and back, there and then, with nothing between. wide, the
    // frame stands in the top right corner, ASPECT as wide as it is tall
    // and as tall as the box at rest leaves over the longest caption, and
    // the text under the word left of it, at BODY size. stacked (a phone)
    // everything goes down the box: the word, the frame across it, the
    // text at PHONE size, and the box is a portrait that fits the screen
    // under the header, the frame taking the height the text leaves it,
    // no taller than ASPECT has it and no shorter than CROP of its width
    // (the box grows past the screen only when the text leaves less than
    // that). they are laid out to
    // the open box and there all along, drawn each frame into a framebuffer
    // of their own (cfb) and copied into the page's only inside the skin
    // (Framebuffer.fillPolygon), so what lies behind the o is seen through
    // it before a press and the growing box wipes the rest in. box,
    // insides and word scroll together and go under the header alike.
    const BOX = {
      PAD: 0.2,      // of the word's size: its ink to the box's edge
      RADIUS: 0.15,  // of the word's size: the open box's corners
      LINE: 2,       // world px, the outline's thickness open, and the x's strokes'
      CLOSE: 1,      // the scale the pixel font's X is drawn at, turned a quarter: 1 is its own pixels, 11 world px wide
      RATE: 0.3,     // an item's text: of the way left to open each 60 hz frame opening, of the way from open shutting
      HEAD: 0.08,    // an item's text shutting: the way from open grows as if this much further, its start's speed over its end's
      RESPONSE: 0.4, // seconds, the box's spring's swing undamped: how quick it swings
      BOUNCE: 0.35,  // how far it swings past open and back: its damping is 1 - BOUNCE, so over 0 and under 1 (0.35 swings about 7 % past open)
      WARBLE: 0.24,  // world px each edge drifts either way, on its own slow sine at the letters' rates
      GAP: 0.45,     // of the word's size: from under its ink to the insides
      PHOTO: 0.45,   // of the insides' width the photo's frame may take, wide
      ASPECT: 0.8,   // the photo's frame's width over its height, wide, and the least, stacked
      BODY: 0.18,    // of the name's size: the text's world px to the em, wide,
      LEAST: 12,     // but no less than this
      MOST: 16,      // and no more than this
      PHONE: 11,     // the text's world px to the em, stacked
      CROP: 0.45,    // the least the photo's frame is tall, of its width, stacked
      LEAD: 1.45,    // ems, baseline to baseline
      PARA: 0.7,     // ems more between paragraphs
      GUTTER: 1.5,   // ems between the text and the photo
      MEASURE: 40,   // ems the text may run across, wide, with no photo beside it
      SLACK: 1,      // ems from the insides' furthest ink right to the edge's padding, in a box with no photo
      ITEM: 1.3,     // of the text's size: the items' (a caret and a name each), in a box that has them
      ROW: 1.9,      // the items' ems, baseline to baseline, every one shut
      CARET: 0.45,   // the items' ems from the caret's ink to the name's
      DROP: 0.6,     // the items' ems from under a name to its text's top
      FLIP: 2.76,    // how many times as fast an item's caret turns as its text opens
      ITEM_PAD_X: 0.5, // the items' ems from an item's bubble's left to its caret's ink, from its furthest ink right to its right, and from its text's bottom to its bottom open
      ITEM_PAD_Y: 0.25, // the items' ems from a name's caps and descenders to its bubble's top and bottom, shut
      ITEM_CAP: 0.75, ITEM_DESC: 0.2, // the items' ems, the face's caps over its baseline and descenders under
      ITEM_RADIUS: 0.4, // the items' ems, an item's bubble's corners
      ITEM_SPREAD: 50, // world px, how far along an item's skin an anchor's pull reaches: less bows deeper as it opens, and under about 50 its top dips through its name
      LOGO_W: 12,    // the text's ems an item's logo may span, at most
      LOGO_H: 4,     // and stand, at most
      LOGO_LEAST: 20, // the text's ems its text keeps beside the logo, else the logo goes above it
      LOGO_GAP: 2.5, // the text's ems between one logo and the next, under it or beside it
      LOGO_WARBLE: true, // whether the logos wobble as the text does; a logo's own warble says otherwise
      LOGO_COLOURS: 8, // its own colours, black and the paper among them,
      PRODUCT_COLOURS: 16, // or this many for a photo of a thing rather than a flat logo
      BUBBLE: 0.45,  // of the photo's box's height, bubble bob's open box's
      BOB: 0.5,      // of Doodles' o, across and up, bubble bob's o's
      FIRST: 1000,   // the text's seeds run from here, a thousand a paragraph, ten thousand a box
      CAP: 0.85,     // of the text's size, the caption's, no less than CAP_LEAST
      CAP_LEAST: 10, // world px to the em
      CAP_GAP: 0.6,  // the caption's ems between the photo's frame and its first line's top
      CAP_LEAD: 1.3, // the caption's ems, baseline to baseline
      SLIDE_GAP: 0.6, // the caption's ems between the slideshow's <, its count and its >
    };
    // the slideshow's photos in the order it shows them, each a key of
    // js/about-photos.js, its caption, a line each, and its focus: where in
    // the photo (of its width, of its height) its crop is centred, as far
    // as the photo goes, the face
    const SLIDES = [
      { key: 'maine', caption: ['Portland, Maine', 'Aug 2026'], focus: [0.4, 0.3] },
      { key: 'portland', caption: ['Portland, Oregon', '2026'], focus: [0.4, 0.2] },
      { key: 'dc', caption: ['Washington, DC', '2026'], focus: [0.49, 0.29] },
      { key: 'oscar', caption: ['Oscar', 'Washington, DC', '2026'], focus: [0.32, 0.4] },
    ];
    const LOREM = [
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
      'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
    ];
    const loremTypes = LOREM.map((p) => new Type(p, () => document.createElement('canvas'), TAG.FACE));
    // the slides as the page keeps them: each its caption's lines and its
    // count (2 / 4) as type, made once, and its photo, an image, with its
    // own colours once it has loaded (photoPalette) and its dithers by
    // size (ditherPhoto); and the < and > either side of the count
    const slides = SLIDES.map((d, i) => ({
      ...d,
      types: d.caption.map((line) => new Type(line, () => document.createElement('canvas'), TAG.FACE)),
      count: new Type((i + 1) + ' / ' + SLIDES.length, () => document.createElement('canvas'), TAG.FACE),
      img: new Image(),
      colours: null,
      dithers: new Map(),
    }));
    const backType = new Type('<', () => document.createElement('canvas'), TAG.FACE);
    const onType = new Type('>', () => document.createElement('canvas'), TAG.FACE);
    const caretType = new Type('>', () => document.createElement('canvas'), TAG.FACE);
    const LINK_SEP = ' | '; // between an item's links

    // each section: its word, what goes in its box (paragraphs of type,
    // and the photo or not, or items) and, laid out, its
    // letters and its box. every
    // place below is world px from the page's top as laid out, with every
    // box above it shut; off is how far down the boxes above have it now.
    // o is which of the word's o's, from 0, its shut box is: that o is
    // drawn as the box, not as a letter. a section's text and each item's
    // are js/text.js's (readText, below)
    const SECTIONS = [
      { title: 'About',             photo: true,  o: 0 },
      { title: 'Professional work', photo: false, o: 0, items: [
        { title: 'Sennheiser',        logos: [{ key: 'soundbase' }, { key: 'sennheiser' }], links: [['soundbase.app', 'https://soundbase.app'], ['sennheiser.com', 'https://www.sennheiser.com']] },
        { title: 'BrandNewNoise',     logos: [{ key: 'brandnewnoise' }, { key: 'reversethecurse', scale: 2, photo: true }], links: [['brandnewnoise.com', 'https://www.brandnewnoise.com']] },
        { title: 'Critter & Guitari', logos: [{ key: 'critterandguitari', scale: 0.8, dx: -1 }], links: [['critterandguitari.com', 'https://critterandguitari.com']] },
      ] },
      { title: 'Personal work',     photo: false, o: 0, items: [
        { title: 'Cicada' },
        { title: 'Monk Mouth',        demo: true, links: [['github.com/dangelo729/monk_mouth', 'https://github.com/dangelo729/monk_mouth']] },
        { title: 'Third Dimension',   ship: true, links: [['github.com/dangelo729/third_dimension', 'https://github.com/dangelo729/third_dimension']] },
        { title: 'Second Dimension',  daedalus: true, links: [['github.com/dangelo729/second_dimension', 'https://github.com/dangelo729/second_dimension']] },
        { title: 'Upright' },
        { title: 'This website!' },
      ] },
      { title: 'Doodles',           photo: false, o: 0, items: [
        { title: 'Bubble Bob', game: true },
      ] },
      { title: 'Contact',           photo: false, o: 0 },
    ];
    const sections = SECTIONS.map((s, n) => ({
      ...s,
      n,                // its place: its seeds run from its word's hundred and its box's ten thousand
      type: new Type(s.title, () => document.createElement('canvas')),
      letters: [],      // the word's
      ink: null,        // the word's ink box, { x0, y0, x1, y1 }
      off: 0,           // whole world px
      body: [],         // its text, a paragraph each, as type (readText)
      box: {
        open: false,  // where it is going: open, or back into the o
        shown: false, // out of the o: from a press until it is back in it
        p: 0,         // how far open it is, 0 in the o to 1 open
        v: 0,         // how fast p is moving, a second
        shut: null,   // where it starts and ends: the o's ink box, { x0, y0, x1, y1, r }
        full: null,   // where it opens to
        close: null,  // the x in its corner, { x, y, w, h, letter }: its ink's top left and size
      },
      skin: null,       // its box's shape, laid out: a ring of points chasing it (js/skin.js)
      bodyLetters: [],  // its text's
      // its items, each { title, open, p, ... }: where it is going and how
      // far open its text is, as a box's, and how far its caret has turned
      // from > to v (turn); laid out, its caret and its
      // name's letters, its text's, its shut baseline, where its text is
      // cut from (clip) and how tall the text stands under that (span),
      // its bubble shut, round its caret and name (shut), and full, round
      // its text open too (full), each with its corners' radius, how far
      // it pushes the items under it open (ext: as far as its bubble grows
      // down, so the next bubble keeps the gap under this one open that it
      // kept under it shut), the box from its bubble's left round its
      // caret and name (hit) and how far the texts above push it now
      // (shift), its furthest ink right and how much further than the
      // rows' it takes the box's right open (wide), and its skin, a ring of
      // points chasing its bubble (js/skin.js), each of the bubble's edges
      // warbling on its own sine as the box's do (warble). rest and restX1 are
      // the box's bottom and right with every item shut. its links go on a
      // line of their own under its text, LINK_SEP between: linkType is
      // the line, and each link { label, url } is laid out with its letters
      // and the box round them (hit). game: it is bubble bob, his bubble
      // shut his o and open the game (layoutItems). demo: it holds monk
      // mouth's menu, its face and its ribbon where its logos would go,
      // laid out as demoAt (the demo, below). ship: it holds the ship in a
      // bottle there, laid out as shipAt (the ship, below). daedalus: it
      // holds daedalus over its text, laid out as daedalusAt (daedalus's
      // body, below)
      items: (s.items || []).map((x, i) => ({
        title: x.title, game: !!x.game, demo: !!x.demo, demoAt: null, ship: !!x.ship, shipAt: null, daedalus: !!x.daedalus, daedalusAt: null, type: new Type(x.title, () => document.createElement('canvas'), TAG.FACE),
        body: [], // its text, as its section's
        links: (x.links || []).map(([label, url]) => ({ label, url, letters: [], hit: null })),
        // its logos, each { key, scale, dx, photo, warble }: a key of
        // js/logos.js, how big it may be of LOGO_W and LOGO_H, how many of
        // the text's ems it is nudged right of the column, whether it is a
        // photo (its colours PRODUCT_COLOURS) and whether it wobbles (else
        // as LOGO_WARBLE has it); laid out, each dithered, placed and made
        // a letter that wobbles,
        // { g, x, y, letter }
        logos: x.logos || [], logosAt: [],
        linkType: new Type((x.links || []).map((l) => l[0]).join(LINK_SEP), () => document.createElement('canvas'), TAG.FACE),
        open: false, p: 0, turn: 0, caret: null, letters: [], text: [], base: 0, clip: 0, span: 0, ext: 0, hit: null, shift: 0, right: 0, wide: 0,
        shut: null, full: null, skin: null,
        warble: [WOBBLE.SWAY_HZ, WOBBLE.BOB_HZ, WOBBLE.SWAY_HZ, WOBBLE.BOB_HZ].map((hz, e) => ({
          hz: hz * (0.8 + 0.4 * noise(BOX.FIRST + 10000 * n + 3000 + 100 * i - 3, e)),
          ph: 2 * Math.PI * noise(BOX.FIRST + 10000 * n + 3000 + 100 * i - 3, e + 4),
        })),
      })),
      rest: 0,
      restX1: 0,
      // with the photo, the slideshow: which slide it shows, from 0, and,
      // laid out, the photo's frame, its top left and size, whole px, with
      // every slide's caption's letters (captions) and count (counts) and
      // the < and > (back, on), each of those three its ink's top left and
      // size and its letters, { x, y, w, h, letters }: { x, y, w, h,
      // captions, counts, back, on }
      slide: 0,
      show: null,
      photoAt: null,    // the shown slide's photo dithered, its top left and it as a letter that wobbles, { g, x, y, letter }, once it has loaded
      // with bubble bob, the bubble's world's place in his open box, whole
      // px, the text's size there, how far his caret's ink is in from its
      // left, and its wobble, a letter's with nothing to draw:
      // { x, y, w, h, size, inset, letter }
      room: null,
      // its warble: each edge its own sine, left and right at about the
      // letters' sway rate and top and bottom their bob's, rates and
      // phases seeded as a letter's are
      warble: [WOBBLE.SWAY_HZ, WOBBLE.BOB_HZ, WOBBLE.SWAY_HZ, WOBBLE.BOB_HZ].map((hz, e) => ({
        hz: hz * (0.8 + 0.4 * noise(BOX.FIRST + 10000 * n - 2, e)),
        ph: 2 * Math.PI * noise(BOX.FIRST + 10000 * n - 2, e + 4),
      })),
    }));

    // every section's text and every item's as type, a paragraph each, from
    // text (TEXT, js/text.js): a section's is under its title there, an
    // item's under its own title under its section's, and an item with
    // none has lorem ipsum
    function readText(text) {
      const types = (words) => words.map((p) => new Type(p, () => document.createElement('canvas'), TAG.FACE));
      for (const s of sections) {
        const words = text[s.title] || [];
        const whole = Array.isArray(words);
        s.body = whole ? types(words) : [];
        for (const it of s.items) {
          const own = whole ? null : words[it.title];
          it.body = own && own.length ? types(own) : loremTypes;
        }
      }
    }
    readText(TEXT);

    // the logos, each once it has loaded with its own few colours worked
    // out once, as the photos' are, by key: { img, colours, dithers }, the
    // last its dithers by size (ditherLogo). the page is laid out again
    // with each
    const logoArt = {};
    const photoLogos = new Set(SECTIONS.flatMap((s) => (s.items || []).flatMap((x) => (x.logos || []).filter((l) => l.photo).map((l) => l.key))));
    if (typeof LOGOS !== 'undefined') for (const key in LOGOS) {
      const img = new Image();
      img.onload = () => {
        const colours = imagePalette(img, photoLogos.has(key) ? BOX.PRODUCT_COLOURS : BOX.LOGO_COLOURS);
        if (!colours) return;
        logoArt[key] = { img, colours, dithers: new Map() };
        if (fb) layout();
      };
      img.src = LOGOS[key];
    }

    // each slide's photo, loaded on its own: once it has, its colours are
    // worked out, any dithers it had are let go, and the page is laid out
    // again
    for (const sl of slides) {
      sl.img.onload = () => { sl.colours = photoPalette(sl.img); sl.dithers.clear(); if (fb) layout(); };
      if (typeof ABOUT_PHOTOS !== 'undefined' && ABOUT_PHOTOS[sl.key]) sl.img.src = ABOUT_PHOTOS[sl.key];
    }

    // a photo, img, or the part of it crop gives ({ sx, sy, sw, sh } in its
    // own px), drawn at w x h into a canvas and read back as r, g, b, its
    // levels stretched so its darkest and lightest LEVELS (by brightness)
    // go to black and white, and, sharp, each channel sharpened by SHARPEN
    // of its difference from a 3 x 3 blur so edges survive the dither;
    // null if the canvas cannot be read
    const PHOTO = { LEVELS: 0.02, SHARPEN: 1, COLOURS: 32, SAMPLE: 128, WARBLE: false }; // WARBLE: whether it wobbles as the text does
    function readPhoto(img, w, h, sharp, crop) {
      try {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.imageSmoothingQuality = 'high';
        if (crop) x.drawImage(img, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, w, h);
        else x.drawImage(img, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, n = w * h, rgb = new Float32Array(3 * n), bright = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          for (let k = 0; k < 3; k++) rgb[3 * i + k] = d[4 * i + k];
          bright[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
        }
        bright.sort();
        const lo = bright[Math.floor(PHOTO.LEVELS * (n - 1))], hi = bright[Math.ceil((1 - PHOTO.LEVELS) * (n - 1))];
        const span = Math.max(1, hi - lo);
        for (let i = 0; i < 3 * n; i++) rgb[i] = Math.min(255, Math.max(0, (rgb[i] - lo) / span * 255));
        if (!sharp) return rgb;
        const out = new Float32Array(3 * n);
        for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) for (let k = 0; k < 3; k++) {
          let sum = 0, cnt = 0;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const qx = px + dx, qy = py + dy;
            if (qx >= 0 && qx < w && qy >= 0 && qy < h) { sum += rgb[3 * (qy * w + qx) + k]; cnt++; }
          }
          const i = 3 * (py * w + px) + k;
          out[i] = rgb[i] + PHOTO.SHARPEN * (rgb[i] - sum / cnt);
        }
        return out;
      } catch (e) {
        return null;
      }
    }

    // the paper's colour as [r, g, b], the palette's first: what an image is
    // drawn over, and the colour its palette has for paper
    function paperRGB() {
      const w = Framebuffer.PALETTE[0];
      return [w & 255, w >> 8 & 255, w >> 16 & 255];
    }

    // an image drawn at w x h over paper, read back as r, g, b; null if the
    // canvas cannot be read
    function readImage(img, w, h) {
      try {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.fillStyle = 'rgb(' + paperRGB().join(',') + ')';
        x.fillRect(0, 0, w, h);
        x.imageSmoothingQuality = 'high';
        x.drawImage(img, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, n = w * h, rgb = new Float32Array(3 * n);
        for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) rgb[3 * i + k] = d[4 * i + k];
        return rgb;
      } catch (e) {
        return null;
      }
    }

    // a logo's own colours, as a photo's: n less two by median cut over
    // it at PHOTO.SAMPLE px wide, and black and the paper, each a place in
    // the framebuffer's palette. { rgb, v }, or null
    function imagePalette(img, n) {
      const w = PHOTO.SAMPLE, h = Math.max(1, Math.round(w * img.naturalHeight / img.naturalWidth)), rgb = readImage(img, w, h);
      if (!rgb) return null;
      const colours = [[0, 0, 0], paperRGB(), ...Framebuffer.medianCut(rgb, n - 2)];
      const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
      return { rgb: colours, v: colours.map((c) => Framebuffer.colour(hex(c))) };
    }

    // make() for key, a dithered picture or null, kept in memo: a layout
    // at a size laid out lately (a phone's toolbar going and coming back
    // resizes between two) finds it made. the MEMO keys asked for latest
    // are kept, and a null is not
    const MEMO = 8;
    function remember(memo, key, make) {
      let g = memo.get(key);
      if (g) memo.delete(key);
      else if (!(g = make())) return null;
      memo.set(key, g);
      if (memo.size > MEMO) memo.delete(memo.keys().next().value);
      return g;
    }

    // a logo at w x h in its colours, dithered as a photo is: a bitmap
    // { px, w, h } of the framebuffer's v's, or null. each size made is
    // kept with the logo (art.dithers)
    function ditherLogo(art, w, h) {
      return remember(art.dithers, w + 'x' + h, () => {
        const rgb = readImage(art.img, w, h);
        if (!rgb) return null;
        const g = Framebuffer.ditherColour(rgb, w, h, art.colours.rgb);
        for (let i = 0; i < g.px.length; i++) g.px[i] = art.colours.v[g.px[i]];
        return g;
      });
    }

    // a photo's own colours, worked out once it has loaded: COLOURS less
    // two by median cut over it at SAMPLE px wide, and black and the paper,
    // each given a place in the framebuffer's palette. { rgb, v }, or null
    function photoPalette(img) {
      const w = PHOTO.SAMPLE, h = Math.round(w * img.naturalHeight / img.naturalWidth), rgb = readPhoto(img, w, h, false);
      if (!rgb) return null;
      const colours = [[0, 0, 0], paperRGB(), ...Framebuffer.medianCut(rgb, PHOTO.COLOURS - 2)];
      const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
      return { rgb: colours, v: colours.map((c) => Framebuffer.colour(hex(c))) };
    }

    // the most of a slide's photo that fills w x h, centred on its focus
    // as far as the photo goes: { sx, sy, sw, sh } in its own px
    function photoCrop(sl, w, h) {
      const nw = sl.img.naturalWidth, nh = sl.img.naturalHeight, want = w / h;
      let sw = nw, sh = nh;
      if (want > nw / nh) sh = nw / want;
      else sw = nh * want;
      return {
        sx: Math.min(nw - sw, Math.max(0, sl.focus[0] * nw - sw / 2)),
        sy: Math.min(nh - sh, Math.max(0, sl.focus[1] * nh - sh / 2)),
        sw, sh,
      };
    }

    // a slide's photo at w x h in its colours, cut to fill it, dithered: a
    // bitmap { px, w, h } of the framebuffer's v's, or null until it has
    // loaded. each size made is kept with the slide (sl.dithers), until its
    // colours are worked out again
    function ditherPhoto(sl, w, h) {
      if (!sl.colours) return null;
      return remember(sl.dithers, w + 'x' + h, () => {
        const rgb = readPhoto(sl.img, w, h, true, photoCrop(sl, w, h));
        if (!rgb) return null;
        const g = Framebuffer.ditherColour(rgb, w, h, sl.colours.rgb);
        for (let i = 0; i < g.px.length; i++) g.px[i] = sl.colours.v[g.px[i]];
        return g;
      });
    }

    // a paragraph's glyphs in lines no wider than width, in the type's px:
    // each line its glyphs and its ink's left. words break where the text
    // has white space between two glyphs, and a word goes on the line when
    // the line's ink with it is no wider than width, else starts the next
    function wrapType(t, width) {
      const words = [];
      let word = null, prev = null;
      for (const gl of t.glyphs) {
        if (!word || /\s/.test(t.text.slice(prev.at + prev.ch.length, gl.at)))
          words.push(word = { glyphs: [], left: Infinity, right: -Infinity });
        word.glyphs.push(gl);
        word.left = Math.min(word.left, gl.x + gl.dx - gl.g.w / 2);
        word.right = Math.max(word.right, gl.x + gl.dx + gl.g.w / 2);
        prev = gl;
      }
      const lines = [];
      let line = null;
      for (const w of words) {
        if (line && w.right - line.left <= width) {
          line.glyphs.push(...w.glyphs);
          line.right = w.right;
        } else lines.push(line = { glyphs: [...w.glyphs], left: w.left, right: w.right });
      }
      return lines;
    }

    // the words into letters down the page under the header, whose ink
    // ends at bottom, their boxes shut and open laid out round them, and
    // the page made tall enough to scroll them away
    function layoutSections(name, bottom, stacked) {
      for (const s of sections) {
        s.letters = [];
        s.bodyLetters = [];
        s.show = s.photoAt = s.room = null;
        s.ink = s.box.shut = s.box.full = s.box.close = null;
        s.skin = null;
      }
      const laid = name ? sections.filter((s) => s.type.glyphs.length) : [];
      if (laid.length) {
        // one size for them all, the most the widest leaves room for
        const widest = Math.max(...laid.map((s) => (s.type.left + s.type.right) / TYPE.EM));
        const size = Math.min(ABOUT.SIZE * name.size, stacked ? NAME.NARROW * W / widest : (W - 2 * NAME.X) / (widest + ABOUT.INDENT)), k = size / TYPE.EM;
        let y = bottom + ABOUT.BELOW * name.size; // the next word's ink's top
        for (const s of laid) {
          const t = s.type, ems = (t.left + t.right) / TYPE.EM;
          const ox = (stacked ? (W - ems * size) / 2 : name.left + ABOUT.INDENT * size) + k * t.left, base = y + k * t.ascent;
          let o = null, os = 0;
          for (const gl of t.glyphs) {
            const L = makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, ABOUT.FIRST + 100 * s.n + gl.at, k, WOBBLE);
            s.letters.push(L);
            // its o, the first glyph until there is one, and the last
            // o it has if it has fewer: its letter laid out for its place
            // and size, which its box takes shut
            if (!o || (gl.ch === 'o' && os++ <= s.o)) o = { L, cx: L.cx, cy: L.cy, w: k * gl.g.w, h: k * gl.g.h };
          }
          // the box shut is the o, so its letter is not drawn
          s.letters.splice(s.letters.indexOf(o.L), 1);
          s.ink = { x0: ox - k * t.left, y0: y, x1: ox + k * t.right, y1: base + k * t.descent };
          s.box.shut = { x0: o.cx - o.w / 2, y0: o.cy - o.h / 2, x1: o.cx + o.w / 2, y1: o.cy + o.h / 2, r: Math.min(o.w, o.h) / 2 };
          y = s.ink.y1 + ABOUT.SPACE * size;
        }
        const edge = Math.max(2, Math.min(NAME.X, ...laid.map((s) => s.ink.x0)) - BOX.PAD * size);
        for (const s of laid) layoutBox(s, name, size, stacked, edge);
        // each box's skin settled where its box is now: laid out again, it
        // is put straight there rather than sent across
        for (const s of laid) if (s.box.full) s.skin = new Skin(boxAt(s, s.box.p));
      }
      settle();
    }

    // a section's open box round its word at size, edge in from either
    // side of the window, and its insides laid out in it, wide or stacked
    function layoutBox(s, name, size, stacked, edge) {
      const box = s.box, seed = BOX.FIRST + 10000 * s.n, pad = BOX.PAD * size;
      const x0 = edge, x1 = W - edge, y0 = s.ink.y0 - pad, rest = H - edge;
      const ix0 = x0 + pad, ix1 = x1 - pad, iw = ix1 - ix0, under = s.ink.y1 + BOX.GAP * size;
      const bs = stacked ? BOX.PHONE : Math.min(BOX.MOST, Math.max(BOX.LEAST, BOX.BODY * name.size)), bk = bs / TYPE.EM;
      // the x in the top left corner, at CLOSE; what
      // goes under the word starts a line's space under the x instead
      box.close = null;
      const xg = glyphInk('X');
      if (xg) {
        // turned a quarter, so it stands as wide as the glyph is tall
        const xs = BOX.CLOSE, xw = xg.h * xs, xh = xg.w * xs, cy = s.ink.y0;
        // strip: the band across the top of the box it answers for, from the
        // box's top to halfway down to what is under it
        box.close = { x: ix0, y: cy, w: xw, h: xh, strip: [y0, cy + xh + 0.45 * bs], letter: makeLetter(xg, ix0 + xw / 2, cy + xh / 2, seed - 1, xs, WOBBLE) };
      }
      const top = box.close ? box.close.y + box.close.h + 0.9 * bs : under;
      if (s.items.length) return layoutItems(s, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1);
      // the caption under the photo's frame, and how tall it stands with
      // its gap (capTall): as tall as the slide with the most lines has it,
      // so the frame is the same for every slide, and drop lines more. the
      // slideshow's <, count and > go on its first line, right of it, and
      // need the frame across to stand two SLIDE_GAPs clear of the widest
      // first line; in a frame narrower than that they keep the first line
      // to themselves and the captions go down one (drop)
      const cs = Math.max(BOX.CAP_LEAST, BOX.CAP * bs), ck = cs / TYPE.EM, gap = BOX.SLIDE_GAP * cs;
      const wide = (t) => ck * (t.left + t.right), most = (f) => Math.max(...slides.map(f));
      const across = most((sl) => sl.types.length && wide(sl.types[0])) + 3 * gap + wide(backType) + most((sl) => wide(sl.count)) + gap + wide(onType);
      const capTall = (drop) => (BOX.CAP_GAP + 0.75 + (most((sl) => sl.types.length) - 1 + drop) * BOX.CAP_LEAD + 0.3) * cs;
      let drop = 0, capH = capTall(drop);
      // with no photo the text goes under the x, across the box stacked
      // and no wider than MEASURE wide
      let px = ix0, py = top, pw = iw, ph = 0, tw = stacked ? iw : Math.min(iw, BOX.MEASURE * bs), ty = top - 0.03 * bs;
      if (s.photo && !stacked) {

        // the text under the x left of it
        py = s.ink.y0;
        const fit = () => {
          ph = Math.max(rest - pad - py - capH, 8 * bs);
          pw = ph * BOX.ASPECT;
          if (pw > BOX.PHOTO * iw) { pw = BOX.PHOTO * iw; ph = pw / BOX.ASPECT; }
        };
        fit();
        if (pw < across) { capH = capTall(drop = 1); fit(); }

      const paras = s.body.map((t) => wrapType(t, tw / bk));
      const lines = paras.reduce((n, p) => n + p.length, 0);
      const textH = 1.05 * bs + (lines - 1) * BOX.LEAD * bs + (paras.length - 1) * BOX.PARA * bs;
      let inside = top; // the insides' bottom
      if (s.photo) {
        if (stacked) {

          // screen leaves over its caption and the text; they go under it
          ph = Math.min(pw / BOX.ASPECT, Math.max(BOX.CROP * pw, rest - pad - py - capH - BOX.GUTTER * bs - textH));
        }
        pw = Math.round(pw);
        ph = Math.round(ph);
        px = Math.round(px);
        py = Math.round(py);
        if (stacked) ty = py + ph + capH + BOX.GUTTER * bs;
        // a line of type at the caption's size, its ink's left at left and
        // its baseline at base, seeded from sd: its ink's top left and
        // size and its letters, { x, y, w, h, letters }
        const put = (t, left, base, sd) => {
          const ox = left + ck * t.left;
          return {
            x: left, y: base - ck * t.ascent, w: wide(t), h: ck * (t.ascent + t.descent),
            letters: t.glyphs.map((gl) => makeLetter(gl.g, ox + ck * (gl.x + gl.dx), base + ck * gl.dy, sd + gl.at, ck, WOBBLE)),
          };
        };
        // the first line's baseline cb: on it the >, its ink ending at the
        // frame's right, each slide's count SLIDE_GAP left of it and the <
        // as far left of the widest count, so only the count's figures
        // change from slide to slide; and every slide's caption from the
        // frame's left, from that line or drop lines under it, each line a
        // hundred seeds of its own
        const cb = py + ph + (BOX.CAP_GAP + 0.75) * cs;
        let n = 0;
        const captions = slides.map((sl) => sl.types.flatMap((t, i) => put(t, px, cb + (drop + i) * BOX.CAP_LEAD * cs, seed + 5000 + 100 * n++).letters));
        const on = put(onType, px + pw - wide(onType), cb, seed + 6100);
        const counts = slides.map((sl, i) => put(sl.count, on.x - gap - wide(sl.count), cb, seed + 7000 + 100 * i));
        const back = put(backType, Math.min(...counts.map((c) => c.x)) - gap - wide(backType), cb, seed + 6000);
        s.show = { x: px, y: py, w: pw, h: ph, captions, counts, back, on };
        showSlide(s);
        inside = py + ph + capH;
      }
      let base = ty + 0.75 * bs, last = base, right = ix0;
      paras.forEach((lines, p) => {
        for (const line of lines) {
          right = Math.max(right, ix0 + bk * (line.right - line.left));
          for (const gl of line.glyphs)
            s.bodyLetters.push(makeLetter(gl.g, ix0 + bk * (gl.x + gl.dx - line.left), base + bk * gl.dy, seed + 1000 * p + gl.at, bk, WOBBLE));
          last = base;
          base += BOX.LEAD * bs;
        }
        base += BOX.PARA * bs;
      });
      inside = Math.max(inside, last + 0.3 * bs);
      // with the photo it reaches across the window and down to its
      // bottom; without, only as far as its text, and SLACK, or its word
      // if that is wider, so it covers the word
      box.full = s.photo ? { x0, y0, x1, y1: Math.max(rest, inside + pad), r: BOX.RADIUS * size }
        : { x0, y0, x1: Math.min(x1, Math.max(right, s.ink.x1) + BOX.SLACK * bs + pad), y1: inside + pad, r: BOX.RADIUS * size };
    }

    // a box's items down it from top, under the x: each its caret, its ink
    // ITEM_PAD_X ems in from ix0, and its name CARET ems on, at ITEM of the
    // text's size bs and ROW ems apart, and its text (its body) under its
    // name and indented to it, there all along but cut
    // off where the accordion has got to, and its bubble, from ix0, round
    // its caret and name shut and round its text too open, its ink kept
    // ITEM_PAD_X in from ix1 so the bubble fits. with every item shut the
    // box is only as big as its rows, SLACK past the widest, or its word if
    // that is wider, so it covers the word; it grows down by each item's
    // bubble as it opens, and across to the widest text opening (grow).
    // bubble bob's o is a ring BOB of the box's word's o, its ink's left
    // and bottom where his o's are, the glyphs after it pushed right to
    // make room and his row down as far as it stands over the caps; the
    // ring is his bubble shut, and open, his bubble is a box round his
    // caret and name and the game under them, across the insides and
    // BUBBLE of About's box's height, the bubble's world (room) inside it
    function layoutItems(s, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1) {
      const seed = BOX.FIRST + 10000 * s.n, is = BOX.ITEM * bs, ik = is / TYPE.EM, bk = bs / TYPE.EM;
      // a bubble's padding across, and how far right its ink may reach
      const bx = BOX.ITEM_PAD_X * is, rx = ix1 - bx;
      // the first name's baseline, its bubble's top at top
      let base = top + (BOX.ITEM_CAP + BOX.ITEM_PAD_Y) * is;
      s.items.forEach((it, i) => {
        const t = it.type;
        it.letters = [];
        it.text = [];
        it.caret = null;
        // bubble bob's o, its ring's size and how far its ink goes under the baseline
        const og = it.game ? t.glyphs.find((gl) => gl.ch === 'o') : null, so = s.box.shut;
        const ow = og ? BOX.BOB * (so.x1 - so.x0) : 0, oh = og ? BOX.BOB * (so.y1 - so.y0) : 0, below = og ? ik * (og.dy + og.g.h / 2) : 0;
        if (og) base += Math.max(0, oh - below - BOX.ITEM_CAP * is);
        let nx = ix0 + bx; // the name's ink's left
        if (caretType.glyphs.length) {
          const gl = caretType.glyphs[0];
          it.caret = makeLetter(gl.g, ix0 + bx + ik * gl.g.w / 2, base + ik * gl.dy, seed + 3000 + 100 * i + 99, ik, WOBBLE);
          nx = ix0 + bx + ik * gl.g.w + BOX.CARET * is;
        }
        const ox = nx + ik * t.left, push = og ? ow - ik * og.g.w : 0;
        for (const gl of t.glyphs) if (gl !== og)
          it.letters.push(makeLetter(gl.g, ox + ik * (gl.x + gl.dx) + (og && gl.at > og.at ? push : 0), base + ik * gl.dy, seed + 3000 + 100 * i + gl.at, ik, WOBBLE));
        const ring = og ? { x0: ox + ik * (og.x + og.dx - og.g.w / 2), y0: base + below - oh, x1: ox + ik * (og.x + og.dx - og.g.w / 2) + ow, y1: base + below, r: Math.min(ow, oh) / 2 } : null;
        it.hit = { x0: ix0, y0: Math.min(base - ik * t.ascent, ring ? ring.y0 : Infinity), x1: ox + ik * t.right + push, y1: base + ik * t.descent };
        it.right = it.hit.x1; // its furthest ink right, its text's too
        if (ring) {
          // shut, the ring; open, ITEM_PAD_Y over the ring and down
          // BUBBLE of About's box's height, across to ix1, taking the
          // box's right to its edge, and the room inside its outline
          const like = sections.find((o) => o.photo && o.box.full), tall = BOX.BUBBLE * (like ? like.box.full.y1 - like.box.full.y0 : H - 2 * x0);
          const fy = it.hit.y0 - BOX.ITEM_PAD_Y * is;
          it.shut = ring;
          it.full = { x0: ix0, y0: fy, x1: ix1, y1: fy + tall, r: BOX.ITEM_RADIUS * is };
          it.right = ix1;
          it.ext = it.full.y1 - it.shut.y1;
          it.base = base;
          it.clip = base;
          it.span = 0;
          it.logosAt = [];
          const qx = Math.ceil(ix0 + BOX.LINE), qy = Math.ceil(fy + BOX.LINE);
          s.room = { x: qx, y: qy, w: Math.floor(ix1 - BOX.LINE) - qx, h: Math.floor(fy + tall - BOX.LINE) - qy, size: bs, inset: ix0 + bx - qx, letter: makeLetter(null, 0, 0, seed + 9000, 1, WOBBLE) };
          base += BOX.ROW * is;
          return;
        }
        // its logos that have loaded, each no more than its scale of LOGO_W
        // ems across or LOGO_H tall: wide, LOGO_GAP apart down a column right
        // of its text, a GUTTER on (and each its dx further) and level with
        // its top, each centred across the column; stacked, or when that would leave the text under
        // LOGO_LEAST ems, LOGO_GAP apart across a row above the text, each
        // centred on the row's middle and all shrunk alike to fit it. its
        // demo (DEMO, below) goes first among them, a box DEMO.W wide and
        // as tall as demoH has it at the text's size, that never shrinks,
        // taking the column as a logo does or, in the row, centred across
        // the room the text has; and so does its ship (SHIP, below), a box
        // SHIP.W by SHIP.H. daedalus (DAEDALUS, below), a box DAEDALUS.W by
        // DAEDALUS.H that never shrinks either, always goes in the row
        // above the text, centred across the text's measure, or across the
        // room the text has when that is narrower than he is
        const arts = it.logos.filter((l) => logoArt[l.key]).map((l) => ({ l, art: logoArt[l.key] }));
        let colW = 0;
        for (const a of arts) {
          const aspect = a.art.img.naturalWidth / a.art.img.naturalHeight, k = a.l.scale || 1;
          a.w = BOX.LOGO_W * k * bs;
          a.h = a.w / aspect;
          if (a.h > BOX.LOGO_H * k * bs) { a.h = BOX.LOGO_H * k * bs; a.w = a.h * aspect; }
          colW = Math.max(colW, a.w);
        }
        if (it.demo) {
          arts.unshift({ l: {}, demo: true, w: DEMO.W, h: demoH(bs) });
          colW = Math.max(colW, DEMO.W);
        }
        if (it.ship) {
          arts.unshift({ l: {}, demo: true, ship: true, w: SHIP.W, h: SHIP.H });
          colW = Math.max(colW, SHIP.W);
        }
        if (it.daedalus) {
          arts.unshift({ l: {}, demo: true, daedalus: true, w: DAEDALUS.W, h: DAEDALUS.H });
          colW = Math.max(colW, DAEDALUS.W);
        }
        const beside = arts.length > 0 && !stacked && !it.daedalus && rx - nx - BOX.GUTTER * bs - colW >= BOX.LOGO_LEAST * bs;
        const gaps = (arts.length - 1) * BOX.LOGO_GAP * bs, across = arts.reduce((n, a) => n + a.w, 0);
        const fit = beside || across + gaps <= rx - nx ? 1 : Math.max(0, rx - nx - gaps) / across;
        let rowH = 0;
        for (const a of arts) {
          const f = a.demo ? 1 : fit;
          a.w = Math.max(1, Math.round(a.w * f));
          a.h = Math.max(1, Math.round(a.h * f));
          rowH = Math.max(rowH, a.h);
        }
        // its text, from DROP under its name
        const room = beside ? rx - nx - BOX.GUTTER * bs - colW : rx - nx;
        const tw = stacked ? room : Math.min(room, BOX.MEASURE * bs);
        const top = base + BOX.DROP * is;
        let tb = top + 0.75 * bs, tl = tb, logoBottom = top, ly = top, lx = nx;
        it.logosAt = [];
        it.demoAt = null;
        it.shipAt = null;
        it.daedalusAt = null;
        for (const a of arts) {
          const x = Math.round(beside ? nx + tw + (BOX.GUTTER + (a.l.dx || 0)) * bs + (colW - a.w) / 2 : a.daedalus && tw >= a.w ? nx + (tw - a.w) / 2 : a.demo ? nx + (rx - nx - a.w) / 2 : lx);
          const y = Math.round(beside ? ly : top + (rowH - a.h) / 2);
          if (a.daedalus) it.daedalusAt = placeDaedalus(x, y, seed + 9000 + 10 * i + 5);
          else if (a.ship) it.shipAt = placeShip(x, y, seed + 9000 + 10 * i + 5);
          else if (a.demo) it.demoAt = placeDemo(x, y, bs, seed + 9000 + 10 * i + 5);
          else {
            const g = ditherLogo(a.art, a.w, a.h);
            if (g) it.logosAt.push({ g, x, y, letter: makeLetter(g, x + a.w / 2, y + a.h / 2, seed + 9000 + 10 * i + it.logosAt.length, 1, (a.l.warble ?? BOX.LOGO_WARBLE) ? WOBBLE : STILL) });
          }
          it.right = Math.max(it.right, x + a.w);
          logoBottom = Math.max(logoBottom, y + a.h);
          ly = y + a.h + BOX.LOGO_GAP * bs;
          lx = x + a.w + BOX.LOGO_GAP * bs;
        }
        if (arts.length && !beside) tb = logoBottom + 0.9 * bs + 0.75 * bs;
        it.body.forEach((pt, p) => {
          for (const line of wrapType(pt, tw / bk)) {
            it.right = Math.max(it.right, nx + bk * (line.right - line.left));
            for (const gl of line.glyphs)
              it.text.push(makeLetter(gl.g, nx + bk * (gl.x + gl.dx - line.left), tb + bk * gl.dy, seed + 4000 + 1500 * i + 700 * p + gl.at, bk, WOBBLE));
            tl = tb;
            tb += BOX.LEAD * bs;
          }
          tb += BOX.PARA * bs;
        });
        // its links, a paragraph on under the text: each link's own
        // letters, the separators with the text's
        if (it.links.length && it.linkType.glyphs.length) {
          const lt = it.linkType, ox = nx + bk * lt.left;
          let at = 0;
          const spans = it.links.map((k) => { const from = at; at += k.label.length + LINK_SEP.length; return from; });
          for (const k of it.links) k.letters = [];
          for (const gl of lt.glyphs) {
            const L = makeLetter(gl.g, ox + bk * (gl.x + gl.dx), tb + bk * gl.dy, seed + 4000 + 1500 * i + 1400 + gl.at, bk, WOBBLE);
            const j = spans.findIndex((from, j) => gl.at >= from && gl.at < from + it.links[j].label.length);
            (j >= 0 ? it.links[j].letters : it.text).push(L);
          }
          for (const k of it.links) {
            const x0 = Math.min(...k.letters.map((L) => L.cx - bk * L.g.w / 2)), x1 = Math.max(...k.letters.map((L) => L.cx + bk * L.g.w / 2));
            k.hit = { x0, y0: tb - bk * lt.ascent, x1, y1: tb + bk * lt.descent };
          }
          it.right = Math.max(it.right, ox + bk * lt.right);
          tl = tb;
        }
        const bottom = Math.max(tl + 0.3 * bs, logoBottom);
        it.base = base;
        it.clip = base + 0.3 * is;
        it.span = bottom - it.clip;
        // its bubble shut, ITEM_PAD_Y over the name's caps and under its
        // descenders and ITEM_PAD_X right of its ink, and full, as far right
        // of its furthest ink and under its text's bottom
        it.shut = { x0: ix0, y0: base - (BOX.ITEM_CAP + BOX.ITEM_PAD_Y) * is, x1: it.hit.x1 + bx, y1: base + (BOX.ITEM_DESC + BOX.ITEM_PAD_Y) * is, r: BOX.ITEM_RADIUS * is };
        it.full = { x0: ix0, y0: it.shut.y0, x1: Math.max(it.shut.x1, it.right + bx), y1: Math.max(it.shut.y1, bottom + bx), r: BOX.ITEM_RADIUS * is };
        it.ext = it.full.y1 - it.shut.y1;
        base += BOX.ROW * is;
      });
      // the box's right with every item shut, and how much further each
      // item's text takes it
      const edge = (r) => Math.min(x1, r + BOX.SLACK * bs + pad);
      s.rest = s.items[s.items.length - 1].shut.y1 + pad;
      s.restX1 = edge(Math.max(s.ink.x1, ...s.items.map((it) => it.hit.x1)));
      for (const it of s.items) it.wide = Math.max(0, edge(it.right) - s.restX1);
      s.box.full = { x0, y0, x1: s.restX1, y1: s.rest, r: BOX.RADIUS * size };
      grow(s);
      // each item's skin settled where its bubble is now: laid out again,
      // it is put straight there, as a box's is. bubble bob's opens as big
      // as a box, so it bows as a box's skin does
      for (const it of s.items) it.skin = new Skin(itemAt(it), it.game ? SKIN.SPREAD : BOX.ITEM_SPREAD);
    }

    // a box's accordions where they have got to: each item pushed down by
    // the texts opened above it, the box's bottom by all of them and its
    // right out by the furthest any has got across
    function grow(s) {
      if (!s.items.length || !s.box.full) return;
      let shift = 0, wide = 0;
      for (const it of s.items) {
        it.shift = shift;
        shift += it.p * it.ext;
        wide = Math.max(wide, it.p * it.wide);
      }
      s.box.full.y1 = s.rest + shift;
      s.box.full.x1 = s.restX1 + wide;
    }

    // each section's off: what the boxes above it push it down, where
    // they have got to
    function settle() {
      let off = 0;
      for (const s of sections) {
        s.off = off;
        const b = s.box;
        if (b.shown && b.full) off += Math.max(0, Math.round(b.shut.y1 + (b.full.y1 - b.shut.y1) * b.p - s.ink.y1));
      }
    }

    // how far the page scrolls: until the last word, and its box while it
    // is shown, is ABOUT.END above the window's bottom edge, pushed down
    // by every box shown above it as far as each will open; not at all
    // when it is there already. it is worked out each frame (the frame,
    // below), so the page's end comes up with a box or an item as it
    // shuts and a page scrolled past it is carried up with it
    function setScroll() {
      let push = 0, end = 0;
      for (const s of sections) {
        if (!s.ink) continue;
        // as far as its items will open, or are open while they shut
        const y1 = s.items.length ? s.rest + s.items.reduce((a, it) => a + Math.max(it.p, it.open ? 1 : 0) * it.ext, 0) : s.box.full && s.box.full.y1;
        // and as far as its box will open, or is open while it shuts
        const b = s.box;
        if (b.shown && b.full) push += Math.max(0, (b.open ? y1 : b.shut.y1 + (y1 - b.shut.y1) * b.p) - s.ink.y1);
        end = s.ink.y1 + push;
      }
      scrollEnd = Math.max(0, Math.ceil(end + ABOUT.END - H)) * SCALE;
    }

    // a press on a word: open its box out of the o, or send it back in
    function toggleBox(s) {
      const box = s.box;
      if (!box.shut || !box.full) return;
      box.open = !box.open;
      if (box.open && !box.shown) {
        box.shown = true;
        box.p = 0;
        box.v = 0;
      }
    }

    // a press on an item: its text accordions out under it, or back
    function toggleItem(s, it) {
      it.open = !it.open;
    }

    // the slide a section's slideshow shows, its photo dithered to fill the
    // frame it was laid out to (and kept, so coming back to it is free), as
    // a letter that wobbles only if the photos do; none until the photo
    // has loaded or the frame is laid out
    function showSlide(s) {
      const f = s.show, g = f && ditherPhoto(slides[s.slide], f.w, f.h);
      s.photoAt = g ? { g, x: f.x, y: f.y, letter: makeLetter(g, f.x + f.w / 2, f.y + f.h / 2, BOX.FIRST + 10000 * s.n + 9000, 1, PHOTO.WARBLE ? WOBBLE : STILL) } : null;
    }

    // a press on the slideshow: by slides on (1) or back (-1), round from
    // the last to the first and back, shown at once
    function stepSlide(s, by) {
      s.slide = (s.slide + by + slides.length) % slides.length;
      showSlide(s);
    }

    // p, how far an item's text is open (or its caret turned), dt on
    // toward open or back to shut, travel px the most anything moves on
    // the way, speed times as fast. in the way left to open, q = 1 - p:
    // opening it shrinks by RATE of itself a 60 hz frame, and goes to
    // nothing once under a px of travel; shutting, it and HEAD grow by as
    // much, so it leaves open going and speeds up into shut, and out at 1
    // it is shut. a frame of any other length moves it as far as that
    // many 60 hz frames would
    function ease(p, open, dt, travel, speed = 1) {
      const px = 1 / Math.max(1, travel), f = Math.pow(1 - BOX.RATE, 60 * dt * speed);
      let q = 1 - p;
      if (open) q = q * f < px ? 0 : q * f;
      else q = Math.min(1, (q + BOX.HEAD) / f - BOX.HEAD);
      return 1 - q;
    }

    // a box's items dt on toward open or shut (ease), and their carets
    // turning FLIP times as fast
    function stepItems(s, dt) {
      for (const it of s.items) {
        it.p = ease(it.p, it.open, dt, it.ext);
        it.turn = ease(it.turn, it.open, dt, 4 * BOX.ITEM * BOX.LEAST, BOX.FLIP);
      }
    }

    // dt on toward open, or back toward the o, on a spring: p and its
    // speed v stepped exactly by dt, by the underdamped spring's closed
    // form (RESPONSE s a swing undamped, damped 1 - BOUNCE), so it moves
    // alike at any frame rate. opening it swings past open and settles
    // back, at rest open once within a px of it and moving under a px a
    // 60 hz frame, on the edge that moves furthest; shutting it speeds
    // into the o and stops dead there, never smaller, which would turn the
    // box inside out, and stays there
    function stepBox(s, dt) {
      const box = s.box;
      if (!box.shown) return;
      const a = box.shut, b = box.full;
      const px = 1 / Math.max(1, Math.max(Math.abs(b.x0 - a.x0), Math.abs(b.y0 - a.y0), Math.abs(b.x1 - a.x1), Math.abs(b.y1 - a.y1)));
      const target = box.open ? 1 : 0, w = 2 * Math.PI / BOX.RESPONSE, z = 1 - BOX.BOUNCE;
      const sg = z * w, wd = w * Math.sqrt(1 - z * z), x0 = box.p - target, v0 = box.v;
      const e = Math.exp(-sg * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt);
      const x = e * (x0 * c + (v0 + sg * x0) / wd * sn);
      box.v = e * (v0 * c - (w * w * x0 + sg * v0) / wd * sn);
      box.p = target + x;
      if (box.p <= 0) { box.p = 0; box.v = Math.max(0, box.v); }
      if (box.open && Math.abs(box.p - 1) < px && Math.abs(box.v) / 60 < px) { box.p = 1; box.v = 0; }
      if (box.p === 0 && !box.open) {
        box.shown = false;
        box.v = 0;
      }
    }

    // a section's insides sy up into cfb, as much of them as shows through
    // the window (x0, y0) to (x1, y1), world px on the screen: the window's
    // rows cleared, the letters near enough it to show, the shown slide's
    // caption and count and the slideshow's < and > among them, the photo
    // if it reaches it, the items, each in its bubble, the bubble's world
    // while it is on its way between Doodles' o and bubble bob's, and the
    // x, the ones hover is on in their colours (hover null, none)
    function drawInsides(s, t, sy, x0, y0, x1, y1, hover) {
      const box = s.box;
      cfb.clearRows(Math.floor(y0), Math.ceil(y1) + 1);
      const lo = Math.max(y0, 0) - BOX.MOST, hi = Math.min(y1, H) + BOX.MOST;
      const near = (L) => L.cy - sy > lo && L.cy - sy < hi && L.cx > x0 - BOX.MOST && L.cx < x1 + BOX.MOST;
      for (const L of s.bodyLetters) if (near(L)) L.draw(t, -sy, cfb);
      // the slideshow's: the < in the items' hover colour while hover is
      // on it, the > while hover is on it or on the photo
      const f = s.show;
      if (f) {
        const v = (by) => hover && hover.slide === by ? HOVER_ITEM : undefined;
        for (const L of f.captions[s.slide]) if (near(L)) L.draw(t, -sy, cfb);
        for (const L of f.counts[s.slide].letters) if (near(L)) L.draw(t, -sy, cfb);
        for (const L of f.back.letters) if (near(L)) L.draw(t, -sy, cfb, 0, v(-1));
        for (const L of f.on.letters) if (near(L)) L.draw(t, -sy, cfb, 0, v(1));
      }
      // the photo when its box, 2 px more all round, reaches the window
      const ph = s.photoAt;
      if (ph && ph.x - 2 < x1 && ph.x + ph.g.w + 2 > x0 && ph.y - sy - 2 < y1 && ph.y - sy + ph.g.h + 2 > y0) ph.letter.draw(t, -sy, cfb);
      // the bubble's world goes into bubble bob's insides, through his
      // skin, only while Doodles' box is at rest open; otherwise it is on
      // its way between the two o's, and goes over everything else here
      const home = s === bubbleHome && box.open && box.p === 1;
      // the items, each pushed down by the texts above it, its caret
      // turned from > to v (FLIP times as fast as its text opens), and its text drawn down to
