      // where it has opened to and cut off there, its logos, its demo
      // (drawDemo), its ship (drawShip) and its daedalus (drawDaedalus)
      // with it, all into pfb over its
      // skin's box; then pfb copied into cfb through its skin and the skin
      // outlined over it, LINE px from point to point, in the items' hover
      // colour while the item is hovered, as drawShop does the menu. an
      // item whose skin's box, LINE + 1 px more all round, misses the
      // window's rows is left out. bubble bob's insides are the bubble's
      // world, and his caret and name go over his skin, as they are
      // outside it while it is his o
      for (const it of s.items) {
        if (!it.skin) continue;
        const b = it.skin.bounds(), m = BOX.LINE + 1;
        if (b.y1 + m - sy < y0 || b.y0 - m - sy > y1) continue;
        const d = it.shift - sy;
        const v = hover && hover.it === it && !hover.link && !hover.ribbon && !hover.settings && !hover.ship ? HOVER_ITEM : undefined;
        pfb.clearRows(Math.floor(b.y0 - sy) - BOX.LINE, Math.ceil(b.y1 - sy) + BOX.LINE + 1);
        if (it.game) {
          if (home && bubble) drawGame(pfb, t, sy, x0, y0, x1, y1, hover);
          const pts = it.skin.screen(-sy), n = pts.length;
          cfb.fillPolygon(pts, pfb);
          for (let i = 0; i < n; i++) {
            const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
            cfb.line(p.x, p.y, q.x, q.y, v ?? 1, BOX.LINE);
          }
          if (it.caret) it.caret.draw(t, d, cfb, it.turn * Math.PI / 2, v);
          for (const L of it.letters) L.draw(t, d, cfb, 0, v);
          continue;
        }
        if (it.caret) it.caret.draw(t, d, pfb, it.turn * Math.PI / 2, v);
        for (const L of it.letters) L.draw(t, d, pfb, 0, v);
        if (it.p > 0) {
          const end = it.clip + it.p * it.span + d;
          const see = (L) => L.cy + d > lo && L.cy + d < Math.min(hi, end + BOX.MOST);
          for (const L of it.text) if (see(L)) L.draw(t, d, pfb);
          for (const k of it.links) {
            const lv = hover && hover.link === k ? HOVER_LINK : undefined;
            for (const L of k.letters) if (see(L)) L.draw(t, d, pfb, 0, lv);
          }
          for (const l of it.logosAt) l.letter.draw(t, Math.round(d), pfb);
          if (it.demoAt) drawDemo(it, t, d, hover);
          if (it.shipAt) drawShip(it, t, d);
          if (it.daedalusAt) drawDaedalus(it, t, d);
          pfb.clearRows(Math.ceil(end), Math.ceil(it.clip + it.span + d) + BOX.MOST);
        }
        const pts = it.skin.screen(-sy), n = pts.length;
        cfb.fillPolygon(pts, pfb);
        for (let i = 0; i < n; i++) {
          const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
          cfb.line(p.x, p.y, q.x, q.y, v ?? 1, BOX.LINE);
        }
      }
      if (s.room && bubble && !home) drawGame(cfb, t, sy, x0, y0, x1, y1, hover);
      if (box.close) box.close.letter.draw(t, -sy, cfb, Math.PI / 2, hover && hover.close ? HOVER_ITEM : undefined);
    }

    // the bubble's world sy up into into in cicada's layers: the small
    // bubbles, the hands' holds' lines and the hands where they are in the
    // room (inRoom), there all along for bubble bob's box to wipe in, then
    // the bubble where it is drawn (bubbleAt), filled with paper over them,
    // with its face over it; then his subtitle and the shop. each lot goes
    // down only when its skins, and a hand HAND_REACH round its palm, reach
    // the window (x0, y0) to (x1, y1) where they are drawn, a stroke and 4
    // px more for the wobble. while he is shut, the bubble alone, as the
    // rest are inside his o
    function drawGame(into, t, sy, x0, y0, x1, y1, hover) {
      const lx = bubble.lockX, ly = bubble.lockY, m = BUBBLE_LINE + 4, all = bubbleItem.p > 0;
      // whether the box (bx0, by0) to (bx1, by1) in the world's px reaches
      // the window drawn with its lock at, as roomView puts it
      const shows = (at, bx0, by0, bx1, by1) => at.x + at.k * (bx0 - lx) - m < x1 && at.x + at.k * (bx1 - lx) + m > x0 &&
        at.y + at.k * (by0 - ly) - sy - m < y1 && at.y + at.k * (by1 - ly) - sy + m > y0;
      if (all) {
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        for (let i = 0; i < world.blobs.length; i++) {
          const o = world.blobs[i];
          if (o === bubble) continue;
          for (let j = 0; j < o.points.length; j++) {
            const p = o.points[j];
            bx0 = Math.min(bx0, p.x);
            by0 = Math.min(by0, p.y);
            bx1 = Math.max(bx1, p.x);
            by1 = Math.max(by1, p.y);
          }
        }
        for (const h of world.hands) {
          bx0 = Math.min(bx0, h.x - HAND_REACH);
          by0 = Math.min(by0, h.y - HAND_REACH);
          bx1 = Math.max(bx1, h.x + HAND_REACH);
          by1 = Math.max(by1, h.y + HAND_REACH);
        }
        const r = inRoom();
        if (shows(r, bx0, by0, bx1, by1)) {
          const still = roomView(into, t, sy, r);
          for (const o of world.blobs) if (o !== bubble) drawSkin(still, o);
          for (const d of world.held) drawDrag(still, d);
          drawHands(sy, into);
        }
      }
      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      for (let j = 0; j < bubble.points.length; j++) {
        const p = bubble.points[j];
        bx0 = Math.min(bx0, p.x);
        by0 = Math.min(by0, p.y);
        bx1 = Math.max(bx1, p.x);
        by1 = Math.max(by1, p.y);
      }
      const b = bubbleAt();
      if (shows(b, bx0, by0, bx1, by1)) {
        const view = roomView(into, t, sy, b);
        drawSkin(view, bubble);
        face.draw(view);
        // beard.draw(view);
      }
      if (!all) return;
      if (sub) drawSubtitle(t, sy, into);
      drawShop(t, sy, hover, into);
    }

    // where a section's box is at p, from the o (0) to open (1), as
    // { x0, y0, x1, y1, r }: every edge and the corners' radius that much
    // of the way from one to the other, and, given a time t, each edge
    // warbled WARBLE px either way on its own sine
    function boxAt(s, p, t) {
      const a = s.box.shut, b = s.box.full, c = {};
      for (const k of ['x0', 'y0', 'x1', 'y1', 'r']) c[k] = a[k] + (b[k] - a[k]) * p;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * s.warble[e].hz + s.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // where an item's bubble is at its p, from shut (0) to full (1), as
    // { x0, y0, x1, y1, r }: every edge and the corners' radius that much
    // of the way from one to the other, pushed down by the texts above it
    // (shift), and, given a time t, each edge warbled WARBLE px either way
    // on its own sine, as boxAt has the boxes
    function itemAt(it, t) {
      const a = it.shut, b = it.full, c = {};
      for (const k of ['x0', 'y0', 'x1', 'y1', 'r']) c[k] = a[k] + (b[k] - a[k]) * it.p;
      c.y0 += it.shift;
      c.y1 += it.shift;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * it.warble[e].hz + it.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // a section's box sy up, its skin wherever it has got to, shut in the
    // o's place or open or between: its insides into cfb (drawInsides) as
    // far as the skin's box, LINE + 1 px more all round, reaches, then
    // copied into the page inside the skin and the skin outlined over
    // them, a LINE px line from point to point as the bubbles' skins are,
    // in the word's hover colour when the word is hovered
    function drawBox(s, t, sy, hover) {
      const skin = s.skin;
      if (!skin) return;
      const b = skin.bounds(), m = BOX.LINE + 1, top = b.y0 - m - sy, bottom = b.y1 + m - sy;
      if (bottom < 0 || top >= H) return;
      drawInsides(s, t, sy, b.x0 - m, top, b.x1 + m, bottom, hover);
      const pts = skin.screen(-sy), n = pts.length, v = hover && !hover.it && !hover.close && !hover.shop && !hover.slide ? HOVER : 1;
      fb.fillPolygon(pts, cfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        fb.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // what a press at world (x, y) on the screen would press, wherever the
    // page has scrolled to and the boxes have pushed each section: an open
    // box's x, a little round it (at least 20 world px across, for a
    // finger) or anywhere in the strip across the box's top (short of the
    // photo's frame up there), { s, close }; the slideshow's < or >, a
    // little round it as the x is, or the photo's frame, { s, slide }, -1
    // for the < and 1 for the rest; the shop's menu, while bubble bob is
    // open, { s, shop }, its header with menu, the menu's state, and a
    // button with buy, its key; an item's demo's menu, as far as its text
    // has opened to show it, as the shop's is: its header a little round
    // it, { s, it, settings, menu }, and, once it is over half open, its
    // header's row all the way across it, the same, a
    // slider's bar across and its row down, a little round them,
    // { s, it, settings, slider }, its button, { s, it, settings,
    // randomize }, or anywhere else in it, { s, it, settings }; one of the
    // box's items, its caret, its name
    // or right of them to the box's edge (bubble bob's only as far as his
    // name, so the game under it is free), a little above and below,
    // { s, it }; one of an item's links, as far as its text has opened to
    // show it, a little round it, { s, it, link }; an item's demo's
    // ribbon, as far as its text has opened to show it, a little round it
    // (at least 20 world px tall, for a finger), { s, it, ribbon }; an
    // item's ship's box, once the ship is in, as far as its text has opened
    // to show it, { s, it, ship }; a word whose box is not open, a little
    // round it, { s }; or null
    function hitAt(x, y) {
      const sy = scrolled();
      for (const s of sections) {
        if (!s.ink) continue;
        const py = y + sy - s.off;
        if (s.box.open) {
          const c = s.box.close;
          if (!c) continue;
          const mx = Math.max(4, (20 - c.w) / 2), my = Math.max(4, (20 - c.h) / 2);
          if (x >= c.x - mx && x <= c.x + c.w + mx && py >= c.y - my && py <= c.y + c.h + my) return { s, close: true };
          const ui = s === bubbleHome && bubbleItem.open && shopNow();
          if (ui) {
            const inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && py >= r.y0 - m && py <= r.y1 + m;
            if (inside(ui.shut, 2)) return { s, shop: true, menu };
            if (menu.open && menu.p > 0.5) {
              for (const k of ui.buttons) if (inside(k.rect, 2)) return { s, shop: true, buy: k.key };
              if (inside(ui.full, 0)) return { s, shop: true };
            }
          }
          const b = s.box.full, f = s.show, stop = f && f.y < c.strip[1] ? f.x : b.x1;
          if (x >= b.x0 && x <= stop && py >= c.strip[0] && py <= c.strip[1]) return { s, close: true };
          if (f) {
            const near = (k) => {
              const mx = Math.max(4, (20 - k.w) / 2), my = Math.max(4, (20 - k.h) / 2);
              return x >= k.x - mx && x <= k.x + k.w + mx && py >= k.y - my && py <= k.y + k.h + my;
            };
            if (near(f.back)) return { s, slide: -1 };
            if (near(f.on) || (x >= f.x && x <= f.x + f.w && py >= f.y && py <= f.y + f.h)) return { s, slide: 1 };
          }
          for (const it of s.items) {
            const h = it.hit, iy = py - it.shift, hy = Math.max(4, (20 - (h.y1 - h.y0)) / 2);
            const sm = it.demoAt && it.p > 0 && iy <= it.clip + it.p * it.span ? it.demoAt.menu : null;
            if (sm) {
              const inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && iy >= r.y0 - m && iy <= r.y1 + m;
              if (inside(sm.shut, 2)) return { s, it, settings: true, menu: demoMenu };
              if (demoMenu.open && demoMenu.p > 0.5) {
                if (inside({ x0: sm.full.x0, y0: sm.shut.y0, x1: sm.full.x1, y1: sm.shut.y1 }, 2)) return { s, it, settings: true, menu: demoMenu };
                for (const sl of sm.sliders) if (inside(sl.hit, 2)) return { s, it, settings: true, slider: sl };
                if (inside(sm.button.rect, 2)) return { s, it, settings: true, randomize: true };
                if (inside(sm.full, 0)) return { s, it, settings: true };
              }
            }
            if (x >= h.x0 - 4 && x <= (it.game ? h.x1 + 4 : b.x1) && iy >= h.y0 - hy && iy <= h.y1 + hy) return { s, it };
            if (it.p > 0 && iy <= it.clip + it.p * it.span) for (const link of it.links) {
              const k = link.hit;
              if (!k) continue;
              const ky = Math.max(3, (16 - (k.y1 - k.y0)) / 2);
              if (x >= k.x0 - 3 && x <= k.x1 + 3 && iy >= k.y0 - ky && iy <= k.y1 + ky) return { s, it, link };
            }
            const r = it.demoAt && it.p > 0 && iy <= it.clip + it.p * it.span ? it.demoAt.bar : null;
            if (r) {
              const ry = Math.max(4, (20 - (r.y1 - r.y0)) / 2);
              if (x >= r.x0 - 4 && x <= r.x1 + 4 && iy >= r.y0 - ry && iy <= r.y1 + ry) return { s, it, ribbon: true };
            }
            const sb = it.shipAt && Ship.ready && it.p > 0 && iy <= it.clip + it.p * it.span ? it.shipAt.box : null;
            if (sb && x >= sb.x0 && x <= sb.x1 && iy >= sb.y0 && iy <= sb.y1) return { s, it, ship: true };
          }
          continue;
        }
        const a = s.ink, m = 0.15 * (a.y1 - a.y0);
        if (x >= a.x0 - m && x <= a.x1 + m && py >= a.y0 - m && py <= a.y1 + m) return { s };
      }
      return null;
    }

    // a click: the mute button mutes the page or gives it its sound back
    // (muteAt, below), the x shuts its box, a link opens its site in a new
    // tab, the slideshow's < shows the slide before and its > or its photo
    // the one after, an item opens or shuts its text, a word opens its box;
    // a button of the shop's buys a level of its upgrade, the demo's
    // menu's button gives its singer a new voice (Monk.randomize), and
    // either menu's header opens it, kicked toward open, or shuts it; a
    // demo's ribbon and its menu's sliders press nothing here, played while
    // they are held (the demo, below), and nor does the rest of an open
    // menu, nor a ship, turned while it is held (the ship, below)
    canvas.addEventListener('click', (e) => {
      if (grabbed) { grabbed = false; return; }
      const p = worldPointer(e);
      if (muteAt(p.x, p.y)) { setMuted(!muted); return; }
      const h = hitAt(p.x, p.y);
      if (!h) return;
      if (h.link) window.open(h.link.url, '_blank', 'noopener');
      else if (h.buy) buy(h.buy);
      else if (h.randomize) Monk.randomize();
      else if (h.menu) {
        h.menu.open = !h.menu.open;
        if (h.menu.open) h.menu.v += SHOP_UI.KICK;
      }
      else if (h.shop || h.ribbon || h.settings || h.ship) return;
      else if (h.slide) stepSlide(h.s, h.slide);
      else if (h.it) toggleItem(h.s, h.it);
      else toggleBox(h.s);
    });

    // hover: a mouse's pointer over anything a press would press turns it
    // a colour of the tag's while it is there: a word, and its box's
    // outline while the box is not open, and a menu's button or one of
    // the demo's menu's sliders, its outline and its words, the first
    // (Inventor's), anything else in a box, its x, its items and the
    // slideshow's < and > (the > for the photo too), the second (Software
    // Engineer's), and a link, a menu's header, its outline, caret and
    // words with it, and a demo's ribbon, the third (Musician's); a finger
    // has no hover. where it is, in world px on the screen, or null; what
    // it is over is worked out afresh each frame, so it follows the page as
    // it scrolls and the boxes move under a still pointer. the name's
    // letters light their own way, under a finger too (the name's keys,
    // below)
    const HOVER = tagLines[0].v, HOVER_ITEM = tagLines[1].v, HOVER_LINK = tagLines[2].v;
    let hoverAt = null;
    canvas.addEventListener('pointermove', (e) => { hoverAt = e.pointerType === 'touch' ? null : worldPointer(e); });
    canvas.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') hoverAt = null; });
    canvas.addEventListener('pointerleave', () => { hoverAt = null; });

    // --- the name's keys ---------------------------------------------------------
    // the name is a row of piano keys (js/piano.js), a letter a degree of
    // the page's scale (js/scale.js) up from its root at the p, the scale
    // monk mouth's settings set (the demo, below): the pointer coming
    // onto a letter's key strikes it, and the letter is
    // drawn in its colour while the pointer is on it, a mouse over it or a
    // finger down on it. a strike rings its plink out whatever the pointer
    // does next: the piano lets the key go once it has rung. moving within
    // a key strikes nothing; leaving it and coming back strikes it again. a
    // sweep too fast for the moves to land on every key strikes each key it
    // crossed, in order, then the one it came onto, when it went from the
    // row to the row; coming into the row from outside strikes only the key
    // it came onto. a finger strikes where it presses and as it drags along
    // the name; a drag up or down scrolls instead, and cancels the press.
    // only the first pointer plays. the header's letters are drawn
    // screen-fixed, so where the pointer is goes in world px on the screen,
    // as the hover's does, with no scroll in it. the audio is made on the
    // visitor's first gesture, as browsers want
    let nameOn = -1; // the key the pointer is on, or -1
    function nameTo(p) {
      const i = nameAt(p.x, p.y);
      if (i >= 0 && i !== nameOn) {
        const step = i > nameOn ? 1 : -1;
        for (let k = nameOn < 0 ? i : nameOn + step; k !== i + step; k += step) Piano.strike(k);
      }
      nameOn = i;
    }
    canvas.addEventListener('pointerdown', (e) => { if (e.isPrimary) nameTo(worldPointer(e)); });
    canvas.addEventListener('pointermove', (e) => { if (e.isPrimary) nameTo(worldPointer(e)); });
    // a finger lifted, or its press taken by a scroll, is on nothing
    const nameLift = (e) => { if (e.isPrimary && e.pointerType === 'touch') nameOn = -1; };
    canvas.addEventListener('pointerup', nameLift);
    canvas.addEventListener('pointercancel', nameLift);
    canvas.addEventListener('pointerleave', () => { nameOn = -1; });
    Piano.listen(window);
    Voice.listen(window);

    // --- the mute button ---------------------------------------------------------
    // a speaker MUTE.GAP world px clear of the window's bottom-right corner,
    // held there while the page scrolls under it, over everything but the
    // hand: ICONS.sound (js/icons.js) while the page plays and ICONS.muted
    // while it is muted. each is drawn as the letters are, wobbling, as two
    // sprites on one seed so they wobble as one: its paper, with its ink in
    // it so nothing between the two shows through, then its ink over that,
    // in the first tag colour while a mouse is over it. a press on it, or a
    // little round it, eases the piano, the voice and the demo's voice
    // (js/piano.js, js/voice.js, js/monk.js) to silence or brings them back,
    // and presses nothing under it. the browser keeps it, so a visitor who
    // muted the page finds it muted the next time
    const MUTE = {
      GAP: 21,             // world px clear of the right and bottom edges, as the tag is of the right
      SCALE: LETTER_SCALE, // of the icon's px, as the name's letters are of the font's
      SEED: 99000,         // its wobble's, clear of the letters'
      KEY: 'muted',        // where the browser keeps it
    };
    let muted = false;
    let iconRows = ICONS; // each icon's rows by name, and the scroll hand's frames (below)
    let muteArt = {};     // each icon as { paper, ink } letters in the corner, by name

    // icons (ICONS, js/icons.js) read again and put in the corner, the
    // scroll hand's frames beside them, and the demo's face (js/moon.js)
    // given its eye and its nose again
    function readIcons(icons) {
      iconRows = icons;
      placeMute();
      placeHand();
      Moon.art(iconRows.eye || [], iconRows.nose || []);
    }

    // each icon as its two letters, centred so the icon stands MUTE.GAP clear
    // of the window's bottom-right corner; an empty icon has none
    function placeMute() {
      muteArt = {};
      for (const name of ['sound', 'muted']) {
        const rows = iconRows[name] || [];
        const ink = Framebuffer.ink(rows), paper = Framebuffer.ink(rows.map((r) => r.replace(/o/g, '#')));
        if (!ink.w || !ink.h) continue;
        const s = MUTE.SCALE, x = W - MUTE.GAP - ink.w * s / 2, y = H - MUTE.GAP - ink.h * s / 2;
        muteArt[name] = { paper: makeLetter(paper, x, y, MUTE.SEED, s), ink: makeLetter(ink, x, y, MUTE.SEED, s) };
      }
    }

    // whether world (x, y) on the screen presses the icon shown: its box and
    // a little round it, at least 20 world px across, for a finger
    function muteAt(x, y) {
      const a = muteArt[muted ? 'muted' : 'sound'];
      if (!a) return false;
      const L = a.ink, w = L.g.w * L.scale, h = L.g.h * L.scale;
      const mx = Math.max(4, (20 - w) / 2), my = Math.max(4, (20 - h) / 2);
      return Math.abs(x - L.cx) <= w / 2 + mx && Math.abs(y - L.cy) <= h / 2 + my;
    }

    // the icon shown, its ink in the first tag colour if over
    function drawMute(t, over) {
      const a = muteArt[muted ? 'muted' : 'sound'];
      if (!a) return;
      a.paper.draw(t, 0, fb, 0, 0);
      a.ink.draw(t, 0, fb, 0, over ? HOVER : 1);
    }

    // the page muted or given its sound back, and the browser told
    function setMuted(on) {
      muted = on;
      Piano.mute(on);
      Voice.mute(on);
      Monk.mute(on);
      try { localStorage.setItem(MUTE.KEY, on ? '1' : '0'); } catch (e) {}
    }
    try { if (localStorage.getItem(MUTE.KEY) === '1') setMuted(true); } catch (e) {}

    // --- the demo ----------------------------------------------------------------
    // monk mouth's item, in personal work, holds a small demo of its voice
    // (js/monk.js): a box DEMO.W world px wide where its logos would go
    // (layoutItems), as tall as demoH has it at the item's text size, with
    // a menu in its top left corner and, GAP under the menu's button, the
    // face's part of the box, DEMO.H tall: a face floating in it, two eyes,
    // a nose and a mouth and no head round them, over a ribbon across the
    // box's bottom. a primary press on the ribbon, or a little round it,
    // takes it, and while it is held where the finger is across it is
    // Monk.down, 0 at its left edge to just short of 1 at its right, as
    // moon_man's sim keeps its ribbon: the voice sings a degree of the
    // page's scale (js/scale.js) for each of its Monk.DEGREES zones. a
    // lift lets it go, and so
    // does a press up or down that the page takes for a scroll (the swipe,
    // below); a press that goes across stays the ribbon's. the face is
    // moon_man's (js/moon.js): its mouth shaped in 3d from the voice's raw
    // state as it is heard (Monk.state) and tilted with its unseen head,
    // the eyes and the nose angled to follow it. the eyes are ICONS.eye and
    // the nose ICONS.nose (js/icons.js), handed to it at load and again
    // each time the icons are read. it is stepped each frame while monk
    // mouth is at least partly open in a box out of its o (the frame,
    // below), and each of its features is a paper bitmap and an ink bitmap
    // whose middle sits at its own place from the head's centre, HEAD_X
    // across and HEAD_Y down from the top left of the face's part, the
    // whole face FACE times moon_man's own size. each is
    // drawn as the mute button's icons are, its paper and then its ink,
    // wobbling on a seed of its own, so each one sways, bobs, breathes and
    // tilts as a letter does. the ribbon is a bar (RIBBON) outlined
    // BOX.LINE px and round at its corners, with a tick in the middle of
    // each zone, a line a degree, and, while it is held, a dot on the line
    // of the degree being sung, or of the one the finger is on until it
    // sings: there at once at a press, and from line to line as the degree
    // changes by the house approach, SNAP of the way left each 60 hz frame
    // (stepDots). the ribbon is in the links' hover colour while a mouse is
    // over it or a press holds it. until the ribbon has been pressed a small hand stands left
    // of it, outside the box, pointing at its left end: the scroll hand's
    // first frame, which points down (the scroll hand, below), turned a
    // quarter to point right, at its scale and drawn as it is, its paper
    // then its ink, wobbling on a seed of its own, its finger level with
    // the ribbon's middle, its tip HAND.GAP short of the ribbon at the
    // nearest and bobbing HAND.BOB back from there and in again, HAND.HZ
    // times a second. the first press on the ribbon takes it away for
    // good.
    //
    // the menu is built as bubble bob's is (the shop, below), on his
    // SHOP_UI, and moves as his does, on the same spring with the same
    // bounce and kick, a skin chasing it and its edges warbling (stepMenu,
    // menuAt). shut, it is a button in the box's top left corner, a caret
    // and TITLE in the box text's face at the size his menu's rule gives
    // the item's text size, filled with paper and outlined. a press on it
    // opens it down and across the whole box, over the face and short of
    // the ribbon, its caret turning from > to v, and a press on its header,
    // or anywhere along its top once it is open, as an item's name's row
    // is the item's, shuts it. open, it holds a row under the header for each of SLIDERS
    // and one under them for its button, ROW apart and MARGIN round them.
    // a row's slider is a small ribbon (SLIDER): a bar with a tick in the
    // middle of each of its values' zones and, always, a dot on the line of
    // the value in use, which goes from line to line as the ribbon's does.
    // the bars are one width, as wide as the box leaves them beside the
    // widest words any slider says, and APART right of each are its words
    // for the value in use. a primary press on a bar takes it as a press on
    // the ribbon takes the ribbon, and while it is held the value is the
    // zone the pointer is in across the bar, set on the page's scale
    // (Scale[key]) as it changes, so the singer, the name's keys and
    // daedalus's mallets each play their next note in it; the click it
    // ends in presses nothing. the button,
    // BUTTON, as wide as the rows, is drawn and pressed as his are, and
    // gives the singer a new voice (Monk.randomize). under a mouse the
    // menu's outline, its caret and its title are in the links' hover
    // colour while the pointer is on its header, and a slider and its
    // words, and the button's outline and words, in the words' (the
    // inventor's), as his buttons are. its insides are drawn
    // apart (qfb) and copied through its skin into the item's (pfb), over
    // the face and under the ribbon, so it covers the face while it is open
    const DEMO = {
      W: 187, H: 140, // world px, its box's width, and the height of the face's part and the ribbon, under the menu's button and GAP (demoH)
      GAP: 6,         // world px from the menu's button to the face's part
      HEAD_X: 93.5,   // world px across from the face's part's left to the head's centre, its middle,
      HEAD_Y: 37,     // and down from its top: the features reach about 37 either side of it, 33 above it and 77 below at the most a tilt takes them
      FACE: 1.1,      // the face's size, of moon_man's own: its features' places and scales
      FEATURES: 4,    // the face's features, a wobble each: its lips, its nose and its two eyes (Moon.features)
      // world px, a bar's height, its corners' radius, how far each tick
      // stops short of its top and bottom edges, and its dot's radius: the
      // ribbon's, its bottom the box's, and a slider's, centred down its row
      RIBBON: { H: 15, R: 5.5, TICK_IN: 4, MARK: 3 },
      SLIDER: { H: 10, R: 4, TICK_IN: 3, MARK: 2 },
      SNAP: 0.3,      // of the way left to its line a dot goes, each 60 hz frame
      HAND: { GAP: 2, BOB: 3, HZ: 0.8, DOWN: 2 }, // the hand pointing at the ribbon: world px from its tip to the ribbon's left at the nearest and how far it bobs back from there, its bobs a second, and how far its middle stands under the ribbon's so its finger is level with it
      TITLE: 'settings', BUTTON: 'randomize voice', // what the menu's header says, and its button
      // the menu's sliders, top to bottom: the page's scale's value each
      // sets (Scale[key]), the list of its values there (Scale[list]) and
      // the words it says for one of them
      SLIDERS: [
        { key: 'mode', list: 'MODES', say: (m) => m.name },
        { key: 'key', list: 'KEYS', say: (k) => 'key ' + k },
        { key: 'octave', list: 'OCTAVES', say: (o) => 'octave ' + o },
      ],
    };
    let holding = null; // the press holding the ribbon or a slider, { id, it, i }: its pointer, the demo's item and the slider's place in SLIDERS, null for the ribbon; or null
    let dotAt = null;   // where the ribbon's dot is across it, 0 .. 1, or null while the ribbon is not held
    let played = false; // the ribbon has been pressed: the hand pointing at it is gone
    const slideAt = DEMO.SLIDERS.map(() => null); // where each slider's dot is across its bar, 0 .. 1, or null before the first frame
    const demoTypes = new Map(); // a line of the menu's text, to its Type
    // the menu, as bubble bob's (menu): whether it is open, how far (p, 0
    // shut, 1 open and past as it swings) and how fast, its caret's turn,
    // its skin and the box it was made in, and each edge's warble
    const demoMenu = {
      open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };
    const demoHome = sections.find((s) => s.items.some((it) => it.demo)) || null; // the section whose box holds the demo
    const demoItem = demoHome ? demoHome.items.find((it) => it.demo) : null;      // monk mouth, the item it is in

    // the face's wasm fetched, and handed its eye and its nose; and the
    // ship's (the ship, below) and daedalus's (daedalus's body, below)
    Moon.load(window);
    Moon.art(iconRows.eye || [], iconRows.nose || []);
    Ship.load(window);
    Daedalus.load(window);

    // the menu's text size at the item's text size bs, by bubble bob's
    // menu's rule (shopNow), and the height of its button and of each of
    // its rows at that size, as his, { size, h }
    function demoSize(bs) {
      const U = SHOP_UI, size = Math.max(BOX.CAP_LEAST, BOX.CAP * bs);
      return { size, h: Math.round(size * (2 * U.PAD_Y + U.CAP + U.DESC)) };
    }

    // the demo's box's height in world px at the item's text size bs: the
    // menu's button, GAP and the face's part
    function demoH(bs) {
      return demoSize(bs).h + DEMO.GAP + DEMO.H;
    }

    // a demo's box with its top left at (x, y), world px on the page as
    // laid out, at the item's text size bs, its seeds from seed on: for
    // each of the face's features a letter with nothing to draw, at the
    // head's centre in the face's part, for its wobble, at scale 1 so its
    // pose's scale is its breathe alone; the ribbon's box; the hand
    // pointing at it, a letter with nothing to draw at the scroll hand's
    // scale, on the ribbon's left end, for its wobble; and the menu
    // (placeSettings), { face, bar, hand, menu }
    function placeDemo(x, y, bs, seed) {
      const D = DEMO, face = [], h = demoH(bs), top = y + h - D.H;
      for (let i = 0; i < D.FEATURES; i++) face.push(makeLetter(null, x + D.HEAD_X, top + D.HEAD_Y, seed + i, 1));
      const bar = { x0: x, y0: y + h - D.RIBBON.H, x1: x + D.W, y1: y + h };
      return { face, bar, hand: makeLetter(null, bar.x0, (bar.y0 + bar.y1) / 2 + D.HAND.DOWN, seed + 9, HAND.SCALE), menu: placeSettings(x, y, bs, seed) };
    }

    // the demo's menu for its box with its top left at (x, y) and the
    // item's text size bs, laid out as shopNow lays out bubble bob's, its
    // seeds from seed on. shut, its header: a button in the box's top left
    // corner round the caret and TITLE, APART from each other with PAD
    // round them. open, across the box and down round a row for each
    // slider and one for the button, each as tall as the header, ROW apart
    // under it and MARGIN round them: a slider's bar MARGIN in from the
    // left, as wide as the box leaves it beside the widest words any slider
    // says, and centred down its row, its words for every one of its values
    // APART right of it; the button across the rows. { room, size, shut,
    // full, header: { caret, title }, sliders: [{ i, n, hit, bar, says }],
    // button: { rect, ring, letters } }: room the box, and each slider its
    // place in SLIDERS, how many values it has, the box a press takes it in
    // (its bar across, its row down), its bar and its words, a line of
    // letters for each value
    function placeSettings(x, y, bs, seed) {
      const U = SHOP_UI, D = DEMO, { size, h } = demoSize(bs), k = size / TYPE.EM, apart = U.APART * size;
      const type = (text) => {
        let t = demoTypes.get(text);
        if (!t) demoTypes.set(text, t = new Type(text, () => document.createElement('canvas'), TAG.FACE));
        return t;
      };
      const wide = (t) => k * (t.left + t.right);
      // a line's letters, its ink's left at x0, on the baseline of a row whose top is y0
      const letters = (t, x0, y0, sd) => t.glyphs.map((gl) => makeLetter(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (U.PAD_Y + U.CAP) + k * gl.dy, sd + gl.at, k, WOBBLE));
      // the header, the shut menu: the caret and the title
      const tt = type(D.TITLE), cg = caretType.glyphs[0], cw = cg ? k * cg.g.w : 0, cx = x + U.PAD_X * size;
      const shut = { x0: x, y0: y, x1: x + Math.round(cw + apart + wide(tt) + 2 * U.PAD_X * size), y1: y + h };
      const header = {
        caret: cg ? makeLetter(cg.g, cx + cw / 2, y + size * (U.PAD_Y + U.CAP) + k * cg.dy, seed + 50, k, WOBBLE) : null,
        title: letters(tt, cx + cw + apart, y, seed + 60),
      };
      // the rows under it
      const margin = Math.round(U.MARGIN * size), row = Math.round(U.ROW * size), x0 = x + margin, x1 = x + D.W - margin;
      const lines = D.SLIDERS.map((sl) => Scale[sl.list].map((v) => type(sl.say(v))));
      const bw = Math.floor(x1 - x0 - apart - Math.max(...lines.flat().map(wide)));
      let ry = shut.y1;
      const sliders = lines.map((ts, i) => {
        const by = ry + Math.round((h - D.SLIDER.H) / 2);
        const sl = {
          i, n: ts.length,
          hit: { x0, y0: ry, x1: x0 + bw, y1: ry + h },
          bar: { x0, y0: by, x1: x0 + bw, y1: by + D.SLIDER.H },
          says: ts.map((t, v) => letters(t, x0 + bw + apart, ry, seed + 1000 * (i + 1) + 50 * v)),
        };
        ry += h + row;
        return sl;
      });
      const rect = { x0, y0: ry, x1, y1: ry + h };
      const button = { rect, ring: ringRound(rect, U.RADIUS * size, U.STEP), letters: letters(type(D.BUTTON), x0 + U.PAD_X * size, ry, seed + 4000) };
      const room = { x0: x, y0: y, x1: x + D.W, y1: y + demoH(bs) };
      return { room, size, shut, full: { x0: x, y0: y, x1: x + D.W, y1: ry + h + margin }, header, sliders, button };
    }

    // item it's demo, d world px down from where it was laid out, into pfb,
    // in whole px, as the logos are: once the face is in (Moon.ready), each
    // of its features in its order, its paper then its ink, with its middle
    // at the head's centre and its own place from there at FACE, moved by
    // its wobble's sway and bob, at its own scale times FACE by its
    // wobble's breathe, and turned by its wobble's tilt; the hand pointing
    // at the ribbon, until the ribbon has been pressed, turned a quarter
    // back from pointing down, its tip GAP and its bob left of the ribbon;
    // the menu over the face (drawSettings); and the ribbon (drawBar), its
    // dot where it has got to (dotAt) while it is held, in the links' hover
    // colour while hover is on it or a press holds it
    function drawDemo(it, t, d, hover) {
      const D = DEMO, a = it.demoAt, dy = Math.round(d), held = holding && holding.i === null && holding.it === it;
      const v = held || (hover && hover.it === it && hover.ribbon) ? HOVER_LINK : 1;
      if (Moon.ready) {
        const feats = Moon.features;
        for (let i = 0; i < feats.length && i < a.face.length; i++) {
          const f = feats[i], p = a.face[i].pose(t), x = p.x + D.FACE * f.x, y = p.y + D.FACE * f.y + dy, s = D.FACE * f.scale * p.s;
          pfb.sprite(f.paper, x, y, s, p.a, 0);
          pfb.sprite(f.ink, x, y, s, p.a, 1);
        }
      }
      const f = handArt[0];
      if (f && !played) {
        const H = DEMO.HAND, p = a.hand.pose(t), back = H.GAP + H.BOB * (0.5 + 0.5 * Math.sin(2 * Math.PI * t * H.HZ));
        const x = p.x - back - f.ink.h * p.s / 2, y = p.y + dy, turn = p.a - Math.PI / 2;
        pfb.sprite(f.paper, x, y, p.s, turn, 0, CURSOR.MIN_HITS);
        pfb.sprite(f.ink, x, y, p.s, turn, 1, CURSOR.MIN_HITS);
      }
      drawSettings(it, t, dy, hover);
      drawBar(pfb, a.bar, dy, Monk.DEGREES, dotAt, v, DEMO.RIBBON);
    }

    // a bar into into, its box b as laid out, dy world px down: outlined
    // BOX.LINE px, look.R round its corners, a tick BOX.LINE px wide
    // centred on the middle of each of its n zones, stopping look.TICK_IN
    // short of its top and bottom edges, and, at at (0 .. 1 across it, or
    // null for none), a dot look.MARK px round, all in v
    function drawBar(into, b, dy, n, at, v, look) {
      const y0 = b.y0 + dy, y1 = b.y1 + dy;
      into.roundRect(b.x0, y0, b.x1, y1, look.R, null, v, BOX.LINE);
      for (let k = 0; k < n; k++) {
        const x = Math.round(b.x0 + (b.x1 - b.x0) * (k + 0.5) / n) - 1;
        into.line(x, y0 + look.TICK_IN, x, y1 - 1 - look.TICK_IN, v, BOX.LINE);
      }
      if (at !== null) into.fillCircle(b.x0 + (b.x1 - b.x0) * at, (y0 + y1) / 2, look.MARK, v);
    }

    // item it's demo's menu, dy world px down from where it was laid out,
    // hover what the pointer is on: its header and, while it is open at
    // all, its sliders, each its bar (drawBar) with its dot where it has
    // got to (slideAt) and its words for the value in use, and its button,
    // its ring outlined LINE px from point to point, drawn into qfb over
    // the skin's box; then qfb copied into pfb through the skin and the
    // skin outlined over it, as drawShop does bubble bob's
    function drawSettings(it, t, dy, hover) {
      const ui = it.demoAt.menu, m = demoMenu;
      if (!m.skin) return;
      const on = hover && hover.it === it && hover.settings ? hover : null, v = on && on.menu ? HOVER_LINK : 1, box = m.skin.bounds();
      qfb.clearRows(Math.floor(box.y0 + dy) - BOX.LINE, Math.ceil(box.y1 + dy) + BOX.LINE + 1);
      if (ui.header.caret) ui.header.caret.draw(t, dy, qfb, m.turn * Math.PI / 2, v);
      for (const L of ui.header.title) L.draw(t, dy, qfb, 0, v);
      if (m.p > 0) {
        for (const sl of ui.sliders) {
          const sv = on && on.slider === sl ? HOVER : 1;
          drawBar(qfb, sl.bar, dy, sl.n, slideAt[sl.i], sv, DEMO.SLIDER);
          for (const L of sl.says[Scale[DEMO.SLIDERS[sl.i].key]]) L.draw(t, dy, qfb, 0, sv);
        }
        const b = ui.button, bv = on && on.randomize ? HOVER : 1, n = b.ring.length;
        for (let i = 0; i < n; i++) {
          const p = b.ring[i], q = b.ring[i + 1 < n ? i + 1 : 0];
          qfb.line(p.x, p.y + dy, q.x, q.y + dy, bv, BOX.LINE);
        }
        for (const L of b.letters) L.draw(t, dy, qfb, 0, bv);
      }
      const pts = m.skin.screen(dy), n = pts.length;
      pfb.fillPolygon(pts, qfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        pfb.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // a dot at at, 0 .. 1 across its bar, dt on toward to by the house
    // approach, dt-correct, SNAP of the way left each 60 hz frame; at null,
    // on to at once
    function dotTo(at, to, dt) {
      return at === null ? to : at + (to - at) * (1 - Math.pow(1 - DEMO.SNAP, 60 * dt));
    }

    // the demo's dots dt on (dotTo): each slider's toward the line of the
    // value in use; and the ribbon's, while the ribbon is held, toward the
    // line of the degree being sung (Monk.deg), or of the degree whose
    // zone holds the finger until one is, put on its line at once by a
    // press and taken away by a lift
    function stepDots(dt) {
      for (let i = 0; i < DEMO.SLIDERS.length; i++) {
        const sl = DEMO.SLIDERS[i];
        slideAt[i] = dotTo(slideAt[i], (Scale[sl.key] + 0.5) / Scale[sl.list].length, dt);
      }
      if (Monk.down === null) { dotAt = null; return; }
      dotAt = dotTo(dotAt, ((Monk.deg < 0 ? Monk.zone(Monk.down) : Monk.deg) + 0.5) / Monk.DEGREES, dt);
    }

    // world x on the screen across what is held: across the ribbon, as
    // Monk.down; across a slider's bar, the zone it is in as the slider's
    // value, set on the page's scale when it changes
    function holdTo(x) {
      const a = holding.it.demoAt;
      if (!a) return;
      if (holding.i === null) {
        const b = a.bar;
        Monk.down = Math.min(Math.max((x - b.x0) / (b.x1 - b.x0), 0), 0.995);
        return;
      }
      const sl = a.menu.sliders[holding.i], b = sl.bar, key = DEMO.SLIDERS[holding.i].key;
      const v = Math.min(sl.n - 1, Math.max(0, Math.floor((x - b.x0) / (b.x1 - b.x0) * sl.n)));
      if (Scale[key] !== v) Scale[key] = v;
    }
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0) return;
      const p = worldPointer(e), h = !muteAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || !(h.ribbon || h.slider)) return;
      holding = { id: e.pointerId, it: h.it, i: h.slider ? h.slider.i : null };
      if (h.ribbon) played = true;
      holdTo(p.x);
    });
    canvas.addEventListener('pointermove', (e) => { if (holding && e.pointerId === holding.id) holdTo(worldPointer(e).x); });
    // the click a lifted press on the ribbon or a slider ends in presses
    // nothing, wherever the pointer has got to, as a drag's does (the
    // drag, below), and the ribbon let go leaves the singer's ribbon with
    // no finger on it (Monk.down)
    const letGo = (e) => {
      if (!holding || e.pointerId !== holding.id) return;
      if (holding.i === null) Monk.down = null;
      holding = null;
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', letGo);
    canvas.addEventListener('pointercancel', letGo);

    // --- the ship ----------------------------------------------------------------
    // third dimension's item, in personal work, holds the ship in a bottle
    // (js/ship.js): a box SHIP.W by SHIP.H world px where its logos would
    // go (layoutItems), the picture filling it at Ship.SCALE. it is drawn
    // as the face's features are, its ink alone, from a whole px, wobbling
    // on a seed of its own, so it sways, bobs, breathes and tilts as a
    // letter does. it is stepped each frame while third dimension is at
    // least partly open in a box out of its o and its box is on the screen
    // (the frame, below). a primary press on the box takes hold of the
    // bottle, and while it is held each move across turns it DRAG radians a
    // world px, its near side going the way the pointer goes; a lift lets
    // it go, and so does a press up or down that the page takes for a
    // scroll (the swipe, below), and the click it ends in presses nothing.
    // the wheel turns it too, WHEEL radians a css px, across or down,
    // whichever is more, but only in a run of the wheel's events, each
    // under WHEEL.RUN ms after the last, that starts over the box: from its first
    // event the run is the bottle's and never scrolls the page, and a run
    // that starts anywhere else scrolls the page to its end, whatever comes
    // under the pointer (the wheel, below)
    const SHIP = {
      W: 187, H: 110, // world px, its box: the picture at Ship.SCALE, the whole bottle inside it however it is turned
      DRAG: 0.015,    // radians a world px across turns the bottle while it is held
      WHEEL: 0.005,   // radians a css px of wheel turns it
    };
    let turning = null;  // the press holding the bottle, { id, x }: its pointer and where it was across last, world px on the screen; or null
    const shipHome = sections.find((s) => s.items.some((it) => it.ship)) || null; // the section whose box holds the ship
    const shipItem = shipHome ? shipHome.items.find((it) => it.ship) : null;       // third dimension, the item it is in

    // a ship's box with its top left at (x, y), world px on the page as
    // laid out, its wobble seeded from seed: the box, and a letter with
    // nothing to draw at its middle, at scale 1 so its pose's scale is its
    // breathe alone, { box, letter }
    function placeShip(x, y, seed) {
      return { box: { x0: x, y0: y, x1: x + SHIP.W, y1: y + SHIP.H }, letter: makeLetter(null, x + SHIP.W / 2, y + SHIP.H / 2, seed, 1) };
    }

    // item it's ship, d world px down from where it was laid out, into pfb,
    // once it is in: the picture's ink with its middle on the box's, moved
    // by the wobble's sway and bob, at Ship.SCALE by its breathe and turned
    // by its tilt
    function drawShip(it, t, d) {
      if (!Ship.ready) return;
      const p = it.shipAt.letter.pose(t);
      pfb.sprite(Ship.picture, p.x, p.y + Math.round(d), Ship.SCALE * p.s, p.a, 1);
    }

    // where the box of the ship's item is on the screen against the
    // window's rows: whether any of it is in them
    function shipSeen() {
      const b = shipItem.shipAt && shipItem.shipAt.box;
      if (!b) return false;
      const y = shipItem.shift + shipHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0) return;
      const p = worldPointer(e), h = !muteAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.ship) turning = { id: e.pointerId, x: p.x };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!turning || e.pointerId !== turning.id) return;
      const x = worldPointer(e).x;
      Ship.turn((turning.x - x) * SHIP.DRAG);
      turning.x = x;
    });
    // the click a lifted press on the bottle ends in presses nothing,
    // wherever the pointer has got to, as the ribbon's does
    const shipGo = (e) => {
      if (!turning || e.pointerId !== turning.id) return;
      turning = null;
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', shipGo);
    canvas.addEventListener('pointercancel', shipGo);

    // --- daedalus's body ---------------------------------------------------------
    // second dimension's item, in personal work, holds daedalus
    // (js/daedalus.js): a box DAEDALUS.W by DAEDALUS.H world px over its
    // text (layoutItems), the picture's middle on the box's, at
    // Daedalus.SCALE: the box is the picture's rows and the middle 122 of
    // its 128 columns, everything his arms can reach, so it is no wider
    // than a narrow phone has room for. he is drawn as the ship is, his ink alone, from a whole px, wobbling on a
    // seed of his own, so he sways, bobs, breathes and tilts as a letter
    // does. he is stepped each frame while second dimension is at least
    // partly open in a box out of its o and his box is on the screen (the
    // frame, below), and each of those frames he is told where the page's
    // pointer is against his picture as it was laid out, or that there is
    // none (pointDaedalus): a mouse wherever it is over the page, a finger
    // while it is down and the page has not taken it for a scroll (the
    // swipe, below). his arms swing at it when it comes in their reach, so
    // nothing is pressed and nothing is held: a press on his box presses
    // nothing. each strike is a key struck on the piano (js/piano.js), as
    // the name's are, each arm's its own degree of the page's scale
    // (DEGREES)
    const DAEDALUS = {
      W: 268, H: 290, // world px, his box: the middle 122 of the picture's columns by its 132 rows, at Daedalus.SCALE, to the nearest px
      // the degree of the page's scale each arm's strike plays, in
      // Daedalus.struck's order: his upper left arm's the fifth, his upper
      // right's the seventh, his lower left's the root and his lower
      // right's the third, the mode's i, iii, v and vii with the lower
      // arms its lower two
      DEGREES: [4, 6, 0, 2],
    };
    const daedalusHome = sections.find((s) => s.items.some((it) => it.daedalus)) || null; // the section whose box holds daedalus
    const daedalusItem = daedalusHome ? daedalusHome.items.find((it) => it.daedalus) : null; // second dimension, the item he is in

    // daedalus's box with its top left at (x, y), world px on the page as
    // laid out, its wobble seeded from seed: the box, and a letter with
    // nothing to draw at its middle, at scale 1 so its pose's scale is its
    // breathe alone, { box, letter }
    function placeDaedalus(x, y, seed) {
      return { box: { x0: x, y0: y, x1: x + DAEDALUS.W, y1: y + DAEDALUS.H }, letter: makeLetter(null, x + DAEDALUS.W / 2, y + DAEDALUS.H / 2, seed, 1) };
    }

    // item it's daedalus, d world px down from where it was laid out, into
    // pfb, once he is in: the picture's ink with its middle on the box's,
    // moved by the wobble's sway and bob, at Daedalus.SCALE by its breathe
    // and turned by its tilt
    function drawDaedalus(it, t, d) {
      if (!Daedalus.ready) return;
      const p = it.daedalusAt.letter.pose(t);
      pfb.sprite(Daedalus.picture, p.x, p.y + Math.round(d), Daedalus.SCALE * p.s, p.a, 1);
    }

    // where the box of daedalus's item is on the screen against the
    // window's rows: whether any of it is in them
    function daedalusSeen() {
      const b = daedalusItem.daedalusAt && daedalusItem.daedalusAt.box;
      if (!b) return false;
      const y = daedalusItem.shift + daedalusHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    // daedalus told where the page's pointer is, world px from his box's
    // middle where it is on the screen, or that it has none
    function pointDaedalus() {
      const b = daedalusItem.daedalusAt.box;
      if (!pointerAt) { Daedalus.pointOff(); return; }
      const y = daedalusItem.shift + daedalusHome.off - scrolled();
      Daedalus.point(pointerAt.x - (b.x0 + b.x1) / 2, pointerAt.y - (b.y0 + b.y1) / 2 - y);
    }

    // the piano struck for each of daedalus's arms that struck in his last
    // step, at the arm's degree
    function ringDaedalus() {
      for (let i = 0; i < DAEDALUS.DEGREES.length; i++) if (Daedalus.struck >> i & 1) Piano.strike(DAEDALUS.DEGREES[i]);
    }

    // --- the scroll hand ---------------------------------------------------------
    // a hand HAND.GAP world px left of the mute button, as far off the
    // bottom edge as it is, pointing down while the page scrolls further
    // and giving a thumbs up at its end (setScroll), or when it does not
    // scroll:
    // ICONS.hand's frames (js/icons.js), pointing down first and thumbs up
    // last, each turned as it is drawn. the frame it is at eases toward its
    // first or its last by the house approach and the nearest is drawn, so
    // coming to the bottom plays the frames through and leaving it plays
    // them back. each is drawn as the cursor's hand is, at its scale through
    // the same sampler, its paper with its ink in it and then its ink, and
    // wobbles as the mute button does. the text editor (tools/text) holds
    // it on the frame it paints (holdHand) and plays it (playHand)
    const HAND = {
      GAP: 6,              // world px between it and the mute button
      SCALE: CURSOR.SCALE, // of a frame's px, as the cursor is of its art's
      SEED: 99100,         // its wobble's, clear of the mute button's
      RATE: 0.15,          // of the way left to its frame, each 60 hz frame
    };
    let handArt = [];    // each frame as { paper, ink } bitmaps
    let handWob = null;  // its wobble, a letter with no bitmap (makeLetter)
    let handAt = 0;      // the frame it is at, unrounded
    let handHold = null; // the frame the editor holds it on, or null

    // the frames as bitmaps, centred so the widest and tallest stand
    // HAND.GAP clear of the mute button's widest icon and MUTE.GAP clear of
    // the bottom edge; an empty frame is left out
    function placeHand() {
      handArt = [];
      let w = 0, h = 0;
      for (const rows of iconRows.hand || []) {
        const ink = Framebuffer.ink(rows), paper = Framebuffer.ink(rows.map((r) => r.replace(/o/g, '#')));
        if (!ink.w || !ink.h) continue;
        handArt.push({ paper, ink });
        w = Math.max(w, ink.w);
        h = Math.max(h, ink.h);
      }
      let left = W - MUTE.GAP;
      for (const name in muteArt) {
        const L = muteArt[name].ink;
        left = Math.min(left, L.cx - L.g.w * L.scale / 2);
      }
      const s = HAND.SCALE;
      handWob = makeLetter(null, left - HAND.GAP - w * s / 2, H - MUTE.GAP - h * s / 2, HAND.SEED, s);
      if (handHold !== null) holdHand(handHold);
    }

    // whether the page is scrolled to its end, to within a world px, or
    // does not scroll
    function atBottom() {
      return scrolled() >= scrollEnd / SCALE - 1;
    }

    // the frame eased toward the last at the bottom and the first anywhere
    // else, the house approach dt-correct; held, it stays on its frame
    function stepHand(dt) {
      if (handHold !== null) return;
      const to = atBottom() ? handArt.length - 1 : 0;
      handAt += (to - handAt) * (1 - Math.pow(1 - HAND.RATE, 60 * dt));
    }

    // the nearest frame, its paper then its ink, at its wobble's pose
    function drawHand(t) {
      const f = handArt[Math.max(0, Math.min(handArt.length - 1, Math.round(handAt)))];
      if (!f || !handWob) return;
      const p = handWob.pose(t);
      fb.sprite(f.paper, p.x, p.y, p.s, p.a, 0, CURSOR.MIN_HITS);
      fb.sprite(f.ink, p.x, p.y, p.s, p.a, 1, CURSOR.MIN_HITS);
    }

    // held on frame i, or let go to follow the page again with null
    function holdHand(i) {
      handHold = i === null ? null : Math.max(0, Math.min(handArt.length - 1, i));
      if (handHold !== null) handAt = handHold;
    }

    // let go and played from its far end to where the page is
    function playHand() {
      handHold = null;
      handAt = atBottom() ? 0 : handArt.length - 1;
    }

    // --- layout ------------------------------------------------------------------
    // wide: the menu down the left side and daedalus's panel in the middle,
    // each centred on the viewport's height, or pushed down clear of the
    // name when the page is too short for that. narrow (a phone): the panel
    // on top and the menu under it, every line centred, the stack centred
    // in what the name leaves. the menu is off for now; true brings it
    // back.
    //
    // the bubble's world is its room in bubble bob's box (layoutItems),
    // the bubble locked to its middle. the bubble is made here the first
    // time there is a room; after that a resize carries its lock, skin,
    // face and all to the new middle, so nothing flies across. with no room
    // the world is the viewport, empty, so a press grabs nothing
    const SHOW_MENU = false;
    const MENU = ['PLAYGROUND', 'PROJECTS', 'PAST WORKS'];
    const PANEL_W = 128, PANEL_H = 64;
    const STACK_BELOW = 463; // viewport width in world px under which it stacks
    const GAP = 28;          // between the bubble and the menu when stacked
    let letters = [];
    let panelX = 0, panelY = 0;

    function layout() {
      letters = [];
      const lineH = (typeof FONT !== 'undefined' ? FONT.height : 14) * LETTER_SCALE + 11;
      const menuH = MENU.length * lineH - 11;
      const stacked = W < STACK_BELOW;
      // the name first, and its tag beside it or, stacked, under it:
      // everything else keeps clear under them
      const name = layoutName(stacked);
      const tagBottom = layoutTag(name, stacked);
      const headerBottom = name === null ? 0 : Math.max(name.bottom, tagBottom === null ? -Infinity : tagBottom);
      const under = name === null ? 0 : headerBottom + NAME.GAP;
      layoutSections(name, headerBottom, stacked);
      const top = stacked ? under + (H - under - (2 * BUBBLE_R + GAP + menuH)) / 2 : 0;
      // the middle of the centre object, unrounded; the panel, when shown,
      // sits on the same middle
      const cx = W / 2, cy = stacked ? top + BUBBLE_R : Math.max(H / 2, under + BUBBLE_R);
      panelX = Math.floor(cx - PANEL_W / 2);
      panelY = Math.floor(cy - PANEL_H / 2);
      // before the font check: the bubble does not need the font
      const room = bubbleHome && bubbleHome.room, ww = room ? room.w : W, wh = room ? room.h : H;
      if (!world) world = new World(ww, wh);
      else world.resize(ww, wh);
      if (room && !bubble) {
        bubble = new SoftBlob(ww / 2, wh / 2, BUBBLE_POINTS, BUBBLE_R, BUBBLE_PUFF, true);
        world.blobs.push(bubble);
        face = new Face(bubble);
        // beard = new Beard(ww, wh);
      } else if (bubble) {
        const dx = ww / 2 - bubble.lockX, dy = wh / 2 - bubble.lockY;
        face.moveBy(dx, dy);
        for (const b of world.blobs) if (b !== bubble) { const c = b.getCenter(); b.moveLockTo(c.x + dx, c.y + dy); }
        for (const h of world.hands) { h.x += dx; h.y += dy; }
        bubble.moveLockTo(ww / 2, wh / 2);
        // the face is carried in one jump: the strands pose afresh on the
        // mouth rather than whip across after it
        // beard.resize(ww, wh);
        // beard.reset();
      }
      if (!SHOW_MENU || typeof FONT === 'undefined') return;
      let y = stacked ? top + 2 * BUBBLE_R + GAP : Math.max((H - menuH) / 2, under), i = 0;
      for (const line of MENU) {
        letters.push(...layoutText(line, stacked ? (W - textWidth(line)) / 2 : NAME.X, y, i));
        i += line.length;
        y += lineH;
      }
    }

    // --- the bubble --------------------------------------------------------------
    // bubble bob's box, in Doodles', holds cicada's bubble, its face at 5/3 its art's
    // size and the skin drawn in tighter round it than cicada's: a ring of
    // verlet points (js/softbody.js) locked to the middle of the box, which
    // gives when pulled and wobbles home. it lives in a world the size of
    // the box's inside (its room), which keeps it in the box and runs
    // whole 60 hz steps from wall time, so a 120 hz screen does not run it
    // twice as fast and a slow frame catches up. it is drawn into the box's
    // insides with the text's, so the box wipes it in and it scrolls and is
    // pushed with the box, and it wobbles as one letter does, sway, bob,
    // breathe and tilt about its lock. it is filled with paper and then
    // outlined, the skin a bresenham line from point to point, so it covers
    // whatever is under it as a solid thing, and its face (js/face.js)
    // goes on top, trailing the skin when it moves. the beard (js/beard.js,
    // daedalus's) is commented out; uncommented, it hangs from the mouth, so
    // it trails as the mouth does and swings when it is carried. the face's
    // art goes down 1:1 on a bubble of FACE.DEFAULT_RADIUS (js/face.js) and
    // scales with the radius, each feature by its own size, drawn as line
    // art (roomView), so its strokes are BUBBLE_LINE px at any size, as the
    // skin's are. with Doodles' box shut, it is drawn shrunk into Doodles'
    // o, its skin under the o's ring, so its face shows through the o; as
    // the box opens it is drawn going over to bubble bob's o, half as big,
    // and sits in that one the same way; as his box opens it is drawn
    // growing out of his o to its room's middle (bubbleAt), its world and
    // its physics as they are. the rest of its world, the small bubbles
    // and the hands, is drawn where it is in the room all along (inRoom),
    // so the boxes wipe it in as they open. while his box is open its world spawns
    // smaller bubbles, skins like its own with no face, one every
    // couple of seconds, a few at most, each drifting a little as it comes;
    // dragged onto the bubble, one is eaten, and the bubble keeps its 32
    // points and eases back to its own size over a few seconds
    // (js/softbody.js).
    const BUBBLE_SCALE = 5 / 3;
    const BUBBLE_LINE = 2; // world px, every stroke of the skin and the face
    // its radius in world px (about 38), its points, and its
    // air: the area it fills over its circle's
    const BUBBLE_R = FACE.DEFAULT_RADIUS * BUBBLE_SCALE, BUBBLE_POINTS = 32, BUBBLE_PUFF = 1.2;
    let world = null, bubble = null, face = null; // made at the first layout
    // let beard = null;
    const bubbleHome = sections.find((s) => s.items.some((it) => it.game)) || null; // the section whose box it is in
    const bubbleItem = bubbleHome ? bubbleHome.items.find((it) => it.game) : null; // bubble bob, the item it is in

    // whether the game is on: Doodles' box open and bubble bob open in it
    function playing() {
      return !!bubbleHome && bubbleHome.box.open && bubbleItem.open;
    }

    // where the bubble's lock is drawn, world px on the page as laid out,
    // and how much it is drawn scaled, { x, y, k }. in an o, in its middle,
    // its skin at rest (BUBBLE_R puffed, PUFFED) as big round as the o's
    // ring is across its longer way, so it sits under the ring there and
    // the porthole cuts it off under the ring the other way; open, its
    // room's middle at its own size. as far as bubble bob is open it goes
    // from his o to the room's middle, and as far as Doodles' box is open
    // from Doodles' o to there, and past it as the box swings past open
    function bubbleAt() {
      const r = bubbleHome.room, f = bubbleItem.p, p = bubbleHome.box.p;
      const at = (o) => ({ x: (o.x0 + o.x1) / 2, y: (o.y0 + o.y1) / 2, k: Math.max(o.x1 - o.x0, o.y1 - o.y0) / 2 / (BUBBLE_R * PUFFED) });
      const a = at(bubbleHome.box.shut), o = at(bubbleItem.shut);
      const b = { x: o.x + (r.x + bubble.lockX - o.x) * f, y: o.y + (r.y + bubble.lockY - o.y) * f, k: o.k + (1 - o.k) * f };
      return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, k: a.k + (b.k - a.k) * p };
    }

    // where the bubble's lock is in its room on the page as laid out, at
    // its own size, { x, y, k } as bubbleAt has it: where everything in its
    // world but the bubble is drawn, there all along whatever the boxes do
    function inRoom() {
      const r = bubbleHome.room;
      return { x: r.x + bubble.lockX, y: r.y + bubble.lockY, k: 1 };
    }

    // a framebuffer the bubble's world draws into as into the world: what
    // goes into it at its world's px lands in into at the page's, its box
    // dy up, scaled about its lock and its lock moved as b has it ({ x, y,
    // k }, bubbleAt's unless given), and warbled about its lock by its
    // room's letter. the face's sprites go
    // down as line art (Framebuffer.strokeSprite), so at any size their
    // strokes are BUBBLE_LINE px, as the skin's are; a line is as thick as
    // it is asked, 1 px unless told
    function roomView(into, t, dy, b = bubbleAt()) {
      const w = bubbleHome.room.letter.pose(t), lx = bubble.lockX, ly = bubble.lockY;
      const c = b.k * w.s * Math.cos(w.a), n = b.k * w.s * Math.sin(w.a), ox = b.x + w.x, oy = b.y - dy + w.y;
      const at = (x, y) => [ox + c * (x - lx) - n * (y - ly), oy + n * (x - lx) + c * (y - ly)];
      return {
        sprite(g, x, y, s, a, v) { const [X, Y] = at(x, y); into.strokeSprite(g, X, Y, s * w.s * b.k, a + w.a, v, BUBBLE_LINE); },
        line(x0, y0, x1, y1, v, thick = 1) { const [a, b] = at(x0, y0), [c, d] = at(x1, y1); into.line(a, b, c, d, v, thick); },
        fillPolygon(pts, v) { into.fillPolygon(pts.map((p) => { const [x, y] = at(p.x, p.y); return { x, y }; }), v); },
      };
    }

    // --- the pulse ---------------------------------------------------------------
    // cicada's colour pulse: when a bubble eats, colour runs off round its
    // skin both ways from where the two met, and fades along its trail and
    // over its life (js/softbody.js). cicada's ran through the rainbow;
    // this one fades round the tag's three colours, teal to khaki to rose
    // and back to teal, in STEPS shades from each to the next, and from the
    // skin's ink up to the colour in LEVELS shades by how strongly the
    // pulse lights it, times INTENSITY: at 1.75 anything it lights at about
    // half or more is the colour itself, and the rest of its trail and its
    // last moments fade back into the ink. every shade is a colour of the
    // framebuffer's palette, made once here
    const PULSE = { STEPS: 6, LEVELS: 5, INTENSITY: 1.75 };
    const pulseInks = (() => {
      const rgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
      const hex = (c) => '#' + c.map((x) => Math.round(x).toString(16).padStart(2, '0')).join('');
      const ink = [0, 8, 16].map((k) => Framebuffer.INK >> k & 0xFF); // the palette's words run r, g, b up from the low byte
      const cols = TAG.LINES.map((l) => rgb(l.colour)), n = cols.length * PULSE.STEPS;
      return Array.from({ length: PULSE.LEVELS }, (_, l) => Array.from({ length: n }, (_, k) => {
        const a = cols[Math.floor(k / PULSE.STEPS)], b = cols[(Math.floor(k / PULSE.STEPS) + 1) % cols.length];
        const f = (k % PULSE.STEPS) / PULSE.STEPS, lit = (l + 1) / PULSE.LEVELS;
        return Framebuffer.colour(hex(ink.map((x, j) => x + (a[j] + (b[j] - a[j]) * f - x) * lit)));
      }));
    })();

    // the ink a stretch of skin is drawn in, from the pulses at its two
    // ends (SoftBlob.pulseAt), as cicada coloured its lines: the mean of the
    // two where both are lit, the short way round the cycle, the one where
    // one is, and the skin's own ink where neither is or the shade comes to
    // none
    function pulseInk(a, b) {
      if (!a && !b) return 1;
      let strength, along;
      if (a && b) {
        let d = b.along - a.along;
        if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
        strength = (a.strength + b.strength) / 2;
        along = (a.along + d / 2 + 1) % 1;
      } else ({ strength, along } = a || b);
      const level = Math.min(Math.round(strength * PULSE.INTENSITY * PULSE.LEVELS), PULSE.LEVELS);
      if (level <= 0) return 1;
      const row = pulseInks[level - 1];
      return row[Math.round(along * row.length) % row.length];
    }

    // a blob's skin through view: filled with paper and outlined
    // BUBBLE_LINE px thick, in ink, or where a pulse runs round it, in the
    // pulse's colours
    function drawSkin(view, blob) {
      const pts = blob.points, n = pts.length;
      view.fillPolygon(pts, 0);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        view.line(p.x, p.y, q.x, q.y, pulseInk(blob.pulseAt(i), blob.pulseAt((i + 1) % n)), BUBBLE_LINE);
      }
    }

    // --- the subtitles -----------------------------------------------------------
    // what the bubble says (js/voice.js), in the box text's face at its
    // size, as words beside him: one syllable more each time he begins one,
    // the whole line once he is done, and gone LINGER seconds after, or as
    // soon as he says another or his box shuts. a line goes somewhere round
    // him at random (js/subtitle.js), GAP of its size clear of his skin as
    // it is when he starts, inside his room EDGE of its size in from the
    // box and off bubble bob's caret and name, and stays there; with nowhere it fits, it
    // does not show. its letters warble more than the box text's, each its
    // own way: WOBBLE's sway, bob, breathe and tilt, depth and rate, each
    // times its own 1 ± SPREAD at random
    const SUBS = {
      GAP: 0.6,     // of its size, from his skin to the line's ink
      EDGE: 0.6,    // of its size, from the room's edge to the line's ink, and round bubble bob's caret and name
      LINGER: 0.75, // seconds it stays once he is done
      SPREAD: 0.5,
      WOBBLE: { SWAY_PX: 0.5, SWAY_HZ: 1.2, BOB_PX: 0.5, BOB_HZ: 0.7, BREATHE: 0.03, BREATHE_HZ: 0.9, TILT_RAD: 0.03, TILT_HZ: 0.5 },
    };
    const subTypes = new Map(); // a line's text as shown, to its Type, made the first time it is said
    let subSaid = 0; // the voice's lines said, as of the last frame
    let sub = null;  // the line shown, { room, ends, letters: [{ L, at }] }, or null

    // a line's subtitle, placed round him in his room as laid out, or null
    function makeSubtitle(line) {
      const { whole, ends } = Subtitle.split(line.text || '');
      if (!ends.length) return null;
      let type = subTypes.get(whole);
      if (!type) subTypes.set(whole, type = new Type(whole, () => document.createElement('canvas'), TAG.FACE));
      if (!type.glyphs.length) return null;
      const room = bubbleHome.room, size = room.size, k = size / TYPE.EM, edge = SUBS.EDGE * size;
      let reach = 0; // his skin's furthest from his lock
      for (const p of bubble.points) reach = Math.max(reach, Math.hypot(p.x - bubble.lockX, p.y - bubble.lockY));
      const h = bubbleItem.hit, keep = [{ x0: h.x0 - edge, y0: h.y0 - edge, x1: h.x1 + edge, y1: h.y1 + edge }];
      const ui = shopNow();
      if (ui) {
        const r = menu.p > 0 || menu.open ? ui.full : ui.shut;
        keep.push({ x0: r.x0 - edge, y0: r.y0 - edge, x1: r.x1 + edge, y1: r.y1 + edge });
      }
      const area = { x0: room.x + edge, y0: room.y + edge, x1: room.x + room.w - edge, y1: room.y + room.h - edge };
      const at = Subtitle.place(k * (type.left + type.right), k * (type.ascent + type.descent),
        room.x + bubble.lockX, room.y + bubble.lockY, reach + BUBBLE_LINE + SUBS.GAP * size, area, keep);
      if (!at) return null;
      const ox = at.x + k * type.left, base = at.y + k * type.ascent; // the line's origin, on its baseline
      const vary = () => 1 + SUBS.SPREAD * (2 * Math.random() - 1);
      const letters = type.glyphs.map((gl) => {
        const wob = {};
        for (const key in SUBS.WOBBLE) wob[key] = SUBS.WOBBLE[key] * vary();
        return { at: gl.at, L: makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, Math.floor(Math.random() * 1e6), k, wob) };
      });
      return { room, ends, letters };
    }

    // each frame: a new line's subtitle made as he starts it, and the one
    // shown dropped once it has lingered, or the engine would not take it,
    // or his box shuts or is laid out again
    function stepSubtitle() {
      if (Voice.said !== subSaid) {
        subSaid = Voice.said;
        sub = bubble && bubbleHome.room && playing() && Voice.line ? makeSubtitle(Voice.line) : null;
      }
      if (sub && (!Voice.line || !playing() || bubbleHome.room !== sub.room ||
          (Voice.endedAt !== null && Date.now() - Voice.endedAt > SUBS.LINGER * 1000))) sub = null;
    }

    // the subtitle sy up into into: as many syllables as he has begun, every
    // one once he is done
    function drawSubtitle(t, sy, into) {
      const n = Voice.endedAt !== null ? sub.ends.length : Math.min(Voice.heard, sub.ends.length);
      if (!n) return;
      const end = sub.ends[n - 1];
      for (const s of sub.letters) if (s.at < end) s.L.draw(t, -sy, into);
    }

    // --- the shop ------------------------------------------------------------------
    // bubble bob's box sells drag strength, hands, spawn rate, max bubbles,
    // bubble value and a random voice for the bubbles the bubble has eaten, each paying by its size (js/shop.js), every number
    // shown to two places, in a menu of its own in the room's top right, as
    // far in from its top and right as his caret's ink is from its left. shut, the
    // menu is a button: a rounded rect drawn as the box is, filled with
    // paper over whatever drifts under it and outlined LINE px from point to
    // point, RADIUS of its text's size round its corners, saying with a
    // caret on its left the bubbles earned a second (js/shop.js's rate), a
    // BAR, how many bubbles there are, a BAR and TITLE, APART from each
    // other, in the box text's face at the photo caption's size, PAD round
    // them. a press
    // on it opens the menu as a box opens: the button is its shut shape, and
    // its open one reaches down and left round a list of the upgrades under
    // the header, a button each, ROW apart, every one as wide as the
    // widest, MARGIN round them, each with its label and price. it swings
    // there and back on the boxes' spring, but bouncier (BOUNCE) and set off
    // with a KICK when it opens, so it bursts open and swings further past
    // it before it settles, its edges warbling as the boxes' do, and a skin
    // (js/skin.js) chases it as a box's does, its anchors' pull reaching
    // only SPREAD along it, so it bows between them as a big box's skin
    // does, with the menu's insides, drawn apart (pfb), copied through the
    // skin, so it wipes the list in as it grows. its caret turns from > to v as it opens, as an
    // item's does, and a press on the header shuts it. under the pointer
    // the menu's outline, its caret and its words are in the links' hover
    // colour (the musician's), and a button's outline and words in the
    // words' (the inventor's). a press on a button buys a level: drag strength pulls every
    // held skin in the bubble's world harder, spawn rate spawns small
    // bubbles there more often, max bubbles lets it hold more at once,
    // bubble value makes every one the bubble eats pay more,
    // randomize voice gives the bubble a new voice (js/voice.js), and
    // a hand comes out of its button and goes after the small bubbles
    // (js/hands.js), drawn as the pointer is (js/cursor.js), a fist while
    // it holds one, its hold's line dashed as the pointer's is, over the
    // small bubbles and under the bubble, as cicada layered them
    // (drawGame). HAND_REACH is how far its art reaches from its palm.
    // the demo's menu (the demo, above) is built on SHOP_UI too, and moves
    // as this one does (menuAt, stepMenu)
    const SHOP_UI = {
      KEYS: ['drag', 'hands', 'spawn', 'max', 'value', 'voice'], TITLE: 'upgrades', BAR: '|',
      LABELS: { drag: 'drag strength', hands: 'hands', spawn: 'spawn rate', max: 'max bubbles', value: 'bubble value', voice: 'randomize voice' },
      PAD_X: 0.5, PAD_Y: 0.25, RADIUS: 0.4, // of the text's size: round a button's words, and its corners
      APART: 0.4,                           // of the text's size, between the header's caret, rate, bars, count and title
      ROW: 0.4, MARGIN: 0.4,                // of the text's size, between the list's buttons, and round them in the open menu
      BOUNCE: 0.45,                         // the spring's: damped 1 - BOUNCE (the boxes' 0.35, 7 % past open)
      KICK: 12,                             // a second, added to its speed toward open as it opens: with BOUNCE, about 19 % past open
      SPREAD: 14,                           // px, how far along the skin an anchor's pull reaches (a box's 80)
      CAP: 0.75, DESC: 0.2,                 // of the text's size, the face's caps over its baseline and descenders under
      STEP: 2,                              // px between a button's outline's points, as the box's skin stands
    };
    const shop = new Shop();
    // what each bubble in the world pays when the bubble eats it: its own
    // reward (Shop.reward) at the size it is first seen at, and a bubble
    // that eats another takes on what that one pays too, so a merged bubble
    // pays what its parts would have paid apart (the frame, below)
    const worth = new WeakMap();
    const worthOf = (b) => worth.has(b) ? worth.get(b) : Shop.reward(b.radius);
    let bps = 0;                 // the shop's rate, as of this frame
    const helpers = [];          // each hand bought, { hand, cursor }
    const HAND_REACH = 20;       // world px
    const shopTypes = new Map(); // a label's text, to its Type
    let shopUI = null;           // as laid out: { room, key, size, shut, full, header: { caret, rate, rateBar, count, bar, title }, buttons: [{ key, rect, ring, letters }] }
    // the menu: whether it is open, how far (p, 0 shut, 1 open and past as
    // it swings) and how fast, its caret's turn, its skin and the room it
    // was made in, and each edge's warble
    const menu = {
      open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };

    // dev mode: D, E and V held down together for DEV.MS make the shop free
    // until the page is reloaded; the count and the prices go on as ever
    const DEV = { KEYS: ['KeyD', 'KeyE', 'KeyV'], MS: 5000 };
    const devHeld = new Set();
    let devTimer = null;
    const devStop = () => { clearTimeout(devTimer); devTimer = null; };
    window.addEventListener('keydown', (e) => {
      if (!DEV.KEYS.includes(e.code)) return;
      devHeld.add(e.code);
      if (devHeld.size === DEV.KEYS.length && devTimer === null) devTimer = setTimeout(() => { shop.free = true; }, DEV.MS);
    });
    window.addEventListener('keyup', (e) => { if (devHeld.delete(e.code)) devStop(); });
    window.addEventListener('blur', () => { devHeld.clear(); devStop(); });

    // the menu laid out, again whenever the room or what it says changes;
    // null with no room
    function shopNow() {
      const room = bubbleHome && bubbleHome.room;
      if (!room) return null;
      const U = SHOP_UI, labels = U.KEYS.map((k) => U.LABELS[k] + ' · ' + Shop.figure(shop.price(k)));
      const rate = Shop.figure(bps) + ' bps', count = Shop.figure(shop.bubbles) + ' bubbles';
      const key = labels.join('|') + '|' + rate + '|' + count;
      if (shopUI && shopUI.room === room && shopUI.key === key) return shopUI;
      const size = Math.max(BOX.CAP_LEAST, BOX.CAP * room.size), k = size / TYPE.EM, inset = room.inset;
      const type = (text) => {
        let t = shopTypes.get(text);
        if (!t) shopTypes.set(text, t = new Type(text, () => document.createElement('canvas'), TAG.FACE));
        return t;
      };
      const wide = (t) => k * (t.left + t.right), h = Math.round(size * (2 * U.PAD_Y + U.CAP + U.DESC));
      // a line's letters, its ink's left at x0, on the baseline of a row whose top is y0
      const letters = (t, x0, y0, seed) => t.glyphs.map((gl) => makeLetter(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (U.PAD_Y + U.CAP) + k * gl.dy, seed + gl.at, k, WOBBLE));
      // the header, the shut menu: the caret, the rate, a bar, the count, a bar and the title
