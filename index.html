    // the bubble locked to its middle. the bubble is made here the first
    // time there is a room; after that a resize carries its lock, skin,
    // face and all to the new middle, so nothing flies across. with no room
    // the world is the viewport, empty, so a press grabs nothing
    const SHOW_MENU = false;
    const MENU = ['PLAYGROUND', 'PROJECTS', 'PAST WORKS'];
    const PANEL_W = 128, PANEL_H = 64;
    const STACK_BELOW = 463; // viewport width in world px under which it stacks
    const GAP = 28;          // between the bubble and the menu when stacked
    let letters = [];
    let panelX = 0, panelY = 0;

    function layout() {
      letters = [];
      const lineH = (typeof FONT !== 'undefined' ? FONT.height : 14) * LETTER_SCALE + 11;
      const menuH = MENU.length * lineH - 11;
      const stacked = W < STACK_BELOW;
      // the name first, and its tag beside it or, stacked, under it:
      // everything else keeps clear under them
      const name = layoutName(stacked);
      const tagBottom = layoutTag(name, stacked);
      const headerBottom = name === null ? 0 : Math.max(name.bottom, tagBottom === null ? -Infinity : tagBottom);
      const under = name === null ? 0 : headerBottom + NAME.GAP;
      layoutSections(name, headerBottom, stacked);
      const top = stacked ? under + (H - under - (2 * BUBBLE_R + GAP + menuH)) / 2 : 0;
      // the middle of the centre object, unrounded; the panel, when shown,
      // sits on the same middle
      const cx = W / 2, cy = stacked ? top + BUBBLE_R : Math.max(H / 2, under + BUBBLE_R);
      panelX = Math.floor(cx - PANEL_W / 2);
      panelY = Math.floor(cy - PANEL_H / 2);
      // before the font check: the bubble does not need the font
      const room = bubbleHome && bubbleHome.room, ww = room ? room.w : W, wh = room ? room.h : H;
      if (!world) world = new World(ww, wh);
      else world.resize(ww, wh);
      if (room && !bubble) {
        bubble = new SoftBlob(ww / 2, wh / 2, BUBBLE_POINTS, BUBBLE_R, BUBBLE_PUFF, true);
        world.blobs.push(bubble);
        face = new Face(bubble);
        // beard = new Beard(ww, wh);
      } else if (bubble) {
        const dx = ww / 2 - bubble.lockX, dy = wh / 2 - bubble.lockY;
        face.moveBy(dx, dy);
        for (const b of world.blobs) if (b !== bubble) { const c = b.getCenter(); b.moveLockTo(c.x + dx, c.y + dy); }
        for (const h of world.hands) { h.x += dx; h.y += dy; }
        bubble.moveLockTo(ww / 2, wh / 2);
        // the face is carried in one jump: the strands pose afresh on the
        // mouth rather than whip across after it
        // beard.resize(ww, wh);
        // beard.reset();
      }
      if (!SHOW_MENU || typeof FONT === 'undefined') return;
      let y = stacked ? top + 2 * BUBBLE_R + GAP : Math.max((H - menuH) / 2, under), i = 0;
      for (const line of MENU) {
        letters.push(...layoutText(line, stacked ? (W - textWidth(line)) / 2 : NAME.X, y, i));
        i += line.length;
        y += lineH;
      }
    }

    // --- the bubble --------------------------------------------------------------
    // Personal work's box holds cicada's bubble, its face at 5/3 its art's
    // size and the skin drawn in tighter round it than cicada's: a ring of
    // verlet points (js/softbody.js) locked to the middle of the box, which
    // gives when pulled and wobbles home. it lives in a world the size of
    // the box's inside (its room), which keeps it in the box and runs
    // whole 60 hz steps from wall time, so a 120 hz screen does not run it
    // twice as fast and a slow frame catches up. it is drawn into the box's
    // insides with the text's, so the box wipes it in and it scrolls and is
    // pushed with the box, and it wobbles as one letter does, sway, bob,
    // breathe and tilt about its lock. it is filled with paper and then
    // outlined, the skin a bresenham line from point to point, so it covers
    // whatever is under it as a solid thing, and its face (js/face.js)
    // goes on top, trailing the skin when it moves. the beard (js/beard.js,
    // daedalus's) is commented out; uncommented, it hangs from the mouth, so
    // it trails as the mouth does and swings when it is carried. the face's
    // art goes down 1:1 on a bubble of FACE.DEFAULT_RADIUS (js/face.js) and
    // scales with the radius, each feature by its own size, drawn as line
    // art (roomView), so its strokes are BUBBLE_LINE px at any size, as the
    // skin's are. shut, it is drawn shrunk into the o, its skin under the
    // o's ring, so its face shows through the o; as the box opens it is
    // drawn growing out of the o to its room's middle (bubbleAt), its world
    // and its physics as they are. while the box is open its world spawns
    // smaller bubbles, skins like its own with no face, one every
    // couple of seconds, a few at most, each drifting a little as it comes;
    // dragged onto the bubble, one is eaten, and the bubble keeps its 32
    // points and eases back to its own size over a few seconds
    // (js/softbody.js).
    const BUBBLE_SCALE = 5 / 3;
    const BUBBLE_LINE = 2; // world px, every stroke of the skin and the face
    // its radius in world px (about 38), its points, and its
    // air: the area it fills over its circle's
    const BUBBLE_R = FACE.DEFAULT_RADIUS * BUBBLE_SCALE, BUBBLE_POINTS = 32, BUBBLE_PUFF = 1.2;
    let world = null, bubble = null, face = null; // made at the first layout
    // let beard = null;
    const bubbleHome = sections.find((s) => s.bubble) || null; // the section whose box it is in

    // where the bubble's lock is drawn, world px on the page as laid out,
    // and how much it is drawn scaled, { x, y, k }, as far as its box is
    // open: shut, in the middle of its o, its skin at rest (BUBBLE_R
    // puffed, PUFFED) as big round as the o's ring is across its longer
    // way, so it sits under the ring there and the porthole cuts it off
    // under the ring the other way; open, its room's middle at its own
    // size; between, that far from one to the other, and past open as the
    // box swings past it
    function bubbleAt() {
      const r = bubbleHome.room, o = bubbleHome.box.shut, q = 1 - bubbleHome.box.p;
      const hx = r.x + bubble.lockX, hy = r.y + bubble.lockY, k = Math.max(o.x1 - o.x0, o.y1 - o.y0) / 2 / (BUBBLE_R * PUFFED);
      return { x: hx + ((o.x0 + o.x1) / 2 - hx) * q, y: hy + ((o.y0 + o.y1) / 2 - hy) * q, k: 1 - (1 - k) * q };
    }

    // a framebuffer the bubble draws into as into its world: what goes into
    // it at its world's px lands in into at the page's, its box dy up,
    // scaled about its lock and its lock moved as bubbleAt has it, and
    // warbled about its lock by its room's letter. the face's sprites go
    // down as line art (Framebuffer.strokeSprite), so at any size their
    // strokes are BUBBLE_LINE px, as the skin's are; a line is as thick as
    // it is asked, 1 px unless told
    function roomView(into, t, dy) {
      const w = bubbleHome.room.letter.pose(t), b = bubbleAt(), lx = bubble.lockX, ly = bubble.lockY;
      const c = b.k * w.s * Math.cos(w.a), n = b.k * w.s * Math.sin(w.a), ox = b.x + w.x, oy = b.y - dy + w.y;
      const at = (x, y) => [ox + c * (x - lx) - n * (y - ly), oy + n * (x - lx) + c * (y - ly)];
      return {
        sprite(g, x, y, s, a, v) { const [X, Y] = at(x, y); into.strokeSprite(g, X, Y, s * w.s * b.k, a + w.a, v, BUBBLE_LINE); },
        line(x0, y0, x1, y1, v, thick = 1) { const [a, b] = at(x0, y0), [c, d] = at(x1, y1); into.line(a, b, c, d, v, thick); },
        fillPolygon(pts, v) { into.fillPolygon(pts.map((p) => { const [x, y] = at(p.x, p.y); return { x, y }; }), v); },
      };
    }

    // --- the pulse ---------------------------------------------------------------
    // cicada's colour pulse: when a bubble eats, colour runs off round its
    // skin both ways from where the two met, and fades along its trail and
    // over its life (js/softbody.js). cicada's ran through the rainbow;
    // this one fades round the tag's three colours, teal to khaki to rose
    // and back to teal, in STEPS shades from each to the next, and from the
    // skin's ink up to the colour in LEVELS shades by how strongly the
    // pulse lights it, times INTENSITY: at 1.75 anything it lights at about
    // half or more is the colour itself, and the rest of its trail and its
    // last moments fade back into the ink. every shade is a colour of the
    // framebuffer's palette, made once here
    const PULSE = { STEPS: 6, LEVELS: 5, INTENSITY: 1.75 };
    const pulseInks = (() => {
      const rgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
      const hex = (c) => '#' + c.map((x) => Math.round(x).toString(16).padStart(2, '0')).join('');
      const ink = [0, 8, 16].map((k) => Framebuffer.INK >> k & 0xFF); // the palette's words run r, g, b up from the low byte
      const cols = TAG.LINES.map((l) => rgb(l.colour)), n = cols.length * PULSE.STEPS;
      return Array.from({ length: PULSE.LEVELS }, (_, l) => Array.from({ length: n }, (_, k) => {
        const a = cols[Math.floor(k / PULSE.STEPS)], b = cols[(Math.floor(k / PULSE.STEPS) + 1) % cols.length];
        const f = (k % PULSE.STEPS) / PULSE.STEPS, lit = (l + 1) / PULSE.LEVELS;
        return Framebuffer.colour(hex(ink.map((x, j) => x + (a[j] + (b[j] - a[j]) * f - x) * lit)));
      }));
    })();

    // the ink a stretch of skin is drawn in, from the pulses at its two
    // ends (SoftBlob.pulseAt), as cicada coloured its lines: the mean of the
    // two where both are lit, the short way round the cycle, the one where
    // one is, and the skin's own ink where neither is or the shade comes to
    // none
    function pulseInk(a, b) {
      if (!a && !b) return 1;
      let strength, along;
      if (a && b) {
        let d = b.along - a.along;
        if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
        strength = (a.strength + b.strength) / 2;
        along = (a.along + d / 2 + 1) % 1;
      } else ({ strength, along } = a || b);
      const level = Math.min(Math.round(strength * PULSE.INTENSITY * PULSE.LEVELS), PULSE.LEVELS);
      if (level <= 0) return 1;
      const row = pulseInks[level - 1];
      return row[Math.round(along * row.length) % row.length];
    }

    // a blob's skin through view: filled with paper and outlined
    // BUBBLE_LINE px thick, in ink, or where a pulse runs round it, in the
    // pulse's colours
    function drawSkin(view, blob) {
      const pts = blob.points, n = pts.length;
      view.fillPolygon(pts, 0);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        view.line(p.x, p.y, q.x, q.y, pulseInk(blob.pulseAt(i), blob.pulseAt((i + 1) % n)), BUBBLE_LINE);
      }
    }

    // the bubble's world through view in cicada's layers: the small bubbles,
    // then whatever under draws (the hands and their holds' lines), then the
    // bubble, filled with paper over them, with its face over it
    function drawBubble(view, under) {
      for (const b of world.blobs) if (b !== bubble) drawSkin(view, b);
      if (under) under();
      drawSkin(view, bubble);
      face.draw(view);
      // beard.draw(view);
    }

    // --- the subtitles -----------------------------------------------------------
    // what the bubble says (js/voice.js), in the box text's face at its
    // size, as words beside him: one syllable more each time he begins one,
    // the whole line once he is done, and gone LINGER seconds after, or as
    // soon as he says another or his box shuts. a line goes somewhere round
    // him at random (js/subtitle.js), GAP of its size clear of his skin as
    // it is when he starts, inside his room EDGE of its size in from the
    // box and off the box's x, and stays there; with nowhere it fits, it
    // does not show. its letters warble more than the box text's, each its
    // own way: WOBBLE's sway, bob, breathe and tilt, depth and rate, each
    // times its own 1 ± SPREAD at random
    const SUBS = {
      GAP: 0.6,     // of its size, from his skin to the line's ink
      EDGE: 0.6,    // of its size, from the room's edge to the line's ink, and round the x
      LINGER: 0.75, // seconds it stays once he is done
      SPREAD: 0.5,
      WOBBLE: { SWAY_PX: 0.5, SWAY_HZ: 1.2, BOB_PX: 0.5, BOB_HZ: 0.7, BREATHE: 0.03, BREATHE_HZ: 0.9, TILT_RAD: 0.03, TILT_HZ: 0.5 },
    };
    const subTypes = new Map(); // a line's text as shown, to its Type, made the first time it is said
    let subSaid = 0; // the voice's lines said, as of the last frame
    let sub = null;  // the line shown, { room, ends, letters: [{ L, at }] }, or null

    // a line's subtitle, placed round him in his room as laid out, or null
    function makeSubtitle(line) {
      const { whole, ends } = Subtitle.split(line.text || '');
      if (!ends.length) return null;
      let type = subTypes.get(whole);
      if (!type) subTypes.set(whole, type = new Type(whole, () => document.createElement('canvas'), TAG.FACE));
      if (!type.glyphs.length) return null;
      const room = bubbleHome.room, size = room.size, k = size / TYPE.EM, edge = SUBS.EDGE * size;
      let reach = 0; // his skin's furthest from his lock
      for (const p of bubble.points) reach = Math.max(reach, Math.hypot(p.x - bubble.lockX, p.y - bubble.lockY));
      const x = bubbleHome.box.close, keep = x ? [{ x0: x.x - edge, y0: x.y - edge, x1: x.x + x.w + edge, y1: x.y + x.h + edge }] : [];
      const ui = shopNow();
      if (ui) {
        const r = menu.p > 0 || menu.open ? ui.full : ui.shut;
        keep.push({ x0: r.x0 - edge, y0: r.y0 - edge, x1: r.x1 + edge, y1: r.y1 + edge });
      }
      const area = { x0: room.x + edge, y0: room.y + edge, x1: room.x + room.w - edge, y1: room.y + room.h - edge };
      const at = Subtitle.place(k * (type.left + type.right), k * (type.ascent + type.descent),
        room.x + bubble.lockX, room.y + bubble.lockY, reach + BUBBLE_LINE + SUBS.GAP * size, area, keep);
      if (!at) return null;
      const ox = at.x + k * type.left, base = at.y + k * type.ascent; // the line's origin, on its baseline
      const vary = () => 1 + SUBS.SPREAD * (2 * Math.random() - 1);
      const letters = type.glyphs.map((gl) => {
        const wob = {};
        for (const key in SUBS.WOBBLE) wob[key] = SUBS.WOBBLE[key] * vary();
        return { at: gl.at, L: makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, Math.floor(Math.random() * 1e6), k, wob) };
      });
      return { room, ends, letters };
    }

    // each frame: a new line's subtitle made as he starts it, and the one
    // shown dropped once it has lingered, or the engine would not take it,
    // or his box shuts or is laid out again
    function stepSubtitle() {
      if (Voice.said !== subSaid) {
        subSaid = Voice.said;
        sub = bubble && bubbleHome.room && bubbleHome.box.open && Voice.line ? makeSubtitle(Voice.line) : null;
      }
      if (sub && (!Voice.line || !bubbleHome.box.open || bubbleHome.room !== sub.room ||
          (Voice.endedAt !== null && Date.now() - Voice.endedAt > SUBS.LINGER * 1000))) sub = null;
    }

    // the subtitle sy up into cfb: as many syllables as he has begun, every
    // one once he is done
    function drawSubtitle(t, sy) {
      const n = Voice.endedAt !== null ? sub.ends.length : Math.min(Voice.heard, sub.ends.length);
      if (!n) return;
      const end = sub.ends[n - 1];
      for (const s of sub.letters) if (s.at < end) s.L.draw(t, -sy, cfb);
    }

    // --- the shop ------------------------------------------------------------------
    // Personal work's box sells drag strength, hands, spawn rate and max
    // bubbles for the bubbles the bubble has eaten, each paying by its size (js/shop.js), every number
    // shown to two places, in a menu of its own in the room's top right, as
    // far in from its top and right as the x is from its left. shut, the
    // menu is a button: a rounded rect drawn as the box is, filled with
    // paper over whatever drifts under it and outlined LINE px from point to
    // point, RADIUS of its text's size round its corners, saying with a
    // caret on its left how many bubbles there are, a BAR and TITLE, APART
    // from each other, in the box text's face at the photo caption's size, PAD
    // round them. a press
    // on it opens the menu as a box opens: the button is its shut shape, and
    // its open one reaches down and left round a list of the upgrades under
    // the header, a button each, ROW apart, every one as wide as the
    // widest, MARGIN round them, each with its label and price. it swings
    // there and back on the boxes' spring, but bouncier (BOUNCE) and set off
    // with a KICK when it opens, so it bursts open and swings further past
    // it before it settles, its edges warbling as the boxes' do, and a skin
    // (js/skin.js) chases it as a box's does, its anchors' pull reaching
    // only SPREAD along it, so it bows between them as a big box's skin
    // does, with the menu's insides, drawn apart (pfb), copied through the
    // skin, so it wipes the list in as it grows. its caret turns from > to v as it opens, as an
    // item's does, and a press on the header shuts it. under the pointer
    // the menu's outline, its caret and its words are in the items' hover
    // colour, and a button's outline and words in the links' (the
    // musician's). a press on a button buys a level: drag strength pulls every
    // held skin in the bubble's world harder, spawn rate spawns small
    // bubbles there more often, max bubbles lets it hold more at once, and
    // a hand comes out of its button and goes after the small bubbles
    // (js/hands.js), drawn as the pointer is (js/cursor.js), a fist while
    // it holds one, its hold's line dashed as the pointer's is, over the
    // small bubbles and under the bubble, as cicada layered them
    // (drawBubble). HAND_REACH is how far its art reaches from its palm.
    const SHOP_UI = {
      KEYS: ['drag', 'hands', 'spawn', 'max'], TITLE: 'upgrades', BAR: '|',
      LABELS: { drag: 'drag strength', hands: 'hands', spawn: 'spawn rate', max: 'max bubbles' },
      PAD_X: 0.5, PAD_Y: 0.25, RADIUS: 0.4, // of the text's size: round a button's words, and its corners
      APART: 0.4,                           // of the text's size, between the header's caret, count, bar and title
      ROW: 0.4, MARGIN: 0.4,                // of the text's size, between the list's buttons, and round them in the open menu
      BOUNCE: 0.45,                         // the spring's: damped 1 - BOUNCE (the boxes' 0.35, 7 % past open)
      KICK: 12,                             // a second, added to its speed toward open as it opens: with BOUNCE, about 19 % past open
      SPREAD: 14,                           // px, how far along the skin an anchor's pull reaches (a box's 80)
      CAP: 0.75, DESC: 0.2,                 // of the text's size, the face's caps over its baseline and descenders under
      STEP: 2,                              // px between a button's outline's points, as the box's skin stands
    };
    const shop = new Shop();
    const helpers = [];          // each hand bought, { hand, cursor }
    const HAND_REACH = 20;       // world px
    const shopTypes = new Map(); // a label's text, to its Type
    let shopUI = null;           // as laid out: { room, key, size, shut, full, header: { caret, count, bar, title }, buttons: [{ key, rect, ring, letters }] }
    // the menu: whether it is open, how far (p, 0 shut, 1 open and past as
    // it swings) and how fast, its caret's turn, its skin and the room it
    // was made in, and each edge's warble
    const menu = {
      open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
      warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
    };

    // the menu laid out, again whenever the room or what it says changes;
    // null with no room or no x
    function shopNow() {
      const room = bubbleHome && bubbleHome.room, c = bubbleHome && bubbleHome.box.close;
      if (!room || !c) return null;
      const U = SHOP_UI, labels = U.KEYS.map((k) => U.LABELS[k] + ' · ' + shop.price(k).toFixed(2));
      const count = shop.bubbles.toFixed(2) + ' bubbles', key = labels.join('|') + '|' + count;
      if (shopUI && shopUI.room === room && shopUI.key === key) return shopUI;
      const size = Math.max(BOX.CAP_LEAST, BOX.CAP * room.size), k = size / TYPE.EM, inset = c.x - room.x;
      const type = (text) => {
        let t = shopTypes.get(text);
        if (!t) shopTypes.set(text, t = new Type(text, () => document.createElement('canvas'), TAG.FACE));
        return t;
      };
      const wide = (t) => k * (t.left + t.right), h = Math.round(size * (2 * U.PAD_Y + U.CAP + U.DESC));
      // a line's letters, its ink's left at x0, on the baseline of a row whose top is y0
      const letters = (t, x0, y0, seed) => t.glyphs.map((gl) => makeLetter(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (U.PAD_Y + U.CAP) + k * gl.dy, seed + gl.at, k, WOBBLE));
      // the header, the shut menu: the caret, the count, the bar and the title
      const ct = type(count), bt = type(U.BAR), tt = type(U.TITLE), cg = caretType.glyphs[0], cw = cg ? k * cg.g.w : 0, apart = U.APART * size;
      const right = room.x + room.w - inset, top = room.y + inset;
      const hw = Math.round(cw + wide(ct) + wide(bt) + wide(tt) + 3 * apart + 2 * U.PAD_X * size);
      const shut = { x0: right - hw, y0: top, x1: right, y1: top + h };
      const x = shut.x0 + U.PAD_X * size, xc = x + cw + apart, xb = xc + wide(ct) + apart, xt = xb + wide(bt) + apart;
      const header = {
        caret: cg ? makeLetter(cg.g, x + cw / 2, top + size * (U.PAD_Y + U.CAP) + k * cg.dy, 78999, k, WOBBLE) : null,
        count: letters(ct, xc, top, 79000),
        bar: letters(bt, xb, top, 77000),
        title: letters(tt, xt, top, 78000),
      };
      // the list under it, every button as wide as the widest, or as the
      // header less the margins if that is wider, and the open menu round it
      const margin = Math.round(U.MARGIN * size), row = Math.round(U.ROW * size), types = labels.map(type);
      const bw = Math.max(Math.round(Math.max(...types.map(wide)) + 2 * U.PAD_X * size), hw - 2 * margin);
      const buttons = [];
      let y = shut.y1;
      U.KEYS.forEach((key, i) => {
        const rect = { x0: right - margin - bw, y0: y, x1: right - margin, y1: y + h };
        buttons.push({ key, rect, ring: ringRound(rect, U.RADIUS * size, U.STEP), letters: letters(types[i], rect.x0 + U.PAD_X * size, y, 70000 + 1000 * i) });
        y += h + row;
      });
      const full = { x0: right - Math.max(hw, bw + 2 * margin), y0: top, x1: right, y1: y - row + margin };
      shopUI = { room, key, size, shut, full, header, buttons };
      return shopUI;
    }

    // the menu's shape at p, from shut (0) to open (1), and, given a time t,
    // each edge warbled WARBLE px either way on its own sine, as boxAt has
    // the boxes
    function menuAt(ui, p, t) {
      const a = ui.shut, b = ui.full, c = { r: SHOP_UI.RADIUS * ui.size };
      for (const k of ['x0', 'y0', 'x1', 'y1']) c[k] = a[k] + (b[k] - a[k]) * p;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * menu.warble[e].hz + menu.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // the menu dt on toward open or back to its button on the boxes' spring
    // made bouncier (stepBox's closed form, stopping dead at shut), its
    // caret turning as an item's does, and its skin after it; a room laid
    // out again settles a new skin where the menu now is
    function stepMenu(dt, t) {
      const ui = shopNow();
      if (!ui) return;
      const a = ui.shut, b = ui.full;
      const px = 1 / Math.max(1, Math.abs(b.x0 - a.x0), Math.abs(b.y1 - a.y1));
      const target = menu.open ? 1 : 0, w = 2 * Math.PI / BOX.RESPONSE, z = 1 - SHOP_UI.BOUNCE;
      const sg = z * w, wd = w * Math.sqrt(1 - z * z), x0 = menu.p - target, v0 = menu.v;
      const e = Math.exp(-sg * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt);
      menu.p = target + e * (x0 * c + (v0 + sg * x0) / wd * sn);
      menu.v = e * (v0 * c - (w * w * x0 + sg * v0) / wd * sn);
      if (menu.p <= 0) { menu.p = 0; menu.v = Math.max(0, menu.v); }
      if (menu.open && Math.abs(menu.p - 1) < px && Math.abs(menu.v) / 60 < px) { menu.p = 1; menu.v = 0; }
      menu.turn = ease(menu.turn, menu.open, dt, 4 * ui.size, BOX.FLIP);
      const shape = menuAt(ui, menu.p, t);
      if (!menu.skin || menu.room !== ui.room) {
        menu.skin = new Skin(shape, SHOP_UI.SPREAD);
        menu.room = ui.room;
      } else menu.skin.step(dt, shape);
    }

    // a rounded rect's outline as a ring of points about step px apart,
    // clockwise from the top right corner, its corners quarter circles of
    // radius round
    function ringRound(r, round, step) {
      const pts = [];
      const corner = (cx, cy, from) => {
        const n = Math.max(2, Math.ceil(round * Math.PI / 2 / step));
        for (let i = 0; i <= n; i++) {
          const a = from + i / n * Math.PI / 2;
          pts.push({ x: cx + round * Math.cos(a), y: cy + round * Math.sin(a) });
        }
      };
      const edge = (ax, ay, bx, by) => {
        const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
        for (let i = 1; i < n; i++) pts.push({ x: ax + (bx - ax) * i / n, y: ay + (by - ay) * i / n });
      };
      corner(r.x1 - round, r.y0 + round, -Math.PI / 2);
      edge(r.x1, r.y0 + round, r.x1, r.y1 - round);
      corner(r.x1 - round, r.y1 - round, 0);
      edge(r.x1 - round, r.y1, r.x0 + round, r.y1);
      corner(r.x0 + round, r.y1 - round, Math.PI / 2);
      edge(r.x0, r.y1 - round, r.x0, r.y0 + round);
      corner(r.x0 + round, r.y0 + round, Math.PI);
      edge(r.x0 + round, r.y0, r.x1 - round, r.y0);
      return pts;
    }

    // the menu sy up into cfb, hover what the pointer is on: its header and,
    // while it is open at all, its buttons, each ring outlined LINE px from
    // point to point, drawn into pfb over the skin's box; then pfb copied
    // into cfb through the skin and the skin outlined over it, as drawBox
    // does a box
    function drawShop(t, sy, hover) {
      const ui = shopNow();
      if (!ui || !menu.skin) return;
      const v = hover && hover.menu ? HOVER_ITEM : 1, box = menu.skin.bounds();
      pfb.clearRows(Math.floor(box.y0 - sy) - BOX.LINE, Math.ceil(box.y1 - sy) + BOX.LINE + 1);
      for (const L of ui.header.count) L.draw(t, -sy, pfb, 0, v);
      for (const L of ui.header.bar) L.draw(t, -sy, pfb, 0, v);
      if (ui.header.caret) ui.header.caret.draw(t, -sy, pfb, menu.turn * Math.PI / 2, v);
      for (const L of ui.header.title) L.draw(t, -sy, pfb, 0, v);
      if (menu.p > 0) for (const b of ui.buttons) {
        const bv = hover && hover.buy === b.key ? HOVER_LINK : 1, n = b.ring.length;
        for (let i = 0; i < n; i++) {
          const p = b.ring[i], q = b.ring[i + 1 < n ? i + 1 : 0];
          pfb.line(p.x, p.y - sy, q.x, q.y - sy, bv, BOX.LINE);
        }
        for (const L of b.letters) L.draw(t, -sy, pfb, 0, bv);
      }
      const pts = menu.skin.screen(-sy), n = pts.length;
      cfb.fillPolygon(pts, pfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        cfb.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // a level of key bought, if there are bubbles enough, and what it buys
    function buy(key) {
      if (!world || !shop.buy(key)) return;
      if (key === 'drag') world.dragForce = SOFT.DRAG.FORCE * shop.drag();
      if (key === 'spawn') world.spawnMs = SOFT.SPAWN.EVERY_MS / shop.spawn();
      if (key === 'max') world.maxBlobs = SOFT.SPAWN.MAX_BLOBS + shop.more();
      if (key !== 'hands') return;
      const room = bubbleHome.room, r = shopNow().buttons.find((b) => b.key === 'hands').rect;
      const hand = new Hand((r.x0 + r.x1) / 2 - room.x, (r.y0 + r.y1) / 2 - room.y, world.hands.length);
      world.hands.push(hand);
      helpers.push({ hand, cursor: new Cursor() });
    }

    // the hands sy up into cfb, each where its world has it as the bubble
    // is drawn (bubbleAt)
    function drawHands(sy) {
      if (!helpers.length) return;
      const b = bubbleAt();
      for (const { hand, cursor } of helpers) {
        cursor.moveTo(b.x + (hand.x - bubble.lockX) * b.k, b.y + (hand.y - bubble.lockY) * b.k - sy);
        cursor.draw(cfb);
      }
    }

    // a point in world px on the screen as its world's px, wherever the page
    // has scrolled to, the boxes have pushed the bubble's and its box has it
    // drawn (bubbleAt), so a press lands on the bubble where it is drawn; as
    // it is with no room
    function toRoom(p) {
      const r = bubbleHome && bubbleHome.room;
      if (!r) return p;
      const b = bubbleAt(), y = p.y + scrolled() - bubbleHome.off;
      return { x: bubble.lockX + (p.x - b.x) / b.k, y: bubble.lockY + (y - b.y) / b.k };
    }

    // --- the tag's bubbles -------------------------------------------------------
    // a small bubble in each of the tag's lines, in the line's colour: a
    // ring of verlet points (js/softbody.js) as Personal work's bubble is,
    // with no face, locked where the tag puts it and holding still there,
    // with no wobble. each is in a world of its own the size of the
    // viewport, so its px are the page's: the tag does not scroll. it is
    // made at each layout and settled in place at once, at a radius that
    // puffs out to the one the tag gives it (PUFFED, the ring's radius at
    // rest over the radius it is made with). it is filled with its colour
    // right out to the skin; a press within
    // REACH of it takes hold of it as of the other, and it wobbles home
    // when let go.
    const SETTLE = 60; // steps that leave a ring still where it is made
    const PUFFED = (() => {
      const w = new World(100, 100), b = new SoftBlob(50, 50, BUBBLE_POINTS, 10, BUBBLE_PUFF, true);
      w.blobs.push(b);
      for (let i = 0; i < SETTLE; i++) w.tick();
      const c = b.getCenter();
      return b.points.reduce((r, p) => r + Math.hypot(p.x - c.x, p.y - c.y), 0) / b.points.length / 10;
    })();
    let tagBubbles = []; // each { world, blob, x, y, r, v }, made by layoutTag

    // a bubble r px round at (x, y) on the page in colour v, settled there
    function makeTagBubble(x, y, r, v) {
      const world = new World(W, H), blob = new SoftBlob(x, y, BUBBLE_POINTS, r / PUFFED, BUBBLE_PUFF, true);
      world.blobs.push(blob);
      for (let i = 0; i < SETTLE; i++) world.tick();
      return { world, blob, x, y, r, v };
    }

    // a tag bubble: filled with its colour out to its skin's outer edge,
    // the ring's points pushed out along its normal by half BUBBLE_LINE,
    // so it is as big as an outline BUBBLE_LINE px thick round the ring
    // would be and as round as the ring is
    function drawTagBubble(b) {
      const pts = b.blob.points, n = pts.length;
      const edge = (d) => pts.map((q, i) => {
        // the secant across it turned a quarter: outward, on a ring that
        // runs clockwise on screen
        const a = pts[(i + n - 1) % n], c = pts[(i + 1) % n];
        const nx = c.y - a.y, ny = a.x - c.x, m = Math.hypot(nx, ny) || 1;
        return { x: q.x + d * nx / m, y: q.y + d * ny / m };
      });
      fb.fillPolygon(edge(BUBBLE_LINE / 2), b.v);
    }

    // the tag bubble a press at world (x, y) on the screen takes hold of:
    // the nearest, if the press is within REACH of its skin, or null
    function tagBubbleAt(x, y) {
      let best = null, most = Infinity;
      for (const b of tagBubbles) {
        const d = Math.hypot(x - b.x, y - b.y) - b.r;
        if (d <= TAG.REACH && d < most) { best = b; most = d; }
      }
      return best;
    }

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm
    // on the pointer. while the button is held it closes through the frames
    // to a fist, and it opens again when the button lifts. a touch gets no
    // hand: there is nothing to see under a finger. it goes down last, over
    // everything, on a dark backing, so it reads over the letters and the
    // bubble.
    const cursor = new Cursor();

    // --- the drag ----------------------------------------------------------------
    // a press near the skin, while its box is open and the press presses
    // nothing else, takes hold of its nearest point and two either
    // side and pulls them toward the pointer, and so does a press near one
    // of the tag's bubbles that presses nothing else, until the press lifts or the
    // pull goes too far and the skin lets go; the click it ends in presses
    // nothing. the pointer is captured, so a
    // drag carries on outside the window; only a pointer that leaves with
    // nothing held is forgotten, and the eyes stop following it. where it
    // is goes to each world each frame, so a scroll or a box pushing the
    // bubble's moves it in the world as a move would
    function worldPointer(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / SCALE, y: (e.clientY - rect.top) / SCALE };
    }
    let pointerAt = null, grabbed = false; // the pointer, world px on the screen, or null; whether the last press took hold
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      cursor.press();
      pointerAt = p;
      const q = toRoom(p);
      grabbed = !!(bubbleHome && bubbleHome.box.open && !hitAt(p.x, p.y)) && world.grab(q.x, q.y);
      if (grabbed && world.drag.blob === bubble) Voice.complain(); // the bubble, taken hold of, complains out loud (js/voice.js)
      const b = !grabbed && !hitAt(p.x, p.y) && tagBubbleAt(p.x, p.y);
      if (b) grabbed = b.world.grab(p.x, p.y);
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      pointerAt = p;
    });
    // a lifted press opens the hand again. it goes when there is nothing
    // left to hover: a finger lifted, or a captured drag let go outside the
    // viewport
    function liftCursor(e) {
      cursor.release();
      const p = worldPointer(e);
      if (e.pointerType === 'touch' || p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) cursor.hide();
    }
    // every world a press can take hold in
    function worlds() {
      return [world, ...tagBubbles.map((b) => b.world)];
    }
    canvas.addEventListener('pointerup', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    canvas.addEventListener('pointercancel', (e) => { liftCursor(e); for (const w of worlds()) w.release(); });
    // a captured drag carried outside the window keeps its hand: moves still come
    canvas.addEventListener('pointerleave', () => {
      if (worlds().some((w) => w.drag)) return;
      pointerAt = null;
      for (const w of worlds()) w.pointerOff();
      cursor.hide();
    });

    // --- the swipe ---------------------------------------------------------------
    // the browser scrolls on its own and tells the page where it got to late
    // and unevenly, so a finger scrolls the page itself. a press (not a
    // mouse) that goes SWIPE.SLOP css px, more up or down than across, is a
    // swipe: everything else the press was doing is called off as the
    // browser's own scroll calls it off (a pointercancel and a
    // pointerleave), and from there the page moves 1:1 with the finger, no
    // further than either end. let go moving, it glides on the way it was
    // going, as far as the finger's speed over its last FLICK ms carries
    // it, by the house approach, GLIDE of the way left each 60 hz frame (a
    // flick slowing as ios's scroll does, 0.998 of its speed a ms). a press
    // that goes across first is the page's to the end. a press while it
    // glides stops it and is the swipe's alone, its events and its click
    // going no further: up or down, it swipes on from where it stopped it.
    // a wheel or a key scrolls the document natively, and the finger's
    // scroll is kept on top of the document's
    const SWIPE = {
      SLOP: 10,                              // css px a press goes before it is a swipe or not
      FLICK: 100,                            // ms of the finger's last moves its speed is taken over
      STILL: 60,                             // ms a finger held still before lifting that leaves no glide
      GLIDE: 1 - Math.pow(0.998, 1000 / 60), // of the way left to glide, each 60 hz frame
    };
    let swipeY = 0, swipeTo = 0; // css px the finger has the page scrolled past the document's own, and where it glides to
    let swipe = null;            // the press being watched, { id, x, y, on, done, stop, y0, from, samples }, or null
    let eatClick = false;        // the click the press ends in presses nothing
    let calling = false;         // the swipe is calling a press off, so its own listeners let that through

    // how far the page is scrolled, in whole world px
    function scrolled() {
      return Math.round((window.scrollY + swipeY) / SCALE);
    }

    // y css px of the finger's scroll, no further than either end
    function clampSwipe(y) {
      return Math.min(Math.max(y, -window.scrollY), scrollEnd - window.scrollY);
    }

    // the finger's scroll kept in the page, and gliding on toward where it
    // was flicked while no finger holds it
    function stepSwipe(dt) {
      swipeY = clampSwipe(swipeY);
      swipeTo = clampSwipe(swipeTo);
      if ((swipe && swipe.on) || swipeTo === swipeY) return;
      swipeY += (swipeTo - swipeY) * (1 - Math.pow(1 - SWIPE.GLIDE, 60 * dt));
      if (Math.abs(swipeTo - swipeY) < 0.5) swipeY = swipeTo;
    }

    // on the window, capturing, so a press is heard before the canvas's
    // own listeners and can be kept from them
    window.addEventListener('pointerdown', (e) => {
      if (calling) return;
      eatClick = false;
      if (e.pointerType === 'mouse' || !e.isPrimary) return;
      const stop = Math.abs(swipeTo - swipeY) > SWIPE.SLOP;
      swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false, done: false, stop, y0: 0, from: 0, samples: [] };
      swipeTo = swipeY;
      // a press while it glides stops it, and nothing else hears it
      if (stop) {
        e.stopPropagation();
        eatClick = true;
      }
    }, true);
    window.addEventListener('pointermove', (e) => {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.on) {
        e.stopPropagation();
        swipeY = swipeTo = clampSwipe(swipe.from - (e.clientY - swipe.y0));
        swipe.samples.push({ t: e.timeStamp, y: swipeY });
        while (swipe.samples.length > 2 && e.timeStamp - swipe.samples[0].t > SWIPE.FLICK) swipe.samples.shift();
        return;
      }
      if (swipe.stop) e.stopPropagation();
      if (swipe.done) return;
      const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      if (Math.hypot(dx, dy) <= SWIPE.SLOP) return;
      swipe.done = true;
      // across first: the press is the page's to the end
      if (Math.abs(dy) <= Math.abs(dx)) return;
      // up or down: the press called off as the browser's scroll calls it
      // off, unless it stopped a glide and the canvas never heard it
      if (!swipe.stop) {
        const like = { pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary, clientX: e.clientX, clientY: e.clientY };
        calling = true;
        canvas.dispatchEvent(new PointerEvent('pointercancel', like));
        canvas.dispatchEvent(new PointerEvent('pointerleave', like));
        calling = false;
      }
      // anchored where it takes over, so the page does not jump by the slop
      swipe.on = true;
      swipe.y0 = e.clientY;
      swipe.from = swipeY;
      swipe.samples = [{ t: e.timeStamp, y: swipeY }];
      eatClick = true;
      e.stopPropagation();
    }, true);
    // a swipe let go: the finger's speed v, css px a second, over its last
    // FLICK ms, none if it was held still STILL ms first, and the glide's
    // end v / k on, k the house approach's rate a second, so the glide
    // starts at the finger's speed
    function swipeLift(e) {
      if (calling || !swipe || e.pointerId !== swipe.id) return;
      if (swipe.stop || swipe.on) e.stopPropagation();
      if (swipe.on && e.type === 'pointerup') {
        const s = swipe.samples.filter((p) => e.timeStamp - p.t <= SWIPE.FLICK);
        const a = s[0], b = s[s.length - 1];
        const v = s.length < 2 || e.timeStamp - b.t > SWIPE.STILL || b.t === a.t ? 0 : (b.y - a.y) / (b.t - a.t) * 1000;
        const k = -60 * Math.log(1 - SWIPE.GLIDE);
        swipeTo = clampSwipe(swipeY + v / k);
      }
      swipe = null;
    }
    window.addEventListener('pointerup', swipeLift, true);
    window.addEventListener('pointercancel', swipeLift, true);
    window.addEventListener('click', (e) => {
      if (!eatClick) return;
      eatClick = false;
      e.stopPropagation();
    }, true);

    // cicada's drag line: dashed, from the grabbed point to the pointer,
    // its dashes shrinking and gaps opening over the last 30 % of the reach
    // before the skin lets go, in world w through view as its bubble is
    // drawn. cicada also put a plus on every held point; those are left
    // off, the skin is not to be marked
    function drawDrag(view, d) {
      if (!d) return;
      const c = d.points[0].point;
      const dx = c.x - d.x, dy = c.y - d.y;
      const reach = Math.min(Math.sqrt(dx * dx + dy * dy) / SOFT.DRAG.BREAKAWAY, 1);
      const dashing = Math.pow(Math.max(0, (reach - 0.7) / 0.3), 2);
      const dashLength = Math.max(2, 12 * (1 - dashing)), gapLength = 1 + 25 * dashing;
      // walked from the rounded ends, as cicada did
      const x0 = Math.round(c.x), y0 = Math.round(c.y), x1 = Math.round(d.x), y1 = Math.round(d.y);
      const len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (len === 0) return;
      const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      for (let at = 0, drawing = true; at < len; drawing = !drawing) {
        const end = Math.min(at + (drawing ? dashLength : gapLength), len);
        if (drawing) view.line(x0 + ux * at, y0 + uy * at, x0 + ux * end, y0 + uy * end);
        at = end;
      }
    }

    // --- daedalus ----------------------------------------------------------------
    // the program's 128x64 panel, one world pixel per panel pixel, in the
    // middle of the viewport, copied bit for bit into the framebuffer, dark
    // bits too, so it reads as a screen over whatever is under it. it runs
    // 80 frames a second on its own clock; each browser frame runs as many
    // as wall time has moved on.
    // the bubble has taken its place in the middle; SHOW_DAEDALUS brings it back.
    const SHOW_DAEDALUS = false; // false: no module, no panel, no keyboard
    const FRAME_MS = 12.5;
    let panel = null; // set once the module is up

    if (SHOW_DAEDALUS) createDaedalus().then((m) => {
      m._daed_init(0x64616564);
      const PW = m._daed_width(), PH = m._daed_height();
      const stride = (PW + 7) >> 3;
      let acc = 0, last = performance.now();

      panel = {
        step(now) {
          acc += now - last;
          last = now;
          if (acc > 100) acc = 100; // after a stall, catch up a little, not forever
          while (acc >= FRAME_MS) { m._daed_frame(); acc -= FRAME_MS; }
        },
        draw() {
          // HEAPU8 re-read each frame: the heap view changes if memory grows
          fb.blitPacked(m.HEAPU8, m._daed_buffer(), PW, PH, stride, panelX, panelY);
        },
      };

      // the computer keyboard as a midi keyboard, the sim window's layout:
      // A W S E D F T G Y H U J K O L P ; are C4..E5, Z/X the octave, C/V the
      // velocity by 20, space the sustain pedal (a hand on every bell).
      const KEYS = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
                     KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14,
                     KeyP: 15, Semicolon: 16 };
      let base = 60, vel = 100, pedal = false;
      const held = {};
      const send = (s, a, b) => m._daed_midi(s, a, b);
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code in KEYS) {
          if (held[e.code] !== undefined) return;
          held[e.code] = base + KEYS[e.code];
          send(0x90, held[e.code], vel);
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (!pedal) { pedal = true; send(0xB0, 64, 127); }
        } else if (e.code === 'KeyZ') { if (base - 12 >= 0) base -= 12; }
        else if (e.code === 'KeyX') { if (base + 12 <= 108) base += 12; }
        else if (e.code === 'KeyC') { vel = Math.max(1, vel - 20); }
        else if (e.code === 'KeyV') { vel = Math.min(127, vel + 20); }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code in KEYS) {
          if (held[e.code] === undefined) return;
          send(0x80, held[e.code], 0);
          delete held[e.code];
        } else if (e.code === 'Space') {
          if (pedal) { pedal = false; send(0xB0, 64, 0); }
        }
      });
      window.addEventListener('blur', () => {
        for (const k in held) { send(0x80, held[k], 0); delete held[k]; }
        if (pedal) { pedal = false; send(0xB0, 64, 0); }
      });
    });

    // --- the frame ---------------------------------------------------------------
    // the world is drawn fresh every browser frame, all of it into the
    // framebuffer. first the bubble's world, its face, the tag's bubbles and the
    // cursor's hand and the boxes catch up with the clock, the words
    // under them are pushed down, and each box's skin is stepped after
    // where its box has got to, warbled; then the bits are cleared, the words and
    // their boxes drawn scrolled, a shut box in its word's o's place with
    // its insides showing through it, the bubble in its box, every other
    // letter over them on its own
    // clock, the tag's bubbles, daedalus's panel if it is shown, the
    // drag's marks, and last the hand on its backing, over the end of the
    // drag's line, each layer simply writing over the bits of the last. then
    // the whole of it goes to the canvas in one copy.
    let lastNow = null; // the last frame's time, for the face's dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      if (pointerAt) { const q = toRoom(pointerAt); world.pointer(q.x, q.y); }
      if (bubble) world.spawning = bubbleHome.box.open;
      world.step(now);
      // the bubble, having eaten, strikes one of the name's notes at random
      // at once (js/piano.js) and a moment later thanks whoever fed him
      // (js/voice.js)
      const fed = bubble ? world.merges.filter((m) => m.blob === bubble) : [];
      if (fed.length) {
        for (const m of fed) shop.earn(Shop.reward(m.eaten.radius));
        Piano.strike(Math.floor(Math.random() * Piano.NOTES.length));
        Voice.thank();
      }
      for (const h of helpers) {
        if (h.hand.drag) h.cursor.press(); else h.cursor.release();
        h.cursor.update(dt);
      }
      Voice.update();
      stepSubtitle();
      if (bubble) face.update(bubble, world, dt, Voice.mouth);
      for (const b of tagBubbles) {
        if (pointerAt) b.world.pointer(pointerAt.x, pointerAt.y);
        b.world.step(now);
      }
      cursor.update(dt);
      for (const s of sections) {
        stepBox(s, dt);
        stepItems(s, dt);
        grow(s);
      }
      settle();
      for (const s of sections) if (s.skin) s.skin.step(dt, boxAt(s, s.box.p, t));
      // each item's skin after its bubble while its box is out of the o
      for (const s of sections) if (s.box.shown) for (const it of s.items) if (it.skin) it.skin.step(dt, itemAt(it, t));
      stepMenu(dt, t);
      // if (bubble) beard.step(dt, face.mouf, face.scale);
      if (panel) panel.step(now);
      stepSwipe(dt);
      fb.clear();
      // the words and their boxes first, scrolled and pushed down by the
      // boxes above them, each box over its word, so the header's letters
      // cover them all
      const sy = scrolled();
      const hit = hoverAt && hitAt(hoverAt.x, hoverAt.y);
      for (const s of sections) {
        const v = hit && hit.s === s && !hit.it && !hit.close && !hit.shop ? HOVER : undefined;
        for (const L of s.letters) L.draw(t, s.off - sy, fb, 0, v);
      }
      for (const s of sections) drawBox(s, t, sy - s.off, hit && hit.s === s ? hit : null);
      // the header's letters, the name's under the pointer in its colour
      const lit = nameRow && nameRow.keys[nameOn];
      for (const L of letters) L.draw(t, 0, fb, 0, lit && L === lit.L ? lit.v : undefined);
      for (const b of tagBubbles) drawTagBubble(b);
      if (SHOW_DAEDALUS && panel) panel.draw();
      if (bubble && bubbleHome.room) drawDrag(roomView(fb, t, sy - bubbleHome.off), world.drag);
      for (const b of tagBubbles) drawDrag({ line: (x0, y0, x1, y1) => fb.line(x0, y0, x1, y1, b.v) }, b.world.drag);
      cursor.draw(fb);
      fb.present(ctx);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
