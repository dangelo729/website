<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peter D'Angelo</title>
  <style>
    /* the paper colour, as in js/raster.js: any sliver past the canvas matches */
    html, body { margin: 0; background: #fff; }
    /* the document scrolls, only to move the about text: #scroll gives it
       its height and the canvas stays fixed over the window. no bar, no
       bounce past either end */
    html, body { overscroll-behavior: none; }
    html { scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    #scroll { width: 1px; }
    /* a press on the canvas is the page's own: no selecting, and a swipe
       only scrolls up and down. no cursor either: the pointer is drawn into
       the frame as a hand */
    canvas { position: fixed; top: 0; left: 0; display: block; image-rendering: pixelated; cursor: none;
             touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="scroll"></div>
  <script src="font.js"></script>
  <script src="daedalus/daedalus.js"></script>
  <script src="js/raster.js"></script>
  <script src="js/softbody.js"></script>
  <script src="js/face-art.js"></script>
  <script src="js/face.js"></script>
  <script src="js/beard.js"></script>
  <script src="js/hand-art.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/type.js"></script>
  <script src="js/about-photo.js"></script>
  <script>
    // --- the viewport ------------------------------------------------------------
    // the window is a viewport onto a grid of world pixels, each SCALE css
    // pixels square. resizing shows more or fewer of them; nothing is ever
    // stretched. every pixel is drawn into one framebuffer (js/raster.js)
    // the size of the visible world, each pixel lit or dark; once a frame
    // it is copied whole into the canvas bitmap, which is that size exactly,
    // and the browser blows it up by SCALE. nothing draws to the canvas
    // itself.
    const SCALE = 1.5;

    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d'); // only the framebuffer's present uses it
    let W = 0, H = 0; // the viewport, in world pixels
    let fb = null;    // the world bitmap, remade at the viewport's size
    let cfb = null;   // the about box's insides, drawn apart and copied through the box (below)

    function resize() {
      W = Math.max(1, Math.floor(window.innerWidth / SCALE));
      H = Math.max(1, Math.floor(window.innerHeight / SCALE));
      canvas.width = W;
      canvas.height = H;
      fb = new Framebuffer(W, H);
      cfb = new Framebuffer(W, H);
      canvas.style.width = (W * SCALE) + 'px';
      canvas.style.height = (H * SCALE) + 'px';
      layout();
    }

    // --- letters -----------------------------------------------------------------
    // a letter is one object: its glyph from font.js cut to its ink, a home
    // position in continuous world space, a scale and a tilt, and slow sines
    // of its own on each, at rates and phases seeded from its place in the
    // text. it is drawn as a sprite (js/raster.js), as daedalus's head is:
    // every world pixel in its box is carried back through the transform
    // into the glyph and lit when enough of it lands on ink, so a sub-pixel
    // move or a touch of scale shows as edge pixels popping, never as the
    // block stepping, and a 1 px stroke at these scales always lights one
    // pixel and only doubles when it sits almost exactly between two. the
    // bubble's face goes through the same sampler.
    const LETTER_SCALE = 1.56;
    const SWAY_PX  = 0.25, SWAY_HZ    = 0.4;  // along x
    const BOB_PX   = 0.25, BOB_HZ     = 0.23; // along y
    const BREATHE  = 0.02, BREATHE_HZ = 0.31; // of the scale: 1.53 to 1.59
    const TILT_RAD = 0.015, TILT_HZ   = 0.17; // about the centre
    // the four together, as makeLetter takes them: the name's letters take
    // these too (NAME.WOBBLE), and could be given their own
    const WOBBLE = { SWAY_PX, SWAY_HZ, BOB_PX, BOB_HZ, BREATHE, BREATHE_HZ, TILT_RAD, TILT_HZ };

    // the glyph cut to its ink columns as a sprite's bitmap, or null for a
    // blank
    function glyphInk(ch) {
      const rows = typeof FONT !== 'undefined' && FONT.glyphs[ch];
      if (!rows) return null;
      let lo = FONT.width, hi = -1;
      for (const r of rows) for (let i = 0; i < r.length; i++)
        if (r[i] === '#') { if (i < lo) lo = i; if (i > hi) hi = i; }
      if (hi < 0) return null;
      return Framebuffer.ink(rows.map((r) => r.slice(lo, hi + 1)));
    }

    // a stable number in [0, 1) from two integers
    function noise(i, k) {
      const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
      return s - Math.floor(s);
    }

    // the bitmap g centred on (cx, cy), drawn at scale and wobbled by wob,
    // its rates and phases seeded from i, in v: ink, or a colour of the
    // framebuffer's palette
    function makeLetter(g, cx, cy, i, scale = LETTER_SCALE, wob = WOBBLE, v = 1) {
      const rate = (base, k) => base * (0.8 + 0.4 * noise(i, k));
      const phase = (k) => 2 * Math.PI * noise(i, k);
      return {
        g, cx, cy, scale, wob, v,
        swayHz: rate(wob.SWAY_HZ, 1), bobHz: rate(wob.BOB_HZ, 2), breatheHz: rate(wob.BREATHE_HZ, 3), tiltHz: rate(wob.TILT_HZ, 4),
        swayPh: phase(5), bobPh: phase(6), breathePh: phase(7), tiltPh: phase(8),
        // at time t, dy world px down from home (up, for a scroll), into
        // the page's framebuffer or another
        draw(t, dy = 0, into = fb) {
          const w = 2 * Math.PI * t, m = this.wob;
          into.sprite(this.g,
            this.cx + m.SWAY_PX * Math.sin(w * this.swayHz + this.swayPh),
            this.cy + dy + m.BOB_PX * Math.sin(w * this.bobHz + this.bobPh),
            this.scale * (1 + m.BREATHE * Math.sin(w * this.breatheHz + this.breathePh)),
            m.TILT_RAD * Math.sin(w * this.tiltHz + this.tiltPh),
            this.v);
        },
      };
    }

    // a line of text as letters, x and y the top-left of the first cell:
    // proportional, one column of air after each glyph, a space half a cell
    // wide, everything at LETTER_SCALE
    function layoutText(text, x, y, firstIndex) {
      const out = [];
      let i = firstIndex;
      for (const ch of text) {
        const g = glyphInk(ch);
        if (!g) { x += (FONT.width >> 1) * LETTER_SCALE; i++; continue; }
        out.push(makeLetter(g, x + g.w * LETTER_SCALE / 2, y + g.h * LETTER_SCALE / 2, i++));
        x += (g.w + 1) * LETTER_SCALE;
      }
      return out;
    }

    // the width of a line of text as layoutText lays it out
    function textWidth(text) {
      let w = 0, last = false;
      for (const ch of text) {
        const g = glyphInk(ch);
        w += (g ? g.w + 1 : (FONT.width >> 1)) * LETTER_SCALE;
        last = !!g;
      }
      return last ? w - LETTER_SCALE : w;
    }

    // --- the name ----------------------------------------------------------------
    // the name across the top left, in helvetica, as big as the page gives
    // it room for. it is not browser text: js/type.js fills each glyph once,
    // big, into an offscreen canvas and reads it back as a bitmap, and here
    // each one is a letter like the menu's, drawn through the same sampler
    // at the name's size with the same sway, bob, breathe and tilt, seeded
    // from its own place in the name. the bitmaps are made once, at the em;
    // a resize only places them and sets their scale, size over the em. at
    // these sizes the breathe and the tilt do most of the moving: the sway
    // and the bob are a quarter of a world pixel whatever its size. wide,
    // its ink's top left sits on the menu's margin, at SIZE or smaller when
    // the page is too narrow for that; narrow, it is centred across the top
    // and the bubble and the menu stack under it. the rest of the page keeps
    // GAP clear of its box. with no 2d canvas there is no name, as there
    // is no menu without font.js.
    const NAME = {
      TEXT: 'Peter D\'Angelo',
      SIZE: 114,       // world px to the em, the most it will be
      WIDTH: 0.68,     // of the viewport's width its ink may span, wide
      NARROW: 0.9,     // the same, stacked
      X: 21,           // its ink's left edge, wide: the menu's margin
      TOP: 21,         // world px from the top edge to its tallest ink
      GAP: 21,         // from its box's bottom to anything under it
      FIRST: 100,      // its letters' seeds run from here, clear of the menu's
      WOBBLE,          // the menu's sway, bob, breathe and tilt
    };
    const nameType = new Type(NAME.TEXT, () => document.createElement('canvas'));

    // the name's letters into letters, sized to fit and placed; its ink's
    // box and size, { left, right, top, base, bottom, size } with base its
    // baseline and size world px to the em, or null
    // when there is no name. wide, it leaves room on its right for the tag
    // at its least
    function layoutName(stacked) {
      const t = nameType;
      if (!t.glyphs.length) return null;
      const ems = (t.left + t.right) / TYPE.EM; // its ink's width, in ems
      const room = tagStair ? 2 * TAG.GAP + TAG.LEAST * tagStair.ems : 0;
      const size = Math.min(NAME.SIZE, (stacked ? NAME.NARROW * W : Math.min(NAME.WIDTH * W, W - NAME.X - room)) / ems);
      const k = size / TYPE.EM;
      // the line's origin on its baseline, from where its ink's top left goes
      const ox = (stacked ? (W - ems * size) / 2 : NAME.X) + k * t.left, base = NAME.TOP + k * t.ascent;
      for (const gl of t.glyphs)
        letters.push(makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, NAME.FIRST + gl.at, k, NAME.WOBBLE));
      return { left: ox - k * t.left, right: ox + k * t.right, top: NAME.TOP, base, bottom: base + k * t.descent, size };
    }

    // --- the tag -----------------------------------------------------------------
    // what he does, three lines of helvetica beside the name, each a STEP
    // right of the one above, each in its own colour. they are the name's
    // kind of letter, through the same sampler with the same wobble, only
    // small. wide, they stand in the room right of the name: the stair's
    // ink starts GAP past the name's and keeps GAP from the right edge, the
    // first line's top is level with the name's top and the last line sits
    // on the name's baseline, at the most size that keeps LEAD between
    // baselines and the widest step inside the room. under LEAST it is too
    // small to read, so it stays at LEAST, the name narrowing to leave it
    // the room and the stair running on below the baseline. stacked, the
    // stair goes under the name at SIZE or less, centred across the page.
    const TAG = {
      LINES: [
        { text: 'Inventor',          colour: '#49B6B0' },
        { text: 'Software Engineer', colour: '#B8B693' },
        { text: 'Musician',          colour: '#B5979A' },
      ],
      // helvetica neue's medium: at this size regular's strokes fall
      // under a pixel and break up, and bold's fill the counters
      FACE: { weight: 500, family: '"Helvetica Neue", Helvetica, Arial, sans-serif' },
      STEP: 1.25, // ems each line's ink starts right of the line above's
      LEAD: 1.1,  // the least baseline to baseline, in ems
      GAP: 21,    // world px clear of the name, and of the right edge
      LEAST: 15,  // world px to the em, wide, the least it will be
      SIZE: 17,   // world px to the em, stacked, the most it will be
      FIRST: 200, // its letters' seeds run from here, clear of the name's
    };
    const tagLines = TAG.LINES.map((l) => ({
      type: new Type(l.text, () => document.createElement('canvas'), TAG.FACE),
      v: Framebuffer.colour(l.colour),
    }));

    // the stair's width in ems, its widest step, and the first line's ink
    // above its baseline; null, and no tag, when a line has no glyphs
    const tagStair = tagLines.every((l) => l.type.glyphs.length) ? {
      ems: Math.max(...tagLines.map((l, i) => i * TAG.STEP + (l.type.left + l.type.right) / TYPE.EM)),
      asc: tagLines[0].type.ascent / TYPE.EM,
    } : null;

    // the tag's lines into letters beside the name's box, or under it
    // stacked; the bottom of its ink, or null when there is no tag
    function layoutTag(name, stacked) {
      if (!name || !tagStair) return null;
      const n = tagLines.length, em = TYPE.EM, { ems, asc } = tagStair;
      let size, x, top, lead;
      if (stacked) {
        size = Math.min(TAG.SIZE, NAME.NARROW * W / ems);
        x = (W - ems * size) / 2;
        top = name.bottom + NAME.GAP / 2;
        lead = TAG.LEAD * size;
      } else {
        x = name.right + TAG.GAP;
        top = name.top;
        const across = (W - TAG.GAP - x) / ems, down = (name.base - top) / (asc + (n - 1) * TAG.LEAD);
        size = Math.min(across, Math.max(TAG.LEAST, down));
        lead = n > 1 ? Math.max(TAG.LEAD * size, (name.base - top - size * asc) / (n - 1)) : 0;
      }
      if (!(size > 0)) return null;
      const k = size / em;
      let base = top + size * asc;
      tagLines.forEach((l, i) => {
        const t = l.type, ox = x + i * TAG.STEP * size + k * t.left;
        base = top + size * asc + i * lead;
        for (const gl of t.glyphs)
          letters.push(makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, TAG.FIRST + 50 * i + gl.at, k, WOBBLE, l.v));
      });
      return base + k * tagLines[n - 1].type.descent;
    }

    // --- about -------------------------------------------------------------------
    // the word under the header (the name and its tag), in the name's
    // helvetica at 0.6 of the name's size, its ink's left on the
    // name's (centred, stacked) and its top BELOW of the name's ems under
    // the header's ink. it is the one thing that scrolls: the document is
    // given height past the window (#scroll) and the canvas stays fixed
    // over it, so a wheel, a swipe or a key scrolls it natively, and each
    // frame the about letters are drawn that far up, in whole world px so
    // they move rigidly rather than shimmer through the sampler. they go
    // down before the header's letters, and a letter writes only its ink,
    // so passing under the header they are hidden by its letters and
    // nothing else: there is only paper behind the header. it scrolls until
    // its last ink, or the box's while there is one, has gone off the top.
    const ABOUT = {
      TEXT: 'About',
      SIZE: 0.6,  // of the name's world px to the em
      BELOW: 1,   // the name's ems from the header's ink to its ink
      FIRST: 300, // its letters' seeds run from here, clear of the tag's
    };
    const aboutType = new Type(ABOUT.TEXT, () => document.createElement('canvas'));
    const scroller = document.getElementById('scroll');
    let aboutLetters = [];
    let aboutInk = null; // the word's ink box, world px from the page's top: { x0, y0, x1, y1 }

    // --- the about box -------------------------------------------------------------
    // a press on the word opens a box round it: a slightly rounded rect, a
    // LINE px outline through the framebuffer like everything, that comes out
    // of the word's o. shut, it is the o's own ink box with corners as round
    // as they go, a circle behind the o; open, it stands PAD clear of the
    // word's ink at its top and left, as far in from the window's right,
    // and down to as far up from the window's bottom, or past it when its
    // insides need more. it goes from one to the other linearly, every edge
    // and the corners' radius at an even pace, in OPEN seconds whatever
    // the screen's rate. its outline starts as thick as the o's stroke, so
    // shut it stands in for the o, and thins to LINE as it opens. it is
    // drawn over the word, so it covers the word as it grows and shows it
    // again as it shrinks. open, an x stands in its top left corner, inside
    // its padding where the word's ink starts: the pixel font's X (font.js,
    // the old menu's) at CLOSE of its own size, with the text's wobble, the
    // text and photo
    // starting under it where the word was. a press on the x sends the
    // box back into the o,
    // from wherever it has got to. while it is open the word, under it, is
    // not pressed; while it is shrinking a press on the word opens it again.
    //
    // inside, lorem ipsum in the tag's face and the photo (js/about-photo.js)
    // dithered at its size in its own few colours, each a place in the
    // framebuffer's palette. wide, the photo stands in the top right corner,
    // as tall as the box at rest, and the text under the word left of it,
    // at BODY size. stacked (a phone) everything goes down the box: the
    // word, the photo across it, the text at PHONE size, and the box is a
    // portrait that fits the screen under the header, the photo taking the
    // height the text leaves it, cut about FOCUS to fill it, no shorter
    // than CROP of its width (the box grows past the screen only when the
    // text leaves less than that). they are laid out to
    // the open box and there all along, drawn each frame into a framebuffer
    // of their own (cfb) and copied into the page's only where the box is
    // (Framebuffer.roundRect), so the growing box wipes them in. box,
    // insides and word scroll together and go under the header alike.
    const BOX = {
      PAD: 0.2,      // of the word's size: its ink to the box's edge
      RADIUS: 0.15,  // of the word's size: the open box's corners
      LINE: 2,       // world px, the outline's thickness open, and the x's strokes'
      CLOSE: 1,      // the scale the pixel font's X is drawn at: 1 is its own pixels, 11 world px tall
      OPEN: 0.2,     // seconds from the o to open, or back
      GAP: 0.45,     // of the word's size: from under its ink to the insides
      PHOTO: 0.45,   // of the insides' width the photo may take, wide
      BODY: 0.18,    // of the name's size: the text's world px to the em, wide,
      LEAST: 12,     // but no less than this
      MOST: 16,      // and no more than this
      PHONE: 11,     // the text's world px to the em, stacked
      CROP: 0.45,    // the least the photo is tall, of its width, stacked
      FOCUS: [0.4, 0.3], // where in the photo a crop is centred, as far as it can be: the face
      LEAD: 1.45,    // ems, baseline to baseline
      PARA: 0.7,     // ems more between paragraphs
      GUTTER: 1.5,   // ems between the text and the photo
      FIRST: 1000,   // the text's seeds run from here, a thousand a paragraph
    };
    const LOREM = [
      'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
      'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
    ];
    const bodyTypes = LOREM.map((p) => new Type(p, () => document.createElement('canvas'), TAG.FACE));
    const box = {
      open: false,  // where it is going: open, or back into the o
      shown: false, // drawn: from a press until it is back in the o
      p: 0,         // how far open it is, 0 in the o to 1 open
      shut: null,   // where it starts and ends: the o, { x0, y0, x1, y1, r }, world px from the page's top
      full: null,   // where it opens to
      close: null,  // the x in its corner, { x, y, w, h, letter }: its ink's top left and size, world px from the page's top
    };
    let bodyLetters = [];
    let photoAt = null; // the dithered photo and its top left, { g, x, y }

    // the photo, once it has loaded; it lays the page out again when it has
    const photo = new Image();
    let photoReady = false;
    photo.onload = () => { photoReady = true; photoColours = photoPalette(); if (fb) layout(); };
    if (typeof ABOUT_PHOTO !== 'undefined') photo.src = ABOUT_PHOTO;

    // the photo, or the part of it crop gives ({ sx, sy, sw, sh } in its
    // own px), drawn at w x h into a canvas and read back as r, g, b, its
    // levels stretched so its darkest and lightest LEVELS (by brightness)
    // go to black and white, and, sharp, each channel sharpened by SHARPEN
    // of its difference from a 3 x 3 blur so edges survive the dither;
    // null if the canvas cannot be read
    const PHOTO = { LEVELS: 0.02, SHARPEN: 1, COLOURS: 32, SAMPLE: 128 };
    function readPhoto(w, h, sharp, crop) {
      try {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.imageSmoothingQuality = 'high';
        if (crop) x.drawImage(photo, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, w, h);
        else x.drawImage(photo, 0, 0, w, h);
        const d = x.getImageData(0, 0, w, h).data, n = w * h, rgb = new Float32Array(3 * n), bright = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          for (let k = 0; k < 3; k++) rgb[3 * i + k] = d[4 * i + k];
          bright[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
        }
        bright.sort();
        const lo = bright[Math.floor(PHOTO.LEVELS * (n - 1))], hi = bright[Math.ceil((1 - PHOTO.LEVELS) * (n - 1))];
        const span = Math.max(1, hi - lo);
        for (let i = 0; i < 3 * n; i++) rgb[i] = Math.min(255, Math.max(0, (rgb[i] - lo) / span * 255));
        if (!sharp) return rgb;
        const out = new Float32Array(3 * n);
        for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) for (let k = 0; k < 3; k++) {
          let sum = 0, cnt = 0;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const qx = px + dx, qy = py + dy;
            if (qx >= 0 && qx < w && qy >= 0 && qy < h) { sum += rgb[3 * (qy * w + qx) + k]; cnt++; }
          }
          const i = 3 * (py * w + px) + k;
          out[i] = rgb[i] + PHOTO.SHARPEN * (rgb[i] - sum / cnt);
        }
        return out;
      } catch (e) {
        return null;
      }
    }

    // the photo's own colours, worked out once it has loaded: COLOURS less
    // two by median cut over it at SAMPLE px wide, and black and white, each
    // given a place in the framebuffer's palette. { rgb, v }, or null
    let photoColours = null;
    function photoPalette() {
      const w = PHOTO.SAMPLE, h = Math.round(w * photo.naturalHeight / photo.naturalWidth), rgb = readPhoto(w, h, false);
      if (!rgb) return null;
      const colours = [[0, 0, 0], [255, 255, 255], ...Framebuffer.medianCut(rgb, PHOTO.COLOURS - 2)];
      const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
      return { rgb: colours, v: colours.map((c) => Framebuffer.colour(hex(c))) };
    }

    // the most of the photo that fills w x h, centred on FOCUS as far as
    // the photo goes: { sx, sy, sw, sh } in its own px
    function photoCrop(w, h) {
      const nw = photo.naturalWidth, nh = photo.naturalHeight, want = w / h;
      let sw = nw, sh = nh;
      if (want > nw / nh) sh = nw / want;
      else sw = nh * want;
      return {
        sx: Math.min(nw - sw, Math.max(0, BOX.FOCUS[0] * nw - sw / 2)),
        sy: Math.min(nh - sh, Math.max(0, BOX.FOCUS[1] * nh - sh / 2)),
        sw, sh,
      };
    }

    // the photo at w x h in its colours, cut to fill it, dithered: a bitmap
    // { px, w, h } of the framebuffer's v's, or null
    function ditherPhoto(w, h) {
      if (!photoColours) return null;
      const rgb = readPhoto(w, h, true, photoCrop(w, h));
      if (!rgb) return null;
      const g = Framebuffer.ditherColour(rgb, w, h, photoColours.rgb);
      for (let i = 0; i < g.px.length; i++) g.px[i] = photoColours.v[g.px[i]];
      return g;
    }

    // a paragraph's glyphs in lines no wider than width, in the type's px:
    // each line its glyphs and its ink's left. words break where the text
    // has white space between two glyphs, and a word goes on the line when
    // the line's ink with it is no wider than width, else starts the next
    function wrapType(t, width) {
      const words = [];
      let word = null, prev = null;
      for (const gl of t.glyphs) {
        if (!word || /\s/.test(t.text.slice(prev.at + prev.ch.length, gl.at)))
          words.push(word = { glyphs: [], left: Infinity, right: -Infinity });
        word.glyphs.push(gl);
        word.left = Math.min(word.left, gl.x + gl.dx - gl.g.w / 2);
        word.right = Math.max(word.right, gl.x + gl.dx + gl.g.w / 2);
        prev = gl;
      }
      const lines = [];
      let line = null;
      for (const w of words) {
        if (line && w.right - line.left <= width) line.glyphs.push(...w.glyphs);
        else lines.push(line = { glyphs: [...w.glyphs], left: w.left });
      }
      return lines;
    }

    // the about word into letters under the header, whose ink ends at
    // bottom, its box shut and open laid out round it, and the page made
    // tall enough to scroll them away
    function layoutAbout(name, bottom, stacked) {
      aboutLetters = [];
      bodyLetters = [];
      photoAt = null;
      aboutInk = box.shut = box.full = box.close = null;
      const t = aboutType;
      if (name && t.glyphs.length) {
        const size = ABOUT.SIZE * name.size, k = size / TYPE.EM, ems = (t.left + t.right) / TYPE.EM;
        const ox = (stacked ? (W - ems * size) / 2 : name.left) + k * t.left;
        const base = bottom + ABOUT.BELOW * name.size + k * t.ascent;
        let o = null;
        for (const gl of t.glyphs) {
          const L = makeLetter(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, ABOUT.FIRST + gl.at, k, WOBBLE);
          aboutLetters.push(L);
          if (gl.ch === 'o' || !o) {
            // its stroke: the ink across from its left on its middle row
            const g = gl.g, row = Math.floor(g.h / 2) * g.w;
            let run = 0;
            while (run < g.w && g.ink[row + run]) run++;
            o = { cx: L.cx, cy: L.cy, w: k * g.w, h: k * g.h, stroke: k * run };
          }
        }
        aboutInk = { x0: ox - k * t.left, y0: base - k * t.ascent, x1: ox + k * t.right, y1: base + k * t.descent };
        box.shut = { x0: o.cx - o.w / 2, y0: o.cy - o.h / 2, x1: o.cx + o.w / 2, y1: o.cy + o.h / 2, r: Math.min(o.w, o.h) / 2, line: Math.max(BOX.LINE, o.stroke) };
        layoutBox(name, size, stacked);
      }
      setScroll();
    }

    // the open box round the word at size, and its insides laid out in it,
    // wide or stacked
    function layoutBox(name, size, stacked) {
      const pad = BOX.PAD * size, edge = Math.max(2, Math.min(NAME.X, aboutInk.x0) - pad);
      const x0 = edge, x1 = W - edge, y0 = aboutInk.y0 - pad, rest = H - edge;
      const ix0 = x0 + pad, ix1 = x1 - pad, iw = ix1 - ix0, under = aboutInk.y1 + BOX.GAP * size;
      const bs = stacked ? BOX.PHONE : Math.min(BOX.MOST, Math.max(BOX.LEAST, BOX.BODY * name.size)), bk = bs / TYPE.EM;
      const aspect = photoReady ? photo.naturalWidth / photo.naturalHeight : 609 / 700;
      // the x in the top left corner, at CLOSE; what
      // goes under the word starts a line's space under the x instead
      box.close = null;
      const xg = glyphInk('X');
      if (xg) {
        const xs = BOX.CLOSE, xw = xg.w * xs, xh = xg.h * xs, cy = aboutInk.y0;
        box.close = { x: ix0, y: cy, w: xw, h: xh, letter: makeLetter(xg, ix0 + xw / 2, cy + xh / 2, BOX.FIRST - 1, xs, WOBBLE) };
      }
      const top = box.close ? box.close.y + box.close.h + 0.9 * bs : under;
      let px = ix0, py = top, pw = iw, ph, tw = iw, ty;
      if (!stacked) {
        // the photo in the top right corner, the text under the x left of it
        py = aboutInk.y0;
        ph = Math.max(rest - pad - py, 8 * bs);
        pw = ph * aspect;
        if (pw > BOX.PHOTO * iw) { pw = BOX.PHOTO * iw; ph = pw / aspect; }
        px = ix1 - pw;
        tw = px - BOX.GUTTER * bs - ix0;
        ty = top - 0.75 * bs + 0.72 * bs;
      }
      // the text in lines, and how tall they stand
      const paras = bodyTypes.map((t) => wrapType(t, tw / bk));
      const lines = paras.reduce((n, p) => n + p.length, 0);
      const textH = 1.05 * bs + (lines - 1) * BOX.LEAD * bs + (paras.length - 1) * BOX.PARA * bs;
      if (stacked) {
        // the photo across the box under the x, as tall as the screen
        // leaves over the text; the text under it
        ph = Math.min(pw / aspect, Math.max(BOX.CROP * pw, rest - pad - py - BOX.GUTTER * bs - textH));
        ty = py + ph + BOX.GUTTER * bs;
      }
      pw = Math.round(pw);
      ph = Math.round(ph);
      px = Math.round(px);
      py = Math.round(py);
      if (photoReady) {
        const g = ditherPhoto(pw, ph);
        if (g) photoAt = { g, x: px, y: py };
      }
      let base = ty + 0.75 * bs, last = base;
      paras.forEach((lines, p) => {
        for (const line of lines) {
          for (const gl of line.glyphs)
            bodyLetters.push(makeLetter(gl.g, ix0 + bk * (gl.x + gl.dx - line.left), base + bk * gl.dy, BOX.FIRST + 1000 * p + gl.at, bk, WOBBLE));
          last = base;
          base += BOX.LEAD * bs;
        }
        base += BOX.PARA * bs;
      });
      const inside = Math.max(last + 0.3 * bs, py + ph);
      box.full = { x0, y0, x1, y1: Math.max(rest, inside + pad), r: BOX.RADIUS * size, line: BOX.LINE };
    }

    // the page tall enough to scroll the word, and the box while it is
    // shown, off the top
    function setScroll() {
      let end = aboutInk ? aboutInk.y1 : 0;
      if (box.shown && box.full) end = Math.max(end, box.full.y1);
      scroller.style.height = (window.innerHeight + Math.ceil(end) * SCALE) + 'px';
    }

    // a press on the word: open the box out of the o, or send it back in
    function toggleBox() {
      if (!box.shut || !box.full) return;
      box.open = !box.open;
      if (box.open && !box.shown) {
        box.shown = true;
        box.p = 0;
      }
      setScroll();
    }

    // dt's share of OPEN on toward open, or back toward the o; back in the
    // o, it is gone
    function stepBox(dt) {
      if (!box.shown) return;
      box.p = Math.min(1, Math.max(0, box.p + (box.open ? dt : -dt) / BOX.OPEN));
      if (box.p === 0 && !box.open) {
        box.shown = false;
        setScroll();
      }
    }

    // the box sy up: its insides into cfb, the letters near enough the
    // screen to show, the photo and the x, then copied into the page
    // through the box and the box's outline over them. where it is goes
    // straight from the o to open by how far open it is
    function drawBox(t, sy) {
      if (!box.shown || !box.shut || !box.full) return;
      const c = {};
      for (const k of ['x0', 'y0', 'x1', 'y1', 'r', 'line']) c[k] = box.shut[k] + (box.full[k] - box.shut[k]) * box.p;
      const top = c.y0 - sy, bottom = c.y1 - sy;
      if (bottom < 0 || top >= H) return;
      cfb.clear();
      const lo = Math.max(top, 0) - BOX.MOST, hi = Math.min(bottom, H) + BOX.MOST;
      for (const L of bodyLetters) if (L.cy - sy > lo && L.cy - sy < hi) L.draw(t, -sy, cfb);
      if (photoAt) {
        const p = photoAt, x = p.x, y = p.y - sy;
        cfb.blitPixels(p.g, x, y);
      }
      if (box.close) box.close.letter.draw(t, -sy, cfb);
      fb.roundRect(c.x0, top, c.x1, bottom, c.r, cfb, 1, Math.max(1, Math.round(c.line)));
    }

    // a click, wherever the page has scrolled to: open, on the x, a little
    // round it (at least 20 world px across, for a finger), the box shuts;
    // else on the word, a little round it, it opens
    canvas.addEventListener('click', (e) => {
      if (!aboutInk) return;
      const p = worldPointer(e), y = p.y + Math.round(window.scrollY / SCALE);
      if (box.open) {
        const c = box.close;
        if (!c) return;
        const mx = Math.max(4, (20 - c.w) / 2), my = Math.max(4, (20 - c.h) / 2);
        if (p.x >= c.x - mx && p.x <= c.x + c.w + mx && y >= c.y - my && y <= c.y + c.h + my) toggleBox();
        return;
      }
      const a = aboutInk, m = 0.15 * (a.y1 - a.y0);
      if (p.x >= a.x0 - m && p.x <= a.x1 + m && y >= a.y0 - m && y <= a.y1 + m) toggleBox();
    });

    // --- layout ------------------------------------------------------------------
    // wide: the menu down the left side and the bubble in the middle, each
    // centred on the viewport's height, or pushed down clear of the name
    // when the page is too short for that. narrow (a phone): the bubble on
    // top and the menu under it, every line centred, the stack centred in
    // what the name leaves. the bubble is made here the first time; after
    // that a resize carries its lock, skin, face and all, to the new middle,
    // so nothing flies across.
    // the menu and the bubble are off for now, the name and its tag alone
    // on the page; true brings each back. with no bubble the world is
    // still made, empty, so a press grabs nothing
    const SHOW_MENU = false, SHOW_BUBBLE = false;
    const MENU = ['PLAYGROUND', 'PROJECTS', 'PAST WORKS'];
    const PANEL_W = 128, PANEL_H = 64;
    const STACK_BELOW = 463; // viewport width in world px under which it stacks
    const GAP = 28;          // between the bubble and the menu when stacked
    let letters = [];
    let panelX = 0, panelY = 0;

    function layout() {
      letters = [];
      const lineH = (typeof FONT !== 'undefined' ? FONT.height : 14) * LETTER_SCALE + 11;
      const menuH = MENU.length * lineH - 11;
      const stacked = W < STACK_BELOW;
      // the name first, and its tag beside it or, stacked, under it:
      // everything else keeps clear under them
      const name = layoutName(stacked);
      const tagBottom = layoutTag(name, stacked);
      const headerBottom = name === null ? 0 : Math.max(name.bottom, tagBottom === null ? -Infinity : tagBottom);
      const under = name === null ? 0 : headerBottom + NAME.GAP;
      layoutAbout(name, headerBottom, stacked);
      const top = stacked ? under + (H - under - (2 * BUBBLE_R + GAP + menuH)) / 2 : 0;
      // the middle of the centre object, unrounded; the panel, when shown,
      // sits on the same middle
      const cx = W / 2, cy = stacked ? top + BUBBLE_R : Math.max(H / 2, under + BUBBLE_R);
      panelX = Math.floor(cx - PANEL_W / 2);
      panelY = Math.floor(cy - PANEL_H / 2);
      // before the font check: the bubble does not need the font
      if (!world) {
        world = new World(W, H);
        if (SHOW_BUBBLE) {
          bubble = new SoftBlob(cx, cy, BUBBLE_POINTS, BUBBLE_R, BUBBLE_PUFF, true);
          world.blobs.push(bubble);
          face = new Face(bubble);
          beard = new Beard(W, H);
        }
      } else if (!bubble) {
        world.resize(W, H);
      } else {
        world.resize(W, H);
        face.moveBy(cx - bubble.lockX, cy - bubble.lockY);
        bubble.moveLockTo(cx, cy);
        // the face is carried in one jump: the strands pose afresh on the
        // mouth rather than whip across after it
        beard.resize(W, H);
        beard.reset();
      }
      if (!SHOW_MENU || typeof FONT === 'undefined') return;
      let y = stacked ? top + 2 * BUBBLE_R + GAP : Math.max((H - menuH) / 2, under), i = 0;
      for (const line of MENU) {
        letters.push(...layoutText(line, stacked ? (W - textWidth(line)) / 2 : NAME.X, y, i));
        i += line.length;
        y += lineH;
      }
    }

    // --- the bubble --------------------------------------------------------------
    // the centre object is cicada's bubble at 4/3 its size: a ring of
    // verlet points (js/softbody.js) locked to the middle, which gives when
    // pulled and wobbles home. it lives in a world the size of the viewport
    // that runs whole 60 hz steps from wall time, so a 120 hz screen does
    // not run it twice as fast and a slow frame catches up. it is filled
    // dark and then outlined, the skin a bresenham line from point to
    // point, so it covers whatever is under it as a solid thing, and its
    // face (js/face.js) goes on top, trailing the skin when it moves. the
    // mustache (js/beard.js, daedalus's) hangs from the mouth, so it trails
    // as the mouth does and swings when it is carried. cicada's bubble is
    // radius 36 with the face's art put down 1:1. at 4/3 nothing lands 1:1:
    // the face scales with the radius and goes through the letters'
    // sampler, its 1 px strokes as 1.33 px ones.
    const BUBBLE_SCALE = 4 / 3;
    // its radius in world px (48), its points, and its
    // air: the area it fills over its circle's
    const BUBBLE_R = 36 * BUBBLE_SCALE, BUBBLE_POINTS = 32, BUBBLE_PUFF = 1.2;
    let world = null, bubble = null, face = null; // made at the first layout
    let beard = null;

    // --- the cursor --------------------------------------------------------------
    // the native pointer is hidden over the canvas and drawn into the frame
    // instead, as cicada's hand (js/cursor.js), open, its palm
    // on the pointer. while the button is held it closes through the frames
    // to a fist, and it opens again when the button lifts. a touch gets no
    // hand: there is nothing to see under a finger. it goes down last, over
    // everything, on a dark backing, so it reads over the letters and the
    // bubble.
    const cursor = new Cursor();

    // --- the drag ----------------------------------------------------------------
    // a press near the skin takes hold of its nearest point and two either
    // side and pulls them toward the pointer, until the press lifts or the
    // pull goes too far and the skin lets go. the pointer is captured, so a
    // drag carries on outside the window; only a pointer that leaves with
    // nothing held is forgotten, and the eyes stop following it.
    function worldPointer(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) / SCALE, y: (e.clientY - rect.top) / SCALE };
    }
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      cursor.press();
      world.grab(p.x, p.y);
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = worldPointer(e);
      cursor.moveTo(p.x, p.y, e.pointerType !== 'touch');
      world.pointer(p.x, p.y);
    });
    // a lifted press opens the hand again. it goes when there is nothing
    // left to hover: a finger lifted, or a captured drag let go outside the
    // viewport
    function liftCursor(e) {
      cursor.release();
      const p = worldPointer(e);
      if (e.pointerType === 'touch' || p.x < 0 || p.y < 0 || p.x >= W || p.y >= H) cursor.hide();
    }
    canvas.addEventListener('pointerup', (e) => { liftCursor(e); world.release(); });
    canvas.addEventListener('pointercancel', (e) => { liftCursor(e); world.release(); });
    // a captured drag carried outside the window keeps its hand: moves still come
    canvas.addEventListener('pointerleave', () => { if (!world.drag) { world.pointerOff(); cursor.hide(); } });

    // cicada's drag line: dashed, from the grabbed point to the pointer,
    // its dashes shrinking and gaps opening over the last 30 % of the reach
    // before the skin lets go. cicada also put a plus on every held point;
    // those are left off, the skin is not to be marked
    function drawDrag() {
      const d = world.drag;
      if (!d) return;
      const c = d.points[0].point;
      const dx = c.x - d.x, dy = c.y - d.y;
      const reach = Math.min(Math.sqrt(dx * dx + dy * dy) / SOFT.DRAG.BREAKAWAY, 1);
      const dashing = Math.pow(Math.max(0, (reach - 0.7) / 0.3), 2);
      const dashLength = Math.max(2, 12 * (1 - dashing)), gapLength = 1 + 25 * dashing;
      // walked from the rounded ends, as cicada did
      const x0 = Math.round(c.x), y0 = Math.round(c.y), x1 = Math.round(d.x), y1 = Math.round(d.y);
      const len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (len === 0) return;
      const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
      for (let at = 0, drawing = true; at < len; drawing = !drawing) {
        const end = Math.min(at + (drawing ? dashLength : gapLength), len);
        if (drawing) fb.line(x0 + ux * at, y0 + uy * at, x0 + ux * end, y0 + uy * end);
        at = end;
      }
    }

    // --- daedalus ----------------------------------------------------------------
    // the program's 128x64 panel, one world pixel per panel pixel, in the
    // middle of the viewport, copied bit for bit into the framebuffer, dark
    // bits too, so it reads as a screen over whatever is under it. it runs
    // 80 frames a second on its own clock; each browser frame runs as many
    // as wall time has moved on.
    // the bubble has taken its place in the middle; SHOW_DAEDALUS brings it back.
    const SHOW_DAEDALUS = false; // false: no module, no panel, no keyboard
    const FRAME_MS = 12.5;
    let panel = null; // set once the module is up

    if (SHOW_DAEDALUS) createDaedalus().then((m) => {
      m._daed_init(0x64616564);
      const PW = m._daed_width(), PH = m._daed_height();
      const stride = (PW + 7) >> 3;
      let acc = 0, last = performance.now();

      panel = {
        step(now) {
          acc += now - last;
          last = now;
          if (acc > 100) acc = 100; // after a stall, catch up a little, not forever
          while (acc >= FRAME_MS) { m._daed_frame(); acc -= FRAME_MS; }
        },
        draw() {
          // HEAPU8 re-read each frame: the heap view changes if memory grows
          fb.blitPacked(m.HEAPU8, m._daed_buffer(), PW, PH, stride, panelX, panelY);
        },
      };

      // the computer keyboard as a midi keyboard, the sim window's layout:
      // A W S E D F T G Y H U J K O L P ; are C4..E5, Z/X the octave, C/V the
      // velocity by 20, space the sustain pedal (a hand on every bell).
      const KEYS = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
                     KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14,
                     KeyP: 15, Semicolon: 16 };
      let base = 60, vel = 100, pedal = false;
      const held = {};
      const send = (s, a, b) => m._daed_midi(s, a, b);
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.code in KEYS) {
          if (held[e.code] !== undefined) return;
          held[e.code] = base + KEYS[e.code];
          send(0x90, held[e.code], vel);
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (!pedal) { pedal = true; send(0xB0, 64, 127); }
        } else if (e.code === 'KeyZ') { if (base - 12 >= 0) base -= 12; }
        else if (e.code === 'KeyX') { if (base + 12 <= 108) base += 12; }
        else if (e.code === 'KeyC') { vel = Math.max(1, vel - 20); }
        else if (e.code === 'KeyV') { vel = Math.min(127, vel + 20); }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code in KEYS) {
          if (held[e.code] === undefined) return;
          send(0x80, held[e.code], 0);
          delete held[e.code];
        } else if (e.code === 'Space') {
          if (pedal) { pedal = false; send(0xB0, 64, 0); }
        }
      });
      window.addEventListener('blur', () => {
        for (const k in held) { send(0x80, held[k], 0); delete held[k]; }
        if (pedal) { pedal = false; send(0xB0, 64, 0); }
      });
    });

    // --- the frame ---------------------------------------------------------------
    // the world is drawn fresh every browser frame, all of it into the
    // framebuffer. first the bubble's world, its face, its mustache and the
    // cursor's hand and the about box catch up with the clock; then the
    // bits are cleared, the about box and word drawn scrolled, every other
    // letter over them on its own
    // clock, daedalus's panel if it is shown, the
    // bubble filled dark and outlined over them, its face and mustache, the
    // drag's marks, and last the hand on its backing, over the end of the
    // drag's line, each layer simply writing over the bits of the last. then
    // the whole of it goes to the canvas in one copy.
    let lastNow = null; // the last frame's time, for the face's dt
    function frame(now) {
      const t = now / 1000;
      const dt = lastNow === null ? 0 : Math.min((now - lastNow) / 1000, 0.1);
      lastNow = now;
      world.step(now);
      if (bubble) face.update(bubble, world, dt);
      cursor.update(dt);
      stepBox(dt);
      if (bubble) beard.step(dt, face.mouf, face.scale);
      if (panel) panel.step(now);
      fb.clear();
      // the about word and box first, scrolled, the box over the word, so
      // the header's letters cover them both
      const sy = Math.round(window.scrollY / SCALE);
      for (const L of aboutLetters) L.draw(t, -sy);
      drawBox(t, sy);
      for (const L of letters) L.draw(t);
      if (SHOW_DAEDALUS && panel) panel.draw();
      if (bubble) {
        const pts = bubble.points;
        fb.fillPolygon(pts, 0);
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i], q = pts[(i + 1) % pts.length];
          fb.line(p.x, p.y, q.x, q.y);
        }
        face.draw(fb);
        beard.draw(fb);
      }
      drawDrag();
      cursor.draw(fb);
      fb.present(ctx);
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
