<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peter D'Angelo</title>
  <meta name="description" content="Hi! I'm Peter, an inventor, software engineer, and musician based in NYC.">
  <!-- the tab's icon: none until js/favicon.js draws it, so the browser
       asks for no /favicon.ico -->
  <link rel="icon" href="data:,">
  <style>
    /* the paper colour, as in js/raster.js: any sliver past the canvas matches */
    html, body { margin: 0; background: #fbf6f0; }
    /* the document never scrolls: the page scrolls itself, in the script
       (the swipe and the wheel), drawn that far up the canvas, which stays
       fixed over the window. no bar, no bounce */
    html, body { overflow: hidden; overscroll-behavior: none; }
    /* a press on the canvas is the page's own, and so is a swipe: a finger
       scrolls the page itself (the swipe, in the script). no selecting */
    canvas { position: fixed; top: 0; left: 0; display: block; image-rendering: pixelated;
             touch-action: none; user-select: none; -webkit-user-select: none; }
    /* no system cursor over the document or the canvas once a frame has
       been drawn (drawn, set by the frame): the pointer is drawn into the
       frame as a hand */
    .drawn, .drawn body, .drawn canvas { cursor: none; }
  </style>
  <script>
    // the paper's colour as the visitor last chose the site, light or
    // dark, or as the system is where they have not chosen, before any
    // other script has loaded
    try {
      let kept = null;
      try { kept = localStorage.getItem('dark'); } catch (e) {}
      const dark = kept !== null ? kept === '1' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.background = dark ? '#000000' : '#fbf6f0';
    } catch (e) {}
  </script>
</head>
<body>

  <script src="js/rules.js"></script>

  <script src="js/scrub.js"></script>

  <script>
    // --- the viewport ------------------------------------------------------------
    // the window is a viewport onto a grid of world pixels, each View.SCALE
    // css pixels square (js/view.js). resizing shows more or fewer of them;
    // nothing is ever stretched. every pixel is drawn into one framebuffer
    // (js/raster.js) the size of the visible world, each pixel lit or dark;
    // once a frame it is copied whole into the canvas bitmap, which is that
    // size exactly, and the browser blows it up by View.SCALE. nothing draws
    // to the canvas itself. a world pixel is a css pixel, but a window fewer
    // than View.across css pixels wide still shows View.across world pixels
    // across, each as much smaller as fits them in, and no smaller than one
    // of the screen's own pixels (resize). View.across is VIEW.ACROSS unless
    // the address gives another (?across=700), 0 for none: every world
    // pixel a css pixel.
    const canvas = document.getElementById('view');
    View.load(window, canvas); // the viewport onto the window, through the canvas
    const ctx = canvas.getContext('2d'); // only the framebuffer's present uses it
    let W = 0, H = 0; // the viewport, in world pixels
    let fb = null;    // the world bitmap, remade at the viewport's size
    let cfb = null;   // the about box's insides, drawn apart and copied through the box (below)
    let ofb = null;   // the insides of a box that holds sections, each of their boxes copied into them through its own (drawBox)
    let pfb = null;   // each item's insides, drawn apart and copied through its skin (drawInsides)
    let qfb = null;   // a menu's insides, the upgrades' or a demo's settings', drawn apart and copied through its skin (drawShop, drawSettings)

    function resize() {
      ({ W, H } = View.resize());
      fb = new Framebuffer(W, H);
      Letter.fb = fb; // the letters draw into it unless given another (js/letter.js)
      cfb = new Framebuffer(W, H);
      ofb = new Framebuffer(W, H);
      pfb = new Framebuffer(W, H);
      qfb = new Framebuffer(W, H);
      placeMute();
      placeHand();
      placeSwitch();
      layout();
    }

    // --- letters -----------------------------------------------------------------
    // a letter (js/letter.js) is one object: its glyph from font.js cut to
    // its ink, a home position in continuous world space, a scale and a
    // tilt, and slow sines of its own on each, at rates and phases seeded
    // from its place in the text. it is drawn as a sprite (js/raster.js),
    // as daedalus's head is: every world pixel in its box is carried back
    // through the transform into the glyph and lit when enough of it lands
    // on ink, so a sub-pixel move or a touch of scale shows as edge pixels
    // popping, never as the block stepping, and a 1 px stroke at these
    // scales always lights one pixel and only doubles when it sits almost
    // exactly between two. the bubble's face goes through the same
    // sampler. a picture (the photo or a logo) is a letter in its own
    // colours, and a letter with no bitmap is the wobble alone, for
    // something drawn its own way (the bubble). the name's letters take
    // LETTER.WOBBLE too (NAME.WOBBLE), and could be given their own

    // none of it: a letter, or a picture, that holds still
    const STILL = { SWAY_PX: 0, SWAY_HZ: 0, BOB_PX: 0, BOB_HZ: 0, BREATHE: 0, BREATHE_HZ: 0, TILT_RAD: 0, TILT_HZ: 0 };

    // the glyph cut to its ink columns as a sprite's bitmap, or null for a
    // blank
    function glyphInk(ch) {
      const rows = typeof FONT !== 'undefined' && FONT.glyphs[ch];
      if (!rows) return null;
      let lo = FONT.width, hi = -1;
      for (const r of rows) for (let i = 0; i < r.length; i++)
        if (r[i] === '#') { if (i < lo) lo = i; if (i > hi) hi = i; }
      if (hi < 0) return null;
      return Framebuffer.ink(rows.map((r) => r.slice(lo, hi + 1)));
    }

    // --- the name ----------------------------------------------------------------
    // the name across the top left, in helvetica, as big as the page gives
    // it room for. it is not browser text: js/type.js fills each glyph once,
    // big, into an offscreen canvas and reads it back as a bitmap, and here
    // each one is a letter (Letter.make), drawn through the same sampler
    // at the name's size with the same sway, bob, breathe and tilt, seeded
    // from its own place in the name. the bitmaps are made once, at the em;
    // a resize only places them and sets their scale, size over the em. at
    // these sizes the breathe and the tilt do most of the moving: the sway
    // and the bob are a tenth of a world pixel whatever its size. wide,
    // its ink's top left sits X in from the left edge, at SIZE or smaller
    // when the page is too narrow for that; narrow, it is centred across
    // the top. the rest of the page keeps GAP clear of its box. with no 2d
    // canvas there is no name.
    //
    // its letters are a row of keys, each one struck on the piano as the
    // pointer comes onto it (the name's keys, below): a key is a column
    // from the name's ink top to its bottom, split from its neighbours
    // halfway between their inks, so the row has no gaps, the apostrophe is
    // as easy to hit as any letter and the space is shared by the r and the
    // d; the row ends at the first letter's ink and the last's. each
    // letter has a colour of the tag's three, in turn along the name,
    // drawn while the pointer is on it.
    const NAME = {
      TEXT: 'Peter D\'Angelo',
      SIZE: 114,       // world px to the em, the most it will be
      WIDTH: 0.68,     // of the viewport's width its ink may span, wide
      NARROW: 0.9,     // the same, stacked
      X: 21,           // its ink's left edge, wide
      TOP: 21,         // world px from the top edge to its tallest ink
      GAP: 21,         // from its box's bottom to anything under it
      FIRST: 100,      // its letters' seeds run from here
      WOBBLE: LETTER.WOBBLE, // the letters' sway, bob, breathe and tilt
    };
    const nameType = new Type(NAME.TEXT, () => document.createElement('canvas'));

    // the name's letters into letters, sized to fit and placed, and its
    // keys into nameRow; its ink's
    // box and size, { left, right, top, base, bottom, size } with base its
    // baseline and size world px to the em, or null
    // when there is no name. wide, it leaves room on its right for the tag
    // at its least
    function layoutName(stacked) {
      const t = nameType;
      nameRow = null;
      if (!t.glyphs.length) return null;
      const ems = (t.left + t.right) / TYPE.EM; // its ink's width, in ems
      const room = tagStair ? 2 * TAG.GAP + TAG.LEAST * tagStair.ems : 0;
      const size = Math.min(NAME.SIZE, (stacked ? NAME.NARROW * W : Math.min(NAME.WIDTH * W, W - NAME.X - room)) / ems);
      const k = size / TYPE.EM;
      // the line's origin on its baseline, from where its ink's top left goes
      const ox = (stacked ? (W - ems * size) / 2 : NAME.X) + k * t.left, base = NAME.TOP + k * t.ascent;
      const keys = t.glyphs.map((gl, i) => {
        const L = Letter.make(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, NAME.FIRST + gl.at, k, NAME.WOBBLE);
        letters.push(L);
        return { L, lo: L.cx - k * gl.g.w / 2, hi: L.cx + k * gl.g.w / 2, v: tagLines[i % 3].v };
      });
      // each pair of keys meets halfway between their inks
      for (let i = 1; i < keys.length; i++) keys[i].lo = keys[i - 1].hi = (keys[i - 1].hi + keys[i].lo) / 2;
      const box = { left: ox - k * t.left, right: ox + k * t.right, top: NAME.TOP, base, bottom: base + k * t.descent, size };
      nameRow = { top: box.top, bottom: box.bottom, keys };
      return box;
    }

    // the name's keys, { top, bottom, keys }: the row's top and bottom, and
    // in glyph order each letter's key, { L, lo, hi, v }, the letter, the
    // key's left and right and the letter's colour, all world px on the
    // screen; or null when there is no name
    let nameRow = null;

    // the name's key at (x, y), world px on the screen, as its index, or -1
    function nameAt(x, y) {
      const r = nameRow;
      if (!r || y < r.top || y > r.bottom || x < r.keys[0].lo || x > r.keys[r.keys.length - 1].hi) return -1;
      let i = 0;
      while (x > r.keys[i].hi) i++;
      return i;
    }

    // --- the tag -----------------------------------------------------------------
    // what he does, three lines of helvetica beside the name, stepped down
    // to the right along their bubbles: each line's bubble stands a STEP
    // right of the one above's, so the bubbles go down a straight line
    // evenly apart and each line hangs off its own, each in its own
    // colour. they are the name's
    // kind of letter, through the same sampler with the same wobble, only
    // small. wide, they stand in the room right of the name: the stair's
    // ink starts GAP past the name's and keeps GAP from the right edge, the
    // first line's top is level with the name's top and the last line sits
    // on the name's baseline, at the most size that keeps LEAD between
    // baselines and the widest step inside the room. under LEAST it is too
    // small to read, so it stays at LEAST, the name narrowing to leave it
    // the room and the stair running on below the baseline. stacked, the
    // stair goes under the name at SIZE or less, centred across the page.
    //
    // each line holds a small bubble in its own colour (the tag's bubbles,
    // below), at the character its bubble names: after Inventor, between
    // Software and Engineer, before Musician. it is BUBBLE ems across with
    // its middle RISE ems over the baseline, about the middle of the caps,
    // and it stands SPACE ems clear of the ink either side of it, the
    // glyphs after it moved along to make the room.
    const TAG = {
      LINES: [
        { text: 'Inventor',          colour: '#49B6B0', bubble: 8 },
        { text: 'Software Engineer', colour: '#B8B693', bubble: 8 },
        { text: 'Musician',          colour: '#B5979A', bubble: 0 },
      ],
      // helvetica neue's medium: at this size regular's strokes fall
      // under a pixel and break up, and bold's fill the counters
      FACE: { weight: 500, family: '"Helvetica Neue", Helvetica, Arial, sans-serif' },
      STEP: 1.25, // ems each line's bubble stands right of the one above's
      LEAD: 1.1,  // the least baseline to baseline, in ems
      GAP: 21,    // world px clear of the name, and of the right edge
      LEAST: 15,  // world px to the em, wide, the least it will be
      SIZE: 17,   // world px to the em, stacked, the most it will be
      FIRST: 200, // its letters' seeds run from here, clear of the name's
      BUBBLE: 0.7, // ems across a line's bubble, about the caps' height
      RISE: 0.35,  // ems from the baseline up to the bubble's middle
      SPACE: 0.25, // ems clear of the ink either side of the bubble
      REACH: 6,    // world px past a bubble's skin a press still takes hold of it
    };
    const tagLines = TAG.LINES.map((l) => {
      const type = new Type(l.text, () => document.createElement('canvas'), TAG.FACE);
      return { type, v: Framebuffer.colour(l.colour), ...tagRoom(type, l.bubble) };
    });

    // where a line's bubble goes, in its type's px from its origin: the
    // glyphs before at stay, the bubble starts SPACE past their ink (at the
    // line's ink's left when there are none), and the glyphs from at on
    // move shift along to start SPACE past it. { at, shift, bx, right }:
    // bx the bubble's middle and right the line's ink's right with it in
    function tagRoom(t, at) {
      const em = TYPE.EM, edge = (gl, side) => gl.x + gl.dx + side * gl.g.w / 2;
      const before = t.glyphs.filter((gl) => gl.at < at), after = t.glyphs.filter((gl) => gl.at >= at);
      const x0 = before.length ? Math.max(...before.map((gl) => edge(gl, 1))) + TAG.SPACE * em : -t.left;
      const shift = after.length ? x0 + (TAG.BUBBLE + TAG.SPACE) * em - Math.min(...after.map((gl) => edge(gl, -1))) : 0;
      const right = Math.max(x0 + TAG.BUBBLE * em, ...after.map((gl) => edge(gl, 1) + shift), ...before.map((gl) => edge(gl, 1)));
      return { at, shift, bx: x0 + TAG.BUBBLE * em / 2, right };
    }

    // the stair: each line's ink's left in ems from the stair's, set so
    // its bubble's middle is a STEP right of the line above's, the stair's
    // width in ems, and the first line's ink above its baseline; null, and
    // no tag, when a line has no glyphs
    const tagStair = tagLines.every((l) => l.type.glyphs.length) ? (() => {
      const wide = tagLines.map((l) => (l.type.left + l.right) / TYPE.EM);
      const lefts = tagLines.map((l, i) => i * TAG.STEP - (l.type.left + l.bx) / TYPE.EM);
      const lo = Math.min(...lefts);
      return {
        lefts: lefts.map((x) => x - lo),
        ems: Math.max(...lefts.map((x, i) => x + wide[i])) - lo,
        asc: tagLines[0].type.ascent / TYPE.EM,
      };
    })() : null;

    // the tag's lines into letters beside the name's box, or under it
    // stacked, and each line's bubble made where it goes; the bottom of
    // its ink, or null when there is no tag
    function layoutTag(name, stacked) {
      tagBubbles = [];
      if (!name || !tagStair) return null;
      const n = tagLines.length, em = TYPE.EM, { ems, asc } = tagStair;
      let size, x, top, lead;
      if (stacked) {
        size = Math.min(TAG.SIZE, NAME.NARROW * W / ems);
        x = (W - ems * size) / 2;
        top = name.bottom + NAME.GAP / 2;
        lead = TAG.LEAD * size;
      } else {
        x = name.right + TAG.GAP;
        top = name.top;
        const across = (W - TAG.GAP - x) / ems, down = (name.base - top) / (asc + (n - 1) * TAG.LEAD);
        size = Math.min(across, Math.max(TAG.LEAST, down));
        lead = n > 1 ? Math.max(TAG.LEAD * size, (name.base - top - size * asc) / (n - 1)) : 0;
      }
      if (!(size > 0)) return null;
      const k = size / em;
      let base = top + size * asc;
      tagLines.forEach((l, i) => {
        const t = l.type, ox = x + tagStair.lefts[i] * size + k * t.left;
        base = top + size * asc + i * lead;
        for (const gl of t.glyphs)
          letters.push(Letter.make(gl.g, ox + k * (gl.x + gl.dx + (gl.at >= l.at ? l.shift : 0)), base + k * gl.dy, TAG.FIRST + 50 * i + gl.at, k, LETTER.WOBBLE, l.v));
        tagBubbles.push(makeTagBubble(ox + k * l.bx, base - TAG.RISE * size, TAG.BUBBLE * size / 2, l.v));
      });
      return base + k * tagLines[n - 1].type.descent;
    }

    // --- the sections ------------------------------------------------------------
    // words down the page under the header (the name and its tag), each a
    // section that opens (SECTIONS, below): Work, Doodles, About and
    // Contact. Work's box holds two sections of its own, Professional and
    // Personal: their words down it under its x, SUB of its word's size,
    // and each its own box, opening out of its o inside Work's (layoutSubs).
    // they are in the name's helvetica at SIZE of the name's size, or less
    // when the widest would not fit across the screen, their ink's left
    // INDENT in from the name's (each centred, stacked), the first's top BELOW of the
    // name's ems under the header's ink and each next one's SPACE of their
    // size under the one before's. they are what scrolls: the document
    // itself never does, a finger or the wheel scrolls the page (the swipe
    // and the wheel, below), and each frame the words are
    // drawn that far up, in whole world px so they move
    // rigidly rather than shimmer through the sampler. they go down before
    // the header's letters, and a letter writes only its ink, so passing
    // under the header they are hidden by its letters and nothing else:
    // there is only paper behind the header. it scrolls until the last
    // word's ink, or its box's while there is one, stands END above the
    // window's bottom edge, and not at all while it already does.
    //
    // an open box pushes every word under it down, and their boxes, by as
    // far as its bottom has got past its own word's ink, in whole px, so
    // the next word keeps SPACE under the box as it kept under the word,
    // and rides down with the box as it opens and back up as it shuts.
    const ABOUT = {
      SIZE: 0.6,   // of the name's world px to the em, the most
      SUB: 0.75,   // of the words' size: a word's in another's box
      BELOW: 1,    // the name's ems from the header's ink to the first word's ink
      SPACE: 1.8,  // of the words' size: from a word's ink, or its box, to the next word's ink
      INDENT: 0.4, // of the words' size: their ink's left in from the name's, wide
      FIRST: 300,  // their letters' seeds run from here, a hundred a word, clear of the tag's
      END: 64,     // world px from the last word's ink, or its box, to the window's bottom edge at the page's end
    };
    let scrollEnd = 0; // css px the page scrolls at most

    // --- the boxes -----------------------------------------------------------------
    // a press on a word opens a box round it: a slightly rounded rect, a
    // LINE px outline through the framebuffer like everything, that grows
    // out of the word's o. shut, the box is the o: a ring LINE px thick in
    // the o's own ink box, its corners as round as they go, drawn in the
    // o's place all the time, where the o's glyph is not drawn, with the
    // insides showing through it; open, it stands PAD clear of the
    // words' ink at its top and left (every box the same width, edged by
    // the word furthest left), as far in from the window's right, and,
    // with the photo, down to as far up from the window's bottom, or past
    // it when its insides need more; without, as far down as its text
    // needs. every edge and the corners' radius go from one to the other
    // together, by how far open it is, and that moves on a spring,
    // RESPONSE s a swing, pulled toward open or back toward the o from
    // wherever it has got to and at whatever speed. opening, it swings
    // past open, further the more BOUNCE, the words under it pushed with
    // it, and settles back; shutting, it speeds into the o and stops
    // there, never smaller. each frame steps the spring exactly by the
    // frame's length, so it moves alike at any frame rate. where the
    // spring has it is where the box is headed; its shape is a skin
    // (js/skin.js), a ring of points chasing that outline, its corners'
    // and edges' middles pulled hardest so they lead and drag the rest
    // after them like jelly, gaining points as it grows and shedding them
    // as it shrinks. it is filled from the insides and outlined LINE px,
    // as the bubbles are, in the word's hover colour while the word is
    // hovered. it is
    // drawn over the word, so it covers the word as it grows and shows it
    // again as it shrinks. open, an x stands in its top left corner, inside
    // its padding where the word's ink starts: the pixel font's X (font.js)
    // at CLOSE of its own size, with the text's wobble, the
    // text and photo
    // starting under it where the word was. a press on the x sends the
    // box back into the o,
    // from wherever it has got to. while it is open the word, under it, is
    // not pressed; while it is shrinking a press on the word opens it again.
    //
    // Doodles' box holds items as the work boxes do, two of them: graffiti
    // wall, whose bubble opens into the wall itself (the wall, below), and
    // bubble bob, whose o is the bubble's (below), a ring BOB of
    // Doodles' o across and up, sitting on the baseline and bigger than
    // the name round it. it is his item's bubble shut, so his item has no
    // bubble round its caret and name; open, it grows out of the o into a
    // box round them and the game under them, as wide as the box's
    // insides and BUBBLE of About's box's height. in the others, their text in the
    // tag's face, under the x at BODY size wide
    // (no wider than MEASURE) and at PHONE size stacked, and, in About's,
    // a slideshow: the photos (SLIDES, js/about-photos.js) one at a time
    // in a frame, the same for every one so nothing moves when it changes,
    // the one shown dithered at the frame's size in its own few colours,
    // each a place in the framebuffer's palette, cut to fill the frame
    // about its own focus, and captioned under it, a line each. on the
    // caption's first line, right of it, a <, which slide it is of how
    // many (2 / 4) and a >, SLIDE_GAP apart, the >'s ink ending at the
    // frame's right. a press on the < shows the slide before, on the > or
    // anywhere on the frame the slide after, round from the last to the
    // first and back, there and then, with nothing between. wide, the
    // frame stands in the top right corner, ASPECT as wide as it is tall
    // and as tall as the box at rest leaves over the longest caption, and
    // the text under the word left of it, at BODY size. stacked (a phone)
    // everything goes down the box: the word, the frame across it, the
    // text at PHONE size, and the box is a portrait that fits the screen
    // under the header, the frame taking the height the text leaves it,
    // no taller than ASPECT has it and no shorter than CROP of its width
    // (the box grows past the screen only when the text leaves less than
    // that). they are laid out to
    // the open box and there all along, drawn each frame into a framebuffer
    // of their own (cfb) and copied into the page's only inside the skin
    // (Framebuffer.fillPolygon), so what lies behind the o is seen through

      const rgb = readImage(img, w, h, photo ? new Uint8Array(w * h) : null);
      if (!rgb) return null;
      const cut = Framebuffer.medianCut(rgb, (photo ? BOX.PRODUCT_COLOURS : BOX.LOGO_COLOURS) - 2), colours = [[0, 0, 0], paperRGB(), ...cut];
      const hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
      return { rgb: colours, v: photo ? colours.map((c) => Framebuffer.colour(hex(c))) : [1, 0, ...cut.map((c) => Framebuffer.colour(hex(c), hex(flipRGB(c))))] };
    }

    // make() for key, a dithered picture or null, kept in memo: a layout
    // at a size laid out lately (a phone's toolbar going and coming back
    // resizes between two) finds it made. the MEMO keys asked for latest
    // are kept, and a null is not
    const MEMO = 8;
    function remember(memo, key, make) {
      let g = memo.get(key);
      if (g) memo.delete(key);
      else if (!(g = make())) return null;
      memo.set(key, g);
      if (memo.size > MEMO) memo.delete(memo.keys().next().value);
      return g;
    }

    // a logo at w x h in its colours, dithered as a photo is: a bitmap
    // { px, w, h } of the framebuffer's v's, or null. where a photo of a
    // thing does not cover a pixel by half, it is the page's paper. each
    // size made is kept with the logo (art.dithers)
    function ditherLogo(art, w, h) {
      return remember(art.dithers, w + 'x' + h, () => {
        const clear = art.photo ? new Uint8Array(w * h) : null, rgb = readImage(art.img, w, h, clear);
        if (!rgb) return null;
        const g = Framebuffer.ditherColour(rgb, w, h, art.colours.rgb);
        for (let i = 0; i < g.px.length; i++) g.px[i] = clear && clear[i] ? 0 : art.colours.v[g.px[i]];
        return g;
      });
    }

    // a photo's own colours, worked out once it has loaded: COLOURS less
    // two by median cut over it at SAMPLE px wide, and black and the paper,
    // each given a place in the framebuffer's palette. { rgb, v }, or null
    function photoPalette(img) {
      const w = PHOTO.SAMPLE, h = Math.round(w * img.naturalHeight / img.naturalWidth), rgb = readPhoto(img, w, h, false);
      if (!rgb) return null;
      const colours = [[0, 0, 0], paperRGB(), ...Framebuffer.medianCut(rgb, PHOTO.COLOURS - 2)];
      const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
      return { rgb: colours, v: colours.map((c) => Framebuffer.colour(hex(c))) };
    }

    // the most of a slide's photo that fills w x h, centred on its focus
    // as far as the photo goes: { sx, sy, sw, sh } in its own px
    function photoCrop(sl, w, h) {
      const nw = sl.img.naturalWidth, nh = sl.img.naturalHeight, want = w / h;
      let sw = nw, sh = nh;
      if (want > nw / nh) sh = nw / want;
      else sw = nh * want;
      return {
        sx: Math.min(nw - sw, Math.max(0, sl.focus[0] * nw - sw / 2)),
        sy: Math.min(nh - sh, Math.max(0, sl.focus[1] * nh - sh / 2)),
        sw, sh,
      };
    }

    // a slide's photo at w x h in its colours, cut to fill it, dithered: a
    // bitmap { px, w, h } of the framebuffer's v's, or null until it has
    // loaded. each size made is kept with the slide (sl.dithers), until its
    // colours are worked out again
    function ditherPhoto(sl, w, h) {
      if (!sl.colours) return null;
      return remember(sl.dithers, w + 'x' + h, () => {
        const rgb = readPhoto(sl.img, w, h, true, photoCrop(sl, w, h));
        if (!rgb) return null;
        const g = Framebuffer.ditherColour(rgb, w, h, sl.colours.rgb);
        for (let i = 0; i < g.px.length; i++) g.px[i] = sl.colours.v[g.px[i]];
        return g;
      });
    }

    // a paragraph's glyphs in lines no wider than width, in the type's px:
    // each line its glyphs and its ink's left. words break where the text
    // has white space between two glyphs, and a word goes on the line when
    // the line's ink with it is no wider than width, else starts the next
    function wrapType(t, width) {
      const words = [];
      let word = null, prev = null;
      for (const gl of t.glyphs) {
        if (!word || /\s/.test(t.text.slice(prev.at + prev.ch.length, gl.at)))
          words.push(word = { glyphs: [], left: Infinity, right: -Infinity });
        word.glyphs.push(gl);
        word.left = Math.min(word.left, gl.x + gl.dx - gl.g.w / 2);
        word.right = Math.max(word.right, gl.x + gl.dx + gl.g.w / 2);
        prev = gl;
      }
      const lines = [];
      let line = null;
      for (const w of words) {
        if (line && w.right - line.left <= width) {
          line.glyphs.push(...w.glyphs);
          line.right = w.right;
        } else lines.push(line = { glyphs: [...w.glyphs], left: w.left, right: w.right });
      }
      return lines;
    }

    // a section's word into letters at size, its ink's left at left and
    // its top at y, and its box shut, its o's place
    function layoutWord(s, left, y, size) {
      const t = s.type, k = size / TYPE.EM, ox = left + k * t.left, base = y + k * t.ascent;
      let o = null, os = 0;
      for (const gl of t.glyphs) {
        const L = Letter.make(gl.g, ox + k * (gl.x + gl.dx), base + k * gl.dy, ABOUT.FIRST + 100 * s.n + gl.at, k, LETTER.WOBBLE);
        s.letters.push(L);
        // its o, the first glyph until there is one, and the last
        // o it has if it has fewer: its letter laid out for its place
        // and size, which its box takes shut
        if (!o || (gl.ch === 'o' && os++ <= s.o)) o = { L, cx: L.cx, cy: L.cy, w: k * gl.g.w, h: k * gl.g.h };
      }
      // the box shut is the o, so its letter is not drawn
      s.letters.splice(s.letters.indexOf(o.L), 1);
      s.ink = { x0: left, y0: y, x1: ox + k * t.right, y1: base + k * t.descent };
      s.box.shut = { x0: o.cx - o.w / 2, y0: o.cy - o.h / 2, x1: o.cx + o.w / 2, y1: o.cy + o.h / 2, r: Math.min(o.w, o.h) / 2 };
    }

    // the words into letters down the page under the header, whose ink
    // ends at bottom, their boxes shut and open laid out round them, the
    // sections in a box with it (layoutSubs), and the page made tall
    // enough to scroll them away
    function layoutSections(name, bottom, stacked) {
      for (const s of sections) {
        s.letters = [];
        s.bodyLetters = [];
        s.show = s.photoAt = s.room = null;
        s.ink = s.box.shut = s.box.full = s.box.close = null;
        s.skin = null;
      }
      const ems = (s) => (s.type.left + s.type.right) / TYPE.EM;
      const laid = name ? tops.filter((s) => s.type.glyphs.length) : [];
      if (laid.length) {
        // one size for them all, the most the widest leaves room for, and
        // the widest in another's box, at SUB of it and its ink a PAD of
        // its own further in either side
        const widest = Math.max(...laid.map(ems)), inner = Math.max(0, ...laid.flatMap((s) => s.subs.map(ems)));
        const size = Math.min(ABOUT.SIZE * name.size, stacked ? NAME.NARROW * W / widest : (W - 2 * NAME.X) / (widest + ABOUT.INDENT), (W - 2 * NAME.X) / (ABOUT.SUB * (inner + 2 * BOX.PAD)));
        let y = bottom + ABOUT.BELOW * name.size; // the next word's ink's top
        for (const s of laid) {
          layoutWord(s, stacked ? (W - ems(s) * size) / 2 : name.left + ABOUT.INDENT * size, y, size);
          y = s.ink.y1 + ABOUT.SPACE * size;
        }
        const edge = Math.max(2, Math.min(NAME.X, ...laid.map((s) => s.ink.x0)) - BOX.PAD * size);
        // the photo's box first: bubble bob's and the wall's are sized by it (layoutItems)
        for (const s of laid) if (s.photo) layoutBox(s, name, size, stacked, edge, W - edge);
        for (const s of laid) if (!s.photo) layoutBox(s, name, size, stacked, edge, W - edge);

        // is put straight there rather than sent across
        for (const s of sections) if (s.box.full) s.skin = new Skin(boxAt(s, s.box.p));
      }
      settle();
    }

    // a section's open box round its word at size, from x0 to no further
    // than x1, each as far in from its side of the window, or the edges of
    // the insides of the box it is in, and its insides laid out in it,
    // wide or stacked
    function layoutBox(s, name, size, stacked, x0, x1) {
      const box = s.box, seed = BOX.FIRST + 10000 * s.n, pad = s.pad = BOX.PAD * size;
      // rest: the window's bottom, x0 in, as far under this word as it is under the first of them
      const y0 = s.ink.y0 - pad, rest = H - x0 + s.ink.y0 - sections.find((o) => o.ink).ink.y0;
      const ix0 = x0 + pad, ix1 = x1 - pad, iw = ix1 - ix0, under = s.ink.y1 + BOX.GAP * size;
      const bs = stacked ? BOX.PHONE : Math.min(BOX.MOST, Math.max(BOX.LEAST, BOX.BODY * name.size)), bk = bs / TYPE.EM;

      box.close = null;

        const xs = BOX.CLOSE, xw = xg.h * xs, xh = xg.w * xs, cy = s.ink.y0;

        // box's top to halfway down to what is under it
        box.close = { x: ix0, y: cy, w: xw, h: xh, strip: [y0, cy + xh + 0.45 * bs], letter: Letter.make(xg, ix0 + xw / 2, cy + xh / 2, seed - 1, xs, LETTER.WOBBLE) };
      }
      const top = box.close ? box.close.y + box.close.h + 0.9 * bs : under;
      if (s.items.length) return layoutItems(s, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1);
      if (s.subs.some((o) => o.type.glyphs.length)) return layoutSubs(s, name, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1);
      // the caption under the photo's frame, and how tall it stands with
      // its gap (capTall): as tall as the slide with the most lines has it,
      // so the frame is the same for every slide, and drop lines more. the
      // slideshow's <, count and > go on its first line, right of it, and
      // need the frame across to stand two SLIDE_GAPs clear of the widest
      // first line; in a frame narrower than that they keep the first line
      // to themselves and the captions go down one (drop)
      const cs = Math.max(BOX.CAP_LEAST, BOX.CAP * bs), ck = cs / TYPE.EM, gap = BOX.SLIDE_GAP * cs;
      const wide = (t) => ck * (t.left + t.right), most = (f) => Math.max(...slides.map(f));
      const across = most((sl) => sl.types.length && wide(sl.types[0])) + 3 * gap + wide(backType) + most((sl) => wide(sl.count)) + gap + wide(onType);
      const capTall = (drop) => (BOX.CAP_GAP + 0.75 + (most((sl) => sl.types.length) - 1 + drop) * BOX.CAP_LEAD + 0.3) * cs;
      let drop = 0, capH = capTall(drop);

      // and no wider than MEASURE wide
      let px = ix0, py = top, pw = iw, ph = 0, tw = stacked ? iw : Math.min(iw, BOX.MEASURE * bs), ty = top - 0.03 * bs;
      if (s.photo && !stacked) {
        // the photo's frame in the top right corner, its caption under it,
        // the text under the x left of it
        py = s.ink.y0;
        const fit = () => {
          ph = Math.max(rest - pad - py - capH, 8 * bs);
          pw = ph * BOX.ASPECT;
          if (pw > BOX.PHOTO * iw) { pw = BOX.PHOTO * iw; ph = pw / BOX.ASPECT; }
        };
        fit();
        if (pw < across) { capH = capTall(drop = 1); fit(); }
        px = ix1 - pw;
        tw = px - BOX.GUTTER * bs - ix0;
      } else if (s.photo && pw < across) capH = capTall(drop = 1);

      const paras = s.body.map((t) => wrapType(t, tw / bk));
      const lines = paras.reduce((n, p) => n + p.length, 0);
      const textH = 1.05 * bs + (lines - 1) * BOX.LEAD * bs + (paras.length - 1) * BOX.PARA * bs;
      let inside = top; // the insides' bottom
      if (s.photo) {
        if (stacked) {

          // screen leaves over its caption and the text; they go under it
          ph = Math.min(pw / BOX.ASPECT, Math.max(BOX.CROP * pw, rest - pad - py - capH - BOX.GUTTER * bs - textH));
        }
        pw = Math.round(pw);
        ph = Math.round(ph);
        px = Math.round(px);
        py = Math.round(py);
        if (stacked) ty = py + ph + capH + BOX.GUTTER * bs;
        // a line of type at the caption's size, its ink's left at left and
        // its baseline at base, seeded from sd: its ink's top left and
        // size and its letters, { x, y, w, h, letters }
        const put = (t, left, base, sd) => {
          const ox = left + ck * t.left;
          return {
            x: left, y: base - ck * t.ascent, w: wide(t), h: ck * (t.ascent + t.descent),
            letters: t.glyphs.map((gl) => Letter.make(gl.g, ox + ck * (gl.x + gl.dx), base + ck * gl.dy, sd + gl.at, ck, LETTER.WOBBLE)),
          };
        };
        // the first line's baseline cb: on it the >, its ink ending at the
        // frame's right, each slide's count SLIDE_GAP left of it and the <
        // as far left of the widest count, so only the count's figures
        // change from slide to slide; and every slide's caption from the
        // frame's left, from that line or drop lines under it, each line a
        // hundred seeds of its own
        const cb = py + ph + (BOX.CAP_GAP + 0.75) * cs;
        let n = 0;
        const captions = slides.map((sl) => sl.types.flatMap((t, i) => put(t, px, cb + (drop + i) * BOX.CAP_LEAD * cs, seed + 5000 + 100 * n++).letters));
        const on = put(onType, px + pw - wide(onType), cb, seed + 6100);
        const counts = slides.map((sl, i) => put(sl.count, on.x - gap - wide(sl.count), cb, seed + 7000 + 100 * i));
        const back = put(backType, Math.min(...counts.map((c) => c.x)) - gap - wide(backType), cb, seed + 6000);
        s.show = { x: px, y: py, w: pw, h: ph, captions, counts, back, on };
        showSlide(s);
        inside = py + ph + capH;
      }
      let base = ty + 0.75 * bs, last = base, right = ix0;
      paras.forEach((lines, p) => {
        for (const line of lines) {
          right = Math.max(right, ix0 + bk * (line.right - line.left));
          for (const gl of line.glyphs)
            s.bodyLetters.push(Letter.make(gl.g, ix0 + bk * (gl.x + gl.dx - line.left), base + bk * gl.dy, seed + 1000 * p + gl.at, bk, LETTER.WOBBLE));
          last = base;
          base += BOX.LEAD * bs;
        }
        base += BOX.PARA * bs;
      });
      inside = Math.max(inside, last + 0.3 * bs);
      // with the photo it reaches across the window and as far down as
      // the window's bottom is under the first word; without, only as far as its text, and SLACK, or its word
      // if that is wider, so it covers the word
      box.full = s.photo ? { x0, y0, x1, y1: Math.max(rest, inside + pad), r: BOX.RADIUS * size }
        : { x0, y0, x1: Math.min(x1, Math.max(right, s.ink.x1) + BOX.SLACK * bs + pad), y1: inside + pad, r: BOX.RADIUS * size };
    }

    // a box's items down it from top, under the x: each its caret, its ink
    // ITEM_PAD_X ems in from ix0, and its name CARET ems on, at ITEM of the
    // text's size bs and ROW ems apart, and its text (its body) under its
    // name and indented to it, there all along but cut
    // off where the accordion has got to, and its bubble, from ix0, round
    // its caret and name shut and round its text too open, its ink kept
    // ITEM_PAD_X in from ix1 so the bubble fits. with every item shut the
    // box is only as big as its rows, SLACK past the widest, or its word if
    // that is wider, so it covers the word; it grows down by each item's
    // bubble as it opens, and across to the widest text opening (grow).
    // bubble bob's o is the bubble itself: its place (ring) is round, BOB
    // of the box's word's o's longer way across, its left and bottom where
    // his o's ink's are, the glyphs after it pushed right to make room and
    // his row down as far as it stands over the caps. his bubble shut goes
    // round his caret and name as the others' do, the ring inside it, and
    // open it is a box round them and the game under them, across the
    // insides and BUBBLE of About's box's height, the bubble's world (room)
    // inside it
    function layoutItems(s, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1) {
      const seed = BOX.FIRST + 10000 * s.n, is = BOX.ITEM * bs, ik = is / TYPE.EM, bk = bs / TYPE.EM;
      // a bubble's padding across, and how far right its ink may reach
      const bx = BOX.ITEM_PAD_X * is, rx = ix1 - bx;
      // the first name's baseline, its bubble's top at top
      let base = top + (BOX.ITEM_CAP + BOX.ITEM_PAD_Y) * is;
      s.items.forEach((it, i) => {
        const t = it.type;
        it.letters = [];
        it.text = [];
        it.caret = null;
        // bubble bob's o, how far across its ring is and how far its ink goes under the baseline
        const og = it.game ? t.glyphs.find((gl) => gl.ch === 'o') : null, so = s.box.shut;
        const ow = og ? BOX.BOB * Math.max(so.x1 - so.x0, so.y1 - so.y0) : 0, oh = ow, below = og ? ik * (og.dy + og.g.h / 2) : 0;
        if (og) base += Math.max(0, oh - below - BOX.ITEM_CAP * is);
        let nx = ix0 + bx; // the name's ink's left
        if (Menu.caret.glyphs.length) {
          const gl = Menu.caret.glyphs[0];
          it.caret = Letter.make(gl.g, ix0 + bx + ik * gl.g.w / 2, base + ik * gl.dy, seed + 3000 + 100 * i + 99, ik, LETTER.WOBBLE);
          nx = ix0 + bx + ik * gl.g.w + BOX.CARET * is;
        }
        const ox = nx + ik * t.left, push = og ? ow - ik * og.g.w : 0;
        for (const gl of t.glyphs) if (gl !== og)
          it.letters.push(Letter.make(gl.g, ox + ik * (gl.x + gl.dx) + (og && gl.at > og.at ? push : 0), base + ik * gl.dy, seed + 3000 + 100 * i + gl.at, ik, LETTER.WOBBLE));
        const ring = og ? { x0: ox + ik * (og.x + og.dx - og.g.w / 2), y0: base + below - oh, x1: ox + ik * (og.x + og.dx - og.g.w / 2) + ow, y1: base + below, r: Math.min(ow, oh) / 2 } : null;
        it.hit = { x0: ix0, y0: Math.min(base - ik * t.ascent, ring ? ring.y0 : Infinity), x1: ox + ik * t.right + push, y1: base + ik * t.descent };
        it.right = it.hit.x1; // its furthest ink right, its text's too
        if (it.wall) {
          // shut, round its caret and name as the others' are; open, a
          // box round the wall's opening, the whole inside of its
          // outline (the wall, below): as much of the wall as fits
          // across the insides and, down, twice bubble bob's box, in
          // whole px, and no more than the wall as it is drawn
          const like = sections.find((o) => o.photo && o.box.full), fy = base - (BOX.ITEM_CAP + BOX.ITEM_PAD_Y) * is;
          const tall = 2 * BOX.BUBBLE * (like ? like.box.full.y1 - like.box.full.y0 : H - 2 * x0);
          const qx = Math.ceil(ix0 + BOX.LINE), qy = Math.ceil(fy + BOX.LINE);
          const ow = Math.min(Math.floor(WALL.W * WALL_UI.GROW), Math.floor(ix1 - BOX.LINE) - qx), oh = Math.min(Math.floor(WALL.H * WALL_UI.GROW), Math.floor(fy + tall - BOX.LINE) - qy);
          it.shut = { x0: ix0, y0: fy, x1: it.hit.x1 + bx, y1: base + (BOX.ITEM_DESC + BOX.ITEM_PAD_Y) * is, r: BOX.ITEM_RADIUS * is };
          it.full = { x0: ix0, y0: fy, x1: qx + ow + BOX.LINE, y1: qy + oh + BOX.LINE, r: BOX.ITEM_RADIUS * is };
          it.right = it.full.x1;
          it.ext = it.full.y1 - it.shut.y1;
          it.base = base;
          it.clip = base;
          it.span = 0;
          it.logosAt = [];
          it.wallAt = placeWall(qx, qy, ow, oh, bs, ix0 + bx - qx, seed + 9000 + 10 * i + 5);
          base += BOX.ROW * is;
          return;
        }
        if (ring) {
          // shut, round his caret and name as the others' are, from
          // ITEM_PAD_Y over the ring where that stands over the caps;
          // open, from there down BUBBLE of About's box's height and
          // across to ix1, taking the box's right to its edge, and the
          // room inside its outline
          const like = sections.find((o) => o.photo && o.box.full), tall = BOX.BUBBLE * (like ? like.box.full.y1 - like.box.full.y0 : H - 2 * x0);

          it.ring = ring;
          it.shut = { x0: ix0, y0: fy, x1: it.hit.x1 + bx, y1: base + (BOX.ITEM_DESC + BOX.ITEM_PAD_Y) * is, r: BOX.ITEM_RADIUS * is };
          it.full = { x0: ix0, y0: fy, x1: ix1, y1: fy + tall, r: BOX.ITEM_RADIUS * is };
          it.right = ix1;
          it.ext = it.full.y1 - it.shut.y1;
          it.base = base;
          it.clip = base;
          it.span = 0;
          it.logosAt = [];
          const qx = Math.ceil(ix0 + BOX.LINE), qy = Math.ceil(fy + BOX.LINE);
          s.room = { x: qx, y: qy, w: Math.floor(ix1 - BOX.LINE) - qx, h: Math.floor(fy + tall - BOX.LINE) - qy, size: bs, inset: ix0 + bx - qx, letter: Letter.make(null, 0, 0, seed + 9000, 1, LETTER.WOBBLE) };
          base += BOX.ROW * is;
          return;
        }
        // its logos that have loaded, each no more than its scale of LOGO_W
        // ems across or LOGO_H tall: wide, LOGO_GAP apart down a column right
        // of its text, a GUTTER on (and each its dx further) and level with
        // its top, each centred across the column; stacked, or when that would leave the text under
        // LOGO_LEAST ems, LOGO_GAP apart across a row above the text, each
        // centred on the row's middle and all shrunk alike to fit it. its
        // demo (DEMO, below) goes first among them, a box DEMO.W wide and
        // as tall as demoH has it at the text's size, that never shrinks,
        // taking the column as a logo does or, in the row, centred across
        // the room the text has; and so does its ship (SHIP, below), a box
        // SHIP.W by SHIP.H. daedalus (DAEDALUS, below), a box DAEDALUS.W by
        // DAEDALUS.H that never shrinks either, always goes in the row
        // above the text, centred across the text's measure, or across the
        // room the text has when that is narrower than he is, and so do
        // upright's keys and their menu (PIANO, below), a box PIANO.W wide
        // and as tall as pianoH has it at the text's size, the hand
        // pointing at them in what the measure leaves right of them, and
        // chebble's chess set (CHESS, below), its opening as far across as
        // the text's measure, no more than CHESS.ACROSS, and CHESS.TALL of
        // that down, no less than CHESS.LEAST nor more than CHESS.DOWN,
        // and cicada's film (FILM, below), its picture as far across as
        // the text's measure, no more than FILM.ACROSS, and as tall as
        // filmH has it with its row under it
        const arts = it.logos.filter((l) => logoArt[l.key]).map((l) => ({ l, art: logoArt[l.key] }));
        let colW = 0;
        for (const a of arts) {
          const aspect = a.art.img.naturalWidth / a.art.img.naturalHeight, k = a.l.scale || 1;
          a.w = BOX.LOGO_W * k * bs;
          a.h = a.w / aspect;
          if (a.h > BOX.LOGO_H * k * bs) { a.h = BOX.LOGO_H * k * bs; a.w = a.h * aspect; }
          colW = Math.max(colW, a.w);
        }
        if (it.demo) {
          arts.unshift({ l: {}, demo: true, w: DEMO.W, h: demoH(bs) });
          colW = Math.max(colW, DEMO.W);
        }
        if (it.ship) {
          arts.unshift({ l: {}, demo: true, ship: true, w: SHIP.W, h: SHIP.H });
          colW = Math.max(colW, SHIP.W);
        }
        if (it.daedalus) {
          arts.unshift({ l: {}, demo: true, daedalus: true, w: DAEDALUS.W, h: DAEDALUS.H });
          colW = Math.max(colW, DAEDALUS.W);
        }
        if (it.piano) {
          arts.unshift({ l: {}, demo: true, piano: true, w: PIANO.W, h: pianoH(bs) });
          colW = Math.max(colW, PIANO.W);
        }
        if (it.chess) {
          const across = Math.round(Math.min(CHESS.ACROSS, rx - nx, stacked ? Infinity : BOX.MEASURE * bs));
          arts.unshift({ l: {}, demo: true, chess: true, w: across, h: Math.round(Math.max(CHESS.LEAST, Math.min(CHESS.DOWN, CHESS.TALL * across))) });
          colW = Math.max(colW, across);
        }
        if (it.film) {
          const across = Math.round(Math.min(FILM.ACROSS, rx - nx, stacked ? Infinity : BOX.MEASURE * bs));
          arts.unshift({ l: {}, demo: true, film: true, w: across, h: filmH(across, bs) });
          colW = Math.max(colW, across);
        }
        const beside = arts.length > 0 && !stacked && !it.daedalus && !it.piano && !it.chess && !it.film && rx - nx - BOX.GUTTER * bs - colW >= BOX.LOGO_LEAST * bs;
        const gaps = (arts.length - 1) * BOX.LOGO_GAP * bs, across = arts.reduce((n, a) => n + a.w, 0);
        const fit = beside || across + gaps <= rx - nx ? 1 : Math.max(0, rx - nx - gaps) / across;
        let rowH = 0;
        for (const a of arts) {
          const f = a.demo ? 1 : fit;
          a.w = Math.max(1, Math.round(a.w * f));
          a.h = Math.max(1, Math.round(a.h * f));
          rowH = Math.max(rowH, a.h);
        }
        // its text, from DROP under its name
        const room = beside ? rx - nx - BOX.GUTTER * bs - colW : rx - nx;
        const tw = stacked ? room : Math.min(room, BOX.MEASURE * bs);
        const top = base + BOX.DROP * is;
        let tb = top + 0.75 * bs, tl = tb, logoBottom = top, ly = top, lx = nx;
        it.logosAt = [];
        it.demoAt = null;
        it.shipAt = null;
        it.daedalusAt = null;
        it.pianoAt = null;
        it.chessAt = null;
        it.filmAt = null;
        it.menu = null;
        for (const a of arts) {
          const x = Math.round(beside ? nx + tw + (BOX.GUTTER + (a.l.dx || 0)) * bs + (colW - a.w) / 2 : (a.daedalus || a.piano || a.chess || a.film) && tw >= a.w ? nx + (tw - a.w) / 2 : a.demo ? nx + (rx - nx - a.w) / 2 : lx);
          const y = Math.round(beside ? ly : top + (rowH - a.h) / 2);
          if (a.daedalus) it.daedalusAt = placeDaedalus(x, y, seed + 9000 + 10 * i + 5);
          else if (a.chess) it.chessAt = placeChess(x, y, a.w, a.h, bs, seed + 9000 + 10 * i + 5);
          else if (a.film) it.filmAt = placeFilm(x, y, a.w, bs, seed + 9000 + 10 * i + 5);
          else if (a.piano) {
            it.pianoAt = placePiano(x, y, bs, seed + 9000 + 10 * i + 5, nx + tw);
            it.menu = { ui: it.pianoAt.menu, m: pianoMenu };
            it.right = Math.max(it.right, it.pianoAt.right);
          }
          else if (a.ship) it.shipAt = placeShip(x, y, seed + 9000 + 10 * i + 5);
          else if (a.demo) {
            it.demoAt = placeDemo(x, y, bs, seed + 9000 + 10 * i + 5);
            it.menu = { ui: it.demoAt.menu, m: demoMenu };
          }
          else {
            const g = ditherLogo(a.art, a.w, a.h);
            if (g) it.logosAt.push({ g, x, y, letter: Letter.make(g, x + a.w / 2, y + a.h / 2, seed + 9000 + 10 * i + it.logosAt.length, 1, (a.l.warble ?? BOX.LOGO_WARBLE) ? LETTER.WOBBLE : STILL) });
          }
          it.right = Math.max(it.right, x + a.w);
          logoBottom = Math.max(logoBottom, y + a.h);
          ly = y + a.h + BOX.LOGO_GAP * bs;
          lx = x + a.w + BOX.LOGO_GAP * bs;
        }
        if (arts.length && !beside) tb = logoBottom + 0.9 * bs + 0.75 * bs;
        it.body.forEach((pt, p) => {
          for (const line of wrapType(pt, tw / bk)) {
            it.right = Math.max(it.right, nx + bk * (line.right - line.left));
            for (const gl of line.glyphs)
              it.text.push(Letter.make(gl.g, nx + bk * (gl.x + gl.dx - line.left), tb + bk * gl.dy, seed + 4000 + 1500 * i + 700 * p + gl.at, bk, LETTER.WOBBLE));
            tl = tb;
            tb += BOX.LEAD * bs;
          }
          tb += BOX.PARA * bs;
        });
        // its links, a paragraph on under the text: each link's own
        // letters, the separators with the text's
        if (it.links.length && it.linkType.glyphs.length) {
          const lt = it.linkType, ox = nx + bk * lt.left;
          let at = 0;
          const spans = it.links.map((k) => { const from = at; at += k.label.length + LINK_SEP.length; return from; });
          for (const k of it.links) k.letters = [];
          for (const gl of lt.glyphs) {
            const L = Letter.make(gl.g, ox + bk * (gl.x + gl.dx), tb + bk * gl.dy, seed + 4000 + 1500 * i + 1400 + gl.at, bk, LETTER.WOBBLE);
            const j = spans.findIndex((from, j) => gl.at >= from && gl.at < from + it.links[j].label.length);
            (j >= 0 ? it.links[j].letters : it.text).push(L);
          }
          for (const k of it.links) {
            const x0 = Math.min(...k.letters.map((L) => L.cx - bk * L.g.w / 2)), x1 = Math.max(...k.letters.map((L) => L.cx + bk * L.g.w / 2));
            k.hit = { x0, y0: tb - bk * lt.ascent, x1, y1: tb + bk * lt.descent };
          }
          it.right = Math.max(it.right, ox + bk * lt.right);
          tl = tb;
        }
        const bottom = Math.max(tl + 0.3 * bs, logoBottom);
        it.base = base;
        it.clip = base + 0.3 * is;
        it.span = bottom - it.clip;
        // its bubble shut, ITEM_PAD_Y over the name's caps and under its
        // descenders and ITEM_PAD_X right of its ink, and full, as far right
        // of its furthest ink and under its text's bottom
        it.shut = { x0: ix0, y0: base - (BOX.ITEM_CAP + BOX.ITEM_PAD_Y) * is, x1: it.hit.x1 + bx, y1: base + (BOX.ITEM_DESC + BOX.ITEM_PAD_Y) * is, r: BOX.ITEM_RADIUS * is };
        it.full = { x0: ix0, y0: it.shut.y0, x1: Math.max(it.shut.x1, it.right + bx), y1: Math.max(it.shut.y1, bottom + bx), r: BOX.ITEM_RADIUS * is };
        it.ext = it.full.y1 - it.shut.y1;
        // and what is under upright's menu pushed down as far as the menu
        // is open now, so laid out again under an open menu it stays put
        it.push = 0;
        if (it.pianoAt) pushItem(it, pianoPush(it));
        base += BOX.ROW * is;
      });
      // the box's right with every item shut, and how much further each
      // item's text takes it
      const edge = (r) => Math.min(x1, r + BOX.SLACK * bs + pad);
      s.rest = s.items[s.items.length - 1].shut.y1 + pad;
      s.restX1 = edge(Math.max(s.ink.x1, ...s.items.map((it) => it.hit.x1)));
      for (const it of s.items) it.wide = Math.max(0, edge(it.right) - s.restX1);
      s.box.full = { x0, y0, x1: s.restX1, y1: s.rest, r: BOX.RADIUS * size };
      grow(s);
      // each item's skin settled where its bubble is now: laid out again,
      // it is put straight there, as a box's is. bubble bob's and graffiti
      // wall's open as big as a box, so they bow as a box's skin does
      for (const it of s.items) it.skin = new Skin(itemAt(it), it.game || it.wall ? SKIN.SPREAD : BOX.ITEM_SPREAD);
    }

    // a box's sections down it from top, under the x, as the words are
    // down the page: each its word at SUB of the box's word's size, its
    // ink a PAD of its own in from ix0, the first's as far under top and
    // each next one's SPACE of their size under the one before's, and its
    // own box laid out round it at that size (layoutBox) from ix0 to no
    // further than ix1, so it opens inside this one, this one's PAD clear
    // of its edges. with every one of them shut this box is only as big
    // as their words, SLACK past the widest, or its own word if that is
    // wider, so it covers the word; it grows down by each of their boxes
    // as it opens, and across to the widest open (growSubs)
    function layoutSubs(s, name, top, ix0, ix1, bs, stacked, pad, size, x0, y0, x1) {
      const laid = s.subs.filter((o) => o.type.glyphs.length), sub = ABOUT.SUB * size, inset = BOX.PAD * sub;
      let y = top + inset; // the next word's ink's top
      for (const o of laid) {
        layoutWord(o, ix0 + inset, y, sub);
        y = o.ink.y1 + ABOUT.SPACE * sub;
      }
      for (const o of laid) layoutBox(o, name, sub, stacked, ix0, ix1);
      s.rest = laid[laid.length - 1].ink.y1 + inset + pad;
      s.restX1 = Math.min(x1, Math.max(s.ink.x1, ...laid.map((o) => o.ink.x1)) + BOX.SLACK * bs + pad);
      s.box.full = { x0, y0, x1: s.restX1, y1: s.rest, r: BOX.RADIUS * size };
      growSubs(s);
    }

    // how far a section's box has got past its own word's ink, in whole
    // px: what it pushes everything under it down
    function pushed(s) {
      const b = s.box;
      return b.shown && b.full ? Math.max(0, Math.round(b.shut.y1 + (b.full.y1 - b.shut.y1) * b.p - s.ink.y1)) : 0;
    }

    // how far a box's sections' boxes have its bottom down, each pushing
    // as far as push has it: the last a PAD of its own less, so its box's
    // bottom comes this one's PAD clear of this one's, as its sides are,
    // where its word's ink was that and its own
    function subsPush(s, push) {
      return s.subs.reduce((a, o, i) => a + (i < s.subs.length - 1 ? push(o) : Math.max(0, push(o) - o.pad)), 0);
    }

    // a box's sections' boxes where they have got to: its bottom down by
    // as far as each has got past its own word (subsPush), and its right
    // out to PAD past the furthest any has got across
    function growSubs(s) {
      if (!s.subs.length || !s.box.full) return;
      let right = -Infinity;
      for (const o of s.subs) {
        const b = o.box;
        if (b.shown && b.full) right = Math.max(right, b.shut.x1 + (b.full.x1 - b.shut.x1) * b.p);
      }
      s.box.full.y1 = s.rest + subsPush(s, pushed);
      s.box.full.x1 = Math.max(s.restX1, right + s.pad);
    }

    // a box's accordions where they have got to: each item pushed down by
    // the texts opened above it, the box's bottom by all of them and its
    // right out by the furthest any has got across
    function grow(s) {
      if (!s.items.length || !s.box.full) return;
      let shift = 0, wide = 0;
      for (const it of s.items) {
        it.shift = shift;
        shift += it.p * it.ext;
        wide = Math.max(wide, it.p * it.wide);
      }
      s.box.full.y1 = s.rest + shift;
      s.box.full.x1 = s.restX1 + wide;
    }

    // each section's off: what the boxes above it push it down, where
    // they have got to, down the page (tops) or, in a box, down that box,
    // with what that box is pushed itself
    function settle(list = tops, off = 0) {
      for (const s of list) {
        s.off = off;
        settle(s.subs, off);
        off += pushed(s);
      }
    }

    // how far a section's box will push everything under it down: as far
    // as its items, or the boxes in it, will open, or are open while they
    // shut, and as far as it will open itself, or is open while it shuts
    function willPush(s) {
      const b = s.box;
      if (!s.ink || !b.shown || !b.full) return 0;
      const y1 = s.items.length ? s.rest + s.items.reduce((a, it) => a + Math.max(it.p, it.open ? 1 : 0) * it.ext, 0)
        : s.subs.length ? s.rest + subsPush(s, willPush) : b.full.y1;
      return Math.max(0, (b.open ? y1 : b.shut.y1 + (y1 - b.shut.y1) * b.p) - s.ink.y1);
    }

    // how far the page scrolls: until the last word, and its box while it
    // is shown, is ABOUT.END above the window's bottom edge, pushed down
    // by every box shown above it as far as each will open (willPush); not
    // at all when it is there already. it is worked out each frame (the
    // frame, below), so the page's end comes up with a box or an item as
    // it shuts and a page scrolled past it is carried up with it
    function setScroll() {
      let push = 0, end = 0;
      for (const s of tops) {
        if (!s.ink) continue;
        push += willPush(s);
        end = s.ink.y1 + push;
      }
      scrollEnd = Math.max(0, Math.ceil(end + ABOUT.END - H)) * View.SCALE;
    }

    // a press on a word: open its box out of the o, or send it back in.
    // an opening is counted (js/tally.js)
    function toggleBox(s) {
      const box = s.box;
      if (!box.shut || !box.full) return;
      box.open = !box.open;
      if (box.open) Tally.section(s.title);
      if (box.open && !box.shown) {
        box.shown = true;
        box.p = 0;
        box.v = 0;
      }
    }

    // a press on an item: its text accordions out under it, or back. an
    // opening is counted (js/tally.js)
    function toggleItem(s, it) {
      it.open = !it.open;
      if (it.open) Tally.item(it.title);
    }

    // the slide a section's slideshow shows, its photo dithered to fill the
    // frame it was laid out to (and kept, so coming back to it is free), as
    // a letter that wobbles only if the photos do; none until the photo
    // has loaded or the frame is laid out
    function showSlide(s) {
      const f = s.show, g = f && ditherPhoto(slides[s.slide], f.w, f.h);
      s.photoAt = g ? { g, x: f.x, y: f.y, letter: Letter.make(g, f.x + f.w / 2, f.y + f.h / 2, BOX.FIRST + 10000 * s.n + 9000, 1, PHOTO.WARBLE ? LETTER.WOBBLE : STILL) } : null;
    }

    // a press on the slideshow: by slides on (1) or back (-1), round from
    // the last to the first and back, shown at once
    function stepSlide(s, by) {
      s.slide = (s.slide + by + slides.length) % slides.length;
      showSlide(s);
    }

    // a box's items dt on toward open or shut (Menu.ease, js/menu.js), and
    // their carets turning FLIP times as fast
    function stepItems(s, dt) {
      for (const it of s.items) {
        it.p = Menu.ease(it.p, it.open, dt, it.ext);
        it.turn = Menu.ease(it.turn, it.open, dt, 4 * BOX.ITEM * BOX.LEAST, BOX.FLIP);
      }
    }

    // dt on toward open, or back toward the o, on a spring: p and its
    // speed v stepped exactly by dt, by the underdamped spring's closed
    // form (RESPONSE s a swing undamped, damped 1 - BOUNCE), so it moves
    // alike at any frame rate. opening it swings past open and settles
    // back, at rest open once within a px of it and moving under a px a
    // 60 hz frame, on the edge that moves furthest; shutting it speeds
    // into the o and stops dead there, never smaller, which would turn the
    // box inside out, and stays there
    function stepBox(s, dt) {
      const box = s.box;
      if (!box.shown) return;
      const a = box.shut, b = box.full;
      const px = 1 / Math.max(1, Math.max(Math.abs(b.x0 - a.x0), Math.abs(b.y0 - a.y0), Math.abs(b.x1 - a.x1), Math.abs(b.y1 - a.y1)));
      const target = box.open ? 1 : 0, w = 2 * Math.PI / BOX.RESPONSE, z = 1 - BOX.BOUNCE;

      box.p = target + x;
      if (box.p <= 0) { box.p = 0; box.v = Math.max(0, box.v); }
      if (box.open && Math.abs(box.p - 1) < px && Math.abs(box.v) / 60 < px) { box.p = 1; box.v = 0; }

        box.v = 0;
      }
    }

    // a section's insides sy up into into, as much of them as shows through
    // the window (x0, y0) to (x1, y1), world px on the screen: the window's
    // rows cleared, the letters near enough it to show, the shown slide's
    // caption and count and the slideshow's < and > among them, the photo
    // if it reaches it, the sections in its box, each its word and its box
    // over it, the items, each in its bubble, the bubble's world
    // while it is on its way between Doodles' o and bubble bob's, and the
    // x, the ones hover is on in their colours (hover null, none), a level
    // down from the word's (tint); hit is what the pointer is on anywhere
    // on the page, for the sections in its box
    function drawInsides(s, t, sy, x0, y0, x1, y1, hover, hit, into) {
      const box = s.box;
      into.clearRows(Math.floor(y0), Math.ceil(y1) + 1);
      const lo = Math.max(y0, 0) - BOX.MOST, hi = Math.min(y1, H) + BOX.MOST;
      const near = (L) => L.cy - sy > lo && L.cy - sy < hi && L.cx > x0 - BOX.MOST && L.cx < x1 + BOX.MOST;
      for (const L of s.bodyLetters) if (near(L)) L.draw(t, -sy, into);

      // on it, the > while hover is on it or on the photo
      const f = s.show;
      if (f) {
        const v = (by) => hover && hover.slide === by ? tint(s, 1) : undefined;
        for (const L of f.captions[s.slide]) if (near(L)) L.draw(t, -sy, into);
        for (const L of f.counts[s.slide].letters) if (near(L)) L.draw(t, -sy, into);
        for (const L of f.back.letters) if (near(L)) L.draw(t, -sy, into, 0, v(-1));
        for (const L of f.on.letters) if (near(L)) L.draw(t, -sy, into, 0, v(1));
      }
      // the photo when its box, 2 px more all round, reaches the window
      const ph = s.photoAt;
      if (ph && ph.x - 2 < x1 && ph.x + ph.g.w + 2 > x0 && ph.y - sy - 2 < y1 && ph.y - sy + ph.g.h + 2 > y0) ph.letter.draw(t, -sy, into);
      // the sections in its box, each as far up as it is pushed less than
      // this one: its word, in its hover colour while it is hovered, when
      // its ink is near enough the window's rows to show, and its box over
      // it, shut in its o or open, when the box's skin, LINE + 1 px more
      // all round, reaches them
      for (const o of s.subs) {
        if (!o.skin) continue;
        const oy = sy + s.off - o.off, v = onWord(hit, o) ? tint(o, 0) : undefined;
        if (o.ink.y1 - oy > lo && o.ink.y0 - oy < hi) for (const L of o.letters) L.draw(t, -oy, into, 0, v);
        const b = o.skin.bounds(), m = BOX.LINE + 1;
        if (b.y1 + m - oy >= y0 && b.y0 - m - oy <= y1) drawBox(o, t, oy, hit, into);
      }
      // the bubble's world goes into bubble bob's insides, through his
      // skin, only while Doodles' box is at rest open; otherwise it is on
      // its way between the two o's, and goes over everything else here
      const home = s === bubbleHome && box.open && box.p === 1;
      // the items, each pushed down by the texts above it, its caret
      // turned from > to v (FLIP times as fast as its text opens), and its text drawn down to
      // where it has opened to and cut off there, its logos, its demo
      // (drawDemo), its ship (drawShip), its daedalus (drawDaedalus), its
      // piano (drawPiano), its chess set (drawChess) and its film
      // (drawFilm) with it, its text
      // and its links as far down
      // as its menu pushes them (push), all into pfb over its
      // skin's box; then pfb copied into the insides through its skin and the skin
      // outlined over it, LINE px from point to point, in the items' hover
      // colour while the item is hovered, as drawShop does the menu. an
      // item whose skin's box, LINE + 1 px more all round, misses the
      // window's rows is left out. bubble bob's insides are the bubble's
      // world, and his caret and name go over his skin, so it never cuts
      // them as it bows open and shut. graffiti wall's insides are the
      // wall and its menu (drawWall), wiped in as its bubble opens, and
      // its caret and name over them
      for (const it of s.items) {
        if (!it.skin) continue;
        const b = it.skin.bounds(), m = BOX.LINE + 1;
        if (b.y1 + m - sy < y0 || b.y0 - m - sy > y1) continue;
        const d = it.shift - sy;
        const v = hover && hover.it === it && !hover.link && !hover.ribbon && !hover.settings && !hover.ship && !hover.piano && !hover.wall && !hover.chess && !hover.film ? tint(s, 1) : undefined;
        pfb.clearRows(Math.floor(b.y0 - sy) - BOX.LINE, Math.ceil(b.y1 - sy) + BOX.LINE + 1);
        if (it.game) {
          if (home && bubble) drawGame(pfb, t, sy, x0, y0, x1, y1, hover);
          const pts = it.skin.screen(-sy), n = pts.length;
          into.fillPolygon(pts, pfb);
          for (let i = 0; i < n; i++) {
            const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
            into.line(p.x, p.y, q.x, q.y, v ?? 1, BOX.LINE);
          }
          if (it.caret) it.caret.draw(t, d, into, it.turn * Math.PI / 2, v);
          for (const L of it.letters) L.draw(t, d, into, 0, v);
          continue;
        }
        if (it.wall && it.p > 0) drawWall(it, t, d, hover);
        if (it.caret) it.caret.draw(t, d, pfb, it.turn * Math.PI / 2, v);
        for (const L of it.letters) L.draw(t, d, pfb, 0, v);
        if (it.p > 0 && !it.wall) {
          const end = it.clip + it.p * it.span + d, dp = d + it.push;
          const see = (L) => L.cy + dp > lo && L.cy + dp < Math.min(hi, end + BOX.MOST);
          for (const L of it.text) if (see(L)) L.draw(t, dp, pfb);
          for (const k of it.links) {
            const lv = hover && hover.link === k ? tint(s, 2) : undefined;
            for (const L of k.letters) if (see(L)) L.draw(t, dp, pfb, 0, lv);
          }
          for (const l of it.logosAt) l.letter.draw(t, Math.round(d), pfb);
          if (it.demoAt) drawDemo(it, t, d, hover);
          if (it.shipAt) drawShip(it, t, d);
          if (it.daedalusAt) drawDaedalus(it, t, d);
          if (it.pianoAt) drawPiano(it, t, d, hover);
          if (it.chessAt) drawChess(it, t, d, hover);
          if (it.filmAt) drawFilm(it, t, d, hover);
          pfb.clearRows(Math.ceil(end), Math.ceil(it.clip + it.span + d) + BOX.MOST);
        }
        const pts = it.skin.screen(-sy), n = pts.length;
        into.fillPolygon(pts, pfb);
        for (let i = 0; i < n; i++) {
          const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
          into.line(p.x, p.y, q.x, q.y, v ?? 1, BOX.LINE);
        }
      }
      if (s.room && bubble && !home) drawGame(into, t, sy, x0, y0, x1, y1, hover);
      if (box.close) box.close.letter.draw(t, -sy, into, Math.PI / 2, hover && hover.close ? tint(s, 1) : undefined);
    }

    // the bubble's world sy up into into in cicada's layers: the small
    // bubbles, the hands' holds' lines and the hands where they are in the
    // room (inRoom), there all along for bubble bob's box to wipe in, then
    // the bubble where it is drawn (bubbleAt), filled with paper over them,
    // with its face over it; then his subtitle and the shop. each lot goes
    // down only when its skins, and a hand HAND_REACH round its palm, reach
    // the window (x0, y0) to (x1, y1) where they are drawn, a stroke and 4
    // px more for the wobble. while he is shut, the bubble alone, as the
    // rest's room is shut
    function drawGame(into, t, sy, x0, y0, x1, y1, hover) {
      const lx = bubble.lockX, ly = bubble.lockY, m = BUBBLE_LINE + 4, all = bubbleItem.p > 0;
      // whether the box (bx0, by0) to (bx1, by1) in the world's px reaches
      // the window drawn with its lock at, as roomView puts it
      const shows = (at, bx0, by0, bx1, by1) => at.x + at.k * (bx0 - lx) - m < x1 && at.x + at.k * (bx1 - lx) + m > x0 &&
        at.y + at.k * (by0 - ly) - sy - m < y1 && at.y + at.k * (by1 - ly) - sy + m > y0;
      if (all) {
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        for (let i = 0; i < world.blobs.length; i++) {
          const o = world.blobs[i];
          if (o === bubble) continue;
          for (let j = 0; j < o.points.length; j++) {
            const p = o.points[j];
            bx0 = Math.min(bx0, p.x);
            by0 = Math.min(by0, p.y);
            bx1 = Math.max(bx1, p.x);
            by1 = Math.max(by1, p.y);
          }
        }
        for (const h of world.hands) {
          bx0 = Math.min(bx0, h.x - HAND_REACH);
          by0 = Math.min(by0, h.y - HAND_REACH);
          bx1 = Math.max(bx1, h.x + HAND_REACH);
          by1 = Math.max(by1, h.y + HAND_REACH);
        }
        const r = inRoom();
        if (shows(r, bx0, by0, bx1, by1)) {
          const still = roomView(into, t, sy, r);
          for (const o of world.blobs) if (o !== bubble) drawSkin(still, o);
          for (const d of world.held) drawDrag(still, d);
          drawHands(sy, into);
        }
      }
      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      for (let j = 0; j < bubble.points.length; j++) {
        const p = bubble.points[j];
        bx0 = Math.min(bx0, p.x);
        by0 = Math.min(by0, p.y);
        bx1 = Math.max(bx1, p.x);
        by1 = Math.max(by1, p.y);
      }
      const b = bubbleAt();
      if (shows(b, bx0, by0, bx1, by1)) {
        const view = roomView(into, t, sy, b);
        drawSkin(view, bubble);
        face.draw(view);
      }
      if (!all) return;
      if (sub) drawSubtitle(t, sy, into);
      drawShop(t, sy, hover, into);
    }

    // where a section's box is at p, from the o (0) to open (1), as
    // { x0, y0, x1, y1, r }: every edge and the corners' radius that much
    // of the way from one to the other, and, given a time t, each edge
    // warbled WARBLE px either way on its own sine
    function boxAt(s, p, t) {
      const a = s.box.shut, b = s.box.full, c = {};
      for (const k of ['x0', 'y0', 'x1', 'y1', 'r']) c[k] = a[k] + (b[k] - a[k]) * p;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * s.warble[e].hz + s.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // where an item's bubble is at its p, from shut (0) to full (1), as
    // { x0, y0, x1, y1, r }: every edge and the corners' radius that much
    // of the way from one to the other, pushed down by the texts above it
    // (shift), and, given a time t, each edge warbled WARBLE px either way
    // on its own sine, as boxAt has the boxes
    function itemAt(it, t) {
      const a = it.shut, b = it.full, c = {};
      for (const k of ['x0', 'y0', 'x1', 'y1', 'r']) c[k] = a[k] + (b[k] - a[k]) * it.p;
      c.y0 += it.shift;
      c.y1 += it.shift;
      if (t !== undefined) {
        const w = (e) => BOX.WARBLE * Math.sin(2 * Math.PI * t * it.warble[e].hz + it.warble[e].ph);
        c.x0 += w(0);
        c.y0 += w(1);
        c.x1 += w(2);
        c.y1 += w(3);
      }
      return c;
    }

    // a section's box sy up, its skin wherever it has got to, shut in the
    // o's place or open or between: its insides into cfb, or ofb if they
    // are sections (drawInsides), as far as the skin's box, LINE + 1 px
    // more all round, reaches, then copied into into, the page or the
    // insides of the box it is in, inside the skin and the skin outlined
    // over them, a LINE px line from point to point as the bubbles' skins
    // are, in the word's hover colour when the word is hovered. hit is
    // what the pointer is on, anywhere on the page
    function drawBox(s, t, sy, hit, into) {
      const skin = s.skin;
      if (!skin) return;
      const b = skin.bounds(), m = BOX.LINE + 1, top = b.y0 - m - sy, bottom = b.y1 + m - sy;
      if (bottom < 0 || top >= H) return;
      const ins = s.subs.length ? ofb : cfb;
      drawInsides(s, t, sy, b.x0 - m, top, b.x1 + m, bottom, hit && hit.s === s ? hit : null, hit, ins);
      const pts = skin.screen(-sy), n = pts.length, v = onWord(hit, s) ? tint(s, 0) : 1;
      into.fillPolygon(pts, ins);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        into.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // what a press at world (x, y) on the screen would press, wherever the
    // page has scrolled to and the boxes have pushed each section: an open
    // box's x, a little round it (at least 20 world px across, for a
    // finger) or anywhere in the strip across the box's top (short of the
    // photo's frame up there), { s, close }; the slideshow's < or >, a
    // little round it as the x is, or the photo's frame, { s, slide }, -1
    // for the < and 1 for the rest; the shop's menu, while bubble bob is
    // open, { s, shop }, its header with menu, the menu's state, and a
    // button with buy, its key; an item's demo's settings menu (monk
    // mouth's or upright's), as far as its text
    // has opened to show it, as the shop's is: its header a little round
    // it, { s, it, settings, menu }, and, once it is over half open, its
    // header's row all the way across it, the same, a
    // slider's bar across and its row down, a little round them,
    // { s, it, settings, slider }, its button if it has one, { s, it,
    // settings, randomize }, or anywhere else in it, { s, it, settings }; one of the
    // box's items, its caret, its name
    // or right of them to the box's edge (bubble bob's and graffiti
    // wall's only as far as the bubble's right shut, so the game or the
    // wall beside it is free), a little above
    // and below,
    // { s, it }; one of an item's links, as far as its text has opened to
    // show it, a little round it, { s, it, link }; an item's demo's
    // ribbon, as far as its text has opened to show it, a little round it
    // (at least 20 world px tall, for a finger), { s, it, ribbon }; an
    // item's ship's box, once the ship is in, as far as its text has opened
    // to show it, { s, it, ship }; an item's piano's keys, once they are
    // in, as far as its text has opened to show them and where its menu
    // has them pushed, { s, it, piano, key }, key the midi note of the key
    // there (Keys.at), -1 for none; graffiti wall, as far as its bubble
    // has opened: its menu's header, a little round it, { s, it, wall,
    // menu }, and, once the menu is over half open, one of its cells,
    // half the gap between them round it, { s, it, wall, cell }, its
    // slider's bar across and its row down, a little round them, { s, it,
    // wall, width }, the eraser where it is now, a little round it, over
    // the rest, { s, it, wall, eraser }, its tray, { s, it, wall, tray }, or
    // anywhere else in it, { s, it, wall }, OUT or IN in the opening's
    // bottom right corner, a little round it, { s, it, wall, zoom }, -1
    // or 1, and the wall itself, clear of its label, { s, it, wall, canvas }; an item's chess
    // set, as far as its text has opened to show it: its menu's header, a
    // little round it, { s, it, chess, menu }, and, once the menu is over
    // half open, its button that picks, a little round it, or, once that
    // is over half open, one of the rows under it, { s, it, chess, option
    // }, the row; GO where it is now, a little round it, { s, it, chess,
    // button }; or anywhere else in it, { s, it, chess }; RESET in its
    // opening's bottom right corner, a little round it, { s, it, chess,
    // reset }; its pane, in the bottom left: once it is over half open
    // round a famous game's controls, one of their buttons, a little
    // round it, { s, it, chess, pane }, its key, the scrubber's bar and a
    // little over and under it, { s, it, chess, scrub }, or anywhere else
    // in it, and before that its porthole, { s, it, chess }; and anywhere
    // else in its opening, { s, it, chess, board }; an item's film, as
    // far as its text has opened to show it: its button, a little round
    // it, or its picture, { s, it, film, play }, and the row its bar lies
    // in, { s, it, film, reel }; in a box that holds sections, whatever
    // of theirs a press would press, as the ones down the page's, each of
    // them the s of its own; a word whose box is not open, a little
    // round it, { s }; or null. list: the sections asked, the ones down
    // the page or the ones in a box
    function hitAt(x, y, list = tops) {
      const sy = scrolled();
      for (const s of list) {
        if (!s.ink) continue;
        const py = y + sy - s.off;
        if (s.box.open) {
          const c = s.box.close;
          if (!c) continue;
          const mx = Math.max(4, (20 - c.w) / 2), my = Math.max(4, (20 - c.h) / 2);
          if (x >= c.x - mx && x <= c.x + c.w + mx && py >= c.y - my && py <= c.y + c.h + my) return { s, close: true };
          const ui = s === bubbleHome && bubbleItem.open && shopNow();
          if (ui) {
            const inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && py >= r.y0 - m && py <= r.y1 + m;
            if (inside(ui.shut, 2)) return { s, shop: true, menu };
            if (menu.open && menu.p > 0.5) {
              for (const k of ui.buttons) if (inside(k.rect, 2)) return { s, shop: true, buy: k.key };
              if (inside(ui.full, 0)) return { s, shop: true };
            }
          }
          const b = s.box.full, f = s.show, stop = f && f.y < c.strip[1] ? f.x : b.x1;
          if (x >= b.x0 && x <= stop && py >= c.strip[0] && py <= c.strip[1]) return { s, close: true };
          if (f) {
            const near = (k) => {
              const mx = Math.max(4, (20 - k.w) / 2), my = Math.max(4, (20 - k.h) / 2);
              return x >= k.x - mx && x <= k.x + k.w + mx && py >= k.y - my && py <= k.y + k.h + my;
            };
            if (near(f.back)) return { s, slide: -1 };
            if (near(f.on) || (x >= f.x && x <= f.x + f.w && py >= f.y && py <= f.y + f.h)) return { s, slide: 1 };
          }
          const sub = hitAt(x, y, s.subs);
          if (sub) return sub;
          for (const it of s.items) {
