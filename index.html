            const h = it.hit, iy = py - it.shift, hy = Math.max(4, (20 - (h.y1 - h.y0)) / 2);
            const sm = it.menu && it.p > 0 && iy <= it.clip + it.p * it.span ? it.menu.ui : null;
            if (sm) {
              const sn = it.menu.m, inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && iy >= r.y0 - m && iy <= r.y1 + m;
              if (inside(sm.shut, 2)) return { s, it, settings: true, menu: sn };
              if (sn.open && sn.p > 0.5) {
                if (inside({ x0: sm.full.x0, y0: sm.shut.y0, x1: sm.full.x1, y1: sm.shut.y1 }, 2)) return { s, it, settings: true, menu: sn };
                for (const sl of sm.sliders) if (inside(sl.hit, 2)) return { s, it, settings: true, slider: sl };
                if (sm.button && inside(sm.button.rect, 2)) return { s, it, settings: true, randomize: true };
                if (inside(sm.full, 0)) return { s, it, settings: true };
              }
            }
            if (x >= h.x0 - 4 && x <= (it.game || it.wall ? it.shut.x1 : b.x1) && iy >= h.y0 - hy && iy <= h.y1 + hy) return { s, it };
            if (it.p > 0 && iy <= it.clip + it.p * it.span) for (const link of it.links) {
              const k = link.hit;
              if (!k) continue;
              const ky = Math.max(3, (16 - (k.y1 - k.y0)) / 2), ly = iy - it.push;
              if (x >= k.x0 - 3 && x <= k.x1 + 3 && ly >= k.y0 - ky && ly <= k.y1 + ky) return { s, it, link };
            }
            const r = it.demoAt && it.p > 0 && iy <= it.clip + it.p * it.span ? it.demoAt.bar : null;
            if (r) {
              const ry = Math.max(4, (20 - (r.y1 - r.y0)) / 2);
              if (x >= r.x0 - 4 && x <= r.x1 + 4 && iy >= r.y0 - ry && iy <= r.y1 + ry) return { s, it, ribbon: true };
            }
            const sb = it.shipAt && Ship.ready && it.p > 0 && iy <= it.clip + it.p * it.span ? it.shipAt.box : null;
            if (sb && x >= sb.x0 && x <= sb.x1 && iy >= sb.y0 && iy <= sb.y1) return { s, it, ship: true };
            const kb = it.pianoAt && Keys.ready && it.p > 0 && iy <= it.clip + it.p * it.span ? it.pianoAt.box : null, uy = iy - it.push;
            if (kb && x >= kb.x0 && x <= kb.x1 && uy >= kb.y0 && uy <= kb.y1) return { s, it, piano: true, key: Keys.at(x - (kb.x0 + kb.x1) / 2, uy - (kb.y0 + kb.y1) / 2) };
            const wa = it.wallAt && it.p > 0 ? it.wallAt : null, wo = wa && itemAt(it);
            if (wa && x <= wo.x1 && iy + it.shift <= wo.y1) {
              const wu = wa.menu, wb = wa.box, inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && iy >= r.y0 - m && iy <= r.y1 + m;
              if (inside(wu.shut, 2)) return { s, it, wall: true, menu: wallMenu };
              if (wallMenu.open && wallMenu.p > 0.5) {
                const er = wu.eraser.rect, ex = x - wallOut.x, ey = iy - wallOut.y;
                if (ex >= er.x0 - 2 && ex <= er.x1 + 2 && ey >= er.y0 - 2 && ey <= er.y1 + 2) return { s, it, wall: true, eraser: true };
                for (const cell of wu.cells) if (inside(cell, WALL_UI.GAP / 2)) return { s, it, wall: true, cell };
                if (inside(wu.slider.hit, 2)) return { s, it, wall: true, width: true };
                if (inside(wu.tray, 0)) return { s, it, wall: true, tray: true };
                if (inside(wu.full, 0)) return { s, it, wall: true };
              }
              for (const z of wa.zooms) if (inside(z.rect, WALL_UI.GAP / 2)) return { s, it, wall: true, zoom: z.dir };
              if (x >= wb.x0 && x < wb.x1 && iy >= wb.y0 && iy < wb.y1 && (x > it.shut.x1 || iy > it.shut.y1)) return { s, it, wall: true, canvas: true };
            }
            const ca = it.chessAt && it.p > 0 && iy <= it.clip + it.p * it.span ? it.chessAt : null;
            if (ca) {
              const cu = ca.menu, cb = ca.box, su = ca.synth, inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && iy >= r.y0 - m && iy <= r.y1 + m;
              if (su && inside(su.shut, 2)) return { s, it, chess: true, menu: synthMenu };
              if (su && synthMenu.open && synthMenu.p > 0.5) {
                const rows = su.pick.rows, n = synthOrder().length, ky = iy - synthGrown(su);
                if (inside({ x0: su.full.x0, y0: su.shut.y0, x1: su.full.x1, y1: su.shut.y1 }, 2)) return { s, it, chess: true, menu: synthMenu };
                if (inside(rows[0].rect, 2)) return { s, it, chess: true, synth: true, option: rows[0] };
                if (synthPick.open && synthPick.p > 0.5) for (let j = 1; j < n; j++) if (inside(rows[j].rect, 0)) return { s, it, chess: true, synth: true, option: rows[j] };
                for (const r of su.knobs) if (x >= r.hit.x0 - 2 && x <= r.hit.x1 + 2 && ky >= r.hit.y0 - 2 && ky <= r.hit.y1 + 2) return { s, it, chess: true, knob: r };
                if (inside(su.full, 0)) return { s, it, chess: true };
              }
              if (inside(cu.shut, 2)) return { s, it, chess: true, menu: chessMenu };
              if (chessMenu.open && chessMenu.p > 0.5) {
                const rows = cu.pick.rows, b = cu.button, br = b.rect, gy = iy - chessGrown(cu);
                if (inside(rows[0].rect, 2)) return { s, it, chess: true, option: rows[0] };
                if (chessPick.open && chessPick.p > 0.5) for (let j = 1; j < rows.length; j++) if (inside(rows[j].rect, 0)) return { s, it, chess: true, option: rows[j] };
                if (x >= br.x0 - 2 && x <= br.x1 + 2 && gy >= br.y0 - 2 && gy <= br.y1 + 2) return { s, it, chess: true, button: b };
                if (inside(cu.full, 0)) return { s, it, chess: true };
              }
              if (inside(ca.reset.rect, WALL_UI.GAP / 2)) return { s, it, chess: true, reset: true };
              const cp = ca.panel, wide = chessPane.p > 0.5;
              if (wide && Replay.on) {
                for (const b of cp.replay.buttons) if (inside(b.rect, 2)) return { s, it, chess: true, pane: b.key };
                if (inside(cp.replay.hit, 0)) return { s, it, chess: true, scrub: true };
              }
              if (inside(wide ? cp.full : cp.shut, 0)) return { s, it, chess: true };
              if (x >= cb.x0 && x < cb.x1 && iy >= cb.y0 && iy < cb.y1) return { s, it, chess: true, board: true };
            }
            const fa = it.filmAt && it.p > 0 && iy <= it.clip + it.p * it.span ? it.filmAt : null;
            if (fa) {
              const inside = (r, m) => x >= r.x0 - m && x <= r.x1 + m && iy >= r.y0 - m && iy <= r.y1 + m;
              if (inside(fa.button.rect, 2)) return { s, it, film: true, play: true };
              if (inside(fa.hit, 0)) return { s, it, film: true, reel: true };
              if (x >= fa.box.x0 && x < fa.box.x1 && iy >= fa.box.y0 && iy < fa.box.y1) return { s, it, film: true, play: true };
            }
          }
          continue;
        }
        const a = s.ink, m = 0.15 * (a.y1 - a.y0);
        if (x >= a.x0 - m && x <= a.x1 + m && py >= a.y0 - m && py <= a.y1 + m) return { s };
      }
      return null;
    }

    // a click: the mute button mutes the page or gives it its sound back
    // (muteAt, below), the switch sends the page to its other end, dark or
    // light (Switch.send, js/switch.js), the x shuts its box, a link opens its site in a new
    // tab, the slideshow's < shows the slide before and its > or its photo
    // the one after, an item opens or shuts its text, a word opens its box;
    // a button of the shop's buys a level of its upgrade, the demo's
    // menu's button gives its singer a new voice (Monk.randomize), and
    // either menu's header opens it, kicked toward open, or shuts it; a
    // demo's ribbon and its menu's sliders press nothing here, played while
    // they are held (the demo, below), and nor does the rest of an open
    // menu, nor a ship, turned while it is held (the ship, below), nor the
    // piano's keys, played while they are held (the piano, below), nor the
    // wall, drawn on while it is held, nor its menu's cells and tray, their
    // paint mixed while it is held and a tap's colour picked as it lifts,
    // nor its slider, set while it is held, nor its eraser, dragged while
    // it is held (the wall, below), though its
    // menu's header opens and shuts it as the others' do, and OUT and IN
    // in its opening's corner ask for
    // the wall ZOOM_STEP times smaller or bigger (stepZoom); nor the
    // chess set's board, turned or its pieces carried while it is held
    // (chess, below), though RESET in its corner ends a famous game
    // played back and leads every piece back to where it starts, anyone's
    // to take, its menus' headers open and shut them as the others' do,
    // either opening shutting the other, the famous games' button that
    // picks opens, kicked, and shuts, one of the others under it changes
    // places with the one picked and shuts it, GO plays the famous game
    // picked back and shuts the menu, the synthesis menu's button that
    // picks opens, kicked, and shuts, and one of the named sets under it
    // turns the knobs to it and shuts it, its knobs' rows pressing
    // nothing, turned while they are held (chess, below), and the buttons of a
    // famous game's controls show it a move back or on, stop and start it
    // and pick its speed (js/replay.js); and the film's button, or its
    // picture, plays it, or stops it while it plays (js/film.js), though
    // its bar presses nothing, the film sought while it is held (the
    // film, below)
    canvas.addEventListener('click', (e) => {
      if (grabbed) { grabbed = false; return; }
      const p = View.pointer(e);
      if (muteAt(p.x, p.y)) { setMuted(!Mute.on); return; }
      if (switchAt(p.x, p.y)) { Switch.send(Switch.to < 0.5 ? 1 : 0); return; }
      const h = hitAt(p.x, p.y);
      if (!h) return;
      if (h.link) {
        window.open(h.link.url, '_blank', 'noopener');
        Tally.link(h.it.title);
      }
      else if (h.buy) buy(h.buy);
      else if (h.randomize) Monk.randomize();
      else if (h.menu) {
        h.menu.open = !h.menu.open;
        if (h.menu.open) h.menu.v += SHOP_UI.KICK;
        if (h.menu.open && h.chess) (h.menu === chessMenu ? synthMenu : chessMenu).open = false;
      }
      else if (h.zoom) wallScaleTo = Math.min(WALL_UI.ZOOM_MOST, wallScaleTo * Math.pow(WALL_UI.ZOOM_STEP, h.zoom));
      else if (h.reset) {
        Replay.stop();
        Chess.reset();
        Chess.mover(-1);
      }
      else if (h.synth && h.option.j) {
        Clack.pick(synthOrder()[h.option.j] - 1);
        synthPick.open = false;
      }
      else if (h.synth) {
        synthPick.open = !synthPick.open;
        if (synthPick.open) synthPick.v += SHOP_UI.KICK;
      }
      else if (h.option && h.option.j) {
        const j = h.option.j, was = chessOrder[0];
        chessOrder[0] = chessOrder[j];
        chessOrder[j] = was;
        chessPick.open = false;
      }
      else if (h.option) {
        chessPick.open = !chessPick.open;
        if (chessPick.open) chessPick.v += SHOP_UI.KICK;
      }
      else if (h.button) {
        Replay.watch(GAMES[chessOrder[0]]);
        chessMenu.open = false;
      }
      else if (h.pane) Replay[h.pane]();
      else if (h.play) Film.toggle();
      else if (h.shop || h.ribbon || h.settings || h.ship || h.piano || h.wall || h.chess || h.film) return;
      else if (h.slide) stepSlide(h.s, h.slide);
      else if (h.it) toggleItem(h.s, h.it);
      else toggleBox(h.s);
    });

    // hover: a mouse's pointer over anything a press would press turns it
    // a colour of the tag's while it is there: a word, and its box's
    // outline while the box is not open, and a menu's button or one of
    // the demo's menu's sliders, its outline and its words, the first
    // (Inventor's), anything else in a box, its x, its items and the
    // slideshow's < and > (the > for the photo too), the second (Software
    // Engineer's), and a link, a menu's header, its outline, caret and
    // words with it, and a demo's ribbon, the third (Musician's); a finger
    // has no hover. in a box inside another's each of them is the next
    // colour on, the first again after the third (tint). where a mouse's
    // pointer is, in world px on the screen, or null, is Hover.at
    // (js/hover.js); what
    // it is over is worked out afresh each frame, so it follows the page as
    // it scrolls and the boxes move under a still pointer. the name's
    // letters light their own way, under a finger too (the name's keys,
    // below)
    const HOVER = tagLines[0].v, HOVER_ITEM = tagLines[1].v, HOVER_LINK = tagLines[2].v;
    // the colour of what is n levels down from a section's word: the
    // word's own the first, or, for each box the section is in, the next
    // one on, and each level down the one after, round from the third to
    // the first again
    const HOVERS = [HOVER, HOVER_ITEM, HOVER_LINK];
    const tint = (s, n) => HOVERS[(s.depth + n) % HOVERS.length];
    // whether hit, what the pointer is on, is section s's word, or its
    // box's outline while that is not open
    const onWord = (hit, s) => !!hit && hit.s === s && !hit.it && !hit.close && !hit.shop && !hit.slide;
    Hover.listen(canvas, View);

    // --- the name's keys ---------------------------------------------------------
    // the name is a row of piano keys (js/piano.js), a letter a degree of
    // the page's scale (js/scale.js) up from its root at the p, the scale
    // monk mouth's settings set (the demo, below): the pointer coming
    // onto a letter's key strikes it, and the letter is
    // drawn in its colour while the pointer is on it, a mouse over it or a
    // finger down on it. a strike rings its plink out whatever the pointer
    // does next: the piano lets the key go once it has rung. moving within
    // a key strikes nothing; leaving it and coming back strikes it again. a
    // sweep too fast for the moves to land on every key strikes each key it
    // crossed, in order, then the one it came onto, when it went from the
    // row to the row; coming into the row from outside strikes only the key
    // it came onto. a finger strikes where it presses and as it drags along
    // the name; a drag up or down scrolls instead, and cancels the press.
    // only the first pointer plays. the header's letters are drawn
    // screen-fixed, so where the pointer is goes in world px on the screen,
    // as the hover's does, with no scroll in it. the audio is made on the
    // visitor's first gesture, as browsers want
    let nameOn = -1; // the key the pointer is on, or -1
    function nameTo(p) {
      const i = nameAt(p.x, p.y);
      if (i >= 0 && i !== nameOn) {
        const step = i > nameOn ? 1 : -1;
        for (let k = nameOn < 0 ? i : nameOn + step; k !== i + step; k += step) Piano.strike(k);
      }
      nameOn = i;
    }
    canvas.addEventListener('pointerdown', (e) => { if (e.isPrimary) nameTo(View.pointer(e)); });
    canvas.addEventListener('pointermove', (e) => { if (e.isPrimary) nameTo(View.pointer(e)); });
    // a finger lifted, or its press taken by a scroll, is on nothing
    const nameLift = (e) => { if (e.isPrimary && e.pointerType === 'touch') nameOn = -1; };
    canvas.addEventListener('pointerup', nameLift);
    canvas.addEventListener('pointercancel', nameLift);
    canvas.addEventListener('pointerleave', () => { nameOn = -1; });
    Piano.listen(window);
    Voice.listen(window);
    Clack.listen(window);
    Scrub.listen(window);

    // --- the mute button ---------------------------------------------------------
    // a speaker (js/mute.js) CORNER.EDGE world px clear of the window's
    // bottom-right corner, held there while the page scrolls under it, over
    // everything but the hand: ICONS.sound (js/icons.js) while the page plays
    // and ICONS.muted while it is muted. each is an icon (js/icon.js), drawn
    // as the letters are, wobbling, its paper and then its ink, its ink in
    // the first tag colour while a mouse is over it. a press on it, or a
    // little round it, eases the piano, the voice, the demo's voice and
    // the chess set's sound (js/piano.js, js/voice.js, js/monk.js,
    // js/clack.js) and the film's (js/film.js, js/scrub.js) to silence or
    // brings them back, and presses nothing
    // under it. the browser keeps it, so a visitor who
    // muted the page finds it muted the next time
    let iconRows = ICONS; // each icon's rows by name, and the scroll hand's frames (below)

    // icons (ICONS, js/icons.js) read again and put in the corner, the
    // scroll hand's frames beside them and the switch and its ball beside
    // those, the demo's face (js/moon.js) given its eye and its nose
    // again, and the chess set's pane its pawn (chess, below)
    function readIcons(icons) {
      iconRows = icons;
      placeMute();
      placeHand();
      placeSwitch();
      Moon.art(iconRows.eye || [], iconRows.nose || []);
      if (chessItem && chessItem.chessAt) chessItem.chessAt.panel.pawn = chessPawn(chessItem.chessAt.panel.shut);
    }

    // each of the mute button's icons, CORNER.EDGE clear of the window's
    // bottom-right corner; an empty icon has none
    function placeMute() {
      Mute.place(iconRows, W - CORNER.EDGE, H - CORNER.EDGE);
    }

    // whether world (x, y) on the screen presses the icon shown
    function muteAt(x, y) {
      return Mute.at(x, y);
    }

    // the page muted or given its sound back (Mute.set), as the click and
    // the text editor (tools/text) ask
    function setMuted(on) {
      Mute.set(on);
    }

    // what muting the page does, and giving it its sound back: the piano,
    // the voice, the demo's voice, the chess set's sound and the film's
    // told; muted at once if the browser keeps that it was
    Mute.load(window, (on) => {
      Piano.mute(on);
      Voice.mute(on);
      Monk.mute(on);
      Clack.mute(on);
      Film.mute(on);
    });

    // --- the switch --------------------------------------------------------------
    // light or dark (js/switch.js): a switch CORNER.GAP world px left of the
    // scroll hand, along the window's bottom with it and the mute button
    // and held there as they are: ICONS.switch (js/icons.js), drawn as the
    // mute button is, with ICONS.ball over it, the ball a press takes hold
    // of, in the first tag colour while a mouse is over it or the ball is
    // held. as the page goes dark, that share of its pixels are their dark
    // colours (Framebuffer's present, js/raster.js): the page's paper to
    // black and its ink to the paper's colour, a logo's colours to those
    // made for the dark (imagePalette), a bubble's pulse to its shades up
    // from the ink there (pulseInks), and the graffiti wall's paper and its
    // black with the page's, which they are (wallLut). the photos keep
    // their own colours, and so do the wall's others. a click on the
    // switch, or a little round it, sends the page to its other end (the
    // click, above), and a press on it presses nothing under it. the page
    // starts as the visitor last sent the switch, or as the system is,
    // light or dark; the document behind the canvas is the paper's colour
    // of the end the page is nearer, and the tab's icon is that end's: a
    // dot in each of the tag's colours down its diagonal
    const CORNER = {
      EDGE: 21, // world px the mute button, the scroll hand and the switch keep clear of the window's right and bottom edges, as the tag is of the right
      GAP: 6,   // world px between the switch and the scroll hand, right of it
    };
    Switch.load(window, [HOVER, HOVER_ITEM, HOVER_LINK]);

    // the switch, CORNER.GAP clear of the scroll hand's widest frame's
    // left, and its ball
    function placeSwitch() {
      let w = 0;
      for (const f of handArt) w = Math.max(w, f.ink.w);
      Switch.place(iconRows.switch, iconRows.ball, handWob.cx - w * HAND.SCALE / 2 - CORNER.GAP, H - CORNER.EDGE);
    }

    // whether world (x, y) on the screen presses the switch
    function switchAt(x, y) {
      return Switch.at(x, y);
    }

    // whether world (x, y) on the screen presses the mute button or the switch
    function cornerAt(x, y) {
      return muteAt(x, y) || switchAt(x, y);
    }

    // a primary press on the switch is watched, and the click a press that
    // took its ball ends in presses nothing (grabbed, the drag below)
    Switch.listen(canvas, View, switchAt, () => { grabbed = true; });

    // --- the demo ----------------------------------------------------------------
    // monk mouth's item, in personal work, holds a small demo of its voice
    // (js/monk.js): a box DEMO.W world px wide where its logos would go
    // (layoutItems), as tall as demoH has it at the item's text size, with
    // a menu in its top left corner and, GAP under the menu's button, the
    // face's part of the box, DEMO.H tall: a face floating in it, two eyes,
    // a nose and a mouth and no head round them, over a ribbon across the
    // box's bottom. a primary press on the ribbon, or a little round it,
    // takes it, and while it is held where the finger is across it is
    // Monk.down, 0 at its left edge to just short of 1 at its right, as
    // moon_man's sim keeps its ribbon: the voice sings a degree of the
    // page's scale (js/scale.js) for each of its Monk.DEGREES zones. a
    // lift lets it go, and so
    // does a press up or down that the page takes for a scroll (the swipe,
    // below); a press that goes across stays the ribbon's. the face is
    // moon_man's (js/moon.js): its mouth shaped in 3d from the voice's raw
    // state as it is heard (Monk.state) and tilted with its unseen head,
    // the eyes and the nose angled to follow it. the eyes are ICONS.eye and
    // the nose ICONS.nose (js/icons.js), handed to it at load and again
    // each time the icons are read. it is stepped each frame while monk
    // mouth is at least partly open in a box out of its o (the frame,
    // below), and each of its features is a paper bitmap and an ink bitmap
    // whose middle sits at its own place from the head's centre, HEAD_X
    // across and HEAD_Y down from the top left of the face's part, the
    // whole face FACE times moon_man's own size. each is
    // drawn as the mute button's icons are, its paper and then its ink,
    // wobbling on a seed of its own, so each one sways, bobs, breathes and
    // tilts as a letter does. the ribbon is a bar (RIBBON) outlined
    // UI.LINE px and round at its corners, with a tick in the middle of
    // each zone, a line a degree, and, while it is held, a dot on the line
    // of the degree being sung, or of the one the finger is on until it
    // sings: there at once at a press, and from line to line as the degree
    // changes by the house approach, BAR.SNAP of the way left each 60 hz
    // frame (stepDots). the ribbon is in the links' hover colour while a mouse is
    // over it or a press holds it. until the ribbon has been pressed a small hand stands left
    // of it, outside the box, pointing at its left end: the scroll hand's
    // first frame, which points down (the scroll hand, below), turned a
    // quarter to point right, at its scale and drawn as it is, its paper
    // then its ink, wobbling on a seed of its own, its finger level with
    // the ribbon's middle, its tip HAND.GAP short of the ribbon at the
    // nearest and bobbing HAND.BOB back from there and in again, HAND.HZ
    // times a second. the first press on the ribbon takes it away for
    // good.
    //
    // the menu is built as bubble bob's is (the shop, below), on his
    // SHOP_UI, and moves as his does, on the same spring with the same
    // bounce and kick, a skin chasing it and its edges warbling (Menu.step,
    // Menu.at). shut, it is a button in the box's top left corner, a caret
    // and TITLE in the box text's face at the size his menu's rule gives
    // the item's text size, filled with paper and outlined. a press on it
    // opens it down and across the whole box, over the face and short of
    // the ribbon, its caret turning from > to v, and a press on its header,
    // or anywhere along its top once it is open, as an item's name's row
    // is the item's, shuts it. open, it holds a row under the header for each of SLIDERS
    // and one under them for its button, ROW apart and MARGIN round them.
    // a row's slider is a small ribbon (SLIDER): a bar with a tick in the
    // middle of each of its values' zones and, always, a dot on the line of
    // the value in use, which goes from line to line as the ribbon's does.
    // the bars are one width, as wide as the box leaves them beside the
    // widest words any slider says, and APART right of each are its words
    // for the value in use. a primary press on a bar takes it as a press on
    // the ribbon takes the ribbon, and while it is held the value is the
    // zone the pointer is in across the bar, set on the page's scale
    // (Scale[key]) as it changes, so the singer, the name's keys and
    // daedalus's mallets each play their next note in it; the click it
    // ends in presses nothing. the button,
    // BUTTON, as wide as the rows, is drawn and pressed as his are, and
    // gives the singer a new voice (Monk.randomize). upright's menu (the
    // piano, below) is made, drawn, stepped and pressed by the same
    // functions, each handed the menu it is for (makeSettings): its
    // sliders are knobs of the piano's, and it has no button. under a mouse the
    // menu's outline, its caret and its title are in the links' hover
    // colour while the pointer is on its header, and a slider and its
    // words, and the button's outline and words, in the words' (the
    // inventor's), as his buttons are. its insides are drawn
    // apart (qfb) and copied through its skin into the item's (pfb), over
    // the face and under the ribbon, so it covers the face while it is open
    const DEMO = {
      W: 187, H: 140, // world px, its box's width, and the height of the face's part and the ribbon, under the menu's button and GAP (demoH)
      GAP: 6,         // world px from the menu's button to the face's part
      HEAD_X: 93.5,   // world px across from the face's part's left to the head's centre, its middle,
      HEAD_Y: 37,     // and down from its top: the features reach about 37 either side of it, 33 above it and 77 below at the most a tilt takes them
      FACE: 1.1,      // the face's size, of moon_man's own: its features' places and scales
      FEATURES: 4,    // the face's features, a wobble each: its lips, its nose and its two eyes (Moon.features)
      // world px, a bar's height, its corners' radius, how far each tick
      // stops short of its top and bottom edges, and its dot's radius: the
      // ribbon's, its bottom the box's, and a slider's, centred down its row
      RIBBON: { H: 15, R: 5.5, TICK_IN: 4, MARK: 3 },
      SLIDER: { H: 10, R: 4, TICK_IN: 3, MARK: 2 },
      KNOB: 0.05,     // of a knob's slider's bar, how far in from each end its turn starts and stops, so its dot stays inside the bar
      HAND: { GAP: 2, BOB: 3, HZ: 0.8, DOWN: 2 }, // the hand pointing at the ribbon: world px from its tip to the ribbon's left at the nearest and how far it bobs back from there, its bobs a second, and how far its middle stands under the ribbon's so its finger is level with it
      TITLE: 'settings', BUTTON: 'randomize voice', // what the menu's header says, and its button
      // the menu's sliders, top to bottom, each one of the page's scale's
      // values (scaleSlider, below): the value it sets (Scale[key]), the
      // list of its values there (Scale[list]) and the words it says for
      // one of them
      SLIDERS: [
        scaleSlider('mode', 'MODES', (m) => m.name),
        scaleSlider('key', 'KEYS', (k) => 'key ' + k),
        scaleSlider('octave', 'OCTAVES', (o) => 'octave ' + o),
      ],
    };
    let holding = null; // the press holding the ribbon or a slider, { id, it, i }: its pointer, the item whose demo it is and the slider's place in its menu's SLIDERS, null for the ribbon; or null
    let dotAt = null;   // where the ribbon's dot is across it, 0 .. 1, or null while the ribbon is not held
    let played = false; // the ribbon has been pressed: the hand pointing at it is gone
    const demoTypes = new Map(); // a line of a settings menu's text, to its Type
    const demoMenu = makeSettings(DEMO); // the menu, and where it has got to

    // a settings menu's slider, as its menu's SLIDERS hold it, { lines,
    // at, set, say, says }: how many lines its bar has, each in the middle
    // of one of as many zones; where its dot goes, 0 .. 1 across the bar,
    // for the value in use; a press at u, 0 .. 1 across the bar, setting
    // its value; its words for the value in use; and lines as wide as any
    // it says, to leave room for beside the bar.
    // this one is one of the page's scale's values, Scale[key] an index
    // into Scale[list]: a zone a value, its dot on the line of the value
    // in use, a press in a zone setting its value, and its words what say
    // makes of the value
    function scaleSlider(key, list, say) {
      const n = Scale[list].length;
      return {
        lines: n,
        at: () => (Scale[key] + 0.5) / n,
        set: (u) => { Scale[key] = Math.min(n - 1, Math.max(0, Math.floor(u * n))); },
        say: () => say(Scale[list][Scale[key]]),
        says: Scale[list].map(say),
      };
    }

    // and this one one of the piano's knobs (js/piano.js), the i-th of its
    // five: the bar is the knob's turn, -1 KNOB in from its left end to 1
    // as far in from its right, with a line at its middle, 0; its dot
    // where the knob is, a press along it turning the knob there
    // (Piano.turn), and its words saloon's sim's (Piano.say): the widest
    // are its two ends' names, its middle's or a number
    function knobSlider(i) {
      const e = DEMO.KNOB;
      return {
        lines: 1,
        at: () => e + (1 - 2 * e) * (Piano.knobs[i] + 1) / 2,
        set: (u) => Piano.turn(i, 2 * (u - e) / (1 - 2 * e) - 1),
        say: () => Piano.say(i),
        says: [-1, 0, 1, 0.88].map((v) => Piano.say(i, v)),
      };
    }

    // a settings menu's state for what S says (DEMO, or PIANO, below: its
    // box's width W, its TITLE, its SLIDERS and its BUTTON, or none), as
    // bubble bob's (menu): whether it is open, how far (p, 0 shut, 1 open
    // and past as it swings) and how fast, its caret's turn, its skin and
    // the box it was made in, each edge's warble, and where each slider's
    // dot is across its bar, 0 .. 1, or null before the first frame (dots)
    function makeSettings(S) {
      return {
        S, open: false, p: 0, v: 0, turn: 0, skin: null, room: null,
        warble: [0, 1, 2, 3].map(() => ({ hz: 0.15 + 0.2 * Math.random(), ph: 2 * Math.PI * Math.random() })),
        dots: S.SLIDERS.map(() => null),
      };
    }
    const demoHome = sections.find((s) => s.items.some((it) => it.demo)) || null; // the section whose box holds the demo
    const demoItem = demoHome ? demoHome.items.find((it) => it.demo) : null;      // monk mouth, the item it is in

    // the face's wasm fetched, and handed its eye and its nose; and the
    // ship's (the ship, below), daedalus's (daedalus's body, below), the
    // keys' (the piano, below) and the chess set's (chess, below), and its
    // sound's knobs read from its sound's (js/clack.js), the page laid out
    // again once they are, for the synthesis menu (chess, below)
    Moon.load(window);
    Moon.art(iconRows.eye || [], iconRows.nose || []);
    Ship.load(window);
    Daedalus.load(window);
    Keys.load(window);
    Chess.load(window);
    Clack.load(window, () => { if (fb) layout(); });

    // the menu's text size at the item's text size bs, by bubble bob's
    // menu's rule (shopNow), and the height of its button and of each of
    // its rows at that size, as his, { size, h }
    function demoSize(bs) {
      const U = SHOP_UI, size = Math.max(BOX.CAP_LEAST, BOX.CAP * bs);
      return { size, h: Math.round(size * (2 * U.PAD_Y + U.CAP + U.DESC)) };
    }

    // the demo's box's height in world px at the item's text size bs: the
    // menu's button, GAP and the face's part
    function demoH(bs) {
      return demoSize(bs).h + DEMO.GAP + DEMO.H;
    }

    // a demo's box with its top left at (x, y), world px on the page as
    // laid out, at the item's text size bs, its seeds from seed on: for
    // each of the face's features a letter with nothing to draw, at the
    // head's centre in the face's part, for its wobble, at scale 1 so its
    // pose's scale is its breathe alone; the ribbon's box; the hand
    // pointing at it, a letter with nothing to draw at the scroll hand's
    // scale, on the ribbon's left end, for its wobble; the menu
    // (placeSettings); and the item's text size, its subtitles' (the
    // subtitles, below), { size, face, bar, hand, menu }
    function placeDemo(x, y, bs, seed) {
      const D = DEMO, face = [], h = demoH(bs), top = y + h - D.H;
      for (let i = 0; i < D.FEATURES; i++) face.push(Letter.make(null, x + D.HEAD_X, top + D.HEAD_Y, seed + i, 1));
      const bar = { x0: x, y0: y + h - D.RIBBON.H, x1: x + D.W, y1: y + h };
      return { size: bs, face, bar, hand: Letter.make(null, bar.x0, (bar.y0 + bar.y1) / 2 + D.HAND.DOWN, seed + 9, HAND.SCALE), menu: placeSettings(demoMenu, x, y, y + h, bs, seed) };
    }

    // settings menu m laid out for its box, S.W wide with its top left at
    // (x, y) and its bottom at bottom, at the item's text size bs, as
    // shopNow lays out bubble bob's, its seeds from seed on. shut, its
    // header: a button in the box's top left
    // corner round the caret and TITLE, APART from each other with PAD
    // round them. open, across the box and down round a row for each
    // slider and one for the button, if it has one, each as tall as the
    // header, ROW apart
    // under it and MARGIN round them: a slider's bar MARGIN in from the
    // left, as wide as the box leaves it beside the widest words any slider
    // says, and centred down its row, its words APART right of it; the
    // button across the rows. { room, size, shut,
    // full, header: { caret, title }, sliders: [{ i, hit, bar, words }],
    // button: { rect, ring, letters } or null }: room the box, and each
    // slider its place in SLIDERS, the box a press takes it in
    // (its bar across, its row down), its bar and its words: words(text)
    // is a line's letters, made the first time the slider says it and kept
    function placeSettings(m, x, y, bottom, bs, seed) {
      const U = SHOP_UI, S = m.S, { size, h } = demoSize(bs), k = size / TYPE.EM, apart = U.APART * size;
      const type = (text) => {
        let t = demoTypes.get(text);
        if (!t) demoTypes.set(text, t = new Type(text, () => document.createElement('canvas'), TAG.FACE));
        return t;
      };
      const wide = (t) => k * (t.left + t.right);
      // a line's letters, its ink's left at x0, on the baseline of a row whose top is y0
      const letters = (t, x0, y0, sd) => t.glyphs.map((gl) => Letter.make(gl.g, x0 + k * (gl.x + gl.dx + t.left), y0 + size * (U.PAD_Y + U.CAP) + k * gl.dy, sd + gl.at, k, LETTER.WOBBLE));
      // the header, the shut menu: the caret and the title
      const tt = type(S.TITLE), cg = Menu.caret.glyphs[0], cw = cg ? k * cg.g.w : 0, cx = x + U.PAD_X * size;
      const shut = { x0: x, y0: y, x1: x + Math.round(cw + apart + wide(tt) + 2 * U.PAD_X * size), y1: y + h };
      const header = {
        caret: cg ? Letter.make(cg.g, cx + cw / 2, y + size * (U.PAD_Y + U.CAP) + k * cg.dy, seed + 50, k, LETTER.WOBBLE) : null,
        title: letters(tt, cx + cw + apart, y, seed + 60),
      };
      // the rows under it
      const margin = Math.round(U.MARGIN * size), row = Math.round(U.ROW * size), x0 = x + margin, x1 = x + S.W - margin;
      const bw = Math.floor(x1 - x0 - apart - Math.max(...S.SLIDERS.flatMap((sl) => sl.says).map((text) => wide(type(text)))));
      let ry = shut.y1;
      const sliders = S.SLIDERS.map((def, i) => {
        const top = ry, by = top + Math.round((h - DEMO.SLIDER.H) / 2), said = new Map();
        ry += h + row;
        return {
          i,
          hit: { x0, y0: top, x1: x0 + bw, y1: top + h },
          bar: { x0, y0: by, x1: x0 + bw, y1: by + DEMO.SLIDER.H },
          words(text) {
            let line = said.get(text);
            if (!line) said.set(text, line = letters(type(text), x0 + bw + apart, top, seed + 1000 * (i + 1)));
            return line;
          },
        };
      });
      const rect = { x0, y0: ry, x1, y1: ry + h };
      const button = S.BUTTON ? { rect, ring: ringRound(rect, U.RADIUS * size, U.STEP), letters: letters(type(S.BUTTON), x0 + U.PAD_X * size, ry, seed + 4000) } : null;
      const room = { x0: x, y0: y, x1: x + S.W, y1: bottom };
      return { room, size, shut, full: { x0: x, y0: y, x1: x + S.W, y1: (button ? ry + h : ry - row) + margin }, header, sliders, button };
    }

    // item it's demo, d world px down from where it was laid out, into pfb,
    // in whole px, as the logos are: once the face is in (Moon.ready), each
    // of its features in its order, its paper then its ink, with its middle
    // at the head's centre and its own place from there at FACE, moved by
    // its wobble's sway and bob, at its own scale times FACE by its
    // wobble's breathe, and turned by its wobble's tilt; the hand pointing
    // at the ribbon, until the ribbon has been pressed, turned a quarter
    // back from pointing down, its tip GAP and its bob left of the ribbon;
    // the subtitle of the syllable the face is singing (the subtitles,
    // below), over the item's text;
    // the menu over the face (drawSettings); and the ribbon (Bar.draw), its
    // dot where it has got to (dotAt) while it is held, in the links' hover
    // colour while hover is on it or a press holds it
    function drawDemo(it, t, d, hover) {
      const D = DEMO, a = it.demoAt, dy = Math.round(d), held = holding && holding.i === null && holding.it === it;
      const v = held || (hover && hover.it === it && hover.ribbon) ? tint(it.home, 2) : 1;
      if (Moon.ready) {
        const feats = Moon.features;
        for (let i = 0; i < feats.length && i < a.face.length; i++) {
          const f = feats[i], p = a.face[i].pose(t), x = p.x + D.FACE * f.x, y = p.y + D.FACE * f.y + dy, s = D.FACE * f.scale * p.s;
          pfb.sprite(f.paper, x, y, s, p.a, 0);
          pfb.sprite(f.ink, x, y, s, p.a, 1);
        }
      }
      const f = handArt[0];
      if (f && !played) {
        const H = DEMO.HAND, p = a.hand.pose(t), back = H.GAP + H.BOB * (0.5 + 0.5 * Math.sin(2 * Math.PI * t * H.HZ));
        const x = p.x - back - f.ink.h * p.s / 2, y = p.y + dy, turn = p.a - Math.PI / 2;
        pfb.sprite(f.paper, x, y, p.s, turn, 0, CURSOR.MIN_HITS);
        pfb.sprite(f.ink, x, y, p.s, turn, 1, CURSOR.MIN_HITS);
      }
      if (monkSub && monkSub.at === a) drawLine(monkSub, monkSub.ends.length, t, d, pfb);
      drawSettings(it, a.menu, demoMenu, t, dy, hover);
      Bar.draw(pfb, a.bar, dy, Monk.DEGREES, dotAt, v, DEMO.RIBBON);
    }

    // item it's demo's settings menu m, laid out as ui, dy world px down
    // from where it was laid out, hover what the pointer is on: its header
    // and, while it is open at
    // all, its sliders, each its bar (Bar.draw) with its dot where it has
    // got to (m.dots) and its words for the value in use, and its button,
    // if it has one,
    // its ring outlined LINE px from point to point, drawn into qfb over
    // the skin's box; then qfb copied into pfb through the skin and the
    // skin outlined over it, as drawShop does bubble bob's
    function drawSettings(it, ui, m, t, dy, hover) {
      if (!m.skin) return;
      const on = hover && hover.it === it && hover.settings ? hover : null, v = on && on.menu ? tint(it.home, 2) : 1, box = m.skin.bounds();
      qfb.clearRows(Math.floor(box.y0 + dy) - BOX.LINE, Math.ceil(box.y1 + dy) + BOX.LINE + 1);
      if (ui.header.caret) ui.header.caret.draw(t, dy, qfb, m.turn * Math.PI / 2, v);
      for (const L of ui.header.title) L.draw(t, dy, qfb, 0, v);
      if (m.p > 0) {
        for (const sl of ui.sliders) {
          const def = m.S.SLIDERS[sl.i], sv = on && on.slider === sl ? tint(it.home, 0) : 1;
          Bar.draw(qfb, sl.bar, dy, def.lines, m.dots[sl.i], sv, DEMO.SLIDER);
          for (const L of sl.words(def.say())) L.draw(t, dy, qfb, 0, sv);
        }
        const b = ui.button, bv = on && on.randomize ? tint(it.home, 0) : 1, n = b ? b.ring.length : 0;
        for (let i = 0; i < n; i++) {
          const p = b.ring[i], q = b.ring[i + 1 < n ? i + 1 : 0];
          qfb.line(p.x, p.y + dy, q.x, q.y + dy, bv, BOX.LINE);
        }
        if (b) for (const L of b.letters) L.draw(t, dy, qfb, 0, bv);
      }
      const pts = m.skin.screen(dy), n = pts.length;
      pfb.fillPolygon(pts, qfb);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[i + 1 < n ? i + 1 : 0];
        pfb.line(p.x, p.y, q.x, q.y, v, BOX.LINE);
      }
    }

    // settings menu m's sliders' dots dt on (Bar.dotTo), each toward where its
    // slider's value in use puts it
    function stepSliders(m, dt) {
      for (let i = 0; i < m.dots.length; i++) m.dots[i] = Bar.dotTo(m.dots[i], m.S.SLIDERS[i].at(), dt);
    }

    // the demo's dots dt on (Bar.dotTo): its menu's sliders' (stepSliders);
    // and the ribbon's, while the ribbon is held, toward the
    // line of the degree being sung (Monk.deg), or of the degree whose
    // zone holds the finger until one is, put on its line at once by a
    // press and taken away by a lift
    function stepDots(dt) {
      stepSliders(demoMenu, dt);
      if (Monk.down === null) { dotAt = null; return; }
      dotAt = Bar.dotTo(dotAt, ((Monk.deg < 0 ? Monk.zone(Monk.down) : Monk.deg) + 0.5) / Monk.DEGREES, dt);
    }

    // world x on the screen across what is held: across the ribbon, as
    // Monk.down; across a slider's bar, 0 at its left end to 1 at its
    // right, for the slider to set its value by
    function holdTo(x) {
      const it = holding.it;
      if (holding.i === null) {
        if (!it.demoAt) return;
        const b = it.demoAt.bar;
        Monk.down = Math.min(Math.max((x - b.x0) / (b.x1 - b.x0), 0), 0.995);
        return;
      }
      if (!it.menu) return;
      const b = it.menu.ui.sliders[holding.i].bar;
      it.menu.m.S.SLIDERS[holding.i].set(Math.min(1, Math.max(0, (x - b.x0) / (b.x1 - b.x0))));
    }
    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (!h || !(h.ribbon || h.slider)) return;
      holding = { id: e.pointerId, it: h.it, i: h.slider ? h.slider.i : null };
      if (h.ribbon) played = true;
      holdTo(p.x);
    });
    canvas.addEventListener('pointermove', (e) => { if (holding && e.pointerId === holding.id) holdTo(View.pointer(e).x); });
    // the click a lifted press on the ribbon or a slider ends in presses
    // nothing, wherever the pointer has got to, as a drag's does (the
    // drag, below), and the ribbon let go leaves the singer's ribbon with
    // no finger on it (Monk.down)
    const letGo = (e) => {
      if (!holding || e.pointerId !== holding.id) return;
      if (holding.i === null) Monk.down = null;
      holding = null;
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', letGo);
    canvas.addEventListener('pointercancel', letGo);

    // --- the ship ----------------------------------------------------------------
    // third dimension's item, in personal work, holds the ship in a bottle
    // (js/ship.js): a box SHIP.W by SHIP.H world px where its logos would
    // go (layoutItems), the picture filling it at Ship.SCALE. it is drawn
    // as the face's features are, its ink alone, from a whole px, wobbling
    // on a seed of its own, so it sways, bobs, breathes and tilts as a
    // letter does. it is stepped each frame while third dimension is at
    // least partly open in a box out of its o and its box is on the screen
    // (the frame, below). a primary press on the box takes hold of the
    // bottle, and while it is held each move across turns it DRAG radians a
    // world px, its near side going the way the pointer goes; a lift lets
    // it go, and so does a press up or down that the page takes for a
    // scroll (the swipe, below), and the click it ends in presses nothing.
    // the wheel turns it too, WHEEL radians a css px, across or down,
    // whichever is more, but only in a run of the wheel's events, each
    // under WHEEL.RUN ms after the last, that starts over the box: from its first
    // event the run is the bottle's and never scrolls the page, and a run
    // that starts anywhere else scrolls the page to its end, whatever comes
    // under the pointer (the wheel, below)
    const SHIP = {
      W: 187, H: 110, // world px, its box: the picture at Ship.SCALE, the whole bottle inside it however it is turned
      DRAG: 0.015,    // radians a world px across turns the bottle while it is held
      WHEEL: 0.005,   // radians a css px of wheel turns it
    };
    let turning = null;  // the press holding the bottle, { id, x }: its pointer and where it was across last, world px on the screen; or null
    const shipHome = sections.find((s) => s.items.some((it) => it.ship)) || null; // the section whose box holds the ship
    const shipItem = shipHome ? shipHome.items.find((it) => it.ship) : null;       // third dimension, the item it is in

    // a ship's box with its top left at (x, y), world px on the page as
    // laid out, its wobble seeded from seed: the box, and a letter with
    // nothing to draw at its middle, at scale 1 so its pose's scale is its
    // breathe alone, { box, letter }
    function placeShip(x, y, seed) {
      return { box: { x0: x, y0: y, x1: x + SHIP.W, y1: y + SHIP.H }, letter: Letter.make(null, x + SHIP.W / 2, y + SHIP.H / 2, seed, 1) };
    }

    // item it's ship, d world px down from where it was laid out, into pfb,
    // once it is in: the picture's ink with its middle on the box's, moved
    // by the wobble's sway and bob, at Ship.SCALE by its breathe and turned
    // by its tilt
    function drawShip(it, t, d) {
      if (!Ship.ready) return;
      const p = it.shipAt.letter.pose(t);
      pfb.sprite(Ship.picture, p.x, p.y + Math.round(d), Ship.SCALE * p.s, p.a, 1);
    }

    // where the box of the ship's item is on the screen against the
    // window's rows: whether any of it is in them
    function shipSeen() {
      const b = shipItem.shipAt && shipItem.shipAt.box;
      if (!b) return false;
      const y = shipItem.shift + shipHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary || e.button !== 0) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.ship) turning = { id: e.pointerId, x: p.x };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!turning || e.pointerId !== turning.id) return;
      const x = View.pointer(e).x;
      Ship.turn((turning.x - x) * SHIP.DRAG);
      turning.x = x;
    });
    // the click a lifted press on the bottle ends in presses nothing,
    // wherever the pointer has got to, as the ribbon's does
    const shipGo = (e) => {
      if (!turning || e.pointerId !== turning.id) return;
      turning = null;
      if (e.type === 'pointerup') grabbed = true;
    };
    canvas.addEventListener('pointerup', shipGo);
    canvas.addEventListener('pointercancel', shipGo);

    // --- daedalus's body ---------------------------------------------------------
    // second dimension's item, in personal work, holds daedalus
    // (js/daedalus.js): a box DAEDALUS.W by DAEDALUS.H world px over its
    // text (layoutItems), the picture's middle on the box's, at
    // Daedalus.SCALE: the box is the picture's rows and the middle 122 of
    // its 128 columns, everything his arms can reach, so it is no wider
    // than a narrow phone has room for. he is drawn as the ship is, his ink alone, from a whole px, wobbling on a
    // seed of his own, so he sways, bobs, breathes and tilts as a letter
    // does. he is stepped each frame while second dimension is at least
    // partly open in a box out of its o and his box is on the screen (the
    // frame, below), and each of those frames he is told where the page's
    // pointer is against his picture as it was laid out, or that there is
    // none (pointDaedalus): a mouse wherever it is over the page, a finger
    // while it is down and the page has not taken it for a scroll (the
    // swipe, below). his arms swing at it when it comes in their reach, so
    // nothing is pressed and nothing is held: a press on his box presses
    // nothing. each strike is a key struck on the piano (js/piano.js), as
    // the name's are, each arm's its own degree of the page's scale
    // (DEGREES)
    const DAEDALUS = {
      W: 268, H: 290, // world px, his box: the middle 122 of the picture's columns by its 132 rows, at Daedalus.SCALE, to the nearest px
      // the degree of the page's scale each arm's strike plays, in
      // Daedalus.struck's order: his upper left arm's the fifth, his upper
      // right's the seventh, his lower left's the root and his lower
      // right's the third, the mode's i, iii, v and vii with the lower
      // arms its lower two
      DEGREES: [4, 6, 0, 2],
    };
    const daedalusHome = sections.find((s) => s.items.some((it) => it.daedalus)) || null; // the section whose box holds daedalus
    const daedalusItem = daedalusHome ? daedalusHome.items.find((it) => it.daedalus) : null; // second dimension, the item he is in

    // daedalus's box with its top left at (x, y), world px on the page as
    // laid out, its wobble seeded from seed: the box, and a letter with
    // nothing to draw at its middle, at scale 1 so its pose's scale is its
    // breathe alone, { box, letter }
    function placeDaedalus(x, y, seed) {
      return { box: { x0: x, y0: y, x1: x + DAEDALUS.W, y1: y + DAEDALUS.H }, letter: Letter.make(null, x + DAEDALUS.W / 2, y + DAEDALUS.H / 2, seed, 1) };
    }

    // item it's daedalus, d world px down from where it was laid out, into
    // pfb, once he is in: the picture's ink with its middle on the box's,
    // moved by the wobble's sway and bob, at Daedalus.SCALE by its breathe
    // and turned by its tilt
    function drawDaedalus(it, t, d) {
      if (!Daedalus.ready) return;
      const p = it.daedalusAt.letter.pose(t);
      pfb.sprite(Daedalus.picture, p.x, p.y + Math.round(d), Daedalus.SCALE * p.s, p.a, 1);
    }

    // where the box of daedalus's item is on the screen against the
    // window's rows: whether any of it is in them
    function daedalusSeen() {
      const b = daedalusItem.daedalusAt && daedalusItem.daedalusAt.box;
      if (!b) return false;
      const y = daedalusItem.shift + daedalusHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    // daedalus told where the page's pointer is, world px from his box's
    // middle where it is on the screen, or that it has none
    function pointDaedalus() {
      const b = daedalusItem.daedalusAt.box;
      if (!pointerAt) { Daedalus.pointOff(); return; }
      const y = daedalusItem.shift + daedalusHome.off - scrolled();
      Daedalus.point(pointerAt.x - (b.x0 + b.x1) / 2, pointerAt.y - (b.y0 + b.y1) / 2 - y);
    }

    // the piano struck for each of daedalus's arms that struck in his last
    // step, at the arm's degree
    function ringDaedalus() {
      for (let i = 0; i < DAEDALUS.DEGREES.length; i++) if (Daedalus.struck >> i & 1) Piano.strike(DAEDALUS.DEGREES[i]);
    }

    // --- the piano ---------------------------------------------------------------
    // upright's item, in personal work, holds a piano to play: saloon's
    // keyboard (js/keys.js), ten white keys and seven black, the notes c to
    // e, drawn by saloon's own code and turned to face the player, each
    // white key an outline and each black key ink, and played on
    // the page's piano (js/piano.js), which is upright. its box is PIANO.W
    // world px wide over its text (layoutItems) and as tall as pianoH has
    // it at the item's text size: a settings menu's button in its top left
    // corner and, GAP under it, the keys, PIANO.W by PIANO.H, the picture's
    // middle on their box's at Keys.SCALE. the keys are drawn as the ship
    // is, the picture's ink alone, from a whole px, wobbling on a seed of
    // their own, and over it, the same way, the outline of every key that
    // is down and of the key a mouse is on (Keys.glow) in the links' hover
    // colour.
    // they are stepped each frame while upright is at least partly open in
    // a box out of its o and they are on the screen (the frame, below),
    // and each of those frames they are told which key the mouse is on, or
    // that it is on none (pointKeys).
    //
    // a press on a key holds it down: its note is struck at once and
    // sounds until the press lifts, the key drawn down under it as saloon
    // draws it, shorter from its front, its outline in that colour. a press dragged onto another key lets the first go and
    // strikes that one, and every finger on the keys holds a key of its
    // own. a lift lets its key go, and so does a press up or down that the
    // page takes for a scroll (the swipe, below), and the click it ends in
    // presses nothing. while upright is open in its box the computer's
    // keyboard plays it too, as saloon's sim's does: A W S E D F T G Y H U
    // J K O L P ; are seventeen notes up from c4 (LETTERS), each held
    // while its letter is, Z and X take them an octave down and up, C and
    // V the velocity down and up by VEL_STEP, and the space bar is the
    // sustain pedal. a note in another octave goes down on the key of its
    // name, and a press on a key then plays its note in that octave
    // (Keys.at). a key is struck at the velocity as it stands, the page's
    // piano's own at first. a note two hold, a letter and a press, sounds
    // once and is let go by the last of them. once upright is shut, or its
    // box, or the window is left, every key is let go and the pedal
    // lifted.
    //
    // each key shows the letter that plays it, A on the first to ; on the
    // last (LABEL): in the box text's face, LABEL.SIZE world px, its
    // middle across on the key's and its baseline LABEL.WHITE or
    // LABEL.BLACK down the keys, ink on a white key and paper on a black
    // one, wobbling on a seed of its own as a letter does, and riding up
    // with its key as far as the key is down (Keys.down). until a key has been
    // played a hand stands right of the keys, pointing at them: monk
    // mouth's (DEMO.HAND), turned a quarter the other way to point left,
    // its tip GAP short of the keys at the nearest and bobbing BOB back
    // from there. where the item's text's measure leaves it no room right
    // of the keys there is no hand. the first key played, by a press or a
    // letter, takes it away for good.
    //
    // its menu is monk mouth's (the demo, above), made, drawn, stepped and
    // pressed by the same functions: shut, a button, a caret and TITLE;
    // open, across the box and down round a row for each of SLIDERS, four
    // of the piano's knobs, its size, its instrument, its tone and its
    // detune (knobSlider), which turn the page's piano under whatever plays it,
    // the name's keys and daedalus's mallets too. it has no button. where
    // monk mouth's menu opens over its face, this one opens between its
    // header and the keys: as far as it is open it pushes the keys, the
    // item's text and its links down, and the item's bubble, the items
    // under it and the box grow by as much (pushItem), so the keys ride
    // down with the menu as it swings open and back up as it shuts, and
    // are played while it is open.
    const PIANO = {
      W: 266, H: 48,  // world px, the keys: the picture's 121 columns by its 22 rows at Keys.SCALE, to the nearest px; W is its box's width too
      GAP: 6,         // world px from the menu's button, or from the menu as far as it is open, to the keys
      // the letter on each key: its size, world px; picture px from a white
      // key's left edge to the next's; and world px from the keys' top to
      // the baseline of a white key's letter and of a black key's
      LABEL: { SIZE: 10, PITCH: 12, WHITE: 39.5, BLACK: 25.5 },
      TITLE: 'settings', BUTTON: null, // what the menu's header says, and no button
      // the menu's sliders, top to bottom: the piano's size, its
      // instrument, its tone and its detune, each by its place among the
      // piano's five knobs
      SLIDERS: [knobSlider(2), knobSlider(0), knobSlider(1), knobSlider(3)],
      // the computer's keys that play it, each the semitones its note is
      // over the first's: ableton's layout, as saloon's sim's
      LETTERS: { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8,
                 KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 },
      BASE: 60,       // the midi note under A at first, c4,
      BASE_MAX: 108,  // and the highest Z and X take it, so the note under ; is a midi note still
      VEL_STEP: 20,   // what C takes from the velocity and V adds to it
    };
    const pianoMenu = makeSettings(PIANO); // the menu, and where it has got to
    const pianoHome = sections.find((s) => s.items.some((it) => it.piano)) || null; // the section whose box holds the piano
    const pianoItem = pianoHome ? pianoHome.items.find((it) => it.piano) : null;    // upright, the item it is in
    let pianoBase = PIANO.BASE;    // the midi note under A
    let pianoVel = Piano.VELOCITY; // the velocity a key is struck at, 1 .. 127
    let pianoPedal = false;        // the sustain pedal is down
    const pianoHolds = new Map();  // what holds a key down, a letter's code or a pointer's id, to the midi note it holds
    const pianoDowns = new Map();  // a midi note held down, to how many hold it
    let pianoPlayed = false;       // a key has been played: the hand pointing at the keys is gone
    // each key's letter, the semitones its note is over the first's and its type
    const pianoLabels = Object.entries(PIANO.LETTERS).map(([code, n]) => ({ n, type: new Type(code === 'Semicolon' ? ';' : code.slice(-1), () => document.createElement('canvas'), TAG.FACE) }));

    // the piano's box's height in world px at the item's text size bs: the
    // menu's button, GAP and the keys
    function pianoH(bs) {
      return demoSize(bs).h + PIANO.GAP + PIANO.H;
    }

    // a piano's box with its top left at (x, y), world px on the page as
    // laid out, at the item's text size bs, its seeds from seed on, and
    // nothing of it further right than right: the
    // keys' box, under the menu's button and GAP; a letter with nothing to
    // draw at the keys' middle, at scale 1 so its pose's scale is its
    // breathe alone, for their wobble; each key's letter, by the semitones
    // its note is over the first's: u is how many white keys' widths the
    // key's middle is from the keys' left, a whole number for a black key,
    // which sits on the line between two white ones, and the picture's
    // middle is five across; the hand, where it fits between the keys and
    // right at its furthest back, or null: a letter with nothing to draw
    // at the scroll hand's scale on the keys' right edge, for its wobble,
    // its middle DEMO.HAND.DOWN over the keys' so its finger is level with
    // it; how far right the keys and the hand reach; and the menu
    // (placeSettings), { box, letter, labels: [{ n, letter }], hand,
    // right, menu }
    function placePiano(x, y, bs, seed, right) {
      const P = PIANO, top = y + demoSize(bs).h + P.GAP, box = { x0: x, y0: top, x1: x + P.W, y1: top + P.H };
      const mx = x + P.W / 2, my = top + P.H / 2, lk = P.LABEL.SIZE / TYPE.EM, labels = [];
      for (const { n, type } of pianoLabels) {
        const gl = type.glyphs[0];
        if (!gl) continue;
        const m = n % 12, u = (m + (m > 4 ? 1 : 0)) / 2 + 0.5 + 7 * Math.floor(n / 12), black = Number.isInteger(u);
        labels.push({ n, letter: Letter.make(gl.g, mx + (u - 5) * P.LABEL.PITCH * Keys.SCALE, top + (black ? P.LABEL.BLACK : P.LABEL.WHITE) + lk * gl.dy, seed + 100 + n, lk, LETTER.WOBBLE, black ? 0 : 1) });
      }
      const f = handArt[0], D = DEMO.HAND, reach = f ? box.x1 + D.GAP + D.BOB + f.ink.h * HAND.SCALE : Infinity;
      const hand = reach <= right ? Letter.make(null, box.x1, my - D.DOWN, seed + 9, HAND.SCALE) : null;
      return { box, letter: Letter.make(null, mx, my, seed, 1), labels, hand, right: hand ? reach : box.x1, menu: placeSettings(pianoMenu, x, y, top + P.H, bs, seed) };
    }

    // item it's piano, d world px down from where it was laid out, into
    // pfb: once the keys are in, the picture's ink with its middle on
    // their box's, as far down as the menu has them pushed, moved by the
    // wobble's sway and bob, at Keys.SCALE by its breathe and turned by its
    // tilt, over it at the same pose the outlines of the keys that are
    // down and of the key a mouse is on, in the links' hover colour, and
    // each key's letter, up as far as its key is down; until a key has
    // been played, the hand pointing at the keys, turned a quarter on from
    // pointing down, its tip GAP and its bob right of them;
    // and the menu (drawSettings)
    function drawPiano(it, t, d, hover) {
      const a = it.pianoAt, dy = Math.round(d + it.push);
      if (Keys.ready) {
        const p = a.letter.pose(t), y = p.y + dy, s = Keys.SCALE * p.s;
        pfb.sprite(Keys.picture, p.x, y, s, p.a, 1);
        pfb.sprite(Keys.glow, p.x, y, s, p.a, tint(it.home, 2));
        for (const l of a.labels) l.letter.draw(t, dy - Keys.SCALE * Keys.down(l.n), pfb);
      }
      const f = handArt[0];
      if (f && a.hand && !pianoPlayed) {
        const D = DEMO.HAND, p = a.hand.pose(t), back = D.GAP + D.BOB * (0.5 + 0.5 * Math.sin(2 * Math.PI * t * D.HZ));
        const x = p.x + back + f.ink.h * p.s / 2, y = p.y + dy, turn = p.a + Math.PI / 2;
        pfb.sprite(f.paper, x, y, p.s, turn, 0, CURSOR.MIN_HITS);
        pfb.sprite(f.ink, x, y, p.s, turn, 1, CURSOR.MIN_HITS);
      }
      drawSettings(it, a.menu, pianoMenu, t, Math.round(d), hover);
    }

    // where the piano's item's keys are on the screen against the window's
    // rows: whether any of them is in them
    function pianoSeen() {
      const b = pianoItem.pianoAt && pianoItem.pianoAt.box;
      if (!b) return false;
      const y = pianoItem.shift + pianoItem.push + pianoHome.off - scrolled();
      return b.y1 + y > 0 && b.y0 + y < H;
    }

    // the keys told which of them a mouse is on, wherever the page has
    // scrolled to and the menu has them pushed, or that it is on none
    function pointKeys() {
      const h = Hover.at && !cornerAt(Hover.at.x, Hover.at.y) && hitAt(Hover.at.x, Hover.at.y);
      Keys.point(h && h.piano ? h.key : -1);
    }

    // how far item it's piano's menu pushes what is under it down, world
    // px: as far as the menu has opened past its button
    function pianoPush(it) {
      const ui = it.pianoAt.menu;
      return pianoMenu.p * (ui.full.y1 - ui.shut.y1);
    }

    // item it's menu pushing what is under it px world px down, from as
    // far as it had it (push): the item's bubble open, how tall its text
    // stands and how far it pushes the items under it open each grown by
    // the difference, so its skin, the box and the page's end follow
    // (itemAt, grow, setScroll)
    function pushItem(it, px) {
      const by = px - it.push;
      it.push = px;
      it.full.y1 += by;
      it.ext += by;
      it.span += by;
    }

    // whether the piano is there to play: upright open, in its box open
    function pianoOn() {
      return !!pianoHome && openBox(pianoHome) && pianoItem.open;
    }

    // midi note's key held down by by, a letter's code or a pointer's id,
    // which holds one key at a time: the note struck on the piano and its
    // key pressed on the keys, unless something holds it already. the keys
    // have been played
    function pressKey(by, note) {
      pianoPlayed = true;
      if (pianoHolds.has(by)) return;
      pianoHolds.set(by, note);
      const n = pianoDowns.get(note) || 0;
      pianoDowns.set(note, n + 1);
      if (n) return;
      Piano.press(note, pianoVel);
      Keys.on(note);
    }

    // by's key let go: the note let go on the piano and its key on the
    // keys, once nothing else holds it
    function liftKey(by) {
      const note = pianoHolds.get(by);
      if (note === undefined) return;
      pianoHolds.delete(by);
      const n = pianoDowns.get(note);
      if (n > 1) { pianoDowns.set(note, n - 1); return; }
      pianoDowns.delete(note);
      Piano.lift(note);
      Keys.off(note);
    }

    // the sustain pedal put down, or lifted
    function setPedal(down) {
      if (down === pianoPedal) return;
      pianoPedal = down;
      Piano.pedal(down);
    }

    // every key let go and the pedal lifted
    function liftKeys() {
      for (const by of [...pianoHolds.keys()]) liftKey(by);
      setPedal(false);
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !pianoOn()) return;
      const p = View.pointer(e), h = !cornerAt(p.x, p.y) && hitAt(p.x, p.y);
      if (h && h.piano && h.key >= 0) pressKey(e.pointerId, h.key);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!pianoHolds.has(e.pointerId)) return;
      const p = View.pointer(e), h = hitAt(p.x, p.y);
      if (!h || !h.piano || h.key < 0 || h.key === pianoHolds.get(e.pointerId)) return;
      liftKey(e.pointerId);
      pressKey(e.pointerId, h.key);
    });
    // the click a lifted press on a key ends in presses nothing, wherever
    // the pointer has got to, as the ribbon's does
    const keyGo = (e) => {
      if (!pianoHolds.has(e.pointerId)) return;
      liftKey(e.pointerId);
      if (e.type === 'pointerup' && e.isPrimary) grabbed = true;
    };
    canvas.addEventListener('pointerup', keyGo);
    canvas.addEventListener('pointercancel', keyGo);

    // the computer's keyboard, while the piano is there to play: a letter
    // of LETTERS holds its note, the space bar the pedal, and Z, X, C and V
    // set the octave and the velocity; a key held with cmd, ctrl or alt is
    // the browser's. a key let go lets its note go whatever has shut since
    window.addEventListener('keydown', (e) => {
      if (!pianoOn() || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.code === 'Space') e.preventDefault();
      if (e.repeat) return;
      if (e.code in PIANO.LETTERS) pressKey(e.code, pianoBase + PIANO.LETTERS[e.code]);
      else if (e.code === 'Space') setPedal(true);
      else if (e.code === 'KeyZ') pianoBase = Math.max(0, pianoBase - 12);
      else if (e.code === 'KeyX') pianoBase = Math.min(PIANO.BASE_MAX, pianoBase + 12);
      else if (e.code === 'KeyC') pianoVel = Math.max(1, pianoVel - PIANO.VEL_STEP);
      else if (e.code === 'KeyV') pianoVel = Math.min(127, pianoVel + PIANO.VEL_STEP);
    });
    window.addEventListener('keyup', (e) => {
      if (e.code in PIANO.LETTERS) liftKey(e.code);
      else if (e.code === 'Space') setPedal(false);
    });
    window.addEventListener('blur', liftKeys);

    // --- the scroll hand ---------------------------------------------------------
    // a hand HAND.GAP world px left of the mute button, as far off the
    // bottom edge as it is, pointing down while the page scrolls further
    // and giving a thumbs up at its end (setScroll), or when it does not
    // scroll:
    // ICONS.hand's frames (js/icons.js), pointing down first and thumbs up
    // last, each turned as it is drawn. the frame it is at eases toward its
    // first or its last by the house approach and the nearest is drawn, so
    // coming to the bottom plays the frames through and leaving it plays
    // them back. each is drawn as the cursor's hand is, at its scale through
    // the same sampler, its paper with its ink in it and then its ink, and
    // wobbles as the mute button does. the text editor (tools/text) holds
    // it on the frame it paints (holdHand) and plays it (playHand)
    const HAND = {
      GAP: 6,              // world px between it and the mute button
      SCALE: CURSOR.SCALE, // of a frame's px, as the cursor is of its art's
      SEED: 99100,         // its wobble's, clear of the mute button's
      RATE: 0.15,          // of the way left to its frame, each 60 hz frame
    };
    let handArt = [];    // each frame as { paper, ink } bitmaps
    let handWob = null;  // its wobble, a letter with no bitmap (Letter.make)
    let handAt = 0;      // the frame it is at, unrounded
    let handHold = null; // the frame the editor holds it on, or null

    // the frames as bitmaps, centred so the widest and tallest stand
    // HAND.GAP clear of the mute button's widest icon and CORNER.EDGE clear of
    // the bottom edge; an empty frame is left out
    function placeHand() {
      handArt = [];
      let w = 0, h = 0;
      for (const rows of iconRows.hand || []) {
        const ink = Framebuffer.ink(rows), paper = Framebuffer.ink(rows.map((r) => r.replace(/o/g, '#')));
        if (!ink.w || !ink.h) continue;
        handArt.push({ paper, ink });
        w = Math.max(w, ink.w);
        h = Math.max(h, ink.h);
      }
      let left = W - CORNER.EDGE;
      for (const name in Mute.art) {
        const L = Mute.art[name].ink;
        left = Math.min(left, L.cx - L.g.w * L.scale / 2);
      }
      const s = HAND.SCALE;
      handWob = Letter.make(null, left - HAND.GAP - w * s / 2, H - CORNER.EDGE - h * s / 2, HAND.SEED, s);
      if (handHold !== null) holdHand(handHold);
    }

    // whether the page is scrolled to its end, to within a world px, or
    // does not scroll
    function atBottom() {
      return scrolled() >= scrollEnd / View.SCALE - 1;
    }

    // the frame eased toward the last at the bottom and the first anywhere
    // else, the house approach dt-correct; held, it stays on its frame
    function stepHand(dt) {
      if (handHold !== null) return;
      const to = atBottom() ? handArt.length - 1 : 0;
      handAt += (to - handAt) * (1 - Math.pow(1 - HAND.RATE, 60 * dt));
    }

    // the nearest frame, its paper then its ink, at its wobble's pose
    function drawHand(t) {
      const f = handArt[Math.max(0, Math.min(handArt.length - 1, Math.round(handAt)))];
      if (!f || !handWob) return;
      const p = handWob.pose(t);
      fb.sprite(f.paper, p.x, p.y, p.s, p.a, 0, CURSOR.MIN_HITS);
      fb.sprite(f.ink, p.x, p.y, p.s, p.a, 1, CURSOR.MIN_HITS);
    }

    // held on frame i, or let go to follow the page again with null
    function holdHand(i) {
      handHold = i === null ? null : Math.max(0, Math.min(handArt.length - 1, i));
      if (handHold !== null) handAt = handHold;
    }

    // let go and played from its far end to where the page is
    function playHand() {
      handHold = null;
      handAt = atBottom() ? 0 : handArt.length - 1;
    }

    // --- layout ------------------------------------------------------------------
    // the header (the name and its tag) and the sections under it, wide or,
    // on a viewport narrower than STACK_BELOW (a phone), stacked.
    //
    // the bubble's world is its room in bubble bob's box (layoutItems),
    // the bubble locked to its middle. the bubble is made here the first
    // time there is a room; after that a resize carries its lock, skin,
    // face and all to the new middle, so nothing flies across. with no room
    // the world is the viewport, empty, so a press grabs nothing
    const STACK_BELOW = 463; // viewport width in world px under which it stacks
    let letters = [];

    function layout() {
      letters = [];
      const stacked = W < STACK_BELOW;
      // the name first, and its tag beside it or, stacked, under it:
      // everything else keeps clear under them
      const name = layoutName(stacked);
      const tagBottom = layoutTag(name, stacked);
      const headerBottom = name === null ? 0 : Math.max(name.bottom, tagBottom === null ? -Infinity : tagBottom);
      layoutSections(name, headerBottom, stacked);
      const room = bubbleHome && bubbleHome.room, ww = room ? room.w : W, wh = room ? room.h : H;
      if (!world) world = new World(ww, wh);
      else world.resize(ww, wh);
      if (room && !bubble) {
        bubble = new SoftBlob(ww / 2, wh / 2, BUBBLE_POINTS, BUBBLE_R, BUBBLE_PUFF, true);
        world.blobs.push(bubble);
        face = new Face(bubble);
      } else if (bubble) {
        const dx = ww / 2 - bubble.lockX, dy = wh / 2 - bubble.lockY;
        face.moveBy(dx, dy);
        for (const b of world.blobs) if (b !== bubble) { const c = b.getCenter(); b.moveLockTo(c.x + dx, c.y + dy); }
        for (const h of world.hands) { h.x += dx; h.y += dy; }
        bubble.moveLockTo(ww / 2, wh / 2);
      }
    }

    // --- the bubble --------------------------------------------------------------
    // bubble bob's box, in Doodles', holds cicada's bubble, its face at 5/3 its art's
    // size and the skin drawn in tighter round it than cicada's: a ring of
    // verlet points (js/softbody.js) locked to the middle of the box, which
    // gives when pulled and wobbles home. it lives in a world the size of
    // the box's inside (its room), which keeps it in the box and runs
    // whole 60 hz steps from wall time, so a 120 hz screen does not run it
    // twice as fast and a slow frame catches up. it is drawn into the box's
    // insides with the text's, so the box wipes it in and it scrolls and is
    // pushed with the box, and it wobbles as one letter does, sway, bob,
    // breathe and tilt about its lock. it is filled with paper and then
    // outlined, the skin a bresenham line from point to point, so it covers
    // whatever is under it as a solid thing, and its face (js/face.js)
    // goes on top, trailing the skin when it moves. the face's
    // art goes down 1:1 on a bubble of FACE.DEFAULT_RADIUS (js/face.js) and
    // scales with the radius, each feature by its own size, drawn as line
    // art (roomView), so its strokes are BUBBLE_LINE px at any size, as the
    // skin's are. with Doodles' box shut, it is drawn shrunk into Doodles'
    // o, its skin under the o's ring, so its face shows through the o; as
    // the box opens it is drawn going over to bubble bob's o's place, half
    // as big, and there it is his o, its own skin the letter, inside his
    // bubble with his caret and name; as his bubble opens it is drawn
    // growing out of his o to its room's middle (bubbleAt), its world and
    // its physics as they are. the rest of its world, the small bubbles
    // and the hands, is drawn where it is in the room all along (inRoom),
    // so the boxes wipe it in as they open. while his box is open its world spawns
    // smaller bubbles, skins like its own with no face, one every
    // couple of seconds, a few at most, each drifting a little as it comes;
    // dragged onto the bubble, one is eaten, and the bubble keeps its 32
    // points and eases back to its own size over a few seconds
    // (js/softbody.js).
    const BUBBLE_SCALE = 5 / 3;
    const BUBBLE_LINE = 2; // world px, every stroke of the skin and the face
    // its radius in world px (about 38), its points, and its
    // air: the area it fills over its circle's
    const BUBBLE_R = FACE.DEFAULT_RADIUS * BUBBLE_SCALE, BUBBLE_POINTS = 32, BUBBLE_PUFF = 1.2;
    let world = null, bubble = null, face = null; // made at the first layout
    const bubbleHome = sections.find((s) => s.items.some((it) => it.game)) || null; // the section whose box it is in
    const bubbleItem = bubbleHome ? bubbleHome.items.find((it) => it.game) : null; // bubble bob, the item it is in

    // whether the game is on: Doodles' box open and bubble bob open in it
    function playing() {
      return !!bubbleHome && bubbleHome.box.open && bubbleItem.open;
    }

    // where the bubble's lock is drawn, world px on the page as laid out,
    // and how much it is drawn scaled, { x, y, k }. in an o, in its middle,
    // its skin at rest (BUBBLE_R puffed, PUFFED) as big round as the o's
    // ring is across its longer way: in Doodles' it sits under the ring
    // there and the porthole cuts it off under the ring the other way, and
    // bubble bob's, round, it fills; open, its room's middle at its own
    // size. as far as bubble bob is open it goes
    // from his o to the room's middle, and as far as Doodles' box is open
    // from Doodles' o to there, and past it as the box swings past open
    function bubbleAt() {
      const r = bubbleHome.room, f = bubbleItem.p, p = bubbleHome.box.p;
      const at = (o) => ({ x: (o.x0 + o.x1) / 2, y: (o.y0 + o.y1) / 2, k: Math.max(o.x1 - o.x0, o.y1 - o.y0) / 2 / (BUBBLE_R * PUFFED) });
      const a = at(bubbleHome.box.shut), o = at(bubbleItem.ring);
      const b = { x: o.x + (r.x + bubble.lockX - o.x) * f, y: o.y + (r.y + bubble.lockY - o.y) * f, k: o.k + (1 - o.k) * f };
      return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, k: a.k + (b.k - a.k) * p };
    }

    // where the bubble's lock is in its room on the page as laid out, at
    // its own size, { x, y, k } as bubbleAt has it: where everything in its
    // world but the bubble is drawn, there all along whatever the boxes do
    function inRoom() {
      const r = bubbleHome.room;
      return { x: r.x + bubble.lockX, y: r.y + bubble.lockY, k: 1 };
    }

    // a framebuffer the bubble's world draws into as into the world: what
    // goes into it at its world's px lands in into at the page's, its box
    // dy up, scaled about its lock and its lock moved as b has it ({ x, y,
    // k }, bubbleAt's unless given), and warbled about its lock by its
    // room's letter. the face's sprites go
    // down as line art (Framebuffer.strokeSprite), so at any size their
    // strokes are BUBBLE_LINE px, as the skin's are; a line is as thick as
    // it is asked, 1 px unless told
    function roomView(into, t, dy, b = bubbleAt()) {
      const w = bubbleHome.room.letter.pose(t), lx = bubble.lockX, ly = bubble.lockY;
      const c = b.k * w.s * Math.cos(w.a), n = b.k * w.s * Math.sin(w.a), ox = b.x + w.x, oy = b.y - dy + w.y;
      const at = (x, y) => [ox + c * (x - lx) - n * (y - ly), oy + n * (x - lx) + c * (y - ly)];
      return {
        sprite(g, x, y, s, a, v) { const [X, Y] = at(x, y); into.strokeSprite(g, X, Y, s * w.s * b.k, a + w.a, v, BUBBLE_LINE); },
        line(x0, y0, x1, y1, v, thick = 1) { const [a, b] = at(x0, y0), [c, d] = at(x1, y1); into.line(a, b, c, d, v, thick); },
        fillPolygon(pts, v) { into.fillPolygon(pts.map((p) => { const [x, y] = at(p.x, p.y); return { x, y }; }), v); },
      };
    }

    // --- the pulse ---------------------------------------------------------------
    // cicada's colour pulse: when a bubble eats, colour runs off round its
    // skin both ways from where the two met, and fades along its trail and
    // over its life (js/softbody.js). cicada's ran through the rainbow;
    // this one fades round the tag's three colours, teal to khaki to rose
